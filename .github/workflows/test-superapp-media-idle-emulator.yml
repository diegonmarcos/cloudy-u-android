# #1923 the idle Media notification on an emulator: with nothing playing, the Media CHILD (channel floating_nav_media) must be in the
# shade with its action(s) and the idle text, and the Media group summary (channel nc_groups, group nc.media) must never be there
# without it. Runs the x86_64 APK a Ship Cloud SuperApp run built. Tidal / Spotify / Buds are absent on the emulator, so the
# expected action is the plain Play (the fallback when no launcher resolves). Evidence: media-idle-evidence (dumpsys, verdict).
name: "Test -> SuperApp idle Media notification (emulator)"

on:
  workflow_dispatch:
    inputs:
      superapp_run_id:
        description: "Ship Cloud SuperApp run id whose x86_64 APK artifact to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch the Cloud SuperApp APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          W_RUN: ${{ inputs.superapp_run_id }}
        run: |
          set -eu
          mkdir -p apk
          gh api "repos/$REPO/actions/runs/$W_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-SuperApp")) | .name' |
          while read -r name; do gh run download "$W_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          pick=""
          for want in x86_64 universal ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud SuperApp APK"; exit 1; }
          cp "$pick" superapp.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the scripts
        run: |
          cat > check.py <<'PY'
          import re, sys
          pkg = sys.argv[2]
          txt = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          recs = ["NotificationRecord(" + r for r in txt.split("NotificationRecord(")[1:]]
          mine = [r for r in recs if ("pkg=%s " % pkg) in r.split("\n", 1)[0]]
          child = [r for r in mine if "channel=floating_nav_media" in r.split("\n", 1)[0]]
          summ = [r for r in mine if "channel=nc_groups" in r.split("\n", 1)[0] and "nc.media" in r]
          ok = True
          def check(c, m):
              global ok
              print(("PASS " if c else "FAIL ") + m); ok = ok and c
          check(len(child) == 1, "the Media child is posted (%d)" % len(child))
          if child:
              c = child[0]
              check("Nothing playing" in c, "the child carries the idle title")
              check(re.search(r'\[\d+\] "?Play', c) is not None or 'Play' in c.split("actions=", 1)[-1], "the child carries a Play action")
          check(not summ or len(child) == 1, "no Media summary without its child (summaries: %d)" % len(summ))
          sys.exit(0 if ok else 1)
          PY
          cat > run.sh <<'EOF2'
          set -u
          mkdir -p out
          adb install -r -g superapp.apk || exit 2
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PKG=$("$aapt2" dump packagename superapp.apk)
          ACT=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tr -d '\r' | tail -1)
          adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
          adb shell appops set "$PKG" SYSTEM_ALERT_WINDOW allow || true
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb shell am start -W -n "$ACT" >/dev/null
          rc=1
          for i in $(seq 1 12); do
            sleep 10
            adb shell dumpsys notification --noredact > out/dumpsys.txt
            if python3 check.py out/dumpsys.txt "$PKG" > out/verdict.txt; then rc=0; break; fi
          done
          cat out/verdict.txt
          grep -n "floating_nav_media\|nc_groups" out/dumpsys.txt | head -20
          timeout 60 adb logcat -d > out/logcat.txt || true
          exit $rc
          EOF2
      - name: Boot emulator and prove
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-idle-evidence
          path: out/
          if-no-files-found: warn
