# #1952 Cloud Mail cache-first mutation runs: each applies ONE deliberate break to the mail list's offline-first design and runs Cloud Mail's JVM
# suite, whose named test must catch it. The JVM suite itself is RED (expected); the JOB is green only when the verdict step finds the named
# test failed (KILLED); a mutation whose named test stayed green, or never ran, fails the job. Manual only.
name: mail-cache-1952-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'tab-push | rows-wait-refresh | error-hides-rows | initial-refresh | banner-drops-reason | stamp-on-failure'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-mail
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation ${{ inputs.name }}
        run: |
          K=ac_cloud-mail/app/src/main/kotlin/app/sterna/ui
          R=ac_cloud-mail/core/data/src/main/kotlin/app/sterna/core/data/mail/MailRepository.kt
          case "${{ inputs.name }}" in
            # a tap on Mail opens a new list entry again (a new ViewModel, an empty pager, a new query and refresh)
            tab-push)            sed -i 's/target == LIST_ROUTE -> TabMove.Return(LIST_ROUTE)/target == LIST_ROUTE -> TabMove.Open(LIST_ROUTE, LIST_ROUTE)/' $K/TabMove.kt ;;
            # the cached rows wait for the network refresh to end
            rows-wait-refresh)   sed -i 's/listRows.itemCount > 0 \&\& !staleRows ->/listRows.itemCount > 0 \&\& !staleRows \&\& !ui.refreshing ->/' $K/inbox/InboxScreen.kt ;;
            # a failed session replaces the cached rows with the error scene
            error-hides-rows)    sed -i 's/listRows.itemCount > 0 \&\& !staleRows ->/listRows.itemCount > 0 \&\& !staleRows \&\& notice == RefreshNotice.NONE ->/' $K/inbox/InboxScreen.kt ;;
            # the folder pager asks the server before its first page
            initial-refresh)     sed -i 's/override suspend fun initialize() = InitializeAction.SKIP_INITIAL_REFRESH/override suspend fun initialize() = InitializeAction.LAUNCH_INITIAL_REFRESH/' $R ;;
            # the banner over the cached rows loses the failure reason
            banner-drops-reason) sed -i 's/RefreshNotice.ERROR -> CacheBanner(notice, error, lastSyncAt)/RefreshNotice.ERROR -> CacheBanner(notice, null, lastSyncAt)/' $K/inbox/CacheBanner.kt ;;
            # a failed refresh moves the last sync time too
            stamp-on-failure)    sed -i 's/wasRefreshing \&\& !refreshing \&\& error == null/wasRefreshing \&\& !refreshing/' $K/inbox/CacheBanner.kt ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      # The app's own two test classes, straight through its gradlew: the fleet unit engine stops at the first failing shared library
      # test, which is not this app's and would leave the named test unrun (LEG ERROR).
      - name: JVM unit tests of the two 1952 classes (RED expected; the verdict step reads the XML)
        run: |
          cd ac_cloud-mail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest -PtestApp --tests "app.sterna.ui.TabMove1952Test" --tests "app.sterna.ui.inbox.CacheFirst1952Test" || true
      - name: Verdict (KILLED = the named test failed)
        env:
          M: ${{ inputs.name }}
        run: |
          case "$M" in
            tab-push)            C=TabMove1952Test; N="returning to Mail goes back to the list entry already on the stack, never a new one" ;;
            rows-wait-refresh|error-hides-rows) C=CacheFirst1952Test; N="a session failure never empties the list" ;;
            initial-refresh)     C=CacheFirst1952Test; N="the list paints from the store with the network failing" ;;
            banner-drops-reason) C=CacheFirst1952Test; N="a failed session keeps the cached rows under a banner with the reason and the last sync" ;;
            stamp-on-failure)    C=CacheFirst1952Test; N="only a refresh that landed moves the last sync time" ;;
          esac
          X="$(find ac_cloud-mail/app/build -path '*test-results*' -name "TEST-*.$C.xml" | head -1)"
          [ -n "$X" ] || { echo "::error::LEG ERROR $M: no result for $C (did not compile or run); not a kill"; exit 1; }
          python3 -I - "$X" "$N" "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, want, leg = sys.argv[1:]
          cases = {c.get("name"): c for c in ET.parse(path).getroot().iter("testcase")}
          failed = sorted(n for n, c in cases.items() if c.find("failure") is not None or c.find("error") is not None)
          print("failed tests:", failed)
          if want not in cases: print("::error::LEG ERROR %s: the named test did not run: %s" % (leg, want)); sys.exit(1)
          if want not in failed: print("::error::LEG SURVIVED %s: the named test stayed green: %s" % (leg, want)); sys.exit(1)
          print("KILLED %s by: %s" % (leg, want))
          PY
      - name: Failed tests
        if: always()
        run: grep -rl "<failure" --include="TEST-*.xml" ac_cloud-mail/app/build 2>/dev/null | xargs -r grep -h -o 'testcase name="[^"]*"' | head -40 || true
