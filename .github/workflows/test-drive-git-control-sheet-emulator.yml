# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test -> Drive Git control sheet walk (emulator)                       ║
# ║ Installs Cloud Drive on an x86_64 API-34 emulator and walks every      ║
# ║ control of the control sheet. Three jobs, each with its own emulator:  ║
# ║ cloned, notcloned, all-repos; the last job merges the three tables.    ║
# ║ Script: ac_cloud-drive/test/emulator-git-control-sheet.sh.                    ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test -> Drive Git control sheet walk (emulator)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Ship cloud-drive run id whose x86_64 APK artifact to test (empty = the latest release asset)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  walk:
    name: "walk (${{ matrix.phase }})"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        phase: [cloned, notcloned, all-repos, bulk-all, bulk-selected, bulk-cloned]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the Drive APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN_ID" ]; then
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name|startswith("Cloud-Drive-x86_64-")) | .name' |
            while read -r name; do gh run download "$RUN_ID" -R "$REPO" -n "$name" -D "apk/dl-$name"; done
            find apk -name '*.apk' -path '*dl-*' | head -1 | xargs -I{} cp {} apk/drive.apk
          else
            gh release download latest -R "$REPO" -p Cloud-Drive-x86_64.apk -O apk/drive.apk
          fi
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + control sheet walk, ${{ matrix.phase }} (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: WALK_BUDGET=2400 bash ac_cloud-drive/test/emulator-git-control-sheet.sh apk/drive.apk out ${{ matrix.phase }}

      # The runner sometimes hands over an emulator adb reports offline or loses it: a second boot is the remedy. A walk that FINISHED (summary.txt)
      # and failed on its controls is a real result and is not repeated.
      - name: Did the walk finish?
        id: fin
        if: always()
        run: if [ -f out/summary.txt ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi

      - name: Boot emulator + control sheet walk, ${{ matrix.phase }} (attempt 2)
        if: steps.try1.outcome != 'success' && steps.fin.outputs.done != 'true'
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: WALK_BUDGET=2400 bash ac_cloud-drive/test/emulator-git-control-sheet.sh apk/drive.apk out ${{ matrix.phase }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-git-control-sheet-evidence-${{ matrix.phase }}
          path: out/
          if-no-files-found: warn

      # attempt 1 finished with failing controls (so attempt 2 was skipped): that is a real RED, not a pass
      - name: Fail when the walk finished with failing controls
        if: steps.try1.outcome == 'failure' && steps.fin.outputs.done == 'true'
        run: cat out/summary.txt; echo "::error::the ${{ matrix.phase }} walk finished with failing controls (see walk.tsv in the evidence)"; exit 1

  combine:
    name: "Combined result table (JVM observed + three walks)"
    needs: walk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download the three walks
        uses: actions/download-artifact@v4
        with:
          pattern: drive-git-control-sheet-evidence-*
          path: walks
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p combined
          RUN=$(gh api "repos/$REPO/actions/workflows/ship-cloud-drive.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          SHA=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_sha')
          AID=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '.artifacts[]|select(.name=="git-control-sheet-results-observed")|.id' | head -1)
          gh api "repos/$REPO/actions/artifacts/$AID/zip" > combined/obs.zip
          python3 -I -c "import zipfile; zipfile.ZipFile('combined/obs.zip').extractall('combined/obs')"
          TSVS=$(ls walks/*/walk.tsv | paste -sd, -)
          python3 -I ac_cloud-drive/test/merge-walk-into-results.py combined/obs/git-control-sheet-results-observed.md "$TSVS" combined/git-control-sheet-results-combined.md "$RUN" "$SHA" | tee combined/totals.txt
          for p in cloned notcloned all-repos bulk-all bulk-selected bulk-cloned; do
            f=walks/drive-git-control-sheet-evidence-$p/summary.txt
            echo "phase $p: $( [ -f "$f" ] && cat "$f" || echo 'no summary (the walk did not finish)')" | tee -a combined/totals.txt
          done
      - name: Upload the combined result table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-control-sheet-results-combined
          path: combined/*
          if-no-files-found: warn
