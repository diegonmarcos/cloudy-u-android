# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test -> Drive Git control sheet walk (emulator)                       ║
# ║ Installs Cloud Drive on an x86_64 API-34 emulator with ONE cloned     ║
# ║ fixture repository, opens Sync > Git, pulls to refresh and asserts the ║
# ║ three status icons end terminal (never "?" / reading) within 15 s.     ║
# ║ Script: ac_cloud-drive/test/emulator-git-control-sheet.sh.                    ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test -> Drive Git control sheet walk (emulator)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Ship cloud-drive run id whose x86_64 APK artifact to test (empty = the latest release asset)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  control-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the Drive APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN_ID" ]; then
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name|startswith("Cloud-Drive-x86_64-")) | .name' |
            while read -r name; do gh run download "$RUN_ID" -R "$REPO" -n "$name" -D "apk/dl-$name"; done
            find apk -name '*.apk' -path '*dl-*' | head -1 | xargs -I{} cp {} apk/drive.apk
          else
            gh release download latest -R "$REPO" -p Cloud-Drive-x86_64.apk -O apk/drive.apk
          fi
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + Drive > Git control sheet walk (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-drive/test/emulator-git-control-sheet.sh apk/drive.apk out

      # The runner sometimes hands over an emulator adb reports offline; a second boot is the remedy, not a weaker test.
      - name: Boot emulator + Drive > Git control sheet walk (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-drive/test/emulator-git-control-sheet.sh apk/drive.apk out

      # #1934 the walk's per-control results go into the observed table: the Ship run's JVM column + this walk's emulator column.
      - name: Combined result table (JVM observed + emulator walk)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p combined
          RUN=$(gh api "repos/$REPO/actions/workflows/ship-cloud-drive.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          SHA=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_sha')
          AID=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '.artifacts[]|select(.name=="git-control-sheet-results-observed")|.id' | head -1)
          gh api "repos/$REPO/actions/artifacts/$AID/zip" > combined/obs.zip
          python3 -I -c "import zipfile; zipfile.ZipFile('combined/obs.zip').extractall('combined/obs')"
          python3 -I ac_cloud-drive/test/merge-walk-into-results.py combined/obs/git-control-sheet-results-observed.md out/walk.tsv combined/git-control-sheet-results-combined.md "$RUN" "$SHA"
      - name: Upload the combined result table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-control-sheet-results-combined
          path: combined/*.md
          if-no-files-found: warn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-git-control-sheet-evidence
          path: out/
          if-no-files-found: warn
