# #1431 #1437 Cloud C3 on an emulator: a screenshot of each Infra page (three rows: Bare | Personal | Domains), opened
# through the launcher's shortcut_action extra. Runs the APK a Ship Cloud C3 run built (x86_64 artifact), else the
# latest release asset. Evidence is uploaded as c3-infra-evidence.
name: "Test -> Cloud C3 Infra pages (emulator)"

on:
  workflow_dispatch:
    inputs:
      c3_run_id:
        description: "Ship Cloud C3 run id whose x86_64 APK artifact to test (empty = release asset)"
        required: false
        default: ""
      release_tag:
        description: "Release to download from when the run id is empty"
        required: false
        default: "latest"

permissions:
  contents: read
  actions: read

jobs:
  infra-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: ac_cloud-c3/test

      - name: Fetch the Cloud C3 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          W_RUN: ${{ inputs.c3_run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$W_RUN" ]; then
            gh api "repos/$REPO/actions/runs/$W_RUN/artifacts" --paginate --jq '.artifacts[] | select((.name|startswith("Cloud-C3-")) and (.name|test("WebServer")|not)) | .name' |
            while read -r name; do gh run download "$W_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          else
            gh release download "${TAG:-latest}" -R "$REPO" -p 'Cloud-C3*.apk' -D apk
          fi
          pick=""
          for want in x86_64 universal ''; do
            # Cloud-C3-WebServer*.apk also matches the Cloud-C3* pattern: it is another app (#1483: the walk ran on it)
            pick=$(find apk -name '*.apk' | sort | grep -vi -- 'webserver' | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud C3 APK"; exit 1; }
          cp "$pick" c3.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + walk the pages (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-c3/test/emulator-infra-pages.sh c3.apk out

      - name: Boot emulator + walk the pages (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-c3/test/emulator-infra-pages.sh c3.apk out

      - name: Upload evidence (screenshots, ui dumps, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-infra-evidence
          path: out/
          if-no-files-found: warn
