# #1934 control sheet mutation proof: the Compose test "every greyed control on a not-cloned repo carries its own reason line"
# (ControlSheetRenderTest) must go RED when the header reason line, one header action's reason, or the card groups reason line (Stage & Commit) is dropped.
# Runs the suite once on the real tree (GREEN expected), then once per planted mutant (RED expected). Manual only.
name: drive-control-sheet-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: "all | one of the mutant names below"
        required: false
        default: "all"
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-drive
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: Real tree GREEN, every mutant RED
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ONLY: ${{ inputs.name }}
        run: |
          set -u
          jq '.tests.unit.task = ":app:testDebugUnitTest"' "$WORK_DIR/build.json" > /tmp/b.json && mv /tmp/b.json "$WORK_DIR/build.json"
          V=ab_cloud-libs-shared/libs/git-ui/src/main/java/com/diegonmarcos/cloudlib/gitui/GitControlSheet.kt
          # Only the suite under proof runs (this checkout only): an unrelated test that needs a runner tool (fish) or
          # another ticket's fixture must not decide whether these mutants are caught.
          find ac_cloud-drive/app/src/test -name '*.kt' ! -name 'ControlSheetRenderTest.kt' -delete
          suite() { sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" > /tmp/suite.log 2>&1; }
          sub() { python3 -c 'import sys; p, a, b = sys.argv[1:]; s = open(p).read(); assert a in s, "anchor missing: " + a; open(p, "w").write(s.replace(a, b, 1))' "$V" "$1" "$2"; }
          suite || { tail -80 /tmp/suite.log; echo "::error::the real tree is RED"; exit 1; }
          grep -q "ControlSheetRenderTest" -r ac_cloud-drive/app/build/test-results 2>/dev/null || { echo "::error::ControlSheetRenderTest did not run"; exit 1; }
          echo "real tree: GREEN"
          stayed=0
          while IFS='@' read -r name a b; do
            [ -z "$name" ] && continue
            [ "$ONLY" != "all" ] && [ "$ONLY" != "$name" ] && continue
            git checkout -- "$V"
            sub "$a" "$b" || { echo "::error::$name: mutation anchor missing"; stayed=$((stayed + 1)); continue; }
            if suite; then echo "::error::mutant stayed GREEN: $name"; stayed=$((stayed + 1)); else echo "RED (caught): $name"; grep -h 'everyGreyedControlOnANotClonedRepoCarriesItsOwnReasonLine\|aClonedRepoShowsNoReasonLines' /tmp/suite.log | head -3; fi
          done <<'MUTANTS'
          header-reason-dropped@if (headerWhy.isNotEmpty()) Column(@if (false) Column(
          one-header-action-reason-dropped@blocked(a)?.let { a.label to it } }.groupBy@blocked(a)?.takeIf { a.id != "hd.check_full" }?.let { a.label to it } }.groupBy
          group-reason-dropped@                Reasons(g.controls.mapNotNull { c -> blocked(c)?.takeIf@                if (false) Reasons(g.controls.mapNotNull { c -> blocked(c)?.takeIf
          MUTANTS
          git checkout -- "$V"
          [ "$stayed" -eq 0 ] || { echo "::error::$stayed mutant(s) stayed green"; exit 1; }
          echo "every mutant RED"
