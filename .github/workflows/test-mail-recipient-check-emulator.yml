name: "Test -> Cloud Mail recipient check (emulator screenshots: chip marks, detail sheet, will-fail question on Send)"

# #1803: build the Cloud Mail test variant (-PtestApp), seed one offline account and bind the SCRIPTED deliverability checker
# (--ez recipientcheck true; src/navWalk ScriptedRecipientChecker answers by domain), then open New mail and type one recipient
# per verdict: ok, catch-all (risky), role + past bounce (risky), no MX (will fail), a malformed address (phone syntax check)
# and an unknown domain (no answer). Shoots the marks while checking and once answered, the detail sheet of the will-fail chip
# and of the malformed one, then a second composer with ok + no-MX where Send asks first; "Back" leaves it unsent.
# Dispatch only; nothing is published, nothing is sent (the seeded account points at an unresolvable host).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mail-recipient-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the test variant
        run: |
          set -eu
          cd ac_cloud-mail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PtestApp
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | sort | head -1)
          [ -n "$apk" ] || { echo "::error::no APK built"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/app-under-test.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "PKG=$("$AAPT" dump packagename "$GITHUB_WORKSPACE/app-under-test.apk")" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the scene script
        run: |
          cat > walk.sh <<'SH'
          #!/bin/bash
          set -u
          mkdir -p walk-out
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb shell settings put secure screensaver_enabled 0 || true
          adb shell svc power stayon true || true
          sleep 45 # let the launcher settle after boot
          adb install -r -g app-under-test.apk || { echo "::error::adb install failed"; exit 2; }
          wake() { adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1; }
          shot() { wake; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1; adb exec-out screencap -p > "walk-out/$1.png"; }
          dump() { wake; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb exec-out cat /sdcard/ui.xml > "walk-out/$1.xml"; }
          # tap the centre of the first node whose text or content-desc equals $1; non-zero when absent
          tap() {
            dump tap-scan
            xy=$(python3 -I - "$1" walk-out/tap-scan.xml <<'PY'
          import re, sys
          want, xml = sys.argv[1], open(sys.argv[2], encoding="utf-8").read()
          for m in re.finditer(r'<node [^>]*>', xml):
              n = m.group(0)
              t = re.search(r' text="([^"]*)"', n); d = re.search(r' content-desc="([^"]*)"', n)
              if want in ((t.group(1) if t else ""), (d.group(1) if d else "")):
                  b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
                  x1, y1, x2, y2 = map(int, b.groups()); print((x1 + x2) // 2, (y1 + y2) // 2); break
          PY
            )
            [ -n "$xy" ] || return 1
            adb shell input tap $xy
          }
          has() { grep -q "$1" "walk-out/$2.xml" && echo "$2 has: $1" >> walk-out/summary.txt || echo "$2 MISSING: $1" >> walk-out/summary.txt; }
          # leave a composer: the toolbar's Discard (X), then the dialog's Discard if it asks; never a blind tap (it lands on the keyboard)
          leave() {
            tap "Discard" || { adb shell input keyevent KEYCODE_BACK; sleep 1; tap "Discard" || true; }
            sleep 2; dump leave-check
            grep -q 'text="Discard"' walk-out/leave-check.xml && { tap "Discard"; sleep 2; dump leave-check; }
            grep -q 'New mail' walk-out/leave-check.xml && echo "leave: still in the composer" >> walk-out/summary.txt
            return 0
          }
          # one address per input call (one long `input text` was cut off mid-address while the suggestion menu opened)
          typeall() { for a in "$@"; do adb shell input text "$a"; sleep 1; adb shell input text ','; sleep 2; done; }
          # tap the LAST node whose content-desc equals $1 (the newest chip's mark, never one scrolled half out of view)
          taplast() {
            dump tap-scan
            xy=$(python3 -I - "$1" walk-out/tap-scan.xml <<'PY'
          import re, sys
          want, xml = sys.argv[1], open(sys.argv[2], encoding="utf-8").read()
          hits = [m.group(0) for m in re.finditer(r'<node [^>]*>', xml) if ('content-desc="%s"' % want) in m.group(0)]
          if hits:
              x1, y1, x2, y2 = map(int, re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', hits[-1]).groups()); print((x1 + x2) // 2, (y1 + y2) // 2)
          PY
            )
            [ -n "$xy" ] || return 1
            adb shell input tap $xy
          }
          compose() {
            ok=0; for i in 1 2 3 4; do tap "Compose" && { ok=1; break; }; sleep 4; done
            # the extended FAB exposes no text to uiautomator: tap its place, but ONLY on the list (a composer still open means
            # the place is the keyboard, which is how "GT" got typed into a recipient before)
            if [ "$ok" != 1 ]; then
              dump fab-check
              grep -q 'New mail' walk-out/fab-check.xml && { echo "::error::a composer is still open; not tapping blind"; exit 1; }
              adb shell input tap 873 1922
            fi
            sleep 8
          }
          adb shell am broadcast -n "$PKG/app.sterna.navwalk.NavWalkSeedReceiver" -a app.sterna.test.navwalk.SEED --ei emails 1 --ez recipientcheck true
          sleep 3
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 15
          # the process may have been restarted by the launch: bind the scripted checker again into the running one
          adb shell am broadcast -n "$PKG/app.sterna.navwalk.NavWalkSeedReceiver" -a app.sterna.test.navwalk.SEED --ez recipientcheck true
          sleep 2
          shot 00-inbox; dump 00-inbox
          compose
          shot 01-new; dump 01-new
          grep -q 'New mail' walk-out/01-new.xml || { echo "::error::New mail did not open"; exit 1; }
          # scene 1: one recipient per verdict; each comma commits a chip, which starts its check
          typeall ok@ok.example catchall@catchall.example info@bounce.example x@nomx.example bad@nodot who@unknown.example
          sleep 0.3; shot 02-marks-checking; dump 02-marks-checking
          sleep 4; shot 03-marks-answered; dump 03-marks-answered
          # the chip area scrolls: every verdict is looked for across the scrolled-to-top and bottom dumps
          adb shell input swipe 400 300 400 420 200; sleep 1; dump 03b-marks-top; shot 03b-marks-top
          cat walk-out/03-marks-answered.xml walk-out/03b-marks-top.xml > walk-out/03-all.xml
          for v in "Delivery check: Can receive" "Delivery check: Risky" "Delivery check: Will fail" "Delivery check: Unknown"; do has "$v" 03-all; done
          leave
          # scene 2: two chips (nothing scrolls); the will-fail mark opens the sheet, then Send asks first
          compose
          typeall ok@ok.example x@nomx.example
          sleep 4; shot 04-two-chips; dump 04-two-chips
          taplast "Delivery check: Will fail" || { echo "::error::no will-fail mark to tap"; exit 1; }
          sleep 3; shot 05-sheet-nomx; dump 05-sheet-nomx
          for s in "Delivery check" "Address format" "Domain accepts mail" "Mailbox" "Past bounces" "Disposable or role address" "Message size limit" "Check again" "no MX and no A record" "Checked by the mail server"; do has "$s" 05-sheet-nomx; done
          adb shell input swipe 540 1800 540 900 300; sleep 2; shot 05b-sheet-nomx-scrolled; dump 05b-sheet-nomx-scrolled
          adb shell input keyevent KEYCODE_BACK; sleep 2
          dump after-sheet; grep -q 'Check again' walk-out/after-sheet.xml && { adb shell input keyevent KEYCODE_BACK; sleep 2; }
          shot 06-send-ready; dump 06-send-ready
          grep -q 'content-desc="Send"' walk-out/06-send-ready.xml || echo "no Send button in the dump" >> walk-out/summary.txt
          tap "Send" || { echo "::error::no Send button"; exit 1; }
          sleep 3; shot 07-will-fail-question; dump 07-will-fail-question
          for s in "Some recipients will not receive this" "x@nomx.example" "Send anyway" "Back" "Domain accepts mail: no MX and no A record"; do has "$s" 07-will-fail-question; done
          tap "Back" || true; sleep 2; shot 08-back-unsent; dump 08-back-unsent
          has "New mail" 08-back-unsent
          leave
          # scene 3: a malformed address: the phone's own syntax line, offline
          compose
          typeall bad@nodot
          sleep 2; shot 09-syntax-chip; dump 09-syntax-chip
          taplast "Delivery check: Will fail" && { sleep 3; shot 10-sheet-syntax; dump 10-sheet-syntax; has "Checked on this phone" 10-sheet-syntax; has "The domain has no dot" 10-sheet-syntax; adb shell input keyevent KEYCODE_BACK; sleep 2; } || echo "no will-fail mark on the malformed chip" >> walk-out/summary.txt
          leave
          timeout 60 adb logcat -d -v threadtime "*:W" > walk-out/logcat.txt || true
          cat walk-out/summary.txt
          if grep -q "MISSING" walk-out/summary.txt; then echo "::error::expected text missing from the dumps (summary.txt)"; exit 1; fi
          SH
          chmod +x walk.sh

      - name: Boot emulator + scenes
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-recipient-check-evidence
          path: walk-out
          if-no-files-found: warn
