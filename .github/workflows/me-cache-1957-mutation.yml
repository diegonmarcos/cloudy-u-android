# #1957 precache mutation runs (owner policy cache_ttl): each leg applies ONE deliberate break to the page cache (LnktreeCache.kt) and runs
# Cloud Me's JVM suite; its named Precache1957Test case must fail (KILLED). The JVM suite is RED by design; the job is green only when the
# verdict step reads the named test as failed in the JUnit XML. A leg whose sed changed nothing, whose test stayed green or never ran fails.
# Leg `all` runs every leg (matrix). The input reaches the scripts only through env and is checked against the allow-list.
name: me-cache-1957-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'all | xo-off | sw-miss | complete-static | no-startup-fill | fresh-refetch | stale-skip | non-atomic | open-fetch | pull-noop | video-cap | version-keep dedupe-off | dedupe-off | job-cap-off | plan-cap-off | no-deadline'
        required: true
        default: all
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-me
jobs:
  legs:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.l.outputs.legs }}
    steps:
      - id: l
        env:
          LEG: ${{ inputs.name }}
        run: |
          ALL='xo-off sw-miss complete-static no-startup-fill fresh-refetch stale-skip non-atomic open-fetch pull-noop video-cap version-keep dedupe-off job-cap-off plan-cap-off no-deadline'
          if [ "$LEG" = all ]; then L="$ALL"; else case " $ALL " in *" $LEG "*) L="$LEG" ;; *) echo "::error::unknown leg"; exit 2 ;; esac; fi
          echo "legs=$(printf '%s\n' $L | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  mutate:
    needs: legs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.legs.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation
        env:
          M: ${{ matrix.leg }}
        run: |
          D=ac_cloud-me/app/src/main/java/com/diegonmarcos/cloudme
          case "$M" in
            xo-off) sed -i 's/(crossOrigin || (it.host.equals(b.host, true)/(false || (it.host.equals(b.host, true)/' "$D/LnktreeCache.kt" ;;
            sw-miss) sed -i 's/if (!cfg.enabled || method != "GET" || !url.startsWith("https:\/\/")) return null/if (true) return null/' "$D/LnktreeCache.kt" ;;
            complete-static) sed -i 's/= paintable(pageId, url) \&\& missing(pageId, url).isEmpty()/= paintable(pageId, url)/' "$D/LnktreeCache.kt" ;;
            no-startup-fill) sed -i 's/CacheState.MISSING -> Action.FILL/CacheState.MISSING -> Action.SKIP/' "$D/LnktreeCache.kt" ;;
            fresh-refetch) sed -i 's/if (store.complete(p.id, p.url)) Action.SKIP else Action.COMPLETE/Action.REFETCH/' "$D/LnktreeCache.kt" ;;
            stale-skip) sed -i 's/CacheState.STALE -> Action.REFETCH/CacheState.STALE -> Action.SKIP/' "$D/LnktreeCache.kt" ;;
            non-atomic) sed -i 's/if (ok \&\& store.commit(p.id, st))/if (store.commit(p.id, st))/' "$D/LnktreeCache.kt" ;;
            open-fetch) sed -i 's/if (isMain \&\& store.state(pageId, url, cfg.ttlMs) == CacheState.STALE) revalidate(url)/if (isMain) revalidate(url)/' "$D/LnktreeCache.kt" ;;
            pull-noop) sed -i 's/if (cfg.hardRefreshScope == "all") store.clearAll() else store.clearPageWithShared(pageId)/1/' "$D/LnktreeCache.kt" ;;
            video-cap) sed -i 's/(cfg.videoMaxFileBytes > 0 \&\& r.body.size > cfg.videoMaxFileBytes)/false/' "$D/LnktreeCache.kt" ;;
            version-keep) sed -i 's/if (had) clearAll()/if (false) clearAll()/' "$D/LnktreeCache.kt" ;;
            dedupe-off) sed -i 's/if (sharedFor(pageId, url) \&\& status == 200) {/if (false \&\& status == 200) {/' "$D/LnktreeCache.kt" ;;
            job-cap-off) sed -i 's/if (cfg.maxBytes > 0 \&\& store.budget.used.get() + r.body.size > cfg.maxBytes)/if (false)/' "$D/LnktreeCache.kt" ;;
            plan-cap-off) sed -i 's/cfg.maxScriptMediaPerPage > 0 \&\& ++scriptMedia/false \&\& ++scriptMedia/' "$D/LnktreeCache.kt" ;;
            no-deadline) sed -i 's/if (now() > end) return Result.Timeout/if (false) return Result.Timeout/; s/if (maxBytes > 0 \&\& out.size() > maxBytes) return Result.TooLarge/if (false) return Result.TooLarge/' "$D/LnktreeCache.kt" ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected; the verdict step reads the XML)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" || true
      - name: Verdict (KILLED = the named test failed)
        env:
          M: ${{ matrix.leg }}
        run: |
          case "$M" in
            xo-off) N="cross-origin subresources and the URLs a script or data file names are planned and stored" ;;
            sw-miss) N="service-worker requests are served from the app cache" ;;
            complete-static) N="a page counts as complete only when every referenced file is stored" ;;
            no-startup-fill) N="the startup job fills every page with no page ever opened" ;;
            fresh-refetch) N="a copy younger than ttl_days is not fetched at startup" ;;
            stale-skip) N="a copy older than ttl_days is refetched and replaced" ;;
            non-atomic) N="a failed refetch keeps the old copy" ;;
            open-fetch) N="opening a fresh page causes no network request for the main frame or its files" ;;
            pull-noop) N="pull-down always refetches" ;;
            video-cap) N="videos keep to the per-file and total caps and images are always stored" ;;
            version-keep) N="a new cache_version wipes the copies taken before it once" ;;
            dedupe-off) N="a shared file is downloaded and stored once for every page and counted once" ;;
            job-cap-off) N="the cache cap holds while the job runs, videos stop first and images still finish" ;;
            plan-cap-off) N="the data-file scan plans at most max_script_media_per_page media files and marks the rest known-missing" ;;
            no-deadline) N="a download that trickles for ever or never ends is cut off and never stalls the job" ;;
          esac
          X="$(find ac_cloud-me/app/build -path '*test-results*' -name "TEST-*.Precache1957Test.xml" | head -1)"
          [ -n "$X" ] || { echo "::error::LEG ERROR $M: no result for Precache1957Test (did not compile or run); not a kill"; exit 1; }
          python3 -I - "$X" "$N" "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, want, leg = sys.argv[1:]
          cases = {c.get("name"): c for c in ET.parse(path).getroot().iter("testcase")}
          failed = sorted(n for n, c in cases.items() if c.find("failure") is not None or c.find("error") is not None)
          print("failed tests:", failed)
          if want not in cases: print("::error::LEG ERROR %s: the named test did not run: %s" % (leg, want)); sys.exit(1)
          if want not in failed: print("::error::LEG SURVIVED %s: the named test stayed green: %s" % (leg, want)); sys.exit(1)
          print("KILLED %s by: %s" % (leg, want))
          PY
