name: "Test -> Cloud Mail compose (emulator screenshots: New, Reply, Forward with the HTML signature; sectioned menu; QR button)"

# #1800: build the Cloud Mail test variant (-PtestApp, the build that carries the offline seed receiver), seed one offline
# account whose identity has an HTML signature with five links (--ez htmlsig true, which also turns "signature on replies" on),
# then open New mail, Reply and Forward and capture each composer: the rich editor with the HTML signature in it; then the
# composer's sectioned overflow menu (scrolled through), the To field's QR button, the camera it opens and what the
# composer says when the picture comes back (the CI emulator has no image-scan engine, so that is its own message).
# Dispatch only; nothing is published.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mail-compose-html-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the test variant
        run: |
          set -eu
          cd ac_cloud-mail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PtestApp
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | sort | head -1)
          [ -n "$apk" ] || { echo "::error::no APK built"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/app-under-test.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "PKG=$("$AAPT" dump packagename "$GITHUB_WORKSPACE/app-under-test.apk")" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the scene script
        run: |
          cat > walk.sh <<'SH'
          #!/bin/bash
          set -u
          mkdir -p walk-out
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          sleep 45 # let the launcher settle after boot
          adb install -r -g app-under-test.apk || { echo "::error::adb install failed"; exit 2; }
          shot() { adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1; adb exec-out screencap -p > "walk-out/$1.png"; }
          dump() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb exec-out cat /sdcard/ui.xml > "walk-out/$1.xml"; }
          # tap the centre of the first node whose text or content-desc equals $1; non-zero when absent
          tap() {
            dump tap-scan
            xy=$(python3 -I - "$1" walk-out/tap-scan.xml <<'PY'
          import re, sys
          want, xml = sys.argv[1], open(sys.argv[2], encoding="utf-8").read()
          for m in re.finditer(r'<node [^>]*>', xml):
              n = m.group(0)
              t = re.search(r' text="([^"]*)"', n); d = re.search(r' content-desc="([^"]*)"', n)
              if want in ((t.group(1) if t else ""), (d.group(1) if d else "")):
                  b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
                  x1, y1, x2, y2 = map(int, b.groups()); print((x1 + x2) // 2, (y1 + y2) // 2); break
          PY
            )
            [ -n "$xy" ] || return 1
            adb shell input tap $xy
          }
          # tap the first node whose TEXT (not content-desc) equals $1: the dialog's button, never the composer's X
          taptext() {
            dump tap-scan
            xy=$(python3 -I - "$1" walk-out/tap-scan.xml <<'PY'
          import re, sys
          want, xml = sys.argv[1], open(sys.argv[2], encoding="utf-8").read()
          for m in re.finditer(r'<node [^>]*>', xml):
              n = m.group(0); t = re.search(r' text="([^"]*)"', n)
              if t and t.group(1) == want:
                  b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
                  x1, y1, x2, y2 = map(int, b.groups()); print((x1 + x2) // 2, (y1 + y2) // 2); break
          PY
            )
            [ -n "$xy" ] || return 1
            adb shell input tap $xy
          }
          # leave a composer: hide the keyboard, close with the X, then the dialog's Discard (by its text)
          leave() {
            adb shell input keyevent KEYCODE_BACK; sleep 1
            tap "Discard" || adb shell input keyevent KEYCODE_BACK; sleep 2
            for i in 1 2 3; do taptext "Discard" && break; sleep 2; done
            sleep 3
          }
          # the signature's words are on screen (the WebView exposes its text to the accessibility tree)
          sigcheck() { grep -q 'Whatsapp' "walk-out/$1.xml" && grep -q 'GitHub' "walk-out/$1.xml" && echo "$1: signature on screen" >> walk-out/summary.txt || echo "$1: signature words not in the accessibility dump (see the screenshot)" >> walk-out/summary.txt; }
          adb shell am broadcast -n "$PKG/app.sterna.navwalk.NavWalkSeedReceiver" -a app.sterna.test.navwalk.SEED --ei emails 3 --ei bodies 3 --ez htmlsig true
          sleep 3
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 15
          shot 00-inbox; dump 00-inbox
          # the FAB animates in after the list: retry, then its known place (bottom-right) as the fallback
          ok=0; for i in 1 2 3 4; do tap "Compose" && { ok=1; break; }; sleep 4; done
          [ "$ok" = 1 ] || { echo "Compose not in the dump; tapping the FAB position" >> walk-out/summary.txt; adb shell input tap 910 1921; }
          sleep 8
          shot 01-new; dump 01-new; sigcheck 01-new
          grep -q 'New mail' walk-out/01-new.xml || { echo "::error::New mail did not open"; exit 1; }
          # the sectioned overflow: Actions, Text, Signature, Templates, Compose (scrolled to see all of it)
          tap "More" || { echo "::error::no overflow button"; exit 1; }
          sleep 2; shot 05-menu-top; dump 05-menu-top
          adb shell input swipe 540 1500 540 600 400; sleep 2; shot 05-menu-middle; dump 05-menu-middle
          adb shell input swipe 540 1500 540 600 400; sleep 2; shot 05-menu-bottom; dump 05-menu-bottom
          cat walk-out/05-menu-*.xml > walk-out/05-menu-all.xml
          for s in Actions Text Signature Templates Compose WYSIWYG "Plain text" "Save draft" "Add…"; do
            grep -q "text=\"$s\"" walk-out/05-menu-all.xml && echo "menu has: $s" >> walk-out/summary.txt || echo "menu MISSING: $s" >> walk-out/summary.txt
          done
          adb shell input keyevent KEYCODE_BACK; sleep 2
          # the To field's QR button, the camera it opens, and the composer's answer to the picture
          shot 06-qr-button; dump 06-qr-button
          grep -q 'Scan a QR code for recipients' walk-out/06-qr-button.xml || { echo "::error::no QR button on the To field"; exit 1; }
          tap "Scan a QR code for recipients"; sleep 6
          shot 06b-qr-camera; dump 06b-qr-camera
          adb shell input keyevent KEYCODE_CAMERA; sleep 4; shot 06c-qr-shutter; dump 06c-qr-shutter
          tap "Done" || echo "camera had no Done button" >> walk-out/summary.txt
          # the composer's answer is a toast: shoot it as it appears
          for i in 1 2 3 4 5 6; do sleep 1; shot 06d-qr-result-$i; done; dump 06d-qr-result
          adb shell input keyevent KEYCODE_BACK; sleep 2
          dump after-qr; grep -q 'New mail' walk-out/after-qr.xml || adb shell input keyevent KEYCODE_BACK
          leave
          ok=0; for i in 1 2 3; do tap "Seed message 3 of 3" && { ok=1; break; }; sleep 3; done
          [ "$ok" = 1 ] || { echo "::error::no seeded message in the list"; exit 1; }
          sleep 6
          shot 02a-reader; dump 02a-reader
          ok=0; for i in 1 2 3; do tap "Reply" && { ok=1; break; }; sleep 3; done
          [ "$ok" = 1 ] || { echo "::error::no Reply action"; exit 1; }
          sleep 8
          shot 02-reply; dump 02-reply; sigcheck 02-reply
          leave
          sleep 2; dump back-in-reader
          grep -q 'Forward' walk-out/back-in-reader.xml || { tap "Seed message 3 of 3" || true; sleep 6; }
          ok=0; for i in 1 2 3; do tap "Forward" && { ok=1; break; }; sleep 3; done
          [ "$ok" = 1 ] || { echo "::error::no Forward action"; exit 1; }
          sleep 8
          shot 03-forward; dump 03-forward; sigcheck 03-forward
          # the formatting bar shows while the body has the focus: tap into the body and shoot the bar too
          adb shell input tap 540 1500; sleep 3; shot 04-forward-formatting-bar; dump 04-forward-formatting-bar
          timeout 60 adb logcat -d -v threadtime "*:W" > walk-out/logcat.txt || true
          cat walk-out/summary.txt
          SH
          chmod +x walk.sh

      - name: Boot emulator + scenes
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-compose-html-signature-evidence
          path: walk-out
          if-no-files-found: warn
