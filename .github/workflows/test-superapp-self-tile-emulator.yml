# #1453 Cloud SuperApp launcher mode on an emulator: tapping the SuperApp's own tile (Cloud > Apps > Lnktree > SuperApp) must
# open Configs inside the home screen, with the SuperApp's own status bar and not Android's. Runs the x86_64 APK a Ship Cloud
# SuperApp run built, as the default home app. Evidence: self-tile-evidence (before-tap, after-tap shots, ui dumps, window dump).
name: "Test -> SuperApp self tile in launcher mode (emulator)"

on:
  workflow_dispatch:
    inputs:
      superapp_run_id:
        description: "Ship Cloud SuperApp run id whose x86_64 APK artifact to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch the Cloud SuperApp APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          W_RUN: ${{ inputs.superapp_run_id }}
        run: |
          set -eu
          mkdir -p apk
          gh api "repos/$REPO/actions/runs/$W_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-SuperApp")) | .name' |
          while read -r name; do gh run download "$W_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          pick=""
          for want in x86_64 universal ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud SuperApp APK"; exit 1; }
          cp "$pick" superapp.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the script
        run: |
          cat > shoot.sh <<'EOF2'
          set -u
          mkdir -p out
          adb install -r -g superapp.apk || exit 2
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PKG=$("$aapt2" dump packagename superapp.apk)
          adb shell appops set "$PKG" SYSTEM_ALERT_WINDOW deny || true
          adb shell cmd package set-home-activity "$PKG/.HomeActivity" || true
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put system screen_off_timeout 2147483647; adb shell svc power stayon true
          adb shell locksettings set-disabled true || true
          adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
          awake() { adb shell am stopservice -n "$PKG/.floatingnav.ScreensaverService" >/dev/null 2>&1 || true; adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard; adb shell input keyevent 82; }
          awake
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME | tr -d '\r' | tail -1 | tee out/home-resolves-to.txt
          adb shell am force-stop "$PKG"
          adb shell am start -W -n "$PKG/.HomeActivity" >/dev/null; sleep 10; awake
          adb shell am start -n "$PKG/.HomeActivity" --es shortcut_action section:cloud >/dev/null; awake; sleep 8
          adb exec-out screencap -p > out/before-tap.png
          # find the SuperApp tile (text or content-desc "SuperApp"), scrolling down until it shows
          cat > find.py <<'PY'
          import re,sys
          x=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'<node[^>]*>',x):
              n=m.group(0)
              t=re.search(r' text="([^"]*)"',n); d=re.search(r' content-desc="([^"]*)"',n)
              if (t and t.group(1)=="SuperApp") or (d and d.group(1)=="SuperApp"):
                  b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n)
                  if b:
                      a=list(map(int,b.groups())); print((a[0]+a[2])//2,(a[1]+a[3])//2); sys.exit(0)
          sys.exit(1)
          PY
          pos=""
          for i in 1 2 3 4 5 6; do
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null || true; adb pull /sdcard/ui.xml out/ui-before-$i.xml >/dev/null || true
            pos=$(python3 find.py out/ui-before-$i.xml || true)
            [ -n "$pos" ] && break
            adb shell input swipe 540 1700 540 800 500; sleep 2
          done
          echo "self tile at: ${pos:-NOT FOUND}"
          [ -n "$pos" ] || { adb exec-out screencap -p > out/tile-not-found.png; timeout 60 adb logcat -d > out/logcat.txt || true; exit 0; }
          adb exec-out screencap -p > out/tile-visible.png
          adb shell input tap $pos; sleep 6; awake; sleep 3
          adb exec-out screencap -p > out/after-tap.png
          adb shell uiautomator dump /sdcard/ui.xml || true; adb pull /sdcard/ui.xml out/ui-after.xml || true
          adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity" > out/resumed.txt || true
          adb shell dumpsys window | grep -iE "statusBar|isVisible|InsetsSource" | head -60 > out/window-bars.txt || true
          cat out/resumed.txt
          timeout 60 adb logcat -d > out/logcat.txt || true
          EOF2
          chmod +x shoot.sh
      - name: Boot emulator and shoot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash shoot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-tile-evidence
          path: out/
          if-no-files-found: warn
