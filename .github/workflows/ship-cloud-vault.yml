name: "Ship → Cloud Vault APK (build + push to GHCR via ORAS + attach to GH Release)"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options: [debug, release]
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
      build_fork:
        description: "Build + publish the Bitwarden-fork (build.json::forks.vault) — the shipping Cloud-Vault.apk, ~14 min"
        required: false
        type: boolean
        default: true
      build_webview:
        description: "ALSO build the legacy WebView wrapper (pre-fork app) — manual fallback only, no longer published on push"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-vault-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-vault/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-vault.yml"
      # ── end MANAGED-PATHS-HEADER ──
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleet-data-client/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints-android/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-agents/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-logcat/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-xray/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ac_cloud-vault/**"
      - "!ac_cloud-vault/web/**"
permissions:
  contents: write
  packages: write

concurrency:
  group: ship-cloud-vault-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-vault

jobs:
  # ── Legacy WebView wrapper — manual fallback only ──────────────────────
  # This was the shipping app until the Bitwarden fork below was proven in CI
  # (run 31602029574, 2026-08-12). The fork job is now the push-triggered
  # publisher of Cloud-Vault.apk; run this with build_webview=true only to
  # resurrect the wrapper (note: push_oras/create_release here would overwrite
  # the fork's published latest with the WebView APK again).
  build_and_publish:
    name: "Build legacy WebView APK (${{ matrix.abi }}) — manual"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_webview }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every application's testers, and — for the 24 that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Until this
      # step existed, an application with zero testers and one with fifty
      # passing testers produced indistinguishable green ticks, and the ship
      # workflow's only question was "did Gradle exit 0". Needs no JDK, no SDK
      # and no gradle, so it costs seconds and fails before anything is built.
      #
      # DELIBERATELY NOT gated on the publish gate: the gate answers "would
      # these bytes differ?", which is the right question for publishing and the
      # wrong one for testing — editing a tester does not move the APK, and
      # gating here would let a new assertion land without ever running once.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.10.2 (cached)
        if: steps.gate.outputs.skip != 'true'
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDVAULT_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          set -o pipefail
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          else
            ./build.sh build 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          fi
          ls -la dist/

      - name: Why the build failed (readable without a token)
        if: failure() && steps.gate.outputs.skip != 'true'
        run: sh 1_cicd/dist/scripts/cloud-android-annotate-build-failure.sh "$RUNNER_TEMP/gradle-build.log" "build [cloud-vault]"

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-vault" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Vault-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDVAULT_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-vault

      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDVAULT_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-vault" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"

  # ── Bitwarden-fork build (build.json::forks.vault) — THE shipping app ──
  # Promoted 2026-08-18: this job now publishes Cloud-Vault.apk (GHCR :latest
  # + GH release rolling tag "latest"), replacing the WebView wrapper above.
  # Runs on every push touching this app (~14 min, path-filtered so rare).
  # The fork APK stages as dist/Cloud-Vault.apk so build.sh's oras-push /
  # gh-release pick it up under the constellation asset name unchanged —
  # aa_cloud-superapp's constellation-fleet.json release_url keeps working.
  # The x86_64 variant (Cloud-Vault-x86_64.apk / GHCR :latest-x86_64) is
  # published from the SAME universal APK — see the staging step below.
  #
  # First green run: 31602029574 (2026-08-12) — assembleFdroidRelease, signed,
  # 36 MB fdroid/release APK.
  #
  # com.bitwarden:sdk-android resolves from
  # https://maven.pkg.github.com/bitwarden/sdk, which 401s anonymously. Upstream's
  # settings.gradle.kts reads the credential as:
  #   password = userProperties["gitHubToken"] ?: System.getenv("GITHUB_TOKEN")
  #   (username is hardcoded to "")
  # The auto-minted per-run GITHUB_TOKEN was assumed too repo-scoped to read
  # another owner's Packages. It is not — it resolved the SDK with no 401, so no
  # BITWARDEN_PACKAGES_TOKEN secret exists or is needed. The env below still
  # prefers that secret if anyone ever sets one.
  build_fork_vault:
    name: "Build + publish Bitwarden fork (build-fork vault)"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORK_DIR: ac_cloud-vault
      FORK: vault

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Upstream pins compileSdk/targetSdk = 37 (gradle/libs.versions.toml
          # at v2026.7.1-bwpm), so API 37 is required — but Google publishes it
          # under minor-versioned paths. "platforms;android-37" does not exist
          # and sdkmanager fails the whole step with "Failed to find package";
          # the real stable packages are android-37.0 and android-37.1. Both are
          # installed because the compileSdk -> minor-platform mapping depends on
          # the AGP version the fork ships.
          packages: "platforms;android-37.0 platforms;android-37.1 build-tools;37.0.0 platform-tools"

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      # The fork signs with the same sops-encrypted shared key as the WebView
      # job — sops must be on PATH before build-fork's signing step (an early
      # run died at "FATAL signing: sops not on PATH"). ORAS + jq because this
      # job now publishes to GHCR + the GH release.
      - name: Install jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Materialize fork (clone @ pin + patch series)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Build fork APK (fork's own gradle wrapper + constellation signing)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # Read by upstream settings.gradle.kts (GitHubPackages/bitwarden/sdk
          # repository credentials) as System.getenv("GITHUB_TOKEN") — NOT a
          # gradle -P property.
          #
          # Falls back to the auto-minted GITHUB_TOKEN when the PAT secret is
          # unset. maven.pkg.github.com refuses anonymous reads (401) but serves
          # com.bitwarden:sdk-android to an ordinary authenticated token (200,
          # verified 2026-08-12), so the fallback is worth attempting before
          # anyone mints a PAT. If the fork build 401s on dependency resolution,
          # that is the signal the auto-minted token is repo-scoped after all —
          # set BITWARDEN_PACKAGES_TOKEN to a PAT with read:packages and re-run.
          GITHUB_TOKEN: ${{ secrets.BITWARDEN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: always()
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-vault" ${{ env.WORK_DIR }}/dist/cloud-vault-vault.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload fork APK as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-vault-bitwarden-fork-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/cloud-vault-vault.apk
          if-no-files-found: warn
          retention-days: 14

      # The autofill tier's JVM suites, before anything is published. The fork
      # job used to run assembleFdroidRelease and nothing else, so a green tick
      # meant "Bitwarden compiled", never "autofill still parses a login form".
      # Scoped to the autofill + URI-matching packages (the whole app suite is
      # ~470 classes and not this job's question); the Cloud Vault tier lives in
      # data.autofill.cloud and is included by the first pattern. A failure here
      # stops the run before the APK is staged, pushed or released.
      - name: "Test → autofill tier (parser, matching, datasets, save, provider status)"
        working-directory: ${{ env.WORK_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.BITWARDEN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon :app:testFdroidDebugUnitTest \
            --tests 'com.x8bit.bitwarden.data.autofill.*' \
            --tests 'com.x8bit.bitwarden.data.platform.manager.ciphermatching.*' \
            --tests 'com.x8bit.bitwarden.data.platform.util.StringExtensionsTest' \
            --tests 'com.x8bit.bitwarden.data.auth.repository.AuthRepositoryTest' \
            --tests 'com.x8bit.bitwarden.fleet.*'

      # Rename to the constellation asset names so build.sh's oras-push /
      # gh-release stage the fork APK per variant. The fdroid release APK is
      # UNIVERSAL (full lib/ sets for arm64-v8a, armeabi-v7a, x86, x86_64 —
      # verified on the 2026-08-18 release), so the SAME file serves both the
      # arm64 asset (Cloud-Vault.apk, CLOUDVAULT_VARIANT unset → matches
      # release.artifact.debug) and the x86_64 asset (Cloud-Vault-x86_64.apk,
      # CLOUDVAULT_VARIANT=x86_64 → suffixed GHCR tags + gh_asset).
      - name: Stage fork APK as constellation assets
        working-directory: ${{ env.WORK_DIR }}
        run: |
          cp dist/cloud-vault-vault.apk dist/Cloud-Vault.apk
          cp dist/cloud-vault-vault.apk dist/Cloud-Vault-x86_64.apk

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS (arm64 + x86_64 tags)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ./build.sh oras-push
          CLOUDVAULT_VARIANT=x86_64 ./build.sh oras-push

      - name: Publish to GitHub Releases (both assets)
        id: publish
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          ./build.sh gh-release
          CLOUDVAULT_VARIANT=x86_64 ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-vault" "${{ steps.publish.outcome }}" "false" "${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──

  # Install the APK this run just built on an emulator and launch it: a crash at startup fails
  # Ship (1_cicd/src/cicd/test-launch-smoke.yml). A job of this run, not a workflow_run listener,
  # so it cannot fail to trigger.
  launch_smoke:
    # The push build is the Bitwarden fork (build_and_publish is the manual legacy WebView APK);
    # it has no publish gate, so a run that uploaded no APK is skipped inside the smoke.
    needs: build_fork_vault
    if: needs.build_fork_vault.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-launch-smoke.yml
    with:
      app: cloud-vault
      artifact_prefix: cloud-vault-bitwarden-fork-
      api_levels: "[34]"

  # #1116/#1119/#1127: the offline-first claims run on a real emulator, not as source greps. The PREVIOUS Ship build is
  # installed and signed in to a seeded Vaultwarden, this run's APK is installed over it (`install -r`), the network is
  # switched off and the app is opened with a fingerprint: the cached vault and the biometric unlock must survive.
  # REQUIRE_EMULATOR=1 inside, so it fails instead of skipping. Screenshots: artifact vault-offline-evidence.
  vault_offline_emulator:
    needs: build_fork_vault
    if: needs.build_fork_vault.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-vault-offline-emulator.yml
    with:
      new_run_id: ${{ github.run_id }}
