# #1953 #1954 #1955 Cloud C3 mutation runs: each leg applies ONE deliberate break and runs Cloud C3's JVM suite (JVM + Robolectric Compose),
# whose NAMED test must catch it. The JVM suite itself is RED (expected); the JOB is green only when the verdict step finds the named test failed
# (KILLED); a mutation whose named test stayed green, or never ran, fails the job. Manual only.
name: c3-195x-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'index-back | lfs-ignored | scope-primary | drop-project-repo | drop-section | hub-primary-only | drop-wiki-path | split-ignored | map-edge-dropped | mail-alias-lost | wiki-lost | home-row-lost | home-zero-on-fail | projects-row-lost | projects-column-lost | vm-unknown-lost | vm-repo-on-host | vm-devices-dropped | control-back | c3mcp-field-lost | infra-order | orch-infra-back | net-edge-dropped | net-node-twice | net-node-undeclared | net-viewer-page-lost | net-section-match-lost | net-resolve-lost | net-unbound-ok | net-dns-depends-lost | net-bundle-weight | net-sheet-field-lost | net-token-blames-vm | net-label-overlap | orch-dup-back | orch-home-lost | deployed-field-lost | orch-page-twice | health-field-lost | health-root-cause-on-vm-when-token-missing | health-layer-order | xray-scope-lost | health-number-on-blind | xray-run-unvalidated | engine-card-lost | engine-field-lost | engine-run-unlisted | net-placer-all | net-short-identity | net-chip-lines | net-reading-on-node | net-pills-at-mid | net-contained-dropped | net-names-overtruncated | net-names-blank'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-c3
  # the input reaches the scripts through the environment only, never interpolated into a run: script (expression injection)
  MUT: ${{ inputs.name }}
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate the mutation name against the allowed list
        run: |
          case "$MUT" in
            index-back|lfs-ignored|scope-primary|drop-project-repo|drop-section|hub-primary-only|drop-wiki-path|split-ignored|map-edge-dropped|mail-alias-lost|wiki-lost|home-row-lost|home-zero-on-fail|projects-row-lost|projects-column-lost|vm-unknown-lost|vm-repo-on-host|vm-devices-dropped|control-back|c3mcp-field-lost|infra-order|orch-infra-back|net-edge-dropped|net-node-twice|net-node-undeclared|net-viewer-page-lost|net-section-match-lost|net-resolve-lost|net-unbound-ok|net-dns-depends-lost|net-bundle-weight|net-sheet-field-lost|net-token-blames-vm|net-label-overlap|orch-dup-back|orch-home-lost|deployed-field-lost|orch-page-twice|health-field-lost|health-root-cause-on-vm-when-token-missing|health-layer-order|xray-scope-lost|health-number-on-blind|xray-run-unvalidated|two-rows-label-lost|two-rows-or|two-rows-vm-order|two-rows-parity|engine-card-lost|engine-field-lost|engine-run-unlisted|net-placer-all|net-short-identity|net-chip-lines|net-reading-on-node|net-pills-at-mid|net-contained-dropped|net-names-overtruncated|net-names-blank) echo "leg: $MUT" ;;
            *) echo "::error::unknown mutation name"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - name: Checkout private fleet data (app/build.gradle reads it at configuration, as in Ship Cloud C3)
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: Apply the mutation
        run: |
          K=ac_cloud-c3/app/src/main/java/com/diegonmarcos/cloudc3
          D=ac_cloud-c3/data
          pyj() { python3 -I - "$1" "$2" <<'PY'
          import json, sys
          p, code = sys.argv[1:]
          d = json.load(open(p)); exec(code); open(p, "w").write(json.dumps(d, indent=1, ensure_ascii=False) + "\n")
          PY
          }
          # rep <file> <old> <new>: an exact one-time replacement (the target must exist exactly once)
          rep() { python3 -I - "$1" "$2" "$3" <<'PY'
          import sys
          p, a, b = sys.argv[1:]
          s = open(p).read(); assert s.count(a) == 1, "target not found once: " + a
          open(p, "w").write(s.replace(a, b))
          PY
          }
          case "$MUT" in
            # #1953-a the Index tile row is back on the Topology pages
            index-back)        pyj ac_cloud-c3/build.json 'd["ui"]["carried_c3"]["stack_topology"].insert(0, {"kind": "tile_row", "title": "Index", "subtitle": "Jump to a table on this page", "tiles": []})' ;;
            # #1953-c an LFS repo is a Repo again (the registry flag is ignored)
            lfs-ignored)       sed -i 's/if (repoOf(e)?.lfs == true \&\& lfsKind.isNotBlank())/if (false)/' $K/pages/ContainerProjects.kt ;;
            # #1953-c scope keeps a repo on its primary project only (hubs and declared repos vanish from the others)
            scope-primary)     sed -i 's/else -> projectsOf(e).any { it.id == p }/else -> projectOf(e)?.id == p/' $K/pages/ContainerProjects.kt ;;
            # #1953-b a project_repos attachment is lost (Wiki ModernSc draws no lib-chronos)
            drop-project-repo) pyj $D/repos_declared.json 'r = next(x for x in d["repos"] if x["name"] == "lib-chronos"); r["attached"] = [a for a in r["attached"] if a["project"] != "pj-wiki-modernsc"]' ;;
            # #1953-d a layout section is dropped (its Type falls outside every section)
            drop-section)      pyj $D/container_projects.json 'b = d["topology_layout"]["bands"][0]; b["sections"] = [x for x in b["sections"] if x["id"] != "other"]' ;;
            # #1953-d the Topology scopes repos to their primary project only (the hubs leave the other projects)
            hub-primary-only)  sed -i 's/else -> projectsOf(e).any { it.id == p }/else -> projectOf(e)?.id == p/' $K/pages/ContainerProjects.kt ;;
            # #1953-d an attached repo loses its path (Wiki ModernSc draws lib-chronos without 1.Modern-science)
            drop-wiki-path)    pyj $D/repos_declared.json 'r = next(x for x in d["repos"] if x["name"] == "lib-chronos"); [a.update(path="") for a in r["attached"] if a["project"] == "pj-wiki-modernsc"]' ;;
            # #1953-d the Public / Private split is ignored
            split-ignored)     sed -i 's/val parts = if (s.id in splitHere) listOf(/val parts = if (false) listOf(/' $K/pages/ContainerTopology.kt ;;
            # #1955-B a Tables path row loses the first edge of each map node
            map-edge-dropped)  sed -i 's/else r.edges.map { e -> base/else r.edges.drop(1).map { e -> base/' $K/pages/MailStack.kt ;;
            # #1955-B the mail_map alias is dropped (a deep link to the old Mail subpage opens nothing)
            mail-alias-lost)   pyj ac_cloud-c3/build.json 'del d["ui"]["aliases"]["pages"]["mail_map"]' ;;
            # #1968 a former Lib entity (the root _git-repos-master) loses its Wiki attachment (the parity test must catch it)
            wiki-lost)         pyj $D/repos_declared.json 'r = next(x for x in d["repos"] if x["name"] == "_git-repos-master"); r["attached"] = []; r["project"] = ""' ;;
            # #1982 the VM row loses its label (the row is not led by VM)
            two-rows-label-lost) sed -i 's/NavGroup("vm", vmLabel, vmPages)/NavGroup("vm", "", vmPages)/' $K/pages/ContainersPage.kt ;;
            # #1982 the two rows combine as OR instead of AND
            two-rows-or)       sed -i 's/filter { it.isNotBlank() }.all { p ->/filter { it.isNotBlank() }.any { p ->/' $K/pages/ContainerProjects.kt ;;
            # #1982 the VM chips swap the first two hosts (not the declared order)
            two-rows-vm-order) pyj ac_cloud-c3/build.json 's = [x for x in d["ui"]["sections"] if x["id"] == "containers"][0]; ps = s["pages"]; i = [k for k, p in enumerate(ps) if p["id"] == "vm-oci-apps"][0]; ps[i], ps[i + 1] = ps[i + 1], ps[i]' ;;
            # #1982 the project-name row under the Projects row is gone (the projects of a category are unreachable)
            two-rows-parity)   sed -i 's/emptyList() else pagesOf(decl, declared, category)/emptyList() else emptyList()/' $K/pages/ContainersPage.kt ;;
            # #1969 Home loses the row of the first page of every section (a declared page has no row)
            home-row-lost)     sed -i 's/flat(s.pages).map { (p, depth) ->/flat(s.pages).drop(1).map { (p, depth) ->/' $K/pages/HomeLive.kt ;;
            # #1969 a Home source that failed shows a zero instead of its reason
            home-zero-on-fail) sed -i 's/"\$what unavailable: \${l.why}"/"\$what: 0"/' $K/pages/HomeLive.kt ;;
            # #1969 Infra Projects drops the first declared project
            projects-row-lost) sed -i 's/decl.projects.map { p ->/decl.projects.drop(1).map { p ->/' $K/pages/InfraProjects.kt ;;
            # #1969 Infra Projects loses a declared column
            projects-column-lost) pyj $D/container_projects.json 'd["projects_table"]["columns"] = [c for c in d["projects_table"]["columns"] if c["key"] != "domains"]' ;;
            # #1971 a container whose host is none of the derived ones vanishes from the VM pages
            vm-unknown-lost)   sed -i 's/(if (h == vm.unknown) e.host !in hostIds else e.host == h)/(if (h == vm.unknown) false else e.host == h)/' $K/pages/ContainerProjects.kt ;;
            # #1971 a repo is listed under a host
            vm-repo-on-host)   sed -i 's/h == vm.all || (e.role != "repo" \&\& (/h == vm.all || ((/' $K/pages/ContainerProjects.kt ;;
            # #1971 the mesh-client devices are no longer derived as hosts
            vm-devices-dropped) sed -i 's/slice.devices.filter { !it.wgIp.isNullOrBlank() }/slice.devices.filter { false }/' $K/pages/ContainerHosts.kt ;;
            # #1972 the Control page is back under Infra Bare
            control-back)      pyj ac_cloud-c3/build.json 'i = next(s for s in d["ui"]["sections"] if s["id"] == "infra"); i["pages"].append({"id": "control", "label": "Control", "icon": "ic_robot"}); next(g for g in i["groups"] if g["id"] == "personal")["pages"].append("control")' ;;
            # #1972 the merged C3 API page loses a field of the former C3 MCP tool row
            c3mcp-field-lost)  sed -i '/"tree [$]{t.tree/d' $K/pages/C3Mcp.kt ;;
            # #1972 the API group is back before Personal
            infra-order)       pyj ac_cloud-c3/build.json 'i = next(s for s in d["ui"]["sections"] if s["id"] == "infra"); g = i["groups"]; g[1], g[2] = g[2], g[1]' ;;
            # #1972 the Orch Infrastructure page is back
            orch-infra-back)   pyj ac_cloud-c3/build.json 'o = next(s for s in d["ui"]["sections"] if s["id"] == "orch"); o["pages"].insert(2, {"id": "orch_infrastructure", "label": "Infrastructure", "icon": "ic_p_c3_vms"})' ;;
            # #1955 A Network Graph: each leg breaks one guarantee of the graph; the named test must catch it
            net-edge-dropped)  rep $K/pages/NetGraphLayout.kt 'val bent = prims.map { e ->' 'val bent = prims.drop(1).map { e ->' ;;
            net-node-twice)    rep $K/pages/NetGraphLayout.kt 'return Layout(MailStack.Plan(nodes, finalEdges, bounds),' 'return Layout(MailStack.Plan(nodes + nodes.take(1), finalEdges, bounds),' ;;
            net-node-undeclared) rep $K/pages/NetGraph.kt 'emptyList(), nodes.values.toList(), edges.values.toList(), depends)' 'emptyList(), nodes.values.toList() + nodes.values.first().copy(id = "x:undeclared", rows = emptyList(), declared = "made-up"), edges.values.toList(), depends)' ;;
            net-viewer-page-lost) pyj $D/ops_maps.json 'del d["viewers"]["pages"]["net_mesh"]' ;;
            net-section-match-lost) pyj $D/ops_maps.json 'del d["viewers"]["pages"]["net_auth"]["graph"]["sections"][0]["match"]' ;;
            net-resolve-lost)  pyj $D/ops_maps.json 'del d["viewers"]["pages"]["net_wg"]["graph"]["resolve"]' ;;
            net-unbound-ok)    rep $K/pages/NetLive.kt 'val DECLARED = Reading(MailStack.Health.UNKNOWN,' 'val DECLARED = Reading(MailStack.Health.OK,' ;;
            net-dns-depends-lost) pyj $D/ops_maps.json 'del d["viewers"]["pages"]["net_dns"]["graph"]["depends"]' ;;
            net-bundle-weight) rep $K/pages/NetGraphLayout.kt 'es.all { it.dashed }, es.size.toFloat())' 'es.all { it.dashed }, 1f)' ;;
            net-sheet-field-lost) rep $K/pages/NetGraph.kt 'listOf("row" to r.section) + r.fields }' 'listOf("row" to r.section) + r.fields.drop(1) }' ;;
            # #1955 A fixes: a missing device token blames a VM; a label may sit on a node
            net-token-blames-vm) rep $K/pages/NetLive.kt '!it.deviceSide && (it.health == MailStack.Health.BAD || it.unreadable)' '(it.health == MailStack.Health.BAD || it.unreadable)' ;;
            net-label-overlap) rep $K/pages/NetGraphLayout.kt 'r.takeIf { c -> nodes.none { hit(c, it) } && placed.values.none { hit(c, it) } }' 'r.takeIf { c -> placed.values.none { hit(c, it) } }' ;;
            # #1955 A rev2 (M1-M6): the placer, the shortening, the chip, the node text, the pill budget, containment parity
            net-contained-dropped) rep $K/pages/NetGraphLayout.kt 'contained[owner] = inside.toMutableList()' 'contained[owner] = inside.drop(1).toMutableList()' ;;
            # #1955 A rev2 (M1-M6): the placer, the shortening, the chip, the node text, the pill budget, containment parity
            net-placer-all)    rep $K/pages/NetScene.kt 'inside(r, canvas) && obstacles.none { hit(r, it) } && (own == null || !hit(r, inflate(own, 2f * dp)))' 'true' ;;
            net-short-identity) rep $K/pages/NetLabel.kt '        return end(base, maxChars)' '        return label' ;;
            net-chip-lines)    rep $K/pages/NetGraphScreens.kt 'maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.widthIn(max = 200.dp)' 'maxLines = 6, overflow = TextOverflow.Ellipsis, modifier = Modifier.widthIn(max = 200.dp)' ;;
            net-reading-on-node) rep $K/pages/NetScene.kt '                metricBox?.let { texts += it }' '                metricBox?.let { texts += it }; val wd = n.sub.ifBlank { n.label } + " · not read"; texts += TextBox("word:" + n.id, Cls.METRIC, MailStack.Rect(c.l, c.b - 4f, c.l + measure.size(wd, sp.metricSp, false).first, c.b - 4f + measure.size(wd, sp.metricSp, false).second), wd, sp.metricSp, false, n.id, wd)' ;;
            net-pills-at-mid)  rep $K/pages/NetScene.kt 'tier == Tier.NEAR -> l.plan.edges' 'tier != Tier.FAR -> l.plan.edges' ;;
            # #1955 A rev2.1 names: a node no longer grows to its name (it stays the standard width though its layout has room)
            net-names-overtruncated) rep $K/pages/NetGraphLayout.kt 'fun drawnW(r: Float) = r' 'fun drawnW(r: Float) = minOf(r, nodeW)' ;;
            # #1955 A rev2.1 names: two different names that read alike are blanked again (the DNS oci-mail services and mesh names drew no text)
            net-names-blank)   rep $K/pages/NetLabel.kt '            if (clash.isEmpty()) return labels.keys.associateWith(::read)' '            if (clash.isEmpty()) return labels.keys.associateWith(::read); return labels.keys.associateWith { if (it in clash) "" else read(it) }' ;;
            # #1954 Orch: each leg breaks one guarantee of the reorganisation; the named test must catch it
            orch-dup-back)     pyj ac_cloud-c3/build.json 'o = next(s for s in d["ui"]["sections"] if s["id"] == "orch"); o["pages"].append({"id": "orch_release", "label": "Release", "icon": "ic_code"})' ;;
            orch-home-lost)    pyj ac_cloud-c3/build.json 'o = next(s for s in d["ui"]["sections"] if s["id"] == "orch"); o["pages"] = [p for p in o["pages"] if p["id"] != "orch_home"]; [g.update(pages=[x for x in g["pages"] if x != "orch_home"]) for g in o["groups"]]' ;;
            deployed-field-lost) rep $K/pages/ContainersLive.kt 'r.copy(live = text, drift = drift, runningTag = running,' 'r.copy(live = text, drift = "", runningTag = running,' ;;
            orch-page-twice)   pyj ac_cloud-c3/build.json 'o = next(s for s in d["ui"]["sections"] if s["id"] == "orch"); next(g for g in o["groups"] if g["id"] == "pipeline")["pages"].append("orch_ghcr"); next(q for q in o["pages"] if q["id"] == "orch_workflows")["datasets"].append("dagu_dags")' ;;
            # #1955 C A4 the Health debugger and X-ray C3: each leg breaks one guarantee; the named test must catch it
            health-field-lost) rep $K/pages/HealthModel.kt '"scope" to "Public", "auth" to s.auth, ' '"scope" to "Public", ' ;;
            health-root-cause-on-vm-when-token-missing) rep $K/pages/HealthPhone.kt 'if (noToken(d.why)) base.copy(status = St.BLIND, details = HealthModel.NO_TOKEN_NOTE)' 'if (noToken(d.why)) base.copy(status = St.DOWN, details = "the API could not read this VM")' ;;
            health-layer-order) rep $K/pages/HealthModel.kt $'        Layer("lights", "Lights (Public / Private URLs)", 9, listOf("edge", "auth", "mesh", "containers", "certs")),\n        Layer("containers", "Containers", 3, listOf("vms")),' $'        Layer("containers", "Containers", 3, listOf("vms")),\n        Layer("lights", "Lights (Public / Private URLs)", 9, listOf("edge", "auth", "mesh", "containers", "certs")),' ;;
            xray-scope-lost)   rep $K/pages/XrayModel.kt 'val KINDS = listOf("xray-vm", "xray-service", "xray-full")' 'val KINDS = listOf("xray-vm", "xray-full")' ;;
            health-number-on-blind) rep $K/pages/HealthModel.kt 'if (status.carriesNumber && phases.any) "${phases.total} ms"' 'if (phases.any) "${phases.total} ms"' ;;
            # #1983 Ops > Health > Tests engines: each leg breaks one guarantee; the named test must catch it
            engine-card-lost)  rep $K/pages/EnginesModel.kt '"cloud-url-health-report", "cloud_url_health"' '"cloud-url-health-reportX", "cloud_url_health"' ;;
            engine-field-lost) rep $K/pages/EnginesModel.kt 'return Chk(name, status, o.entries.map { it.key to prim(it.value) })' 'return Chk(name, status, o.entries.filter { it.key == "name" }.map { it.key to prim(it.value) })' ;;
            engine-run-unlisted) rep $K/pages/EnginesModel.kt 'if (kind != null && kind in RUN_KINDS)' 'if (kind != null)' ;;
            xray-run-unvalidated) rep $K/pages/XrayModel.kt 'if (!SUBJECT.matches(subject) || subject !in declared) return null' 'if (false) return null' ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected; the verdict step reads the XML)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" || true
      - name: Verdict (KILLED = the named test failed)
        run: |
          M="$MUT"
          case "$M" in
            index-back)        C=ContainersPageComposeTest; N="no Topology page carries the Index row, and the Ops Obsv Index stays" ;;
            lfs-ignored)       C=ContainerProjectsTest; N="an LFS repo is Type Db with the git-lfs engine, and is not a Repo" ;;
            scope-primary)     C=ContainerProjectsTest; N="scope keeps a repo on every attached project, not only its primary one" ;;
            drop-project-repo) C=ContainerProjectsTest; N="projects the registry cannot place get their declared repos, Wiki with its lib-chronos path" ;;
            drop-section)      C=ContainerTopologyTest; N="the section types are the declared Types, each in exactly one section" ;;
            hub-primary-only)  C=ContainerTopologyTest; N="a hub is drawn in the Repos band of every project under its code" ;;
            drop-wiki-path)    C=ContainerTopologyTest; N="each Wiki project carries lib-chronos with its path" ;;
            split-ignored)     C=ContainersPageComposeTest; N="the Topology body has a services band and a Repos band, with Public and Private under Apps, DB and Repos on Cloud-me" ;;
            map-edge-dropped)  C=MailStackTest; N="parity - every section, row and edge of the old Mail map is in a Tables table" ;;
            home-row-lost)     C=HomeLiveTest; N="every declared section and page has a Home row, in the declared order" ;;
            home-zero-on-fail) C=HomeLiveTest; N="a failed source shows its reason on the row, never a zero" ;;
            projects-row-lost) C=InfraProjectsTest; N="every declared project is a row and the columns match the declaration" ;;
            projects-column-lost) C=InfraProjectsTest; N="every declared project is a row and the columns match the declaration" ;;
            vm-unknown-lost   ) C=ContainerProjectsTest; N="#1971 parity Projects keeps every entity reachable, VM lists every container under exactly one host or the unknown host with a reason" ;;
            vm-repo-on-host   ) C=ContainerProjectsTest; N="#1971 parity Projects keeps every entity reachable, VM lists every container under exactly one host or the unknown host with a reason" ;;
            vm-devices-dropped) C=ContainerProjectsTest; N="#1971 parity Projects keeps every entity reachable, VM lists every container under exactly one host or the unknown host with a reason" ;;
            control-back)      C=OrchOpsReorgTest; N="#1972 Infra Bare has no Control page, the old id resolves to Gadgets and every other page is still there" ;;
            c3mcp-field-lost)  C=OrchOpsReorgTest; N="#1972 parity the merged C3 API page keeps every field of C3 Endpoints and C3 MCP, and both old ids resolve to it" ;;
            infra-order)       C=OrchOpsReorgTest; N="#1972 the Infra groups are Infra Cloud, Infra Bare, Services API, Services Domains and Projects in the declared order" ;;
            orch-infra-back)   C=OrchOpsReorgTest; N="#1972 Orch has no Infrastructure page and its old ids resolve to the next page, Declared" ;;
            wiki-lost)         C=ContainerProjectsTest; N="#1968 parity every entity under Lib before is under Wiki now, the All total is unchanged and the old ids resolve to Wiki" ;;
            net-edge-dropped)  C=NetGraphLayoutTest; N="parity - every node and edge is drawn exactly once, expanded and collapsed, on every page" ;;
            net-node-twice)    C=NetGraphLayoutTest; N="parity - every node and edge is drawn exactly once, expanded and collapsed, on every page" ;;
            net-node-undeclared) C=NetGraphTest; N="parity - each page's graph draws exactly its table" ;;
            net-viewer-page-lost) C=NetGraphTest; N="every Network page declared in build json has a viewers entry, and the six are there" ;;
            net-section-match-lost) C=NetGraphTest; N="every section of a bound map matches exactly one rule, every rule matches a section, binds name real rows and containers" ;;
            net-resolve-lost)  C=NetGraphTest; N="WireGuard - a host on two subnets is one node with two rows, and the hub edge lands on it through the id resolve" ;;
            net-unbound-ok)    C=NetLiveTest; N="an unbound node is never OK" ;;
            net-dns-depends-lost) C=NetLiveTest; N="root cause - the hub unreadable is the suspected root of the WireGuard spokes and of every mesh name" ;;
            net-bundle-weight) C=NetGraphLayoutTest; N="a collapsed cluster's edge weighs exactly its members, and parity goes red when it does not" ;;
            net-sheet-field-lost) C=NetGraphTest; N="the node sheet prints every field of every row it stands for" ;;
            net-token-blames-vm) C=NetLiveTest; N="a device with no token blames no VM - nodes are not read, the note is device-side" ;;
            net-label-overlap) C=NetGraphLayoutTest; N="a label whose wire midpoint lies inside a node is moved off every node" ;;
            net-contained-dropped) C=NetSceneOverlapTest; N="T5 determinism and parity - equal scenes on two runs, parity in every state" ;;
            net-placer-all) C=NetSceneOverlapTest; N="T1 geometric no-overlap - every text box on all six pages, six states, two canvases, opening and 2x views" ;;
            net-short-identity) C=NetSceneOverlapTest; N="T3 caps and sizes - nothing under 10 sp, names, metrics, pills and headers within their caps, distinct names stay distinct" ;;
            net-chip-lines) C=NetViewerComposeTest; N="T6 the root cause is a one-line chip at most 32 dp, chrome at most 104 dp, the canvas at least 68 percent at 412 dp" ;;
            net-reading-on-node) C=NetSceneOverlapTest; N="T1 geometric no-overlap - every text box on all six pages, six states, two canvases, opening and 2x views" ;;
            net-pills-at-mid) C=NetSceneOverlapTest; N="T2 label budget - no pill at the opening view, budgets with a selection, at 2x and at FAR" ;;
            net-names-overtruncated) C=NetSceneOverlapTest; N="T1g names at fit view on 412 x 739 - a name is shortened only where its node is at the room its layout has, VM names read in full" ;;
            net-names-blank) C=NetSceneOverlapTest; N="T1h names at fit view on 412 x 739 - every node on screen shows a name, none is blank" ;;
            orch-dup-back)     C=OrchOpsReorgTest; N="#1954 one GH Releases page - the Release page is merged in, its id is an alias, both bodies are modes of the one page" ;;
            orch-home-lost)    C=OrchOpsReorgTest; N="#1954 Home is the first Orch page and the first of the Pipeline group, and its flow is declared" ;;
            deployed-field-lost) C=ContainersLiveTest; N="#1954 parity - every field of the removed Service and Declared pages is a column or a row of Containers" ;;
            orch-page-twice)   C=OrchOpsReorgTest; N="#1954 every Orch page appears exactly once, in Pipeline, Registries or CI-CD" ;;
            health-field-lost) C=HealthModelTest; N="parity - every field of the old Health page rows is on its Lights row" ;;
            health-root-cause-on-vm-when-token-missing) C=HealthModelTest; N="a device with no token is a device-side state - no VM and no container is down, none is blamed" ;;
            health-layer-order) C=HealthModelTest; N="the layers are in the owner's order and the attribution ranks are distinct" ;;
            xray-scope-lost)   C=HealthModelTest; N="X-ray - the tabs, the allow-list and the not-served states" ;;
            health-number-on-blind) C=HealthModelTest; N="an unread status never carries a number or a phase bar" ;;
            engine-card-lost)  C=EnginesModelTest; N="every engine folder of infra-obs_reports has a card or is a declared library" ;;
            engine-field-lost) C=EnginesModelTest; N="the mail report phases and checks come out of the real JSON with their own values" ;;
            engine-run-unlisted) C=EnginesModelTest; N="the run trigger is allow-listed" ;;
            xray-run-unvalidated) C=HealthModelTest; N="X-ray - the tabs, the allow-list and the not-served states" ;;
            two-rows-label-lost) C=ContainersTwoRowsComposeTest; N="#1982 both rows render with their labels, Projects over VM, no toggle" ;;
            two-rows-or)       C=ContainersTwoRowsFilterTest; N="#1982 AND filtering - a project or category row and a VM row narrow together, All in a row is no filter" ;;
            two-rows-vm-order) C=ContainersTwoRowsComposeTest; N="#1982 the VM chips are drawn left to right in the declared host_order" ;;
            two-rows-parity)   C=ContainersTwoRowsFilterTest; N="#1982 parity with 1971 - every page, view, project, VM and filter row of the toggle UI is still there" ;;
            mail-alias-lost)   C=OrchOpsReorgTest; N="every old page id still resolves through the aliases to its new place" ;;
          esac
          X="$(find ac_cloud-c3/app/build -path '*test-results*' -name "TEST-*.$C.xml" | head -1)"
          [ -n "$X" ] || { echo "::error::LEG ERROR $M: no result for $C (did not compile or run); not a kill"; exit 1; }
          python3 -I - "$X" "$N" "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, want, leg = sys.argv[1:]
          cases = {c.get("name"): c for c in ET.parse(path).getroot().iter("testcase")}
          failed = sorted(n for n, c in cases.items() if c.find("failure") is not None or c.find("error") is not None)
          print("failed tests:", failed)
          if want not in cases: print("::error::LEG ERROR %s: the named test did not run: %s" % (leg, want)); sys.exit(1)
          if want not in failed: print("::error::LEG SURVIVED %s: the named test stayed green: %s" % (leg, want)); sys.exit(1)
          print("KILLED %s by: %s" % (leg, want))
          PY
      - name: Failed tests
        if: always()
        run: grep -rl "<failure" --include="TEST-*.xml" ac_cloud-c3/app/build 2>/dev/null | xargs -r grep -h -o 'testcase name="[^"]*"' | head -40 || true
