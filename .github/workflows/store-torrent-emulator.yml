# #1790 Cloud Store > Torrent END TO END on an emulator: a real, legal BitTorrent download of a public-domain Mozart recording from
# the Internet Archive (every item publishes https://archive.org/download/<item>/<item>_archive.torrent, web-seeded by archive.org,
# BEP 19, so it completes even with few peers). The .torrent address is typed into the Torrent page and added; the run waits for
# Completed, shoots progress and the finished file, taps Open, then checks every downloaded file's size, SHA-1 and MD5 against
# archive.org/metadata/<item>. Runs the x86_64 APK a Ship Cloud Store run built, else the latest release asset (the x86_64 APK carries
# the real engine: libtorrent4j ships a 16 KB-aligned x86_64 libtorrent). Evidence: store-torrent-evidence.
name: "Test -> Cloud Store Torrent download (emulator, Internet Archive)"

on:
  workflow_dispatch:
    inputs:
      store_run_id:
        description: "Ship Cloud Store run id whose x86_64 APK artifact to test (empty = release asset)"
        required: false
        default: ""
      release_tag:
        description: "Release to download from when the run id is empty"
        required: false
        default: "latest"
      item:
        description: "Internet Archive item (public domain, small): its _archive.torrent is downloaded"
        required: false
        default: "RondoAllaTurca_201401"
      timeout_s:
        description: "Seconds to wait for the download to complete"
        required: false
        default: "1200"

permissions:
  contents: read
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: ac_cloud-store/test

      - name: Fetch the Cloud Store APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          W_RUN: ${{ inputs.store_run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$W_RUN" ]; then
            gh api "repos/$REPO/actions/runs/$W_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-Store-")) | .name' |
            while read -r name; do gh run download "$W_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          else
            gh release download "${TAG:-latest}" -R "$REPO" -p 'Cloud-Store*.apk' -D apk
          fi
          pick=""
          for want in x86_64 universal ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud Store APK"; exit 1; }
          cp "$pick" store.apk
          unzip -l store.apk | grep -E 'lib/x86_64/.*torrent' || echo "::warning::this APK carries no x86_64 libtorrent"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + download the Mozart item (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-store/test/emulator-store-torrent.sh store.apk out "${{ inputs.item }}" "${{ inputs.timeout_s }}"

      - name: Boot emulator + download the Mozart item (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rm -rf out2 && bash ac_cloud-store/test/emulator-store-torrent.sh store.apk out2 "${{ inputs.item }}" "${{ inputs.timeout_s }}" && rm -rf out && mv out2 out

      - name: Verification summary
        if: always()
        run: |
          for d in out out2; do [ -f "$d/verify.json" ] && { echo "## $d"; python3 -c "import json,sys; v=json.load(open(sys.argv[1])); print('item', v['item'], '|', v['title'], '|', v['licence'], '| all_ok', v['all_ok'], '| audio_ok', v['audio_ok']); [print(('OK  ' if r['ok'] else 'BAD ')+r['file'], r['size'], r['sha1']) for r in v['files']]" "$d/verify.json"; } >> "$GITHUB_STEP_SUMMARY" || true; done
          [ -f out/progress.log ] && tail -5 out/progress.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload evidence (screenshots, ui dumps, logcat, verify.json; the downloaded files excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-torrent-evidence
          path: |
            out*/
            !out*/files/
          if-no-files-found: warn
