# #1947 Lnktree cache mutation runs: each applies ONE deliberate break to the page cache (LnktreeCache.kt) and runs Cloud Me's JVM suite,
# whose LnktreeCacheTest must catch it. A RED run is the expected result; a green run means the suite is blind. Manual only.
name: me-cache-1947-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'serve-incomplete | blocking-subresource | no-replan | no-tombstone'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-me
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation ${{ inputs.name }}
        run: |
          F=ac_cloud-me/app/src/main/java/com/diegonmarcos/cloudme/LnktreeCache.kt
          case "${{ inputs.name }}" in
            # cached HTML without its CSS/JS is served again (the unstyled page)
            serve-incomplete)      sed -i 's/if (!store.complete(pageId, url)) { revalidate(url); return null }//' $F ;;
            # a sub-resource miss blocks on its own fetch again
            blocking-subresource)  sed -i 's/if (pageUrl != null \&\& CacheKey.normalize(url) != CacheKey.normalize(pageUrl)) { revalidate(url); return null }//' $F ;;
            # an incomplete fresh page is not planned for a refetch
            no-replan)             sed -i 's/st == CacheState.FRESH \&\& !store.complete(p.id, p.url)/false/' $F ;;
            # a 404 sub-resource is not stored, so the page stays incomplete for ever
            no-tombstone)          sed -i 's/if (r.status == 404 || r.status == 410) store.put(p.id, u, r.mime, r.encoding, r.status, r.body)/Unit/' $F ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"
      - name: Failed tests
        if: always()
        run: grep -rl "<failure" --include="TEST-*.xml" ac_cloud-me/app/build 2>/dev/null | xargs -r grep -h -o 'testcase name="[^"]*"' | head -40 || true
