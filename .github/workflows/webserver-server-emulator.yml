name: "Test -> Cloud C3 Webserver Server page and Recents (emulator)"

# #1712 the Configs > Server page (screenshot) and the Recents behaviour of the app: still listed after another app was used, reachable
# again, also when the Store's ADB button opened it cold. From the APKs of a Ship run each (default: the latest green on main). Dispatch only.
on:
  workflow_dispatch:
    inputs:
      store_run_id: { description: 'Ship Cloud Store run id (default: latest green on main)', required: false, default: '' }
      webserver_run_id: { description: 'Ship Cloud C3 Webserver run id (default: latest green on main)', required: false, default: '' }

permissions:
  contents: read
  actions: read

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ac_cloud-c3-webserver/test

      - name: Fetch both APKs (x86_64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          get() { # get <ship workflow> <run id or ''> <out>
            RUN="$2"; [ -n "$RUN" ] || RUN=$(gh run list -R "$REPO" --workflow "$1" --branch main --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN" ] || { echo "::error::no green $1 run"; exit 1; }
            echo "$1: run $RUN"; mkdir -p "dl/$3"
            gh api "repos/$REPO/actions/runs/$RUN/artifacts" --paginate --jq '.artifacts[] | select(.expired|not) | select(.name|test("x86_64|universal")) | .name' |
            while read -r name; do gh run download "$RUN" -R "$REPO" -n "$name" -D "dl/$3/$name"; done
            pick=$(find "dl/$3" -name '*.apk' | sort | head -1); [ -n "$pick" ] || { echo "::error::no APK in $1 run $RUN"; exit 1; }
            cp "$pick" "$3.apk"
          }
          get ship-cloud-store.yml "${{ inputs.store_run_id }}" store
          get ship-cloud-c3-webserver.yml "${{ inputs.webserver_run_id }}" webserver

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, walk the Server page and the Recents flow
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-c3-webserver/test/emulator-server-recents.sh store.apk webserver.apk out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webserver-server-evidence
          path: out/
          if-no-files-found: warn
