# #1416 FinTerm free-stack mutation proof: ONE job applies each planted break to FreeStack.kt in turn (one Gradle build at a time),
# runs the JVM suite and restores the file. Every mutant must turn the suite RED; the run is GREEN only when all are caught. Manual.
name: finterm-freestack-mutation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  WORK_DIR: ad_Capital-Stack-FinTerminal
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM suite green on the real tree, then RED on every mutant
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -u
          F=ad_Capital-Stack-FinTerminal/app/src/main/java/com/diegonmarcos/capitalfinterm/FreeStack.kt
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" || { echo "::error::the real tree is red"; exit 1; }
          missed=0
          while IFS='|' read -r name from to; do
            [ -n "$name" ] || continue
            cp "$F" /tmp/orig.kt
            python3 - "$F" "$from" "$to" <<'PY' || { echo "::error::mutant $name: target missing"; missed=1; continue; }
          import sys
          p, a, b = sys.argv[1:]
          t = open(p).read()
          if a not in t: sys.exit(1)
          open(p, "w").write(t.replace(a, b, 1))
          PY
            if sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" </dev/null >/tmp/m.log 2>&1; then echo "::error::mutant $name stayed GREEN"; missed=1; else echo "mutant $name: RED (caught)"; fi
            cp /tmp/orig.kt "$F"
          done <<'MUT'
          fs-fred|FreeObs("fred:$id", c[0].trim(), it)|FreeObs(id, c[0].trim(), it)
          fs-figi-order|val a = arr.optJSONObject(i) ?: return@mapNotNull null|val a = arr.optJSONObject(0) ?: return@mapNotNull null
          fs-fmp|if (v is Number && v.toDouble().isFinite())|if (v is Number && false)
          fs-sec-forms|.filter { f.optString(it) in forms }|.filter { true }
          fs-sec-facts|if (x.optString("form") !in forms) continue|if (false) continue
          fs-yahoo-split|day(x.optLong("date")), n / dd)|day(x.optLong("date")), dd / n)
          fs-yahoo-px|if (c.isFinite() && c > 0) out += FreeObs("px:$symbol"|if (c.isFinite() && c > 0) out += FreeObs("$symbol"
          fs-gate|60_000L / maxOf(1, perMin)|30_000L / maxOf(1, perMin)
          fs-gate-wait|if (wait > 0) sleep(wait)|if (wait > 1000) sleep(wait)
          fs-key|s.key != null && !hasKey -> FreeState.NEEDS_KEY|false -> FreeState.NEEDS_KEY
          fs-key-fetch|h[s.key.header] = key ?: throw NeedsKey(s.key.reason)|h[s.key.header] = key ?: ""
          fs-yahoo-last|for (id in order) answers|for (id in emptyList<String>()) answers
          fs-yahoo-flag|s.flag != null && !flagOn -> FreeState.FLAG_OFF|false -> FreeState.FLAG_OFF
          fs-ua|h["User-Agent"] = UrlHttp.AGENT + (if (contact.isNotEmpty()) " ($contact)" else "")|h["User-Agent"] = UrlHttp.AGENT
          MUT
          exit $missed
