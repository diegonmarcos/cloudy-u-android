name: "Test -> Cloud Me cache_then_live timed walk (#1951, emulator)"

# #1951: timed walk of cache_then_live from a Ship APK on a real emulator: the prefetch of all pages, warm vs cold open-to-first-paint of every Pers and Prof page, a changed live page swapping in, airplane mode. ac_cloud-me/test/emulator-me-cache-1951.sh.

on:
  workflow_dispatch:
    inputs:
      me_run_id:
        description: "Ship Cloud Me run id whose x86_64 APK artifact to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ac_cloud-me/test
            ac_cloud-me/data/ui

      - name: Fetch the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ME_RUN: ${{ inputs.me_run_id }}
        run: |
          set -eu
          fetch() {  # fetch RUN PREFIX OUT
            mkdir -p "dl/$2"
            if [ "$1" = release ]; then gh release download latest -R "$REPO" -p "$2*.apk" -D "dl/$2"; else
            gh api "repos/$REPO/actions/runs/$1/artifacts" --paginate --jq ".artifacts[] | select(.name|startswith(\"$2-x86_64\")) | .name" |
            while read -r name; do gh run download "$1" -R "$REPO" -n "$name" -D "dl/$2/$name"; done
            fi
            pick=$(find "dl/$2" -name '*.apk' | sort | grep -i -- x86_64 | head -1); [ -n "$pick" ] || pick=$(find "dl/$2" -name '*.apk' | sort | grep -vi arm | head -1)
            [ -n "$pick" ] || { echo "::error::no $2 x86_64 APK in run $1"; exit 1; }
            cp "$pick" "$3"
          }
          fetch "$ME_RUN" Cloud-Me me.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + timed cache walk
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-me/test/emulator-me-cache-1951.sh me.apk out

      - name: Upload evidence (screenshots, ui dumps, logcat, verdict)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me-cache-1951-evidence
          path: out/
          if-no-files-found: warn
