# #1908 TEMPORARY (deleted in the next commit): regenerates ac_cloud-camera/gradle/verification-metadata.xml for the artifacts
# libs:scanner adds (pdfbox-android, the ML Kit script models, ...), because dependency verification is on and there is no local Gradle.
name: "tmp 1908 verification metadata"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: |
          sdkmanager --install "platforms;android-37.1" "platforms;android-37.0" "platforms;android-29" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6
      - name: Write the verification metadata
        working-directory: ac_cloud-camera
        run: |
          ./gradlew --no-daemon --continue --write-verification-metadata sha256 :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest || true
          git diff --stat -- gradle/verification-metadata.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: ac_cloud-camera/gradle/verification-metadata.xml
