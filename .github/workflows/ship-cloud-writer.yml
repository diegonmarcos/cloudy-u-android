name: "Ship → Cloud Writer APK (build + push to GHCR via ORAS + attach to GH Release)"

# Cloud Writer on a phone: the owner asked for one application that owns Text
# Enhance, Translate, Grammar Check and Summary, with its own model choice for
# each of them separately, and got a design document instead. This workflow is
# what puts Cloud-Writer.apk on the rolling release so he can install it.
#
# NOTHING OUTSIDE ac_cloud-writer/ AND ITS ONE DECLARED SHARED MODULE CAN FAIL
# THIS RELEASE, and nothing here can fail anyone else's. That is the standing
# fleet rule after a day and a half with no SuperApp APK, and it is a property
# of the module map rather than a promise in a comment: build.json::modules
# declares :app and :libs:text-tools, the trigger paths below are derived from
# exactly that list by cloud-android-ship-repo-workflow-engine.sh, and the
# publish gate hashes exactly the same list. cloud-writer is in no other
# application's gradle graph, so it cannot fail ship-cloud-mail,
# ship-cloud-keyboard or ship-cloud-superapp either.
#
# The paragraph above was a promise about the GRADLE graph, and the gradle graph
# was never the thing that broke. A tester is: test-cloud-writer-tools.sh reads
# aa_cloud-superapp/data/constellation-fleet.json to check that the store offers
# the asset this build publishes, so an edit inside the SuperApp could turn this
# release red — the #242 shape, pointed the other way. Since
# cloud-android-test-engine.sh classifies each tester by the source its verdict
# was actually reached with, that failure is a warning and this APK still ships.
#
# PROVEN, NOT ASSERTED. On 2026-09-10 the SuperApp's constellation-fleet.json was
# deliberately edited to offer Cloud-Writer-PLANTED.apk, and run 34522666643
# published Cloud-Writer.apk on both ABIs while the log carried
# "FAIL   W8 the Constellation entry offers 'Cloud-Writer-PLANTED.apk'" and
# "FOREIGN-DOWNGRADED [ac_cloud-writer]". The plant was reverted in the commit
# after it. Before that change the same edit would have made this workflow red.
#
# Same data-driven publish path as every other application: the engine reads
# ac_cloud-writer/build.json::release, so no registry, tag or artifact name is
# written in this file.
#
#   1. ORAS push as OCI artifact → ghcr.io/diegonmarcos/cloud-writer:<tags>
#   2. GH Release attachment     → Cloud-Writer.apk on the rolling `latest` release
#
# One matrix job per ABI variant (build.json::release.variants[].id): arm64
# (the canonical phone build) + x86_64 (Waydroid / desktop emulators),
# published to the SAME rolling `latest` release under distinct filenames and
# to GHCR under the tag suffix -x86_64.
#
# Cloud Writer has NO native (CMake/NDK) code at all — one Kotlin activity and
# a binder client — so the Android SDK setup omits cmake and ndk.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-writer-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-writer/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-writer.yml"
      # ── end MANAGED-PATHS-HEADER ──
      # THE SHARED LIB ENTRY IS ab_cloud-libs-shared/libs/text-tools, derived
      # from build.json::modules and not hand-written. It is the ITextTools
      # boundary this application calls across, so a change to the AIDL or to
      # TextToolsClient must rebuild this APK — most of all a change to
      # TextTools.SERVICE_PACKAGES, which decides which peer answers.
      # 1_cicd/src/cicd is CANONICAL and .github/workflows is the emitted copy
      # (cloud-android-ship-repo-workflow-engine.sh copies src/cicd -> dist/cicd
      # -> .github/workflows). ONLY the source is listed. The emitted copy used
      # to be listed too, against the fear that editing the source alone leaves
      # the change unrun -- but a path filter cannot catch that: if nobody
      # regenerated, the emitted copy did not change either, so watching it
      # triggers nothing. It only ever added spurious builds, one for every
      # unrelated commit that regenerated this file. The real guard is
      # generated-up-to-date.yml, which fails the build when the emitted copy
      # does not match what the source produces.
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/decisions-link/**"
      - "ab_cloud-libs-shared/libs/decisions/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/text-tools/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ac_cloud-writer/**"
      - "!ac_cloud-writer/web/**"
permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-writer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-writer

jobs:
  build_and_publish:
    name: "Build APK + Push (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      # ── Testers, ABOVE the publish gate on purpose ───────────────────
      #
      # The gate skips the whole job when this application's source is
      # unchanged, and an assertion here can also start failing because
      # something it reads OUTSIDE the application changed — libs:text-tools,
      # TextTools.SERVICE_PACKAGES, the shared registry these prompts were
      # copied from. Gating the tests on the same condition would mean the run
      # that most needs them is the one that skips them.
      #
      # Static assertions only: no JDK, no Android SDK, no gradle. They cost
      # seconds and they run before anything is built, let alone published.
      - name: "Test → shell testers (build.json::tests.shell)"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"

      - name: "Test → assertions that cannot fail"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint "$WORK_DIR"

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # No cmake/ndk — cloud-writer has no native code whatsoever. Pins
          # mirror ac_cloud-writer/flake.nix + build.json::toolchain.
          packages: "platforms;android-35 platforms;android-34 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.10.2 (cached)
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      # ── ONE shared Cloud-constellation signing key (vault) ──────────────
      # ALL constellation apps sign with the SAME key so cross-app
      # signature-IPC + the in-app fleet updater never hit a signature
      # mismatch. The raw keystore + its sops-encrypted passwords live ONLY in
      # the private vault repo (Shared/Providers/D_TOOLS-DEVICES/d2-android/release.jks +
      # signing.secrets.yaml). build.sh::_resolve_signing reads $VAULT_DIR +
      # sops-decrypts (SOPS_AGE_KEY) and exports ANDROID_KEYSTORE_* for gradle.
      # NO fallback: if the key is unavailable build.sh exits 1 (desired).
      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install gh CLI + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          command -v gh

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      # #800 the JVM suites: :core (routing and fallback, the OpenRouter wire, the
      # Listen segmenter, the documents, the Markdown tools) and libs:decisions,
      # each followed by its PIT mutation gate. PLACED HERE, after JDK, SDK and
      # Gradle exist — up with the shell testers there is no gradle on PATH and
      # the engine fails closed (#531, the ship-cloud-calc.yml placement).
      # UNGATED on the publish gate (toolchain steps above included): the gate hashes build inputs and deliberately
      # leaves test sources out, so a push that only edits tests skips the gate; gating the suite on it meant a test-only
      # change never ran the tests it changed. The suite now runs on every Ship run; only build/publish stay gated.
      - name: JVM unit tests + PIT (fatal on failure)
        working-directory: ${{ github.workspace }}
        env:
          BYPASS_NIX: "1"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # CLOUDNAV_VARIANT selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          # Kept for the engine's own `gh` calls. Unlike the SuperApp, this
          # app/build.gradle does NOT shell out to `gh` at config phase — it
          # has no About → Stack page to bake CI durations into.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          set -o pipefail
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          else
            ./build.sh build 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          fi
          ls -la dist/

      - name: Why the build failed (readable without a token)
        if: failure() && steps.gate.outputs.skip != 'true'
        run: sh 1_cicd/dist/scripts/cloud-android-annotate-build-failure.sh "$RUNNER_TEMP/gradle-build.log" "build [cloud-writer]"

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-writer" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Writer-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-writer

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-writer" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"
