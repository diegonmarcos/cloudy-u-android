# #1952 fully cached, mutation runs: each applies ONE deliberate break to the body cache (cap, eviction order, day window, the two settings,
# the resume after a restart, the cold-start order) and runs MailCache1952bTest, whose named test must catch it. The JVM run is RED
# (expected); the JOB is green only when the verdict step finds the named test failed (KILLED). `none` runs the unbroken tree and must be
# green. The dispatch input reaches the scripts through env only and is matched against an allow-list. Manual only.
name: mail-cache-1952b-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'none | evict-newest-first | window-ignored | shrink-no-evict | default-drift | setting-not-stored | resume-from-zero | metered-no-chain | network-before-rows | index-not-covering | first-page-unbounded | return-requeries | placeholder-view | core-ungated | query-per-write | first-rows-any-view | fill-ignores-screen | inbox-pruned | folders-after-messages | aggregates-per-write | inbox-id-not-remembered | email-gains-var | inbox-id-not-from-store | extra-scopes-wait | warmup-dropped | pager-on-main | drawer-eager | first-load-late | migration-no-stats'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-mail
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply the mutation
        env:
          M: ${{ inputs.name }}
        run: |
          D=ac_cloud-mail/core/data/src/main/kotlin/app/sterna/core/data
          case "$M" in
            none) echo "no mutation: the tree must be green"; exit 0 ;;
            # past the cap the NEWEST bodies go
            evict-newest-first) sed -i 's/for (row in kept.sortedBy { it.sortKey }) {/for (row in kept.sortedByDescending { it.sortKey }) {/' $D/mail/BodyPrefetch.kt ;;
            # a day window keeps the older bodies
            window-ignored)     sed -i 's/rows.partition { cutoffMillis != null \&\& it.sortKey < cutoffMillis }/rows.partition { false }/' $D/mail/BodyPrefetch.kt ;;
            # a smaller limit is not applied until some later sync
            shrink-no-evict)    sed -i 's/mailRepository.bodyCacheLimit = it; if (!first) mailRepository.applyCacheLimits(); first = false/mailRepository.bodyCacheLimit = it; first = false/' ac_cloud-mail/app/src/main/kotlin/app/sterna/SternaApplication.kt ;;
            # the engine's default leaves the declaration
            default-drift)      sed -i 's/val DEFAULT = GB_3/val DEFAULT = GB_1/' $D/mail/OfflineCache.kt ;;
            # the chosen limit is not what is stored
            setting-not-stored) sed -i 's/prefs\[KEY_BODY_CACHE_LIMIT\] = limit.name/prefs[KEY_BODY_CACHE_LIMIT] = app.sterna.core.data.mail.BodyCacheLimit.DEFAULT.name/' $D/settings/SettingsRepository.kt ;;
            # the header backfill starts again from the top
            resume-from-zero)   sed -i 's/HeaderResume(oldestCachedId, if (oldestCachedId != null) 1 else 0)/HeaderResume(oldestCachedId?.let { null }, 0)/' $D/mail/FullSync.kt ;;
            # a metered link no longer chains the fill
            metered-no-chain)   sed -i 's/if (port.missingBodies(folder, 1).isNotEmpty()) pending = true/if (c0.unmetered \&\& port.missingBodies(folder, 1).isNotEmpty()) pending = true/' $D/mail/FullSync.kt ;;
            # the first server call no longer waits for the painted rows
            network-before-rows) sed -i 's/withTimeoutOrNull(timeoutMs) { painted.await() }/withTimeoutOrNull(0L) { }/' $D/mail/ColdStart.kt ;;
            # the list index loses the column that makes it covering
            index-not-covering) sed -i 's/(`accountId`, `mailboxId`, `fromDomain`, `sortKey`, `seen`, `id`)"/(`accountId`, `mailboxId`, `fromDomain`, `sortKey`, `seen`)"/' $D/db/Migrations.kt ;;
            # the first load asks for the whole folder
            first-page-unbounded) sed -i 's/initialLoadSize = PAGE_SIZE \* 3,/initialLoadSize = Int.MAX_VALUE,/' $D/mail/MailRepository.kt ;;
            # a return to the list waits for the live pages again (no kept rows first)
            return-requeries)   sed -i 's/if (away \&\& held != null) out.tryEmit(held) else out.tryEmit(pages)/out.tryEmit(pages)/' $D/mail/ListReturn.kt ;;
            # the pager starts on a placeholder view again
            placeholder-view)   sed -i 's/.stateIn(viewModelScope, SharingStarted.Eagerly, initialListView())/.stateIn(viewModelScope, SharingStarted.Eagerly, ListView())/' ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/inbox/InboxViewModel.kt ;;
            # the Rust core talks to the server before the rows are painted
            core-ungated)       sed -i '/ColdStart.awaitRows() \/\/ #1952 cold start: every pass of the core/d' $D/mail/RustMailCore.kt ;;
            # every write starts a full query, however slow the list
            query-per-write)    sed -i 's/if (lastLoadMs < LIST_INVALIDATE_FAST_QUERY_MS) 0L else minOf(lastLoadMs, LIST_INVALIDATE_MAX_DELAY_MS)/0L/' $D/mail/ListReturn.kt ;;
            # rows kept for one view are shown in another
            first-rows-any-view) sed -i 's/        if (kept.view != view) return null/        if (kept.view.isEmpty()) return null/' $D/mail/ListReturn.kt ;;
            # the background fill no longer gives way to the screen
            fill-ignores-screen) sed -i 's/if (resumed) UI_RESUMED_BATCH_PAUSE_MS else 0L/0L/' $D/mail/ListReturn.kt ;;
            # the Inbox's old headers are deleted by the age prune again
            inbox-pruned)       sed -i '/if (isInboxRole(mailboxDao.roleForId(accountId, mailboxId))) return/d' $D/mail/MailRepository.kt ;;
            # a first sync stores its folder list only when the messages are in
            folders-after-messages) sed -i 's/storedRoleOfTarget == null \&\& storedFolders == 0/false/' $D/mail/ListReturn.kt ;;
            # the drawer aggregates follow every write again
            aggregates-per-write) sed -i 's/const val AGGREGATE_MIN_GAP_MS = 1_000L/const val AGGREGATE_MIN_GAP_MS = 0L/' $D/mail/ListReturn.kt ;;
            # a first sync no longer remembers the Inbox id with its early folder write (a restart mid-sync paints late)
            inbox-id-not-remembered) sed -i '/if (target.role == "inbox") accountStore.saveInboxMetaFor(credentials.id, target.id, target.name/d' $D/mail/MailRepository.kt ;;
            # the mail model gains a var (the stability declaration for Compose would be a lie)
            email-gains-var) sed -i 's/^    val id: String,$/    var id: String,/' ac_cloud-mail/core/jmap/src/main/kotlin/app/sterna/core/jmap/model/Email.kt ;;
            # the start no longer reads its Inbox id from the store: an unknown folder and a second list key
            inbox-id-not-from-store) sed -i 's/store.inboxMailboxId() ?: inboxIdFromTheStore()/store.inboxMailboxId()/' ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/inbox/InboxViewModel.kt ;;
            # the first page waits for the extra-scopes query again
            extra-scopes-wait) sed -i '/^            \.onStart { warmExtraScopes.await()?.let { emit(it) } }$/d' $D/mail/MailRepository.kt ;;
            # nothing is opened in parallel when the application starts
            warmup-dropped) sed -i '/container.settingsRepository.sortOrder.first()/d' ac_cloud-mail/app/src/main/kotlin/app/sterna/SternaApplication.kt ;;
            # the key and the pager wait behind the main thread's first frame again
            pager-on-main) sed -i 's/}.flowOn(Dispatchers.Default).cachedIn(pagingScope)/}.cachedIn(viewModelScope)/' ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/inbox/InboxViewModel.kt ;;
            # the drawer's content is composed in the first frame again
            drawer-eager) sed -i 's/^\( *\)if (drawerContentReady) {$/\1if (true) {/' ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/inbox/InboxScreen.kt ;;
            # the first page load waits for the screen's first composition again
            first-load-late) sed -i '/^    private val firstPageLoad: Unit = startFirstPageLoad()$/d' ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/inbox/InboxViewModel.kt ;;
            # the migration no longer analyses after building the index
            migration-no-stats) sed -i '/^        EMAILS_STATISTICS_SQL.forEach { db.execSQL(it) }$/d' $D/db/Migrations.kt ;;
            *) echo "::error::unknown mutation (not in the allow-list)"; exit 2 ;;
          esac
          git diff --stat
          test -n "$(git diff --name-only)" || { echo "::error::mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: JVM unit tests of MailCache1952bTest (RED expected under a mutation; the verdict step reads the XML)
        run: |
          cd ac_cloud-mail
          chmod +x gradlew
          ./gradlew --no-daemon :core:data:testDebugUnitTest -PtestApp --tests "app.sterna.core.data.mail.MailCache1952bTest" --tests "app.sterna.core.data.db.ListQueryPlan1952bTest" --tests "app.sterna.core.data.mail.ListReturn1952cTest" --tests "app.sterna.core.data.mail.MailModelImmutability1952Test" || true
      - name: Verdict (KILLED = the named test failed; none = every test green)
        env:
          M: ${{ inputs.name }}
        run: |
          case "$M" in
            none)                N="" ;;
            evict-newest-first)  N="past the cap the oldest bodies go first and the newest stay" ;;
            window-ignored)      N="a day window excludes older bodies and All keeps every one" ;;
            shrink-no-evict)     N="shrinking the limit evicts at once" ;;
            default-drift)       N="the defaults and the choices are the declaration's" ;;
            setting-not-stored)  N="the body cache limit round-trips through the settings store" ;;
            resume-from-zero)    N="the header backfill resumes after the oldest header held, never from zero" ;;
            metered-no-chain)    N="the background fill continues on any connection" ;;
            network-before-rows) N="on a cold start the first network call waits for the painted rows" ;;
            index-not-covering)  N="the domain list's aggregates read the covering index, not the message rows" ;;
            first-page-unbounded) N="the first page is a bounded read of the store" ;;
            return-requeries)    N="returning to the list shows the kept rows first and runs no store query for it" ;;
            placeholder-view)    N="the pager's first key carries the stored view, never a placeholder" ;;
            core-ungated)        N="every pass of the Rust core and the push connection wait for the painted rows" ;;
            query-per-write)     N="a slow list coalesces invalidations into one query and a fast list follows every write" ;;
            first-rows-any-view) N="the top of the list is kept for the next cold start, for its own view only" ;;
            fill-ignores-screen) N="the background fill pauses between batches only while the app is on screen" ;;
            inbox-pruned)        N="the Inbox is never pruned by age, whoever asks" ;;
            folders-after-messages) N="a first sync stores the folder list before its messages" ;;
            inbox-id-not-from-store) N="a start that does not know its Inbox id reads it from the store before the list key" ;;
            extra-scopes-wait)   N="the first page does not wait for the folders that list extra messages" ;;
            migration-no-stats)  N="without statistics the planner does not use the covering index, and the migration's statistics SQL makes it" ;;
            first-load-late)     N="the first page load starts before the screen composes" ;;
            drawer-eager)        N="the drawer's content is composed after the first rows are painted" ;;
            pager-on-main)       N="the key and the pager are built off the main thread" ;;
            warmup-dropped)      N="the settings file, the account store and the database are opened in parallel when the application starts" ;;
            email-gains-var)     N="the mail model has no var and no mutable collection field" ;;
            inbox-id-not-remembered) N="a first sync stores the folder list before its messages" ;;
            aggregates-per-write) N="a sync's writes reach the drawer aggregates in steps and the last write is never lost" ;;
            *) echo "::error::unknown mutation (not in the allow-list)"; exit 2 ;;
          esac
          ls ac_cloud-mail/core/data/build/test-results/*/TEST-*MailCache1952bTest.xml ac_cloud-mail/core/data/build/test-results/*/TEST-*ListQueryPlan1952bTest.xml >/dev/null 2>&1 \
            || { echo "::error::LEG ERROR: a result file of the two classes is missing (did not compile or run); not a kill"; exit 1; }
          X=ac_cloud-mail/core/data/build
          python3 -I - "$X" "$N" "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, want, leg = sys.argv[1:]
          import glob
          cases = {}
          for f in glob.glob(path + "/test-results/*/TEST-*MailCache1952bTest.xml") + glob.glob(path + "/test-results/*/TEST-*ListQueryPlan1952bTest.xml") + glob.glob(path + "/test-results/*/TEST-*ListReturn1952cTest.xml") + glob.glob(path + "/test-results/*/TEST-*MailModelImmutability1952Test.xml"):
              cases.update({c.get("name"): c for c in ET.parse(f).getroot().iter("testcase")})
          failed = sorted(n for n, c in cases.items() if c.find("failure") is not None or c.find("error") is not None)
          print("tests:", len(cases), "failed:", failed)
          if leg == "none":
              if failed or len(cases) < 22: print("::error::the unbroken tree is not green (or tests are missing)"); sys.exit(1)
              print("GREEN: %d tests" % len(cases)); sys.exit(0)
          if want not in cases: print("::error::LEG ERROR %s: the named test did not run: %s" % (leg, want)); sys.exit(1)
          if want not in failed: print("::error::LEG SURVIVED %s: the named test stayed green: %s" % (leg, want)); sys.exit(1)
          print("KILLED %s by: %s" % (leg, want))
          PY
