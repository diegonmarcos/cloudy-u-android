# #1794 Cloud SuperApp Notify badges on an emulator: the persistent badges reach the shade under their switches.
# Runs the x86_64 APK a Ship Cloud SuperApp run built (debug build, run-as) and proves, with `dumpsys notification`
# after each step and a screenshot of the pulled-down shade:
#   0. the owner's stored state that broke it (every #777 group switch OFF, every badge switch ON) posts the badges;
#   1. Notify > Configs "Turn all badges on / off" OFF takes every badge out of the shade;
#   2. turned back ON puts them back;
#   3. one badge's "Show this badge" OFF removes just that badge; ON posts it again.
# Also shoots Notify > Configs (the grouped list, state on the title's row) and Notify > All with every badge row in each
# of its three states (collapsed, first shade state, second shade state), driven by the rows' own right-side arrows.
# Evidence: notify-badges-evidence (PNGs, dumpsys per step, uiautomator XML, verdict.txt). The job fails on a failed check.
name: "Test -> SuperApp Notify badges in the shade (emulator)"

on:
  workflow_dispatch:
    inputs:
      superapp_run_id:
        description: "Ship Cloud SuperApp run id whose x86_64 APK artifact to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  shade:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout the badge declaration
        uses: actions/checkout@v4
        with:
          sparse-checkout: aa_cloud-superapp/build.json
          sparse-checkout-cone-mode: false
      - name: Fetch the Cloud SuperApp APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          W_RUN: ${{ inputs.superapp_run_id }}
        run: |
          set -eu
          mkdir -p apk
          gh api "repos/$REPO/actions/runs/$W_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-SuperApp")) | .name' |
          while read -r name; do gh run download "$W_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          pick=""
          for want in x86_64 universal ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud SuperApp APK"; exit 1; }
          cp "$pick" superapp.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the scripts
        run: |
          # ui.py: find a node in a uiautomator dump and print its centre ("x y"), or the declared badges.
          cat > ui.py <<'PY'
          import json, re, sys
          def nodes(path):
              x = open(path, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r"<node [^>]*>", x):
                  a = dict(re.findall(r'([\w-]+)="([^"]*)"', m.group(0)))
                  b = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", a.get("bounds", ""))
                  if b: a["_b"] = tuple(map(int, b.groups())); yield a
          def centre(a): x1, y1, x2, y2 = a["_b"]; return "%d %d" % ((x1 + x2) // 2, (y1 + y2) // 2)
          cmd = sys.argv[1]
          if cmd == "text":          # ui.py text dump.xml "Label" [n]   -> n-th node whose text matches (case-insensitive)
              want = sys.argv[3].lower(); n = int(sys.argv[4]) if len(sys.argv) > 4 else 0
              hits = sorted((a for a in nodes(sys.argv[2]) if a.get("text", "").strip().lower() == want), key=lambda a: a["_b"][1])
              print(centre(hits[n]) if len(hits) > n else "")
          elif cmd == "below":       # ui.py below dump.xml "Anchor" "Label"  -> first Label node below the Anchor node
              anchor = [a for a in nodes(sys.argv[2]) if a.get("text", "").strip() == sys.argv[3]]
              if not anchor: print(""); sys.exit()
              y0 = anchor[0]["_b"][1]
              hits = sorted((a for a in nodes(sys.argv[2]) if a.get("text", "").strip() == sys.argv[4] and a["_b"][1] > y0), key=lambda a: a["_b"][1])
              print(centre(hits[0]) if hits else "")
          elif cmd == "desc":        # ui.py desc dump.xml "Expand" n  -> n-th node with that content-desc, top to bottom
              hits = sorted((a for a in nodes(sys.argv[2]) if a.get("content-desc", "") == sys.argv[3]), key=lambda a: a["_b"][1])
              n = int(sys.argv[4]); print(centre(hits[n]) if len(hits) > n else "")
          elif cmd == "checked":     # ui.py checked dump.xml X Y  -> checked of the smallest checkable node holding the point
              px, py = int(sys.argv[3]), int(sys.argv[4])
              hit = [a for a in nodes(sys.argv[2]) if a.get("checkable") == "true" and a["_b"][0] <= px <= a["_b"][2] and a["_b"][1] <= py <= a["_b"][3]]
              hit.sort(key=lambda a: (a["_b"][2] - a["_b"][0]) * (a["_b"][3] - a["_b"][1]))
              print(hit[0].get("checked", "") if hit else "")
          elif cmd == "count-desc":
              print(sum(1 for a in nodes(sys.argv[2]) if a.get("content-desc", "") == sys.argv[3]))
          elif cmd == "badges":      # ui.py badges build.json -> "id<TAB>channel<TAB>label" per persistent badge
              for p in json.load(open(sys.argv[2]))["ui"]["notification_center"]["producers"]:
                  if p.get("badge") and p.get("channel"): print("%s\t%s\t%s" % (p["id"], p["channel"], p["label"]))
          PY
          # posted.py: the channels this package has in the shade right now, from `dumpsys notification --noredact`.
          cat > posted.py <<'PY'
          import re, sys
          pkg = sys.argv[2]; out = set()
          for l in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if "NotificationRecord(" in l and ("pkg=%s " % pkg) in l:
                  m = re.search(r"channel=(\S+)", l)
                  if m: out.add(m.group(1))
          print(" ".join(sorted(out)))
          PY
          cat > shoot.sh <<'EOF2'
          set -u
          mkdir -p out
          : > out/verdict.txt
          fails=0
          check() { if [ "$1" = ok ]; then echo "PASS $2" | tee -a out/verdict.txt; else echo "FAIL $2" | tee -a out/verdict.txt; fails=$((fails+1)); fi; }
          adb install -r -g superapp.apk || exit 2
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PKG=$("$aapt2" dump packagename superapp.apk)
          ACT=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tr -d '\r' | tail -1)
          adb shell cmd package set-home-activity "$PKG/.HomeActivity" || true
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put system screen_off_timeout 2147483647; adb shell svc power stayon true
          adb shell locksettings set-disabled true || true
          # no Android screensaver (the charging clock dream took over the screen mid-run and ate every tap)
          for k in screensaver_enabled screensaver_activate_on_sleep screensaver_activate_on_dock; do adb shell settings put secure $k 0 || true; done
          adb shell settings put global stay_on_while_plugged_in 7 || true
          for p in POST_NOTIFICATIONS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do adb shell pm grant "$PKG" android.permission.$p || true; done
          adb shell appops set "$PKG" SYSTEM_ALERT_WINDOW allow || true
          awake() { adb shell am stopservice -n "$PKG/.floatingnav.ScreensaverService" >/dev/null 2>&1 || true; adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard; adb shell input keyevent 82; }
          # The app's own Screensaver (a black overlay with the clock and one "Unlock" button, started by the shell's
          # idle timer) covers the page between steps; take it down with its own button before reading or tapping.
          uncover() { for _ in 1 2 3; do adb shell uiautomator dump /sdcard/u0.xml >/dev/null 2>&1; adb pull /sdcard/u0.xml u0.xml >/dev/null 2>&1
            u=$(python3 ui.py text u0.xml Unlock)
            # the first-start "Install unknown apps" ask covers the page after a restart: Skip it
            [ -z "$u" ] && grep -q 'text="Install unknown apps"' u0.xml && u=$(python3 ui.py text u0.xml Skip)
            [ -z "$u" ] && return 0; adb shell input tap $u; sleep 2; done; }
          dump() { awake; uncover; sleep 1; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml "out/$1.xml" >/dev/null 2>&1; }
          shade() { awake; uncover; adb shell cmd statusbar expand-notifications; sleep 3; adb exec-out screencap -p > "out/shade-$1.png"; adb shell cmd statusbar collapse; sleep 1; }
          posted() { adb shell dumpsys notification --noredact > "out/dumpsys-$1.txt"; python3 posted.py "out/dumpsys-$1.txt" "$PKG"; }
          tap() { [ -n "$1" ] || { echo "tap: no target"; return 1; }; awake; uncover; adb shell input tap $1; }
          shot() { awake; uncover; sleep 1; adb exec-out screencap -p > "out/$1.png"; }
          python3 ui.py badges aa_cloud-superapp/build.json > badges.tsv; cat badges.tsv
          CHANNELS=$(cut -f2 badges.tsv | sort -u | tr '\n' ' ')
          in_shade() { n=0; for c in $CHANNELS; do case " $1 " in *" $c "*) n=$((n+1));; esac; done; echo $n; }
          awake

          # 0. the owner's state: every group switch stored OFF by an older build (#777), no badge switch touched (= ON).
          adb shell am force-stop "$PKG"
          python3 - > groups.xml <<'PY'
          import json
          g = json.load(open("aa_cloud-superapp/build.json"))["ui"]["notification_center"]["groups"]
          print('<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map>' + "".join('<boolean name="%s.enabled" value="false" />' % x["id"] for x in g) + "</map>")
          PY
          adb push groups.xml /data/local/tmp/notify_groups.xml
          # the app's own idle Screensaver (black cover, 10 s default) off for the run: launcher_settings.screensaver_timeout 0 = never
          echo '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><int name="screensaver_timeout" value="0" /></map>' > ls.xml
          adb push ls.xml /data/local/tmp/launcher_settings.xml
          adb shell "run-as $PKG sh -c 'mkdir -p shared_prefs && cp /data/local/tmp/notify_groups.xml shared_prefs/notify_groups.xml && cp /data/local/tmp/launcher_settings.xml shared_prefs/launcher_settings.xml && rm -f shared_prefs/badge_customization.xml'" || echo "run-as failed"
          adb shell am start -W -n "$ACT" >/dev/null; sleep 25; awake
          p0=$(posted start); n0=$(in_shade "$p0"); echo "start: $p0"
          [ "$n0" -ge 3 ] && check ok "0 stale group switches OFF, badge switches ON: $n0 badge channels in the shade ($p0)" || check no "0 stale group switches: only $n0 badge channels in the shade ($p0)"
          shade 0-start

          # Taps happen at the phone's own size only: under a `wm size` override, injected touches are not in the dump's
          # coordinates (the first runs tapped the wrong row). The tall display is for full-page screenshots, never taps.
          page() { adb shell am start -n "$ACT" --es shortcut_action "page:communication/$1" >/dev/null; awake; sleep 8; }
          totop() { for _ in 1 2 3 4 5 6; do adb shell input swipe 540 700 540 2100 150; done; sleep 1; }
          # seek MODE A [B]: scroll down until ui.py MODE finds the target well inside the screen (above the bottom nav);
          # prints its centre and leaves the page there.
          seek() { totop; for _ in $(seq 1 16); do dump seek; pos=$(python3 ui.py "$1" out/seek.xml "${@:2}")
              if [ -n "$pos" ]; then y=${pos#* }; if [ "$y" -gt 300 ] && [ "$y" -lt 2000 ]; then echo "$pos"; return 0; fi; fi
              adb shell input swipe 540 1800 540 1200 500 >/dev/null; sleep 1; done; return 1; }
          # setsw WANT MODE A [B]: drive the switch row to WANT (true|false), reading its state back after every tap.
          setsw() { want=$1; shift; pos=$(seek "$@") || { echo "setsw: not found: $*"; return 1; }; pos=$(printf "%s\n" "$pos" | tail -1)
              for _ in 1 2 3 4; do dump sw; st=$(python3 ui.py checked out/sw.xml $pos); echo "switch $* at $pos: $st (want $want)"
                [ "$st" = "$want" ] && return 0; tap "$pos"; sleep 4; done; return 1; }
          # until_shade NAME TEST: poll the shade (dumpsys) up to 90 s until TEST "$posted" holds; prints the last read.
          until_shade() { t0=$(date +%s); for _ in $(seq 1 18); do p=$(posted "$1"); if $2 "$p"; then break; fi; sleep 5; done
              echo "$p"; echo "  $1 after $(( $(date +%s) - t0 ))s: $p" >&2; }
          none_in() { [ "$(in_shade "$1")" -eq 0 ]; }
          some_in() { [ "$(in_shade "$1")" -ge 3 ]; }
          tall() { adb shell wm size 1080x7600; sleep 3; page "$1"; shot "$2"; adb shell wm size reset; sleep 3; }
          stages() { adb shell "run-as $PKG cat shared_prefs/notify_all_badge_stage.xml" 2>/dev/null | grep -o ">$1<" | wc -l; }

          page notify-configs; shot configs-before; tall notify-configs configs-before-tall

          # 1. Turn all OFF.
          page notify-configs; setsw false text 'Turn all badges on / off'
          p1=$(until_shade all-off none_in); n1=$(in_shade "$p1"); echo "all off: $p1"
          [ "$n1" -eq 0 ] && check ok "1 Turn all OFF: no badge in the shade ($p1)" || check no "1 Turn all OFF: $n1 badge channels still in the shade ($p1)"
          page notify-configs; shot configs-all-off; shade 1-all-off

          # 2. Turn all ON.
          page notify-configs; setsw true text 'Turn all badges on / off'
          p2=$(until_shade all-on some_in); n2=$(in_shade "$p2"); echo "all on: $p2"
          [ "$n2" -ge 3 ] && check ok "2 Turn all ON: $n2 badge channels back in the shade ($p2)" || check no "2 Turn all ON: only $n2 badge channels in the shade ($p2)"
          page notify-configs; shot configs-all-on; shade 2-all-on

          # 3. One badge: the first declared badge that is in the shade now.
          tid=""; for row in battery_status network_data ai_usage presets_state $(cut -f1 badges.tsv); do ch=$(grep -P "^$row\t" badges.tsv | cut -f2); case " $p2 " in *" $ch "*) tid=$row; break;; esac; done
          if [ -n "$tid" ]; then
            tch=$(grep -P "^$tid\t" badges.tsv | cut -f2); tlabel=$(grep -P "^$tid\t" badges.tsv | cut -f3)
            gone() { case " $1 " in *" $tch "*) return 1;; esac; return 0; }; back() { ! gone "$1"; }
            page notify-configs; setsw false below "$tlabel" 'Show this badge'
            p3=$(until_shade one-off gone); echo "$tid off: $p3"
            case " $p3 " in *" $tch "*) check no "3 '$tlabel' Show this badge OFF: channel $tch still in the shade";; *) check ok "3 '$tlabel' Show this badge OFF: channel $tch left the shade";; esac
            others=$(in_shade "$p3"); [ "$others" -ge 1 ] && check ok "3 the other badges stayed ($others)" || check no "3 switching one badge off took the others too"
            shot configs-one-off; shade 3-one-off
            page notify-configs; setsw true below "$tlabel" 'Show this badge'
            p4=$(until_shade one-on back); echo "$tid on: $p4"
            case " $p4 " in *" $tch "*) check ok "3 '$tlabel' Show this badge ON: channel $tch back in the shade";; *) check no "3 '$tlabel' Show this badge ON: channel $tch not posted";; esac
            shade 4-one-on
          else check no "3 no badge was in the shade to switch"; fi
          page notify-configs; shot configs; tall notify-configs configs-final-tall

          # All: the three states, moved by the rows' own right-side arrows (the first three rows), read back from the
          # store the arrow writes (notify_all_badge_stage), then every row shown in each state on the tall display.
          adb shell "run-as $PKG rm -f shared_prefs/notify_all_badge_stage.xml" || true
          adb shell am force-stop "$PKG"; adb shell am start -W -n "$ACT" >/dev/null; sleep 10
          page my-rss; dump all-1; shot all-1-collapsed
          rows=$(python3 ui.py count-desc out/all-1.xml Expand); echo "All rows with an arrow on screen: $rows"
          [ "$rows" -ge 3 ] && check ok "All: badge rows carry the right-side arrow ($rows on screen)" || check no "All: only $rows arrows on screen"
          for i in 0 1 2; do dump all-step; tap "$(python3 ui.py desc out/all-step.xml Expand "$i")"; sleep 2; done
          shot all-2-first; f=$(stages FIRST)
          [ "$f" -ge 3 ] && check ok "All: one arrow tap opens a row to its first shade state ($f rows FIRST)" || check no "All: first state stored for $f rows"
          for i in 0 1 2; do dump all-step; tap "$(python3 ui.py desc out/all-step.xml Expand "$i")"; sleep 2; done
          shot all-3-second; s2=$(stages SECOND)
          [ "$s2" -ge 3 ] && check ok "All: a second tap opens it to its expanded shade state ($s2 rows SECOND)" || check no "All: second state stored for $s2 rows"
          dump all-step; tap "$(python3 ui.py desc out/all-step.xml Collapse 0)"; sleep 2; c=$(stages COLLAPSED)
          [ "$c" -ge 1 ] && check ok "All: a third tap folds the row back" || check no "All: the arrow did not fold the row"
          for st in COLLAPSED FIRST SECOND; do
            adb shell am force-stop "$PKG"
            { echo '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map>'; for id in $(cut -f1 badges.tsv); do echo "<string name=\"$id\">$st</string>"; done; echo '</map>'; } > stage.xml
            adb push stage.xml /data/local/tmp/stage.xml >/dev/null
            adb shell "run-as $PKG cp /data/local/tmp/stage.xml shared_prefs/notify_all_badge_stage.xml" || true
            adb shell am start -W -n "$ACT" >/dev/null; sleep 10
            tall my-rss "all-$st-tall"
          done
          timeout 60 adb logcat -d > out/logcat.txt || true
          cat out/verdict.txt
          [ "$fails" -eq 0 ]
          EOF2
          chmod +x shoot.sh
      - name: Boot emulator and prove
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash shoot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notify-badges-evidence
          path: out/
          if-no-files-found: warn
