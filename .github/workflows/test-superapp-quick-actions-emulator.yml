# #1848 shoots Notify's two rows, the config-icon entry and the new bottom nav; #1846 Quick actions on an emulator (and #1847 Banking Apps Mode on and off, with the Security tab before, during and after), with the x86_64 APK a Ship Cloud SuperApp run built: every tab of the ONE row
# (Preset | Battery Security UI Network Others All) is opened by its deep link, shot, dumped, and checked for its tab row and its
# tiles (resource ids control:tile:<id>, test tags exposed as resource ids) with the detail line each tile paints
# (control:detail:<id>). Evidence: quick-actions-evidence (PNGs, uiautomator XML, tiles.tsv, verdict.txt). Any missing tab label,
# tile or detail line fails the job. Later tickets (#1847 Banking Apps Mode, #1848 Notify and the bottom nav) add rows to the same walk.
name: "Test -> SuperApp Quick actions tabs (emulator)"

on:
  workflow_dispatch:
    inputs:
      superapp_run_id:
        description: "Ship Cloud SuperApp run id whose x86_64 APK artifact to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch the Cloud SuperApp APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          W_RUN: ${{ inputs.superapp_run_id }}
        run: |
          set -eu
          mkdir -p apk
          gh api "repos/$REPO/actions/runs/$W_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-SuperApp")) | .name' |
          while read -r name; do gh run download "$W_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          pick=""
          for want in x86_64 universal ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud SuperApp APK"; exit 1; }
          cp "$pick" superapp.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the scripts
        run: |
          # ui.py: find a node in a uiautomator dump and print its centre ("x y"), or the declared badges.
          cat > ui.py <<'PY'
          import html, json, re, sys
          def nodes(path):
              x = open(path, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r"<node [^>]*>", x):
                  a = {k: html.unescape(v) for k, v in re.findall(r'([\w-]+)="([^"]*)"', m.group(0))}
                  b = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", a.get("bounds", ""))
                  if b: a["_b"] = tuple(map(int, b.groups())); yield a
          def vis(a): x1, y1, x2, y2 = a["_b"]; return x2 > x1 and y2 > y1   # a row scrolled out of view keeps bounds [0,0][0,0]
          def centre(a): x1, y1, x2, y2 = a["_b"]; return "%d %d" % ((x1 + x2) // 2, (y1 + y2) // 2)
          cmd = sys.argv[1]
          if cmd == "text":          # ui.py text dump.xml "Label" [n]   -> n-th node whose text matches (case-insensitive)
              want = sys.argv[3].lower(); n = int(sys.argv[4]) if len(sys.argv) > 4 else 0
              hits = sorted((a for a in nodes(sys.argv[2]) if vis(a) and a.get("text", "").strip().lower() == want), key=lambda a: a["_b"][1])
              print(centre(hits[n]) if len(hits) > n else "")
          elif cmd == "below":       # ui.py below dump.xml "Anchor" "Label"  -> first Label node below the Anchor node
              anchor = [a for a in nodes(sys.argv[2]) if a.get("text", "").strip() == sys.argv[3]]
              if not anchor: print(""); sys.exit()
              y0 = anchor[0]["_b"][1]
              hits = sorted((a for a in nodes(sys.argv[2]) if a.get("text", "").strip() == sys.argv[4] and a["_b"][1] > y0), key=lambda a: a["_b"][1])
              print(centre(hits[0]) if hits else "")
          elif cmd == "desc":        # ui.py desc dump.xml "Expand" n  -> n-th node with that content-desc, top to bottom
              hits = sorted((a for a in nodes(sys.argv[2]) if a.get("content-desc", "") == sys.argv[3]), key=lambda a: a["_b"][1])
              n = int(sys.argv[4]); print(centre(hits[n]) if len(hits) > n else "")
          elif cmd == "checked":     # ui.py checked dump.xml X Y  -> checked of the smallest checkable node holding the point
              px, py = int(sys.argv[3]), int(sys.argv[4])
              hit = [a for a in nodes(sys.argv[2]) if a.get("checkable") == "true" and a["_b"][0] <= px <= a["_b"][2] and a["_b"][1] <= py <= a["_b"][3]]
              hit.sort(key=lambda a: (a["_b"][2] - a["_b"][0]) * (a["_b"][3] - a["_b"][1]))
              print(hit[0].get("checked", "") if hit else "")
          elif cmd == "count-desc":
              print(sum(1 for a in nodes(sys.argv[2]) if a.get("content-desc", "") == sys.argv[3]))
          elif cmd in ("starts", "contains", "match", "textof", "verdict", "texts"):
              # starts   dump "Prefix"       centre of the first node whose text starts with Prefix (Skip, "Skip (don't ask again)")
              # contains dump "Sub" [lo hi]  centre of the topmost node whose text or content-desc holds Sub, centre y inside lo..hi (300..2100)
              # match    dump REGEX          centre of the first node whose text matches REGEX
              # textof   dump "Sub"          the text of the topmost node holding Sub
              # verdict  dump "Sub"          the report row holding Sub: tap (needs your tap) | done | skipped | failed | none
              ns = sorted((a for a in nodes(sys.argv[2]) if vis(a)), key=lambda a: (a["_b"][1], a["_b"][0]))
              arg = sys.argv[3] if len(sys.argv) > 3 else ""
              if cmd == "texts": print(" | ".join(t for a in ns for t in (a.get("text", ""), a.get("content-desc", "")) if t.strip())); sys.exit()
              has = lambda a: arg in a.get("text", "") or arg in a.get("content-desc", "")
              if cmd == "starts":
                  hits = [a for a in ns if a.get("text", "").strip().lower().startswith(arg.lower())]
                  print(centre(hits[0]) if hits else "")
              elif cmd == "contains":
                  lo = int(sys.argv[4]) if len(sys.argv) > 4 else 300; hi = int(sys.argv[5]) if len(sys.argv) > 5 else 2100
                  hits = [a for a in ns if has(a) and lo < (a["_b"][1] + a["_b"][3]) // 2 < hi]
                  print(centre(hits[0]) if hits else "")
              elif cmd == "match":
                  hits = [a for a in ns if re.search(arg, a.get("text", "").strip())]
                  print(centre(hits[0]) if hits else "")
              else:
                  hits = [a for a in ns if has(a)]
                  t = (hits[0].get("text", "") or hits[0].get("content-desc", "")).replace("\n", " ") if hits else ""
                  if cmd == "textof": print(t)
                  else: print("none" if not t else "tap" if "needs your tap" in t else "done" if t.startswith("\u2713") else "skipped" if t.startswith("\u25cb") else "failed" if t.startswith("\u25cf") else "none")
          elif cmd == "badges":      # ui.py badges build.json -> "id<TAB>channel<TAB>label" per persistent badge
              for p in json.load(open(sys.argv[2]))["ui"]["notification_center"]["producers"]:
                  if p.get("badge") and p.get("channel"): print("%s\t%s\t%s" % (p["id"], p["channel"], p["label"]))
          PY
          # posted.py: the channels this package has in the shade right now, from `dumpsys notification --noredact`.
          cat > walk.sh <<'EOF2'
          set -u
          mkdir -p out
          : > out/verdict.txt; : > out/tiles.tsv
          fails=0
          check() { if [ "$1" = ok ]; then echo "PASS $2" | tee -a out/verdict.txt; else echo "FAIL $2" | tee -a out/verdict.txt; fails=$((fails+1)); fi; }
          adb install -r -g superapp.apk || exit 2
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PKG=$("$aapt2" dump packagename superapp.apk)
          ACT=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tr -d '\r' | tail -1)
          adb shell cmd package set-home-activity "$PKG/.HomeActivity" || true
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell svc power stayon true; adb shell locksettings set-disabled true || true
          for k in screensaver_enabled screensaver_activate_on_sleep screensaver_activate_on_dock; do adb shell settings put secure $k 0 || true; done
          echo '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><int name="screensaver_timeout" value="0" /></map>' > ls.xml
          adb push ls.xml /data/local/tmp/launcher_settings.xml
          adb shell am start -W -n "$ACT" >/dev/null; sleep 5; adb shell am force-stop "$PKG"
          adb shell "run-as $PKG sh -c 'mkdir -p shared_prefs && cp /data/local/tmp/launcher_settings.xml shared_prefs/launcher_settings.xml'" || true
          adb shell am start -W -n "$ACT" >/dev/null; sleep 20
          awake() { adb shell am stopservice -n "$PKG/.floatingnav.ScreensaverService" >/dev/null 2>&1 || true; adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard
            adb shell dumpsys window 2>/dev/null | grep -qE "mDreamingLockscreen=true|isKeyguardShowing=true|mShowingLockscreen=true" && adb shell input keyevent 82; true; }
          page() { adb shell am start -n "$ACT" --es shortcut_action "page:config/$1" >/dev/null; awake; sleep 10; }
          # walk NAME PAGE WORD...: open the page, shoot it, and require every WORD (case-insensitive) among the dump's texts.
          walk() { name=$1; pg=$2; shift 2
            adb logcat -c; page "$pg"
            adb exec-out screencap -p > "out/$name.png"
            adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1; adb pull /sdcard/u.xml "out/$name.xml" >/dev/null 2>&1
            for w in "$@"; do grep -qiF "$w" "out/$name.xml" && check ok "$name: '$w' on screen" || check no "$name: '$w' missing"; done
            grep -o 'resource-id="control:tile:[^"]*"' "out/$name.xml" | sed 's/.*tile://; s/"//' | sort -u | sed "s/^/$name\t/" >> out/tiles.tsv
            n=$(grep -o 'resource-id="control:detail:[^"]*"' "out/$name.xml" | sort -u | wc -l); t=$(grep -o 'resource-id="control:tile:[^"]*"' "out/$name.xml" | sort -u | wc -l)
            echo "$name: $t tiles, $n detail lines" | tee -a out/verdict.txt
            timeout 30 adb logcat -d -s C3SecurityTile > "out/$name.log" || true; }
          ROW="Preset Battery Security UI Network Others All"
          walk preset presets $ROW
          walk battery panels-battery $ROW
          walk security panels-security $ROW "Developer"
          walk ui panels-quick-ui $ROW "Do Not Disturb" "Rotation lock" "Auto brightness" "Screen timeout" "Font size" "Keep screen on"
          walk network panels-network $ROW "Wi-Fi" "Mobile data" "Bluetooth" "Hotspot" "Airplane" "Always-on VPN" "Private DNS" "NFC" "Location"
          walk others panels-tools $ROW "Torch"
          walk all panels-all $ROW "Screensaver"
          # every UI and Network tile paints a detail line (the log line carries it: "tile <id> state=... detail=...")
          for t in hotspot nfc private_dns always_on_vpn keep_screen_on screen_timeout font_size wifi mobile_data bluetooth airplane_mode dnd rotation_lock; do
            f=ui; case $t in hotspot|nfc|private_dns|always_on_vpn|wifi|mobile_data|bluetooth|airplane_mode) f=network;; esac
            grep -q "tile $t state=.* detail=.\+" "out/$f.log" && check ok "$t has a live reading and a detail line" || check no "$t: no detail line in the $f tab log"
          done
          # ── #1848 Notify two rows (Cards | Boards), the config-icon entry, the bottom nav with Actions ──
          target() { adb shell am start -n "$ACT" --es shortcut_action "$1" >/dev/null; awake; sleep 10; }
          walkt() { name=$1; tg=$2; shift 2; target "$tg"; adb exec-out screencap -p > "out/$name.png"
            adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1; adb pull /sdcard/u.xml "out/$name.xml" >/dev/null 2>&1
            for w in "$@"; do grep -qiF "$w" "out/$name.xml" && check ok "$name: '$w' on screen" || check no "$name: '$w' missing"; done; }
          walkt notify-cards section:communication "Cards" "All" "Persistents" "Cloudy Apps" "Phone Apps" "Configs" "Boards" "Inboxes" "Tasks" "Resources" "X-Ray Device"
          walkt notify-boards-tasks page:communication/boards-tasks "Cards" "Boards" "Tasks"
          walkt notify-boards-xray page:communication/boards-xray "Boards" "X-Ray Device"
          walkt notify-config-entry page:config/notify "Cards" "Boards" "Persistents"
          grep -qi "Persistent Badges" out/notify-cards.xml && check no "the old label Persistent Badges is still drawn" || check ok "no Persistent Badges label"
          walkt actions-tab section:actions "Preset" "Battery" "Security" "Network" "Others"
          adb shell am start -n "$ACT" >/dev/null; awake; sleep 8; adb exec-out screencap -p > out/bottom-nav.png; adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1; adb pull /sdcard/u.xml out/bottom-nav.xml >/dev/null 2>&1
          for w in Notify Actions Home Cloud Phone; do grep -qiF "$w" out/bottom-nav.xml && check ok "bottom nav: $w" || check no "bottom nav: $w missing"; done
          grep -qiE 'text="Boards"|content-desc="Boards"' out/bottom-nav.xml && check no "bottom nav still has Boards" || check ok "bottom nav has no Boards"
          # ── #1847 Banking Apps Mode: on and off from Preset > Mode, the Security tab before / during / after ──
          # The run keeps its own adb link: USB debugging, wireless debugging and Developer options are in the mode's skip list here
          # (unit tests cover them); the accessibility entry the mode must remove and put back is the app's own service.
          adb shell pm grant "$PKG" android.permission.WRITE_SECURE_SETTINGS || true
          SVC="$PKG/com.diegonmarcos.superapp.system.LockScreenAccessibilityService"
          adb shell am force-stop "$PKG"
          echo '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><string name="skip">usb_debugging,developer_options,wireless_debugging,adb_shell</string></map>' > bm.xml
          adb push bm.xml /data/local/tmp/banking_mode.xml
          adb shell "run-as $PKG sh -c 'mkdir -p shared_prefs && cp /data/local/tmp/banking_mode.xml shared_prefs/banking_mode.xml'" || echo "run-as failed"
          adb shell am start -W -n "$ACT" >/dev/null; sleep 15
          # A screensaver ("Unlock"), the first-start "Install unknown apps" ask (button "Skip", or "Skip (don't ask again)": match the prefix)
          # or a system "X isn't responding" dialog (answer Wait, as the camera walk does) can cover the page: take it down first.
          skipdlg() { for _ in 1 2 3; do adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1; adb pull /sdcard/u.xml out/dlg.xml >/dev/null 2>&1
              u=$(python3 -I ui.py text out/dlg.xml Unlock)
              [ -z "$u" ] && grep -q 'text="Install unknown apps"' out/dlg.xml && u=$(python3 -I ui.py starts out/dlg.xml Skip)
              [ -z "$u" ] && grep -q "isn't responding\|isn&apos;t responding" out/dlg.xml && u=$(python3 -I ui.py text out/dlg.xml Wait)
              [ -z "$u" ] && return 0; adb shell input tap $u; sleep 3; done; }
          skipdlg
          adb shell settings put secure enabled_accessibility_services "$SVC"; adb shell settings put secure accessibility_enabled 1
          a11y() { adb shell settings get secure enabled_accessibility_services | tr -d '\r'; }
          shoot() { adb exec-out screencap -p > "out/$1.png"; adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1; adb pull /sdcard/u.xml "out/$1.xml" >/dev/null 2>&1; }
          sec() { page panels-security; sleep 8; shoot "$1"; }
          dumpto() { for _ in 1 2 3; do r=$(adb shell uiautomator dump /sdcard/u.xml 2>&1 | tr -d '\r'); case "$r" in *dumped*) break;; esac; sleep 1; done; adb pull /sdcard/u.xml "$1" >/dev/null 2>&1; }
          # a slow drag from the right third (a quick flick at the middle was taken by the home swipe gestures / edge pads); the two gestures alternate
          swipe_down() { if [ $(( $1 % 2 )) -eq 0 ]; then adb shell input swipe 760 1900 760 800 1200; else adb shell input draganddrop 760 1900 760 800 900; fi; sleep 2; }
          swipe_up() { adb shell input swipe 760 800 760 1900 400; sleep 1; }
          # scrollfind NAME CMD ARGS...: scroll the page down until `ui.py CMD out/NAME.xml ARGS...` answers (pos = its centre). Dumps are compared as the notify
          # and browser walks do: two dumps in a row identical = the page's end (the swipe gesture alternates, so a dud gesture is not taken for the end),
          # at most 25 swipes.
          scrollfind() { nm=$1; shift; pos=""; prev=""; same=0
            for i in $(seq 0 25); do
              awake; skipdlg; dumpto "out/$nm.xml"
              pos=$(python3 -I ui.py "$1" "out/$nm.xml" "${@:2}")
              [ -n "$pos" ] && { echo "scrollfind $nm: '$pos' after $i swipes"; return 0; }
              cur=$(md5sum < "out/$nm.xml")
              if [ "$cur" = "$prev" ]; then same=$((same+1)); [ "$same" -ge 2 ] && break; else same=0; fi
              prev=$cur; swipe_down "$i"
            done
            echo "scrollfind $nm: not found, end of page after $i swipes"; return 1; }
          # totop: swipe back up until two dumps in a row are identical (at most 25)
          totop() { prev=""; for _ in $(seq 1 25); do swipe_up; dumpto out/top.xml; cur=$(md5sum < out/top.xml); [ "$cur" = "$prev" ] && return 0; prev=$cur; done; }
          # collect NAME: from the page top to its end, every dump appended to out/NAME-all.xml; the first screen with the report's head is shot as NAME-report.png
          collect() { nm=$1; : > "out/$nm-all.xml"; prev=""; same=0; shot=0
            for i in $(seq 0 25); do
              awake; skipdlg; dumpto "out/$nm-s.xml"; cat "out/$nm-s.xml" >> "out/$nm-all.xml"
              [ "$shot" -eq 0 ] && grep -q 'Last change' "out/$nm-s.xml" && { adb exec-out screencap -p > "out/$nm-report.png"; shot=1; }
              cur=$(md5sum < "out/$nm-s.xml")
              if [ "$cur" = "$prev" ]; then same=$((same+1)); [ "$same" -ge 2 ] && break; else same=0; fi
              prev=$cur; swipe_down "$i"
            done; [ "$shot" -eq 1 ]; }
          # the Preset body (Sandboxes ...) drawn: wait, do not scroll
          bodywait() { for _ in 1 2 3 4 5 6; do awake; skipdlg; dumpto out/pm.xml; grep -q 'text="Sandboxes"' out/pm.xml && return 0; sleep 5; done; return 1; }
          tapmode() { pos=""; page presets; bodywait || { echo "the Preset body never drew"; return 1; }
            scrollfind pm contains "Banking Apps Mode" 300 2100 || { echo "no Banking Apps Mode tile"; return 1; }
            adb exec-out screencap -p > out/pm-tile.png
            adb shell input tap $pos; sleep 12; }
          before=$(a11y); echo "a11y before: $before"
          case "$before" in *LockScreen*) check ok "setup: the app's accessibility service is enabled";; *) check no "setup: accessibility service not enabled ($before)";; esac
          sec banking-1-security-before
          tapmode && { shoot banking-2-presets-on; adb shell input swipe 540 1800 540 900 400; sleep 2; shoot banking-2b-report-on; }
          during=$(a11y); echo "a11y during: $during"
          case "$during" in *LockScreen*) check no "Banking Apps Mode on: the accessibility entry is still there ($during)";; *) check ok "Banking Apps Mode on: the accessibility entry was removed ($during)";; esac
          grep -qi "Banking Apps Mode" out/banking-2-presets-on.xml && check ok "the Mode group shows Banking Apps Mode" || check no "Banking Apps Mode tile not on the Presets page"
          adb logcat -d | grep -i "pairing" | grep -vi "wd-keeper\|WdKeeper" > out/banking-pairing.log || true
          sec banking-3-security-during
          tapmode && { shoot banking-4-presets-off; adb shell input swipe 540 1800 540 900 400; sleep 2; shoot banking-4b-report-off; }
          after=$(a11y); echo "a11y after: $after"
          case "$after" in *LockScreen*) check ok "Banking Apps Mode off: the accessibility entry is back ($after)";; *) check no "Banking Apps Mode off: the entry did not come back ($after)";; esac
          sec banking-5-security-after
          [ -z "$(grep -i 'adb pairing\|pairing notification\|PairingNotif' out/banking-pairing.log)" ] && check ok "no ADB pairing prompt was raised during the walk" || check no "pairing activity during the walk"
          # ── #1847 the round trip proof: the tile reached by scrolling, the ON report per item, the Perms link, the OFF restore read back ──
          # What BankingMode writes: Settings.Global development_settings_enabled, adb_enabled, adb_wifi_enabled (WRITE_SECURE_SETTINGS, else the shell
          # broker only when already armed), the fleet's accessibility entry, the keep-alive switch and the overlay switches. adb_enabled=0 on an emulator
          # ends adbd and with it THIS walk's adb, so USB debugging (and the ADB shell item that rides on it) is in the skip list for the proof: the report
          # must list it as left alone and adb_enabled must be unchanged. Developer options and Wireless debugging are written for real and read back.
          g() { adb shell settings get global "$1" | tr -d '\r'; }
          adb_alive() { timeout 60 adb wait-for-device; [ "$(adb get-state 2>/dev/null | tr -d '\r')" = device ]; }
          setup_banking() { # $1 skip list, $2 grant | revoke WRITE_SECURE_SETTINGS
            adb shell am force-stop "$PKG"
            echo "<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\" ?><map><string name=\"skip\">$1</string></map>" > bm.xml
            adb push bm.xml /data/local/tmp/banking_mode.xml
            adb shell "run-as $PKG sh -c 'mkdir -p shared_prefs && cp /data/local/tmp/banking_mode.xml shared_prefs/banking_mode.xml'" || echo "run-as failed"
            adb shell pm $2 "$PKG" android.permission.WRITE_SECURE_SETTINGS || true
            adb shell settings put global development_settings_enabled 1
            adb shell am start -W -n "$ACT" >/dev/null; sleep 15; skipdlg
            adb shell settings put secure enabled_accessibility_services "$SVC"; adb shell settings put secure accessibility_enabled 1; sleep 3; }
          # wait_mode on|off: poll the tile's own label ("... on, tap to turn off") until the mode run has finished
          wait_mode() { for _ in 1 2 3 4 5 6 7 8; do sleep 5; awake; skipdlg; dumpto out/wm.xml; t=$(python3 -I ui.py textof out/wm.xml "Banking Apps Mode")
              case "$t" in "") ;; *"turn off"*) [ "$1" = on ] && return 0;; *) [ "$1" = off ] && return 0;; esac; done; return 1; }
          # report NAME: expand the applied steps ("All N steps"), then read the whole page, top to end, into out/NAME-all.xml
          report() { scrollfind "$1-f" match '^All [0-9]+ steps$' && { adb shell input tap $pos; sleep 2; }
            totop; collect "$1" && check ok "$1: the report is on the page" || check no "$1: no 'Last change' report on the page"; }
          item() { python3 -I ui.py verdict "out/$1-all.xml" "$2"; }
          want_item() { v=$(item "$1" "$2"); case " $4 " in *" $v "*) check ok "$1: $3 is $v";; *) check no "$1: $3 is '$v', want $4";; esac; }
          note_of() { python3 -I ui.py textof "out/$1-all.xml" "$2"; }
          pairing_free() { adb logcat -d | grep -i "pairing" | grep -vi "wd-keeper\|WdKeeper" | grep -i 'adb pairing\|pairing notification\|PairingNotif' > "out/banking-pairing-$1.log" || true
            [ ! -s "out/banking-pairing-$1.log" ] && check ok "$1: no ADB pairing prompt was raised" || check no "$1: pairing activity"; }

          # A. permission held: Developer options and Wireless debugging written for real, USB debugging left alone (the walk's own adb)
          setup_banking "usb_debugging,adb_shell" grant
          dev0=$(g development_settings_enabled); adb0=$(g adb_enabled); wifi0=$(g adb_wifi_enabled); a0=$(a11y)
          echo "A before: development_settings_enabled=$dev0 adb_enabled=$adb0 adb_wifi_enabled=$wifi0 a11y=$a0"
          [ "$dev0" = 1 ] && check ok "A setup: Developer options are on ($dev0)" || check no "A setup: Developer options not on ($dev0)"
          case "$a0" in *LockScreen*) check ok "A setup: the accessibility entry is there";; *) check no "A setup: no accessibility entry ($a0)";; esac
          if tapmode; then
            cp out/pm-tile.png out/banking-A1-tile.png; check ok "A1 the Banking Apps Mode tile was reached on Preset > Mode by scrolling"
          else check no "A1 the Banking Apps Mode tile was not reached"; fi
          wait_mode on && check ok "A the tile reads 'on, tap to turn off'" || check no "A the mode did not report itself on"
          adb_alive && check ok "A the walk's own adb survived the ON" || check no "A the adb link died on ON"
          dev1=$(g development_settings_enabled); adb1=$(g adb_enabled); wifi1=$(g adb_wifi_enabled); a1=$(a11y)
          echo "A on: development_settings_enabled=$dev1 adb_enabled=$adb1 adb_wifi_enabled=$wifi1 a11y=$a1"
          [ "$dev1" = 0 ] && check ok "A2 ON: development_settings_enabled $dev0 -> $dev1" || check no "A2 ON: development_settings_enabled is $dev1, want 0"
          [ "$adb1" = "$adb0" ] && check ok "A2 ON: adb_enabled left at $adb1 (skip list)" || check no "A2 ON: adb_enabled changed $adb0 -> $adb1"
          [ "$wifi0" = 1 ] && { [ "$wifi1" = 0 ] && check ok "A2 ON: adb_wifi_enabled 1 -> 0" || check no "A2 ON: adb_wifi_enabled is $wifi1, want 0"; } || { [ "$wifi1" = "$wifi0" ] && check ok "A2 ON: adb_wifi_enabled was already off ($wifi0), unchanged" || check no "A2 ON: adb_wifi_enabled $wifi0 -> $wifi1"; }
          case "$a1" in *LockScreen*) check no "A2 ON: the accessibility entry is still there ($a1)";; *) check ok "A2 ON: the accessibility entry was removed ($a1)";; esac
          adb exec-out screencap -p > out/banking-A2-on-state.png
          report banking-A-on; cp out/banking-A-on-report.png out/banking-A3-on-report.png 2>/dev/null || true
          want_item banking-A-on "Developer options off" "developer options" "done"
          want_item banking-A-on "USB debugging off" "USB debugging" "skipped"
          note_of banking-A-on "USB debugging off" | grep -qi "skip list" && check ok "A2 ON: the USB debugging row says it is left alone (skip list)" || check no "A2 ON: the USB debugging row does not say why"
          [ "$wifi0" = 1 ] && want_item banking-A-on "Wireless debugging off" "wireless debugging" "done" || want_item banking-A-on "Wireless debugging off" "wireless debugging (already off)" "skipped done"
          want_item banking-A-on "accessibility services off" "accessibility" "done"
          echo "SKIP A2 USB debugging flip (adb_enabled=0): on an emulator it ends adbd and this walk's own adb; the report row (left alone, skip list) and adb_enabled=$adb0 unchanged are asserted instead" | tee -a out/verdict.txt
          if tapmode; then check ok "A the tile is found again for the OFF"; else check no "A the tile is not found for the OFF"; fi
          wait_mode off && check ok "A the tile no longer reads on" || check no "A the mode did not report itself off"
          adb_alive && check ok "A the walk's own adb survived the OFF" || check no "A the adb link died on OFF"
          dev2=$(g development_settings_enabled); adb2=$(g adb_enabled); wifi2=$(g adb_wifi_enabled); a2=$(a11y)
          echo "A off: development_settings_enabled=$dev2 adb_enabled=$adb2 adb_wifi_enabled=$wifi2 a11y=$a2"
          [ "$dev2" = "$dev0" ] && check ok "A4 OFF: development_settings_enabled restored to $dev0" || check no "A4 OFF: development_settings_enabled is $dev2, was $dev0"
          [ "$adb2" = "$adb0" ] && check ok "A4 OFF: adb_enabled is $adb0" || check no "A4 OFF: adb_enabled is $adb2, was $adb0"
          [ "$wifi2" = "$wifi0" ] && check ok "A4 OFF: adb_wifi_enabled restored to $wifi0" || check no "A4 OFF: adb_wifi_enabled is $wifi2, was $wifi0"
          case "$a2" in *LockScreen*) check ok "A4 OFF: the accessibility entry is back ($a2)";; *) check no "A4 OFF: the accessibility entry did not come back ($a2)";; esac
          adb exec-out screencap -p > out/banking-A4-off-state.png
          report banking-A-off; cp out/banking-A-off-report.png out/banking-A5-off-report.png 2>/dev/null || true
          want_item banking-A-off "Developer options off" "developer options restore" "done"
          pairing_free A

          # B. no WRITE_SECURE_SETTINGS (the permission revoked): nothing Android lets the app change is changed; each item is "needs your tap" with
          #    its link, and the accessibility link opens the Perms page (PERMS_A11Y "perms:accessibility" through PermsLink)
          setup_banking "usb_debugging,adb_shell" revoke
          if adb shell dumpsys package "$PKG" | grep "android.permission.WRITE_SECURE_SETTINGS" | grep -q "granted=true"; then
            echo "SKIP B (needs-tap report and the Perms link): WRITE_SECURE_SETTINGS could not be revoked on this image" | tee -a out/verdict.txt
          else
            devB=$(g development_settings_enabled); aB=$(a11y); wifiB=$(g adb_wifi_enabled)
            tapmode && check ok "B1 the Banking Apps Mode tile was reached by scrolling" || check no "B1 the Banking Apps Mode tile was not reached"
            cp out/pm-tile.png out/banking-B1-tile.png
            wait_mode on && check ok "B the tile reads on" || check no "B the mode did not report itself on"
            adb_alive && check ok "B the walk's own adb survived" || check no "B the adb link died"
            [ "$(g development_settings_enabled)" = "$devB" ] && check ok "B ON: development_settings_enabled untouched ($devB): no channel to write it" || check no "B ON: development_settings_enabled changed without a channel"
            report banking-B-on; cp out/banking-B-on-report.png out/banking-B2-on-report.png 2>/dev/null || true
            want_item banking-B-on "Developer options off" "developer options" "tap"
            want_item banking-B-on "accessibility services off" "accessibility" "tap"
            want_item banking-B-on "USB debugging off" "USB debugging" "skipped"
            note_of banking-B-on "accessibility services off" | grep -q "open Settings" && check ok "B2 the accessibility row carries its link (open Settings)" || check no "B2 the accessibility row has no link"
            # the accessibility link: tap the row, land on the Perms page
            totop
            if scrollfind banking-B-link contains "accessibility services off" 300 2100; then
              adb shell input tap $pos; sleep 6; awake; skipdlg; dumpto out/banking-B3-perms.xml; adb exec-out screencap -p > out/banking-B3-perms.png
              if grep -q 'text="Sandboxes"' out/banking-B3-perms.xml; then check no "B3 tapping the accessibility link left the Preset page up"
              elif python3 -I ui.py contains out/banking-B3-perms.xml "Accessibility service" 0 3000 | grep -q . || python3 -I ui.py contains out/banking-B3-perms.xml "Grant all" 0 3000 | grep -q .; then check ok "B3 the accessibility link lands on the Perms page"
              else check no "B3 the accessibility link did not land on the Perms page; on screen: $(python3 -I ui.py texts out/banking-B3-perms.xml 2>/dev/null | head -c 300)"; fi
              adb shell input keyevent KEYCODE_BACK; sleep 2
            else check no "B3 the accessibility row was not found to tap"; fi
            tapmode && wait_mode off && check ok "B the tile no longer reads on" || check no "B the mode did not report itself off"
            [ "$(g development_settings_enabled)" = "$devB" ] && check ok "B4 OFF: development_settings_enabled is $devB (nothing was changed, nothing to restore)" || check no "B4 OFF: development_settings_enabled changed"
            case "$(a11y)" in *LockScreen*) check ok "B4 OFF: the accessibility entry is still there";; *) check no "B4 OFF: the accessibility entry went missing";; esac
            adb exec-out screencap -p > out/banking-B4-off-state.png
            pairing_free B
          fi
          cat out/verdict.txt
          [ "$fails" -eq 0 ]
          EOF2
          chmod +x walk.sh
      - name: Boot emulator and walk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash walk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-actions-evidence
          path: out/
          if-no-files-found: warn
