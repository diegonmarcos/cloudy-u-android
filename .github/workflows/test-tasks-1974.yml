name: "Test -> Cloud Tasks #1974/#1975 (Files, Backlog under Tasks, Home selection, trip roadmap; mutations + emulator shots)"

# #1974/#1975. Job `nav-tests`: test-tasks-1974-nav.sh (5 tests, 10 mutations), test-tasks-trip-parity.sh (4 tests, 7 mutations) and test-tasks-1964-nav.sh
# (4 tests, 7 mutations) each write a JUnit XML; the verdict is read from the XML, never from the script's exit code. Job `shots` (only when run_id is given):
# installs the x86_64 debug APK of a Ship run on an API-34 emulator and screenshots Home with a selection, Tasks > Backlog filtered, Files > RoadMap
# (with the trip section) and Files > Assets. Dispatch inputs reach the scripts through env only, behind an allow-list (digits).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Ship Cloud Tasks run whose x86_64 debug APK is screenshotted (digits; empty = tests only)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "ac_cloud-tasks/test/test-tasks-1964-nav.sh"
      - "ac_cloud-tasks/test/test-tasks-1974-nav.sh"
      - "ac_cloud-tasks/test/test-tasks-trip-parity.sh"
      - "ac_cloud-tasks/test/data/geo-trip-blocks-1975.json"
      - "ac_cloud-tasks/app/src/main/assets/trip-roadmap.json"
      - "ac_cloud-me/data/ui/pers/achieves/geo.json"
      - ".github/workflows/test-tasks-1974.yml"
      - "ac_cloud-tasks/build.json"
      - "ac_cloud-calc/build.json"
      - "ab_cloud-libs-shared/libs/clock-tools/**"

permissions:
  contents: read
  actions: read

jobs:
  nav-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests and their mutations (writes JUnit XML)
        run: |
          JUNIT_OUT="$RUNNER_TEMP/tasks-1974-nav.xml" bash ac_cloud-tasks/test/test-tasks-1974-nav.sh || true
          JUNIT_OUT="$RUNNER_TEMP/tasks-trip.xml" bash ac_cloud-tasks/test/test-tasks-trip-parity.sh || true
          JUNIT_OUT="$RUNNER_TEMP/tasks-1964-nav.xml" bash ac_cloud-tasks/test/test-tasks-1964-nav.sh || true
      - name: Verdict from the XML
        run: |
          python3 -I - "$RUNNER_TEMP/tasks-1974-nav.xml:5:10" "$RUNNER_TEMP/tasks-trip.xml:4:7" "$RUNNER_TEMP/tasks-1964-nav.xml:4:7" <<'PY'
          import sys, xml.etree.ElementTree as ET
          red = []
          for arg in sys.argv[1:]:
              path, nt, nm = arg.rsplit(":", 2)
              cases = ET.parse(path).getroot().findall("testcase")
              tests = [c for c in cases if c.get("classname") == "tests"]
              muts = [c for c in cases if c.get("classname") == "mutations"]
              for c in cases: print(("FAIL " if c.find("failure") is not None else "ok   ") + path.rsplit("/", 1)[-1] + " " + c.get("classname") + "/" + c.get("name"))
              red += [c.get("name") + ": " + c.find("failure").get("message") for c in cases if c.find("failure") is not None]
              if len(tests) != int(nt) or len(muts) != int(nm): red.append("%s: expected %s tests and %s mutations, got %d and %d" % (path, nt, nm, len(tests), len(muts)))
          if red: print("\n".join(red)); sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasks-1974-nav-xml
          path: ${{ runner.temp }}/tasks-*.xml

  shots:
    needs: nav-tests
    if: ${{ inputs.run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ID_INPUT: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK of the Ship run (run id allow-listed to digits)
        run: |
          set -eu
          case "$RUN_ID_INPUT" in ''|*[!0-9]*) echo "::error::run_id must be digits"; exit 1;; esac
          mkdir apk-in
          gh run download "$RUN_ID_INPUT" --repo "$GITHUB_REPOSITORY" --pattern 'Cloud-Tasks-x86_64-debug-*' --dir apk-in
          apk=$(find apk-in -name '*.apk' | sort | head -1)
          [ -n "$apk" ] || { echo "::error::no x86_64 APK in that run"; exit 1; }
          cp "$apk" app-under-test.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the scene script
        run: |
          cat > walk.sh <<'SH'
          #!/bin/bash
          set -u
          mkdir -p walk-out/shots
          PKG=com.diegonmarcos.cloudagenda
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          sleep 40
          adb install -r -g app-under-test.apk || { echo "::error::adb install failed"; exit 2; }
          shot() { adb exec-out screencap -p > "walk-out/shots/tasks-1974-$1.png"; }
          dump() { for t in 1 2 3 4; do adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb exec-out cat /sdcard/ui.xml > walk-out/ui.xml; grep -q "<hierarchy" walk-out/ui.xml && break; sleep 2; done; }
          tap() { # tap the first node whose text or content-desc is exactly $1
            dump
            xy=$(python3 -I - walk-out/ui.xml "$1" <<'PY'
          import re, sys
          x = open(sys.argv[1], encoding="utf-8").read()
          for m in re.finditer(r'<node\b[^>]*>', x):
              n = m.group(0)
              t = re.search(r'\btext="([^"]*)"', n); d = re.search(r'content-desc="([^"]*)"', n); b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
              if b and ((t and t.group(1) == sys.argv[2]) or (d and d.group(1) == sys.argv[2])):
                  a, bb, c, dd = map(int, b.groups()); print((a + c) // 2, (bb + dd) // 2); break
          PY
          )
            echo "tap '$1' -> '${xy:-NOT FOUND}'" | tee -a walk-out/summary.txt
            [ -n "$xy" ] && adb shell input tap $xy
            sleep 3
          }
          adb shell am force-stop $PKG
          adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
          sleep 15
          tap None; tap Galaxy; shot 01-home-selection-galaxy
          tap Tasks; sleep 3; shot 02-tasks-backlog-filtered
          tap Files; sleep 3; shot 03-files-roadmap
          cp walk-out/shots/tasks-1974-03-files-roadmap.png walk-out/shots/tasks-1975-roadmap.png
          tap Assets; sleep 2; tap 1842; shot 04-files-assets
          timeout 60 adb logcat -d -v threadtime "*:E" > walk-out/logcat-errors.txt || true
          SH
          chmod +x walk.sh
      - name: Boot emulator + scenes
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh
      - name: Upload the PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-1974-shots
          path: |
            walk-out/shots/*.png
            walk-out/summary.txt
            walk-out/ui-launch.xml
            walk-out/logcat-errors.txt
          if-no-files-found: warn
