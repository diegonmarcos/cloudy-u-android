name: "Ship → Cloud Mail (build + publish to GHCR)"

# Independent per-app workflow for Cloud Mail (Fairmail fork).
# Engine: 1_cicd/src/scripts/cloud-mail-engine.sh (symlinked as ac_cloud-mail/build.sh).
# Per-app build.json at ac_cloud-mail/build.json. OUR code: the gradle project is ac_cloud-mail/ itself (app/, build.gradle at its root) — no upstream/ subdir, no patch series.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-mail/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-mail.yml"
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/scripts/cloud-mail-engine.sh"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/databackend/**"
      - "ab_cloud-libs-shared/libs/decisions-link/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleet-data-client/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints-android/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints/**"
      - "ab_cloud-libs-shared/libs/fleet-notify/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-agents/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-logcat/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-xray/**"
      - "ab_cloud-libs-shared/libs/mail-core-rs/**"
      - "ab_cloud-libs-shared/libs/ml-l-image/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/text-tools/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ab_cloud-libs-shared/libs/updater/**"
      - "ab_cloud-libs-shared/libs/web-core/**"
      - "ac_cloud-mail/**"
      - "!ab_cloud-libs-shared/libs/**/*.md"
      - "ab_cloud-libs-shared/libs/bottomnav/**/assets/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**/res/**"
      - "ab_cloud-libs-shared/libs/core/**/assets/**"
      - "ab_cloud-libs-shared/libs/core/**/res/**"
      - "ab_cloud-libs-shared/libs/crash/**/assets/**"
      - "ab_cloud-libs-shared/libs/crash/**/res/**"
      - "ab_cloud-libs-shared/libs/databackend/**/assets/**"
      - "ab_cloud-libs-shared/libs/databackend/**/res/**"
      - "ab_cloud-libs-shared/libs/decisions-link/**/assets/**"
      - "ab_cloud-libs-shared/libs/decisions-link/**/res/**"
      - "ab_cloud-libs-shared/libs/devtools/**/assets/**"
      - "ab_cloud-libs-shared/libs/devtools/**/res/**"
      - "ab_cloud-libs-shared/libs/fleet-data-client/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleet-data-client/**/res/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints-android/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints-android/**/res/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints/**/res/**"
      - "ab_cloud-libs-shared/libs/fleet-notify/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleet-notify/**/res/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**/res/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-agents/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-agents/**/res/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-logcat/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-logcat/**/res/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-xray/**/assets/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-xray/**/res/**"
      - "ab_cloud-libs-shared/libs/mail-core-rs/**/assets/**"
      - "ab_cloud-libs-shared/libs/mail-core-rs/**/res/**"
      - "ab_cloud-libs-shared/libs/ml-l-image/**/assets/**"
      - "ab_cloud-libs-shared/libs/ml-l-image/**/res/**"
      - "ab_cloud-libs-shared/libs/perms/**/assets/**"
      - "ab_cloud-libs-shared/libs/perms/**/res/**"
      - "ab_cloud-libs-shared/libs/text-tools/**/assets/**"
      - "ab_cloud-libs-shared/libs/text-tools/**/res/**"
      - "ab_cloud-libs-shared/libs/theme-background/**/assets/**"
      - "ab_cloud-libs-shared/libs/theme-background/**/res/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**/assets/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**/res/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**/assets/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**/res/**"
      - "ab_cloud-libs-shared/libs/updater/**/assets/**"
      - "ab_cloud-libs-shared/libs/updater/**/res/**"
      - "ab_cloud-libs-shared/libs/web-core/**/assets/**"
      - "ab_cloud-libs-shared/libs/web-core/**/res/**"
      - "!ab_cloud-libs-shared/libs/fleetconfig-model/src/main/assets/fleet-config.json"
permissions:
  contents: write   # gh release create (RSS feed entries)
  packages: write   # ghcr push (oras)

concurrency:
  group: ship-cloud-mail-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-mail
  FORK: mail
  # #1837 the Rust mail core (libs:mail-core-rs) is REQUIRED on CI: a build without cargo or the NDK fails instead of shipping
  # an APK on the Kotlin fallback. The APK's ABI and the emulator's are built (build.gradle reads MAIL_CORE_ABIS).
  MAIL_CORE_RS_REQUIRED: "1"
  MAIL_CORE_ABIS: "arm64-v8a,x86_64"

jobs:
  build_and_publish:
    outputs:
      # read by launch_smoke: false when the publish gate skipped the build
      built: ${{ steps.gate.outputs.skip != 'true' }}
    name: "Materialize + build + publish (mail · ${{ matrix.combo.abi }})"
    strategy:
      fail-fast: false
      matrix:
        combo: [{fork: "mail", abi: "arm64-v8a"}]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMS_BUNDLE_ABI: ${{ matrix.combo.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}

      # ── #1837 THE RUST MAIL CORE (libs:mail-core-rs): toolchain read from build.json::native_core.toolchain, then its own suite ──
      # Same pattern as Cloud Drive's core (#1729): cargo + the NDK clang (linker and C compiler: the bundled SQLite), one .so per
      # ABI, loaded by JNI. The suite runs on EVERY run, gate or not: the store == the fake JMAP server after the initial sync,
      # new mail, deletes / moves, an injected gap and a lost history, plus the performance budgets (list < 150 ms over 10k
      # messages, 1,000 headers synced < 5 s).
      - name: Resolve the native core toolchain (build.json::native_core.toolchain)
        id: native
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -eu
          targets="$(jq -r '.native_core.toolchain.rust_targets | join(",")' build.json)"
          ndk="$(jq -r '.native_core.toolchain.ndk' build.json)"
          [ -n "$targets" ] && [ "$ndk" != "null" ] || { echo "::error::build.json::native_core.toolchain is incomplete"; exit 1; }
          { echo "targets=$targets"; echo "ndk=$ndk"; } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.native.outputs.targets }}

      - name: "Test → the Rust mail core (cargo test, fake JMAP server, performance budgets)"
        working-directory: ab_cloud-libs-shared/libs/mail-core-rs
        run: cargo test -- --nocapture

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.combo.abi }}"

      # Static assertions, and they run BEFORE anything is built: they need no
      # JDK, no vault, no gradle, and finish in seconds, so a wiring regression
      # fails the job in under a minute instead of after a 30-minute build.
      #
      # DELIBERATELY NOT gated on steps.gate.outputs.skip. The publish gate
      # answers "would these bytes differ?", which is the right question for
      # publishing and the wrong one for testing — a change to a tester itself
      # does not move the APK, and skipping the suite there would mean a new
      # assertion could land without ever executing once.
      - name: Shell testers (static assertions — fatal on failure)
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"

      - name: Guard against assertions that cannot fail
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint "$WORK_DIR"

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      # #1837 the NDK libs:mail-core-rs links the Rust core with (its build.gradle reads ANDROID_NDK_HOME); the pinned version
      # from build.json::native_core.toolchain.ndk, installed unless the runner image already carries it.
      - name: Point the build at the NDK (build.json::native_core.toolchain.ndk)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eu
          ndk="${{ steps.native.outputs.ndk }}"
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          fi
          [ -x "$ANDROID_HOME/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ] || { echo "::error::NDK $ndk is not installed"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Materialize fork (clone @ pin + patch series)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Generate build stamp (baked into APK BuildConfig AND release tag)
        if: steps.gate.outputs.skip != 'true'
        run: |
          # #1783 P5: the SOURCE commit time, not the wall clock: the same commit always builds the same version code and tag
          echo "COMMS_BUILD_TIMESTAMP=$(TZ=UTC git show -s --date=format-local:'%Y%m%d.%H%M%S' --format=%cd HEAD)" >> "$GITHUB_ENV"

      # The JVM unit test source set. NO EMULATOR: src/test/ runs on the
      # runner's own JVM — only src/androidTest/ needs a device, and that suite
      # has its own workflow. Placed before the assemble so a failing assertion
      # stops the job before it spends the signing and publish steps.
      #
      # Gated on the publish gate, unlike the shell testers above: this task
      # compiles and runs 751 test classes, so when the gate has already proved
      # the source did not move, re-running them buys nothing for the minutes
      # it costs on a shared runner.
      - name: JVM unit tests (fatal on failure)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}
        env:
          BYPASS_NIX: "1"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"

      - name: Build fork APK (fork's own gradle wrapper + constellation signing)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          COMMS_BUILD_TIMESTAMP: ${{ env.COMMS_BUILD_TIMESTAMP }}
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: "Rust mail core: libmail_core.so is in the APK, with its size (#1837)"
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -eu
          apk="${{ env.WORK_DIR }}/dist/cloud-comms-mail.apk"
          ls -l "$apk"
          unzip -lv "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libmail_core\.so' || { echo "::error::$apk carries no libmail_core.so: the Rust mail core did not ship"; exit 1; }

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-mail" ${{ env.WORK_DIR }}/dist/cloud-comms-mail.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload fork APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-comms-mail-${{ matrix.combo.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/cloud-comms-mail.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish fork APK to GHCR
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$FORK"

      - name: Create GitHub Release (RSS update notification)
        if: ${{ steps.gate.outputs.skip != 'true' && (success() && matrix.combo.abi == 'arm64-v8a') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="cloud-comms-mail-${COMMS_BUILD_TIMESTAMP}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && { echo "release $TAG exists (same source commit)"; exit 0; }
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Cloud Mail · ${{ env.COMMS_BUILD_TIMESTAMP }}" \
            --notes "New build published to ghcr.io/diegonmarcos/cloud-comms-mail:latest — install via Cloud Mail → About → Check for updates." \
            --latest=false \
            "${{ env.WORK_DIR }}/dist/cloud-comms-mail.apk"

      # Rolling 'latest' release: upload the APK under its own name so
      # /releases/latest/download/cloud-comms-mail.apk is a stable install URL
      # (aa_cloud-superapp ui.external_apps[cloud-mail].install_apk_url).
      # Engine step reads build.json::release.gh_release (rolling_tag=latest).
      - name: Publish fork APK to rolling 'latest' release (stable install URL)
        id: publish
        # `success()` removed, not lost: GitHub applies it implicitly to any `if:`
        # that names no status function, so this condition means exactly what it
        # did. It has to go because the published-nothing guard is HANDED this
        # expression as an argument, and a status function is only legal inside an
        # `if:` — leaving it made six ship workflows fail to parse at all, which
        # GitHub reports by showing the run under the FILENAME instead of the name.
        if: ${{ steps.gate.outputs.skip != 'true' && matrix.combo.abi == 'arm64-v8a' }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release-fork "$FORK"

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-mail" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && matrix.combo.abi == 'arm64-v8a' }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.combo.abi }}"

  # Install the APK this run just built on an emulator and launch it: a crash at startup fails
  # Ship (1_cicd/src/cicd/test-launch-smoke.yml). A job of this run, not a workflow_run listener,
  # so it cannot fail to trigger.
  launch_smoke:
    needs: build_and_publish
    if: needs.build_and_publish.outputs.built == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-launch-smoke.yml
    with:
      app: cloud-mail
      artifact_prefix: cloud-comms-mail-
      api_levels: "[34]"
