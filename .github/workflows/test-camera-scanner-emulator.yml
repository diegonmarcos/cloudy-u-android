# #1839 Cloud Camera Scanner on an emulator: the walk that proves what the ticket shipped.
# Runs the x86_64 APK a Ship Cloud Camera run built (plus the image engine APK, for OCR) and checks, one PASS/FAIL line each:
#   1. Scanner is the fifth bottom-nav item (build.json declaration, and the island on screen), and its tap opens ScannerActivity;
#   2. the Camera page shows the Filters button (filters_option), and its tap opens the Filters/VR screen (vr_status);
#   3. a generated document photo (white page, black text, slightly rotated, dark background) pushed to Pictures, media-scanned,
#      is imported through the Scanner's Import button and the system picker (ScannerActivity is exported=false and takes
#      no ACTION_SEND/VIEW, so the picker is the only way in);
#   4. edge detection finds a quad hugging the page (cyan corner overlay measured in the screenshot) and the Frame tab's corner editor is shown;
#   5. each filter (B&W, Grayscale, Colour, Original) is applied, with a screenshot of each;
#   6. A4 is chosen on the Size tab;
#   7. Export > PDF > Save through the system "save as" picker; the PDF is pulled with adb and must start with %PDF, have one page,
#      a 595x842 pt page (A4), and a text layer (OCR through the image engine) holding a known word of the test page.
# Evidence: camera-scanner-evidence (PNGs, uiautomator XML, the PDF, verdict.txt). The job fails on any FAIL.
name: "Test -> Cloud Camera Scanner (emulator)"

on:
  workflow_dispatch:
    inputs:
      camera_run_id:
        description: "Ship Cloud Camera run id whose x86_64 APK artifact to test"
        required: true
      libs_run_id:
        description: "Ship Cloud Libs run id whose image engine APK artifact to use for OCR (empty = release asset)"
        required: false
        default: ""
      release_tag:
        description: "Release to download the engine from when libs_run_id is empty"
        required: false
        default: "latest"

permissions:
  contents: read
  actions: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout the nav declaration
        uses: actions/checkout@v4
        with:
          sparse-checkout: ac_cloud-camera/build.json
          sparse-checkout-cone-mode: false

      - name: Fetch the Cloud Camera and engine APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          C_RUN: ${{ inputs.camera_run_id }}
          L_RUN: ${{ inputs.libs_run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p apk/cam apk/lib
          gh api "repos/$REPO/actions/runs/$C_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-Camera-")) | .name' |
          while read -r name; do gh run download "$C_RUN" -R "$REPO" -n "$name" -D "apk/cam/$name"; done
          if [ -n "$L_RUN" ]; then
            gh api "repos/$REPO/actions/runs/$L_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-Libs-")) | .name' |
            while read -r name; do gh run download "$L_RUN" -R "$REPO" -n "$name" -D "apk/lib/$name"; done
          else
            gh release download "${TAG:-latest}" -R "$REPO" -p 'Cloud-Lib-Ml-L-Image-Mlkit.apk' -D apk/lib
          fi
          cam=""
          for want in x86_64 universal ''; do
            cam=$(find apk/cam -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$cam" ] && break
          done
          eng=$(find apk/lib -name 'Cloud-Lib-Ml-L-Image-Mlkit*.apk' | head -1 || true)
          [ -n "$cam" ] && [ -n "$eng" ] || { echo "::error::missing an APK (camera='$cam' engine='$eng')"; exit 1; }
          cp "$cam" camera.apk; cp "$eng" engine.apk
          ls -l camera.apk engine.apk

      - name: Fixture tools (Pillow, fonts)
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q python3-pil fonts-dejavu-core >/dev/null
          python3 -I -c 'import PIL; print("Pillow", PIL.__version__)'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the scripts
        run: |
          # fixture.py: a white page with black text, drawn slightly rotated on a dark background (a phone photo of a document).
          cat > fixture.py <<'PY'
          import glob, sys
          from PIL import Image, ImageDraw, ImageFont
          def font(size, *names):
              for n in names:
                  for p in glob.glob("/usr/share/fonts/**/" + n, recursive=True):
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default(size)
          bold = lambda s: font(s, "DejaVuSans-Bold.ttf", "LiberationSans-Bold.ttf")
          reg = lambda s: font(s, "DejaVuSans.ttf", "LiberationSans-Regular.ttf")
          page = Image.new("RGBA", (1000, 1350), (250, 238, 200, 255))
          d = ImageDraw.Draw(page)
          d.text((70, 90), "INVOICE 0042", fill=(200, 0, 0), font=bold(90))
          y = 290
          for line in ("Cloud Scanner test page", "Coffee 2.50", "Bread 3.20", "Total 5.70", "Thank you for visiting"):
              d.text((70, y), line, fill=(0, 0, 0), font=reg(66)); y += 150
          rot = page.rotate(5, expand=True, resample=Image.BICUBIC)
          bg = Image.new("RGB", (1500, 2000), (35, 35, 40))
          bg.paste(rot, ((1500 - rot.width) // 2, (2000 - rot.height) // 2), rot)
          bg.save(sys.argv[1])
          print("fixture", bg.size)
          PY
          # ui.py: read a uiautomator dump. Nodes with zero-size bounds (a row scrolled out of view) are skipped.
          cat > ui.py <<'PY'
          import html, re, sys
          def nodes(path):
              x = open(path, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r"<node [^>]*>", x):
                  a = {k: html.unescape(v) for k, v in re.findall(r'([\w-]+)="([^"]*)"', m.group(0))}
                  b = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", a.get("bounds", ""))
                  if b: a["_b"] = tuple(map(int, b.groups())); yield a
          def onscreen(a): x1, y1, x2, y2 = a["_b"]; return x2 > x1 and y2 > y1
          def centre(a): x1, y1, x2, y2 = a["_b"]; return "%d %d" % ((x1 + x2) // 2, (y1 + y2) // 2)
          def order(hits): return sorted(hits, key=lambda a: (a["_b"][1], a["_b"][0]))
          cmd, path = sys.argv[1], sys.argv[2]
          ns = [a for a in nodes(path) if onscreen(a)]
          if cmd == "text":        # ui.py text dump.xml "Label" [n]: n-th node whose text or content-desc is Label (case-insensitive)
              want = sys.argv[3].strip().lower(); n = int(sys.argv[4]) if len(sys.argv) > 4 else 0
              hits = order(a for a in ns if want in (a.get("text", "").strip().lower(), a.get("content-desc", "").strip().lower()))
              print(centre(hits[n]) if len(hits) > n else "")
          elif cmd == "starts":    # ui.py starts dump.xml "Prefix": first node whose text starts with Prefix (Skip, "Skip (don't ask again)")
              want = sys.argv[3].lower()
              hits = order(a for a in ns if a.get("text", "").strip().lower().startswith(want))
              print(centre(hits[0]) if hits else "")
          elif cmd == "id":        # ui.py id dump.xml suffix: first node whose resource-id is, or ends with :id/, suffix
              want = sys.argv[3]
              hits = order(a for a in ns if a.get("resource-id", "") == want or a.get("resource-id", "").endswith(":id/" + want))
              print(centre(hits[0]) if hits else "")
          elif cmd == "has":       # ui.py has dump.xml "Label": how many nodes carry Label as text or content-desc
              want = sys.argv[3].strip().lower()
              print(sum(1 for a in ns if want in (a.get("text", "").strip().lower(), a.get("content-desc", "").strip().lower())))
          elif cmd == "texts":     # ui.py texts dump.xml: every text and content-desc on screen, for the log
              print(" | ".join(t for a in ns for t in (a.get("text", ""), a.get("content-desc", "")) if t.strip())[:1500])
          elif cmd == "island":    # ui.py island dump.xml: "N x y" = the island's item count and the fifth item's centre
              # The items are content-desc nodes (QR CODE, OBJECTS, CAMERA, VIDEO, Scanner); the selected one is not clickable,
              # so count by content-desc, not by clickable. The icon's centre lies inside its clickable cell.
              isl = [a for a in ns if a.get("resource-id", "").endswith("camera_mode_island")]
              if not isl: print("0 0 0"); sys.exit()
              x1, y1, x2, y2 = isl[0]["_b"]
              kids = sorted((a for a in ns if a is not isl[0] and a.get("content-desc", "").strip()
                             and a["_b"][0] >= x1 and a["_b"][2] <= x2 and a["_b"][1] >= y1 and a["_b"][3] <= y2), key=lambda a: a["_b"][0])
              if len(kids) >= 5: c = centre(kids[4]); print(len(kids), c)
              else:   # items not readable: the fifth of five equal cells between the island's padded ends (108..972 of 1080)
                  w = x2 - x1; print(0, x1 + w // 10 + (w * 8 // 10) * 9 // 10, (y1 + y2) // 2)
          PY
          # stage.py: measure the Scanner's image stage (between the page strip and the tab row) in a screenshot.
          #   stage.py frame  shot.png dump.xml dpi        the cyan corner quad must hug the page (light region), not the whole photo
          #   stage.py filter shot.png dump.xml dpi mono|colour|any   mono: no coloured pixels; colour: the cream page keeps its colour
          cat > stage.py <<'PY'
          import re, sys
          from PIL import Image
          sys.path.insert(0, ".")
          cmd, shot, dump, dpi = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
          x = open(dump, encoding="utf-8", errors="replace").read()
          def top_of(label, bottom=False):
              for m in re.finditer(r'<node [^>]*text="%s"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"' % re.escape(label), x):
                  return int(m.group(4 if bottom else 2))
          im = Image.open(shot).convert("RGB"); W, H = im.size
          y0 = (top_of("Import", True) or int(H * 0.08)) + int(102 * dpi / 160)
          y1 = top_of("Frame") or top_of("Filter") or int(H * 0.7)
          st = im.crop((0, y0, W, y1)); sw, sh = st.size
          px = st.load(); step = 2
          cy = []; light = []; col = 0; tot = 0
          for j in range(0, sh, step):
              for i in range(0, sw, step):
                  r, g, b = px[i, j]; tot += 1
                  if abs(r - 79) < 28 and abs(g - 195) < 28 and abs(b - 247) < 28: cy.append((i, j)); continue
                  if min(r, g, b) > 200: light.append((i, j))
                  if max(r, g, b) - min(r, g, b) > 25: col += 1
          def box(p): return (min(i for i, _ in p), min(j for _, j in p), max(i for i, _ in p), max(j for _, j in p)) if p else None
          if cmd == "frame":
              cb, lb = box(cy), box(light)
              if len(cy) < 150 or not lb: print("no cyan=%d light=%d stage=%dx%d" % (len(cy), len(light), sw, sh)); sys.exit()
              tol = 0.06
              dev = max(abs(cb[0] - lb[0]) / sw, abs(cb[2] - lb[2]) / sw, abs(cb[1] - lb[1]) / sh, abs(cb[3] - lb[3]) / sh)
              slant = len({p for p in cy if p[1] < cb[1] + 4}) > 0
              print(("ok" if dev <= tol else "no") + " cyan=%d quad=%s page=%s maxdev=%.3f tol=%.2f stage=%dx%d" % (len(cy), cb, lb, dev, tol, sw, sh))
          else:
              expect = sys.argv[5]; lf = len(light) / tot; cf = col / tot
              good = lf > 0.15 and (cf < 0.002 if expect == "mono" else cf > 0.05 if expect == "colour" else True)
              print(("ok" if good else "no") + " light=%.3f coloured=%.4f expect=%s" % (lf, cf, expect))
          PY
          # pdfcheck.py: the exported PDF, read as raw bytes. Writes key=value facts.
          cat > pdfcheck.py <<'PY'
          import re, sys
          d = open(sys.argv[1], "rb").read()
          f = {"size": len(d), "header": d.startswith(b"%PDF")}
          f["count"] = len(re.findall(rb"/Type\s*/Page(?![s\w])", d))
          m = re.search(rb"/Type\s*/Pages\b[^>]*?/Count\s+(\d+)", d)
          f["declared"] = int(m.group(1)) if m else -1
          f["boxes"] = [tuple(float(v) for v in b) for b in re.findall(rb"/MediaBox\s*\[\s*([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s*\]", d)]
          f["boxes"] = [(b[2] - b[0], b[3] - b[1]) for b in f["boxes"]]
          words = []
          for s in re.findall(rb"\(((?:[^()\\]|\\.)*)\)\s*Tj", d):
              words.append(re.sub(rb"\\(.)", rb"\1", s).decode("latin-1"))
          f["text"] = " ".join(words)
          for k, v in f.items(): print("%s=%s" % (k, v))
          PY
          cat > shoot.sh <<'EOF2'
          set -u
          OUT=out; mkdir -p "$OUT"; : > "$OUT/verdict.txt"
          fails=0
          rec() { echo "$1 $2" | tee -a "$OUT/verdict.txt"; }
          check() { if [ "$1" = ok ]; then rec PASS "$2"; else rec FAIL "$2"; fails=$((fails+1)); fi; }
          skip() { rec SKIP "$1"; }
          adb install -r -g engine.apk || exit 2
          adb install -r -g camera.apk || exit 2
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PKG=$("$aapt2" dump packagename camera.apk)
          ACT=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tr -d '\r' | tail -1)
          echo "camera=$PKG ($ACT)"
          DPI=$(adb shell wm density | tr -d '\r' | sed -n 's/.*: \([0-9]*\)$/\1/p' | tail -1); DPI=${DPI:-420}
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global window_animation_scale 0; adb shell settings put global transition_animation_scale 0
          adb shell settings put system screen_off_timeout 2147483647; adb shell svc power stayon true
          adb shell locksettings set-disabled true || true
          adb shell settings put global cloud_perms_first_run 0 || true
          for k in screensaver_enabled screensaver_activate_on_sleep screensaver_activate_on_dock; do adb shell settings put secure $k 0 || true; done
          adb shell settings put global stay_on_while_plugged_in 7 || true
          awake() { adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard; adb shell input keyevent 82; }
          # A screensaver ("Unlock") or the first-start "Install unknown apps" ask can cover the page: take it down before reading or tapping.
          # The ask's button is "Skip", or "Skip (don't ask again)" on its last ask, so match the prefix.
          uncover() { for _ in 1 2 3; do adb shell uiautomator dump /sdcard/u0.xml >/dev/null 2>&1; adb pull /sdcard/u0.xml u0.xml >/dev/null 2>&1
            u=$(python3 -I ui.py text u0.xml Unlock)
            [ -z "$u" ] && grep -q 'text="Install unknown apps"' u0.xml && u=$(python3 -I ui.py starts u0.xml Skip)
            # a system "X isn't responding" dialog (Pixel Launcher on these runners, #1805/#1804) swallows every tap: answer Wait
            [ -z "$u" ] && grep -q "isn't responding\|isn&apos;t responding" u0.xml && u=$(python3 -I ui.py text u0.xml Wait)
            [ -z "$u" ] && return 0; adb shell input tap $u; sleep 2; done; }
          dump() { awake; uncover; for _ in 1 2 3; do r=$(adb shell uiautomator dump /sdcard/ui.xml 2>&1 | tr -d '\r'); case "$r" in *dumped*) break;; esac; sleep 1; done
            adb pull /sdcard/ui.xml "$OUT/$1.xml" >/dev/null 2>&1; }
          shot() { awake; sleep 1; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          tap_text() { for _ in 1 2 3 4; do dump _t; xy=$(python3 -I ui.py text "$OUT/_t.xml" "$1"); [ -n "$xy" ] && { adb shell input tap $xy; echo "tapped '$1' at $xy"; return 0; }; sleep 2; done
            echo "no node '$1'; on screen: $(python3 -I ui.py texts "$OUT/_t.xml")"; return 1; }
          tap_id() { for _ in 1 2 3 4; do dump _t; xy=$(python3 -I ui.py id "$OUT/_t.xml" "$1"); [ -n "$xy" ] && { adb shell input tap $xy; echo "tapped id '$1' at $xy"; return 0; }; sleep 2; done
            echo "no id '$1'; on screen: $(python3 -I ui.py texts "$OUT/_t.xml")"; return 1; }
          on_scanner() { for _ in 1 2 3 4 5 6; do adb shell dumpsys activity activities | tr -d '\r' | grep -E "topResumedActivity|ResumedActivity" | grep -q "scanner.ScannerActivity" && return 0; sleep 2; done; return 1; }
          app_up() { adb shell dumpsys activity activities | tr -d '\r' | grep -E "topResumedActivity|ResumedActivity" | grep -q "$PKG/"; }
          # ensure_app: the camera must be the resumed app (not the launcher, its long-press menu, or a not-responding dialog) before a step
          ensure_app() { for _ in 1 2 3; do uncover; app_up && return 0; adb shell input keyevent KEYCODE_HOME; sleep 1; adb shell am start -W -n "$ACT" >/dev/null; sleep 4; done; uncover; app_up; }
          launch() { uncover; adb shell am force-stop "$PKG"; adb shell am start -W -n "$ACT" >/dev/null; sleep 8; ensure_app || echo "warn: $PKG is not the resumed activity"; }
          # open_scanner: tap the island's fifth slot (read from the dump); sets ISLAND_N (items read, 0 = unreadable)
          # then checks ScannerActivity is resumed, and retries the tap once if not
          open_scanner() { for try in 1 2; do ensure_app; dump nav; set -- $(python3 -I ui.py island "$OUT/nav.xml"); ISLAND_N=$1; echo "island items=$1 fifth=($2,$3) try=$try"
              adb shell input tap "$2" "$3"; sleep 3; on_scanner && return 0; done; return 1; }

          # ── the fixture on the phone: Pictures + media scan, read back from MediaStore ──
          python3 -I fixture.py "$OUT/scan-test-page.png" || exit 2
          adb push "$OUT/scan-test-page.png" /sdcard/Pictures/scan-test-page.png >/dev/null
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Pictures/scan-test-page.png >/dev/null
          indexed=no
          for _ in $(seq 1 15); do adb shell content query --uri content://media/external/images/media --projection _display_name 2>/dev/null | grep -q scan-test-page.png && { indexed=yes; break; }; sleep 2; done
          [ "$indexed" = yes ] && check ok "3 the test page is in Pictures and media-scanned (MediaStore lists scan-test-page.png)" || check no "3 the test page never reached MediaStore"

          # ── 1. Scanner is the fifth nav item and opens ScannerActivity ──
          decl=$(python3 -I -c 'import json; print(",".join(json.load(open("ac_cloud-camera/build.json"))["ui"]["bottom_nav"]))')
          launch; shot camera-page; dump camera-page
          open_scanner; sleep 1; shot scanner-open; dump scanner-open
          if on_scanner; then opened=yes; else opened=no; fi
          if [ "$decl" = "qr_scan,objects,photo,video,scanner" ] && [ "$opened" = yes ] && [ "$ISLAND_N" -eq 5 ]; then
            check ok "1 Scanner is the fifth bottom-nav item (build.json: $decl; island items read: $ISLAND_N, tapped at the fifth item) and its tap opens ScannerActivity"
          else check no "1 bottom_nav='$decl' island items=$ISLAND_N ScannerActivity opened=$opened"; fi
          adb shell input keyevent KEYCODE_BACK; sleep 3

          # ── 2. the Filters button on the Camera page opens the Filters/VR screen ──
          ensure_app; dump camera-back
          if [ -n "$(python3 -I ui.py id "$OUT/camera-back.xml" filters_option)" ]; then check ok "2 the Camera page shows the Filters button (filters_option)"; else check no "2 no Filters button on the Camera page: $(python3 -I ui.py texts "$OUT/camera-back.xml")"; fi
          tap_id filters_option; sleep 6; shot filters-screen; dump filters-screen
          vr=$(python3 -I ui.py id "$OUT/filters-screen.xml" vr_status); gone=$(python3 -I ui.py id "$OUT/filters-screen.xml" filters_option)
          if [ -n "$vr" ] && [ -z "$gone" ]; then check ok "2 tapping Filters opens the Filters/VR screen (vr_status on screen, the button hidden on the page itself)"
          else check no "2 Filters tap: vr_status='$vr' filters_option still shown='$gone'; on screen: $(python3 -I ui.py texts "$OUT/filters-screen.xml")"; fi

          # ── 3. import the test page through the Scanner's Import button and the system picker ──
          launch; open_scanner || echo "warn: ScannerActivity did not open for the import step"; sleep 2
          tap_text Import; sleep 4; shot picker; dump picker
          picked=no
          for attempt in 1 2 3 4; do
            dump picker
            if grep -q 'providers.media' "$OUT/picker.xml" && xy=$(python3 -I ui.py id "$OUT/picker.xml" icon_thumbnail) && [ -n "$xy" ]; then
              echo "photo picker: first thumbnail at $xy"; adb shell input tap $xy; sleep 2; dump picker
              for b in button_add Add Select; do a=$(python3 -I ui.py id "$OUT/picker.xml" "$b"); [ -z "$a" ] && a=$(python3 -I ui.py text "$OUT/picker.xml" "$b"); [ -n "$a" ] && { adb shell input tap $a; break; }; done
              picked=yes; break
            fi
            xy=$(python3 -I ui.py text "$OUT/picker.xml" scan-test-page.png)
            if [ -n "$xy" ]; then
              echo "documents picker: file at $xy"; adb shell input tap $xy; sleep 3; dump picker
              a=$(python3 -I ui.py text "$OUT/picker.xml" Open); [ -n "$a" ] && adb shell input tap $a
              picked=yes; break
            fi
            for root in Images Downloads; do
              d=$(python3 -I ui.py text "$OUT/picker.xml" "Show roots"); [ -n "$d" ] && { adb shell input tap $d; sleep 2; dump picker; }
              r=$(python3 -I ui.py text "$OUT/picker.xml" "$root"); [ -n "$r" ] && { adb shell input tap $r; sleep 3; break; }
            done
          done
          shot picker-after
          added=no
          for _ in $(seq 1 15); do dump imported; [ "$(python3 -I ui.py has "$OUT/imported.xml" 'Page 1')" -ge 1 ] && { added=yes; break; }; sleep 2; done
          shot imported
          if [ "$added" = yes ]; then check ok "3 the test page was imported through Import and the picker (page 1 is in the strip; picker route found: $picked)"
          else check no "3 import failed (picker route found: $picked); on screen: $(python3 -I ui.py texts "$OUT/imported.xml")"; fi

          # ── 4. edge detection and the corner editor (the Frame tab opens by itself on the first page) ──
          sleep 2; dump frame; shot frame
          hint=$(python3 -I ui.py texts "$OUT/frame.xml")
          if echo "$hint" | grep -q "Drag the corners" && [ "$(python3 -I ui.py has "$OUT/frame.xml" 'Auto edges')" -ge 1 ]; then check ok "4 the corner editor is shown (Frame tab: 'Drag the corners', Auto edges, Whole photo)"
          else check no "4 the corner editor is not shown: $hint"; fi
          q=$(python3 -I stage.py frame "$OUT/frame.png" "$OUT/frame.xml" "$DPI" 2>&1 | tail -1); echo "$q"
          case "$q" in ok*) check ok "4 edge detection found a quad hugging the page ($q)";; *) check no "4 no page quad on the corner editor ($q)";; esac

          # ── 5. the four filters ──
          tap_text Filter; sleep 3
          for pair in "B&W:bw:mono" "Grayscale:gray:mono" "Colour:colour:any" "Original:original:colour"; do
            label=${pair%%:*}; rest=${pair#*:}; id=${rest%%:*}; expect=${rest#*:}
            tap_text "$label" || true
            for _ in $(seq 1 20); do dump "filter-$id"; [ "$(python3 -I ui.py has "$OUT/filter-$id.xml" 'Working…')" -eq 0 ] && break; sleep 2; done
            sleep 2; shot "filter-$id"
            q=$(python3 -I stage.py filter "$OUT/filter-$id.png" "$OUT/filter-$id.xml" "$DPI" "$expect" 2>&1 | tail -1); echo "$label: $q"
            case "$q" in ok*) check ok "5 filter $label applied, preview rendered ($q)";; *) check no "5 filter $label ($q)";; esac
          done

          # ── 6. A4 ──
          tap_text Size; sleep 2; tap_text A4 && picked_a4=yes || picked_a4=no; sleep 2; shot size-a4
          [ "$picked_a4" = yes ] && check ok "6 A4 chosen on the Size tab (confirmed by the PDF page size below)" || check no "6 no A4 button on the Size tab"

          # ── 7. export the PDF and read it back ──
          tap_text Export; sleep 2; tap_text PDF || true; sleep 1; shot export-tab
          adb shell 'rm -f /sdcard/Download/scan*.pdf /sdcard/Documents/scan*.pdf' || true
          tap_text Save || true
          # The export reads the page's text first (OCR through the engine, slow on an emulator), then opens the system "save as" picker.
          saved=""
          for _ in $(seq 1 60); do
            dump save-picker
            s=$(python3 -I ui.py id "$OUT/save-picker.xml" container_save)
            if [ -n "$s" ]; then
              shot save-picker; adb shell input tap $s; sleep 5
              saved=$(adb shell 'find /sdcard -maxdepth 3 -name "scan*.pdf" 2>/dev/null' | tr -d '\r' | head -1)
              [ -n "$saved" ] && break
              d=$(python3 -I ui.py text "$OUT/save-picker.xml" "Show roots"); [ -n "$d" ] && { adb shell input tap $d; sleep 2; dump save-roots; r=$(python3 -I ui.py text "$OUT/save-roots.xml" Downloads); [ -n "$r" ] && { adb shell input tap $r; sleep 2; }; }
            fi
            sleep 5
          done
          shot after-save
          if [ -z "$saved" ]; then check no "7 no scan*.pdf was saved to the phone"
          else
            adb pull "$saved" "$OUT/scan.pdf" >/dev/null; echo "pulled $saved"
            python3 -I pdfcheck.py "$OUT/scan.pdf" > "$OUT/pdf-facts.txt"; sed 's/^text=.*/&/' "$OUT/pdf-facts.txt" | head -20
            fact() { sed -n "s/^$1=//p" "$OUT/pdf-facts.txt" | head -1; }
            [ "$(fact header)" = True ] && check ok "7 the export starts with %PDF ($(fact size) bytes)" || check no "7 the export does not start with %PDF"
            [ "$(fact count)" = 1 ] && [ "$(fact declared)" = 1 ] && check ok "7 the PDF has 1 page (as many as were imported)" || check no "7 page count: /Type /Page x$(fact count), /Count $(fact declared), expected 1"
            python3 -I -c 'import ast,sys; b=ast.literal_eval(sys.argv[1]); sys.exit(0 if b and all(abs(w-595)<=1 and abs(h-842)<=1 for w,h in b) else 1)' "$(fact boxes)" \
              && check ok "7 the page size is 595x842 pt, A4 ($(fact boxes))" || check no "7 the page size is not 595x842 pt: $(fact boxes)"
            # OCR ran only if the PDF carries a text layer; the engine APK is installed above, so it must have.
            txt=$(fact text)
            if [ -z "$txt" ]; then check no "7 OCR: the PDF has no text layer (the engine did not read the page)"
            else
              hit=""; for w in invoice scanner coffee bread total; do echo "$txt" | grep -qi "$w" && hit="$hit $w"; done
              [ -n "$hit" ] && check ok "7 OCR text layer holds known words of the test page:$hit (text: $txt)" || check no "7 OCR text layer has none of the page's words (text: $txt)"
            fi
          fi
          timeout 60 adb logcat -d > "$OUT/logcat.txt" || true
          adb shell dumpsys activity activities 2>/dev/null | grep -E "ResumedActivity" > "$OUT/resumed.txt" || true
          if [ "$fails" -eq 0 ]; then echo "VERDICT: PASS" | tee -a "$OUT/verdict.txt"; else echo "VERDICT: FAIL ($fails failed)" | tee -a "$OUT/verdict.txt"; fi
          [ "$fails" -eq 0 ]
          EOF2
          chmod +x shoot.sh

      - name: Boot emulator and prove
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash shoot.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-scanner-evidence
          path: out/
          if-no-files-found: warn
