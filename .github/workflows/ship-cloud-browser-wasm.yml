name: "Ship → cloud-browser web (Kotlin/Wasm build + attach to GH Release + portal refresh)"

# GENERATED from 1_cicd/src/templates/ship-wasm.yml.in, because ac_cloud-browser/build.json
# declares a `web` block (#876). Edit the template or the build.json, never this
# file: the next `./build.sh workflow` overwrites it, and `generated files are up
# to date` fails a push that did not.
#
# The app's Kotlin/Wasm page: ac_cloud-browser/web is its own gradle root, and the
# shared libs' pure-Compose sources (src/commonMain/kotlin, the lib list is
# ab_cloud-libs-shared/web/web.json::libs) arrive through the
# ab_cloud-libs-shared/web composite. It ships ALONE: the APK workflow excludes
# ac_cloud-browser/web from what it watches and hashes, and this one watches only the
# directories listed below, so a web edit never republishes an APK and an APK edit
# never rebuilds the page. The publish gate weighs the page's own inputs (the
# directories above, plus the fleet manifest the build bakes in), so a run that
# moved none of them leaves the released zip untouched.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ac_cloud-browser/web/**"
      - "1_cicd/src/cicd/ship-cloud-browser-wasm.yml"
      - "1_cicd/src/templates/ship-wasm.yml.in"
      - "ab_cloud-libs-shared/libs/bottomnav/src/commonMain/**"
      - "ab_cloud-libs-shared/libs/ui-kit/src/commonMain/**"
      - "ab_cloud-libs-shared/web/**"
      - "ac_cloud-browser/test/test-browser-web.sh"
permissions:
  contents: write   # gh release upload

concurrency:
  group: ship-cloud-browser-wasm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-browser/web
  APP_DIR: ac_cloud-browser

jobs:
  build_and_publish:
    name: "Build Kotlin/Wasm + Publish (cloud-browser)"
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}

      # Publish-if-changed, exactly as the APK workflows do it: the identity is the git
      # trees of the inputs listed here (the watched ones, plus the fleet manifest the
      # build bakes into the page, which is hashed and never watched), compared with the
      # <asset>.source sidecar on the release. --asset/--paths-from because this job's
      # asset is not named by a build.json beside it.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/web-inputs.txt"
          cat > "$inputs" <<'EOF'
          1_cicd/src/cicd/ship-cloud-browser-wasm.yml
          1_cicd/src/templates/ship-wasm.yml.in
          aa_cloud-superapp/data/constellation-fleet.json
          ab_cloud-libs-shared/libs/bottomnav/src/commonMain
          ab_cloud-libs-shared/libs/ui-kit/src/commonMain
          ab_cloud-libs-shared/web
          ac_cloud-browser/test/test-browser-web.sh
          ac_cloud-browser/web
          EOF
          sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$APP_DIR" "" --asset "Cloud-Browser.wasm.zip" --paths-from "$inputs"

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Build (wasmJsBrowserDistribution)
        if: steps.gate.outputs.skip != 'true'
        # YARN_IGNORE_PATH: an app whose tree carries a Yarn Berry config (.yarnrc.yml with yarnPath,
        # as Cloud Notes does) must not hand Kotlin's own Yarn 1 install over to that Berry release.
        env:
          YARN_IGNORE_PATH: "1"
        run: cd "$WORK_DIR" && ./gradlew wasmJsBrowserDistribution --no-daemon --console=plain

      # The app's testers run in full here (test-engine shell), and one of them can
      # drive headless Chromium (cloud-code's page-bleed tester, #1193). That tester
      # FAILS when the browser is missing, it never skips, so a page whose test
      # directory names Playwright gets the same pinned install its APK workflow has.
      - name: Install Playwright Chromium (only when a tester of this app drives it)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          grep -rqi playwright "$APP_DIR/test" 2>/dev/null || { echo "no tester of $APP_DIR uses Playwright"; exit 0; }
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      # The web tester asserts the dist, so it runs AFTER the build and is told
      # to treat an absent dist as a failure (locally it skips, with a reason).
      - name: "Test → the page's dist (contents, size budget, no android in the glue)"
        if: steps.gate.outputs.skip != 'true'
        env:
          CLOUD_WEB_REQUIRE_DIST: "1"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$APP_DIR"

      - name: Package Cloud-Browser.wasm.zip
        id: pack
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          dist="$WORK_DIR/build/dist/wasmJs/productionExecutable"
          test -f "$dist/index.html" || { echo "::error::$dist/index.html missing — the build produced no page"; exit 1; }
          mkdir -p "$RUNNER_TEMP/wasm"
          asset="$RUNNER_TEMP/wasm/Cloud-Browser.wasm.zip"
          (cd "$dist" && zip -qr "$asset" .)
          sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
          ls -l "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Attach to rolling GH Release
        id: publish
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(jq -r '.release.gh_release.rolling_tag' "$APP_DIR/build.json")"
          ASSET="${{ steps.pack.outputs.asset }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --notes "Rolling release — overwritten on every main push." --latest
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names" | grep -qxF "$(basename "$ASSET")" \
            || { echo "::error::gh-release: $(basename "$ASSET") missing on $TAG after upload"; exit 1; }

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-browser/web" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      # The portal (diegonmarcos.github.io Pages deploy; sources: cloudy-h-webapps-desk a_Portals/cloud-web) fetches the zip from
      # the release at ITS build time, so it has to be told. repository_dispatch to
      # another repo needs a token with access to it; GITHUB_TOKEN cannot. Without the
      # secret the release is still correct and the portal picks the page up on its
      # next build, so this degrades to a warning, never a red run.
      - name: Stamp source identity on the published asset
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/web-inputs.txt"
          cat > "$inputs" <<'EOF'
          1_cicd/src/cicd/ship-cloud-browser-wasm.yml
          1_cicd/src/templates/ship-wasm.yml.in
          aa_cloud-superapp/data/constellation-fleet.json
          ab_cloud-libs-shared/libs/bottomnav/src/commonMain
          ab_cloud-libs-shared/libs/ui-kit/src/commonMain
          ab_cloud-libs-shared/web
          ac_cloud-browser/test/test-browser-web.sh
          ac_cloud-browser/web
          EOF
          sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$APP_DIR" "" --asset "Cloud-Browser.wasm.zip" --paths-from "$inputs"

      - name: Tell the portal (repository_dispatch cloud-web-refresh)
        if: steps.gate.outputs.skip != 'true'
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PORTAL_DISPATCH_TOKEN" ]; then
            echo "::warning::PORTAL_DISPATCH_TOKEN is not set: cloud-browser is on the release; the portal takes it at its next build"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $PORTAL_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/diegonmarcos/diegonmarcos.github.io/dispatches \
            -d '{"event_type":"cloud-web-refresh","client_payload":{"slug":"cloud-browser","asset":"Cloud-Browser.wasm.zip"}}'
