name: "Check → CG-Omniverse Galaxy worlds render (CDP on the emulator)"

# #1694 / #1711 on demand: installs the x86_64 APK of a Ship run (debuggable) on an emulator and proves, over DevTools (adb
# forward to the WebView), that Galaxy's declared default tabs reach real drawn content:
#   live     each world (data/store.json ids, WORLDS) is opened by the launch extra; the check passes when the page holds a canvas
#            (floor796: a light-DOM canvas that reads back drawn; the others: a canvas anywhere, closed shadow roots included) AND the
#            screen itself shows the scene (a screencap of the world's area is not one flat colour), inside the world's deadline.
#            A WebGL world must also be receiving draw calls (a loader drawn in the DOM issues none). floor796 is then reloaded
#            once to record the whole request timeline (which answers came from the pin-offline intercept: response header
#            Client-Via): its document and its first data request must be answered by the network, never by the intercept
#            (#1711), and the #1694 viewport assertion (layout viewport not zero) is kept.
#   pinned   the regression of #1711: the phone showed floor796's top bar over a flat #101010 page with 0 canvases, 0 failed
#            requests: its first data request (data/matrix.json?r=<random>, same origin) had no answer. The origin's address is
#            dropped on the emulator (iptables, the CDN hosts stay reachable), the app is started cold and floor796 must STILL
#            reach a drawn canvas: the pinned copy answers what the live site does not. (The site's own 1 s CDN probe can time
#            out on a slow emulator and send the page to its origin for everything; the check then reloads, twice at most.)
# mode=baseline records the same facts and never fails (used to capture the state of a build before a fix).
# Uploads `cg-omniverse-galaxy-check-<api>` (log, request timelines, screenshots, the app's own diagnostics texts).

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship -> CG-Omniverse run whose x86_64 APK to use (empty = the rolling release)"
        required: false
        default: ""
      mode:
        description: "check (assertions gate the run) | baseline (record only, never fails)"
        required: false
        default: "check"
      worlds:
        description: "Store ids to open, in order (data/store.json)"
        required: false
        default: "cyber-city-orion,floor796,messenger"
      api_levels:
        description: "Emulator API levels, a JSON list"
        required: false
        default: "[34, 36]"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: "Galaxy worlds render (API ${{ matrix.api }})"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.api_levels) }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.ship_run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN" ]; then gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64-*' -D apk
          else gh release download latest -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64.apk' -D apk; fi
          pick=$(find apk -name '*.apk' | head -1); [ -n "$pick" ] || { echo "::error::no APK"; exit 1; }
          cp "$pick" app.apk
          gh release download latest -R "$GITHUB_REPOSITORY" -p 'Cloud-Browser-x86_64.apk' -D browser 2>/dev/null \
            || gh release download latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'Cloud-Browser-x86_64.apk' -D browser 2>/dev/null || true
          [ -f browser/Cloud-Browser-x86_64.apk ] && cp browser/Cloud-Browser-x86_64.apk browser.apk || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the check
        run: |
          pip install websocket-client pillow
          cat > check.py <<'PY'
          import json, os, re, socket, subprocess, sys, time, urllib.request
          import websocket
          from PIL import Image

          PKG = "com.diegonmarcos.cgomniverse"
          BROWSER = "com.diegonmarcos.cloudbrowser"
          OUT = "probe"
          MODE = os.environ.get("MODE", "check")
          WORLDS = [w.strip() for w in os.environ.get("WORLDS", "").split(",") if w.strip()]
          STORE = json.load(open("ad_CG-Omniverse/data/store.json"))["entries"]
          URL = dict((e["id"], e["url"]) for e in STORE)
          # how long each world may take to reach drawn content on a software-GL emulator, and the pinned world's deadline
          DEADLINE = {"floor796": 120}
          DEADLINE_DEFAULT = 200
          PINNED = "floor796"
          PINNED_DEADLINE = 150
          T0 = time.time()
          os.makedirs(OUT, exist_ok=True)
          LOG = open(OUT + "/check.log", "w")

          def log(*a):
              s = "[%6.1fs] " % (time.time() - T0) + " ".join(str(x) for x in a)
              LOG.write(s + "\n"); LOG.flush(); print(s, flush=True)

          def adb(*a, timeout=90):
              try: return subprocess.run(["adb", *a], capture_output=True, text=True, timeout=timeout).stdout
              except subprocess.TimeoutExpired: return ""

          STATE = r"""(function(){var o={url:location.href,rs:document.readyState,iw:innerWidth,ih:innerHeight,dpr:devicePixelRatio,
          cdn:(document.documentElement.dataset||{}).cdn||'',canvases:0,drawn:0,blank:0,unreadable:0,cw:0,ch:0,
          videos:document.querySelectorAll('video').length,spinner:!!document.querySelector('.spinner_show'),
          loader:!!document.getElementById('initial-loader'),ctx:window.__cloudCtx||null,mq:matchMedia('(min-height:1px)').matches,
          body:document.body?document.body.getBoundingClientRect().height:-1};
          var cs=document.querySelectorAll('canvas');o.canvases=cs.length;
          for(var i=0;i<cs.length&&i<12;i++){var c=cs[i];if(c.clientWidth*c.clientHeight>o.cw*o.ch){o.cw=c.clientWidth;o.ch=c.clientHeight}
          try{var t=document.createElement('canvas');t.width=t.height=16;var x=t.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,16,16);
          var d=x.getImageData(0,0,16,16).data,k=0;for(var j=4;j<d.length;j+=4){if(d[j]!==d[0]||d[j+1]!==d[1]||d[j+2]!==d[2]||d[j+3]!==d[3]){k=1;break}}
          if(k)o.drawn++;else o.blank++}catch(e){o.unreadable++}}
          return JSON.stringify(o)})()"""

          # counts the WebGL draw calls the page issues from now on (a loader drawn in the DOM issues none; a scene issues many per frame)
          GL_HOOK = r"""(function(){if(window.__probeGl)return 'already';var s=window.__probeGl={calls:0};
          [window.WebGLRenderingContext,window.WebGL2RenderingContext].forEach(function(C){if(!C)return;var p=C.prototype;
          ['drawArrays','drawElements','drawArraysInstanced','drawElementsInstanced','drawRangeElements'].forEach(function(k){var o=p[k];if(!o)return;
          p[k]=function(){s.calls++;return o.apply(this,arguments)}})});return 'hooked'})()"""
          GL_READ = "(function(){var s=window.__probeGl;if(!s)return -1;var n=s.calls;s.calls=0;return n})()"
          # a start gate drawn in the DOM (Orion's ENTER): clicked through the page; one drawn in the scene is tapped on the screen (TAPS)
          ENTER_JS = r"""(function(){var els=document.querySelectorAll('button,a,div,span,p');for(var i=0;i<els.length;i++){
          var t=(els[i].textContent||'').trim();if(/^(enter|begin|start|play)$/i.test(t)&&els[i].children.length===0){els[i].click();return 'clicked '+t}}return 'none'})()"""
          # where a world's own start button sits inside its area (share of width, share of height), for the "entered" screenshot only
          TAPS = {"cyber-city-orion": [(0.5, 0.59)], "messenger": [(0.5, 0.855)]}

          class Cdp:
              def __init__(self, url):
                  self.ws = websocket.create_connection(url, timeout=10, suppress_origin=True)
                  self.n = 0; self.req = {}; self.order = []; self.console = []; self.navs = []
                  for m in ("Runtime.enable", "Log.enable", "Network.enable", "Page.enable"): self.send(m)
              def send(self, method, params=None):
                  self.n += 1; self.ws.send(json.dumps({"id": self.n, "method": method, "params": params or {}})); return self.n
              def recv(self, timeout):
                  self.ws.settimeout(timeout)
                  try: return json.loads(self.ws.recv())
                  except websocket.WebSocketTimeoutException: return None
                  except Exception as e: return {"closed": str(e)}
              def event(self, m):
                  meth = m.get("method"); p = m.get("params", {})
                  if meth == "Network.requestWillBeSent":
                      r = p.get("request", {}); i = p.get("requestId")
                      if i not in self.req: self.order.append(i)
                      self.req[i] = {"url": r.get("url", ""), "t": p.get("timestamp", 0), "type": p.get("type", "")}
                  elif meth == "Network.responseReceived":
                      r = p.get("response", {}); i = p.get("requestId")
                      if i not in self.req: self.order.append(i)
                      q = self.req.setdefault(i, {"url": r.get("url", ""), "t": 0, "type": p.get("type", "")})
                      h = dict((k.lower(), v) for k, v in (r.get("headers") or {}).items())
                      q["status"] = r.get("status"); q["via"] = h.get("client-via", ""); q["tr"] = p.get("timestamp", 0)
                  elif meth == "Network.loadingFinished":
                      q = self.req.get(p.get("requestId"))
                      if q is not None: q["tf"] = p.get("timestamp", 0); q["bytes"] = p.get("encodedDataLength", 0)
                  elif meth == "Network.loadingFailed":
                      q = self.req.get(p.get("requestId"))
                      if q is not None: q["fail"] = p.get("errorText", "failed") + (" (canceled)" if p.get("canceled") else "")
                  elif meth == "Runtime.consoleAPICalled":
                      text = " | ".join(str(a.get("value", a.get("description", ""))) for a in p.get("args", []))[:300]
                      self.console.append([p.get("type"), text]); log("  console." + str(p.get("type")), text)
                  elif meth == "Runtime.exceptionThrown":
                      text = json.dumps(p)[:400]; self.console.append(["exception", text]); log("  EXCEPTION", text)
                  elif meth == "Log.entryAdded":
                      e = p.get("entry", {})
                      if e.get("level") in ("error", "warning"): log("  log." + e.get("level"), e.get("text", "")[:240], e.get("url", "")[:120])
                      if e.get("level") == "error": self.console.append(["log.error", e.get("text", "")[:300]])
                  elif meth == "Page.frameNavigated":
                      f = p.get("frame", {})
                      if not f.get("parentId"): self.navs.append(f.get("url")); log("  nav", f.get("url"))
              def call(self, method, params=None, timeout=25):
                  i = self.send(method, params); end = time.time() + timeout
                  while time.time() < end:
                      m = self.recv(1)
                      if m is None: continue
                      if "closed" in m: return None
                      if m.get("id") == i: return m.get("result", {})
                      self.event(m)
                  return None
              def pump(self, secs):
                  end = time.time() + secs
                  while time.time() < end:
                      m = self.recv(min(1.0, max(0.05, end - time.time())))
                      if m is None: continue
                      if "closed" in m: return False
                      self.event(m)
                  return True
              def js(self, expr, timeout=25):
                  r = self.call("Runtime.evaluate", {"expression": expr, "returnByValue": True}, timeout)
                  try: return r["result"]["value"]
                  except Exception: return None
              def canvases(self):
                  # every canvas of the page, closed shadow roots and frames included (the page's own querySelectorAll cannot see those)
                  r = self.call("DOM.getDocument", {"depth": -1, "pierce": True}, 40)
                  found = []
                  def walk(n):
                      if (n.get("nodeName") or "").lower() == "canvas":
                          a = n.get("attributes") or []; d = dict(zip(a[0::2], a[1::2])); found.append([d.get("width"), d.get("height")])
                      for ch in n.get("children") or []: walk(ch)
                      for sr in n.get("shadowRoots") or []: walk(sr)
                      if n.get("contentDocument"): walk(n["contentDocument"])
                  if r and "root" in r: walk(r["root"])
                  return found
              def timeline(self, path, host):
                  # every request of this page, in order: when it was asked, when it was answered, by whom
                  rows = []; t0 = min([q["t"] for q in self.req.values() if q.get("t")] or [0])
                  for i in self.order:
                      q = self.req[i]; u = q["url"]
                      if u.startswith("data:") or u.startswith("blob:"): continue
                      asked = q.get("t", 0) - t0
                      if "tr" in q: ans = ("%7.2fs" % (q["tr"] - q["t"])) if q.get("t") else "      ?"
                      elif "fail" in q: ans = "FAILED " + q["fail"]
                      else: ans = "PENDING (no answer)"
                      who = "pin-intercept" if q.get("via") else ("network" if "tr" in q else "-")
                      rows.append("+%7.2fs  %-22s %-13s %-4s %-9s %s" % (asked, ans, who, q.get("status", ""), q.get("type", ""), u[:150]))
                  open(path, "w").write("\n".join(rows) + "\n")
                  same = [q for q in self.req.values() if ("//" + host + "/") in q["url"]]
                  skip = ("data:", "blob:")
                  return {"requests": len(self.req), "same_origin": len(same), "by_intercept": len([q for q in same if q.get("via")]),
                          "pending": [q["url"][:120] for q in self.req.values() if "tr" not in q and "fail" not in q and not q["url"].startswith(skip)][:12],
                          "failed": [q["url"][:120] + " " + q["fail"] for q in self.req.values() if "fail" in q][:12]}
              def close(self):
                  try: self.ws.close()
                  except Exception: pass

          def pages(pkg):
              pid = adb("shell", "pidof", pkg).split()
              if not pid: return []
              sock = None
              for l in adb("shell", "cat", "/proc/net/unix").splitlines():
                  if "webview_devtools_remote_" + pid[0] in l: sock = l.split("@")[-1].strip()
              if not sock: return []
              adb("forward", "tcp:9222", "localabstract:" + sock)
              try: return json.load(urllib.request.urlopen("http://localhost:9222/json", timeout=5))
              except Exception: return []

          def attach(pkg, host):
              # the world's page: the one on its host, else the one still blank (its document has not arrived yet); never the app's own asset pages
              ps = [p for p in pages(pkg) if p.get("type") == "page" and "appassets.androidplatform.net" not in p.get("url", "")]
              hit = [p for p in ps if host in p.get("url", "")] or ps
              if not hit: return None
              try: return Cdp(hit[0]["webSocketDebuggerUrl"])
              except Exception as e: log("  attach failed", e); return None

          def dismiss():
              # an emulator's own "isn't responding" dialog (the launcher, at boot) must neither cover the world nor be sampled as its pixels
              f = adb("shell", "dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'")
              if "Not Responding" in f or "isn't responding" in f:
                  log("  a system dialog is in front:", " ".join(f.split())[:200])
                  if not tap("Wait"): adb("shell", "input", "keyevent", "KEYCODE_BACK")
                  time.sleep(1)

          def screen(name=None):
              # the pixels the screen really shows in the middle of the world's area (below the app's bars and its loading chip)
              dismiss()
              try: png = subprocess.run(["adb", "exec-out", "screencap", "-p"], capture_output=True, timeout=60).stdout
              except subprocess.TimeoutExpired: return {"error": "screencap timed out"}
              path = OUT + "/" + (name or "_poll") + ".png"
              open(path, "wb").write(png)
              try:
                  im = Image.open(path).convert("RGB"); w, h = im.size
                  box = im.crop((int(w * 0.04), int(h * 0.50), int(w * 0.96), int(h * 0.84))).resize((96, 96), Image.NEAREST)
                  counts = {}
                  for r, g, b in box.getdata():
                      q = (r & 0xF0, g & 0xF0, b & 0xF0); counts[q] = counts.get(q, 0) + 1
                  top = max(counts, key=counts.get)
                  return {"colours": len(counts), "share": round(counts[top] / float(96 * 96), 3), "dominant": "#%02x%02x%02x" % top}
              except Exception as e: return {"error": str(e)}

          def on_screen(s, light=True):
              # not one flat colour: a hand-drawn 2D scene holds hundreds of colours, a WebGL intro may hold a few over a gradient
              if light: return s.get("colours", 0) >= 12 and s.get("share", 1.0) < 0.95
              return s.get("colours", 0) >= 6 and s.get("share", 1.0) < 0.97

          def texts():
              # what the app itself says on the screen (the loading chip, the no-render banner, the diagnostics sheet)
              for _ in range(3):
                  adb("shell", "uiautomator", "dump", "/sdcard/u.xml", timeout=60)
                  x = adb("shell", "cat", "/sdcard/u.xml")
                  if "<hierarchy" in x:
                      out = []
                      for m in re.finditer(r'<node [^>]*>', x):
                          n = m.group(0); t = re.search(r' text="([^"]*)"', n); d = re.search(r' content-desc="([^"]*)"', n)
                          b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
                          for v in ((t.group(1) if t else ""), (d.group(1) if d else "")):
                              if v: out.append((v, tuple(map(int, b.groups())) if b else None))
                      return out
                  time.sleep(2)
              return []

          def tap(label):
              for v, b in texts():
                  if v == label and b:
                      adb("shell", "input", "tap", str((b[0] + b[2]) // 2), str((b[1] + b[3]) // 2)); time.sleep(2); return True
              return False

          def web_bounds():
              # the world's WebView on the screen (px), read from the view tree
              x = adb("shell", "cat", "/sdcard/u.xml")
              m = re.search(r'class="android.webkit.WebView"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', x)
              return tuple(map(int, m.groups())) if m else None

          def enter(cdp, wid, label):
              # past the world's own start gate, for a screenshot of the scene itself (recorded, never asserted)
              how = cdp.js(ENTER_JS, 10) if cdp is not None else None
              texts(); b = web_bounds()
              if b:
                  for rx, ry in TAPS.get(wid, []):
                      adb("shell", "input", "tap", str(int(b[0] + rx * (b[2] - b[0]))), str(int(b[1] + ry * (b[3] - b[1])))); time.sleep(1)
              if cdp is not None: cdp.pump(20)
              else: time.sleep(20)
              s = screen(label + "-entered"); log(label, "entered (%s, area %s): screen %s" % (how, b, json.dumps(s))); return s

          KEEP = r"rendered|loading|not rendered|Failed requests|Pin offline|pinned copy|Console errors|canvases|Canvases|Presentation|screen:|GPU contexts"

          def diagnostics(label):
              # the app's own Page diagnostics sheet: the render check, Failed requests, the pin-offline lines
              if not tap("Page diagnostics"): log(label, "no Page diagnostics button on screen"); return []
              time.sleep(3)
              rows = [v for v, b in texts()]
              screen(label + "-diagnostics")
              adb("shell", "input", "swipe", "540", "1900", "540", "700", "400"); time.sleep(1)
              rows += [v for v, b in texts() if v not in rows]
              screen(label + "-diagnostics-2")
              adb("shell", "input", "keyevent", "KEYCODE_BACK"); time.sleep(1)
              open(OUT + "/" + label + "-diagnostics.txt", "w").write("\n".join(rows) + "\n")
              keep = [r for r in rows if re.search(KEEP, r)]
              for r in keep: log(label, "  diag:", r[:220])
              return keep[:14]

          def watch(wid, label, secs, light):
              # opens the world cold and waits until it holds a canvas AND the screen shows it; returns the facts and the session
              host = URL[wid].split("/")[2]
              res = {"world": wid, "label": label, "host": host, "deadline_s": secs, "drawn_s": None, "canvas_s": None}
              dismiss()
              adb("shell", "am", "start", "-S", "-W", "-n", PKG + "/.MainActivity", "-e", "world", wid)
              t0 = time.time(); cdp = None; last = None; seen = False
              while time.time() - t0 < secs:
                  if cdp is None:
                      cdp = attach(PKG, host)
                      if cdp is None:
                          if not seen and time.time() - t0 > 50: res["skipped"] = "no page for this world (not in this build's catalogue?)"; break
                          time.sleep(1.5); continue
                      seen = True; log(label, "attached after %.1fs" % (time.time() - t0))
                  if not cdp.pump(2.0): cdp.close(); cdp = None; continue
                  st = cdp.js(STATE, 15)
                  if st is None: cdp.close(); cdp = None; continue
                  s = json.loads(st); scr = screen()
                  if light:
                      # a 2D canvas of the document that reads back drawn
                      n = s["drawn"]; draws = "-"; pierced = "-"
                  else:
                      # a canvas anywhere in the page (closed shadow roots included) that the page is issuing WebGL draw calls into
                      cdp.js(GL_HOOK, 10); cdp.pump(1.0); draws = cdp.js(GL_READ, 10); pierced = len(cdp.canvases())
                      n = pierced if isinstance(draws, int) and draws > 0 else 0
                  line = "canvases=%d drawn=%d blank=%d css=%dx%d spinner=%s cdn=%s pierced=%s gl_draws=%s screen=%s url=%s" % (
                      s["canvases"], s["drawn"], s["blank"], s["cw"], s["ch"], s["spinner"], s["cdn"], pierced, draws, json.dumps(scr), s["url"][:60])
                  if line != last: log(label, line); last = line
                  res["state"] = s; res["screen"] = scr; res["gl_draws"] = draws; res["pierced"] = pierced
                  if n > 0 and res["canvas_s"] is None: res["canvas_s"] = round(time.time() - t0, 1)
                  if n > 0 and on_screen(scr, light): res["drawn_s"] = round(time.time() - t0, 1); break
              res["final_screen"] = screen(label)
              res["overlay"] = [v for v, b in texts() if v.startswith("Loading ") or "is not rendering" in v or "pinned copy" in v.lower() or "is offline" in v.lower()][:6]
              log(label, "RESULT drawn_s=%s canvas_s=%s overlay=%s" % (res["drawn_s"], res["canvas_s"], res["overlay"]))
              return res, cdp

          summary = {"mode": MODE, "worlds": [], "webview": ""}
          wv = adb("shell", "dumpsys", "webviewupdate")
          open(OUT + "/webview.txt", "w").write(wv)
          m = re.search(r"Current WebView package[^\n]*", wv); summary["webview"] = m.group(0).strip() if m else ""
          log("mode", MODE, "worlds", WORLDS, summary["webview"])

          # ── live: every declared tab reaches drawn content ─────────────────────────────────────────────────────────────────
          for wid in WORLDS:
              if wid not in URL:
                  summary["worlds"].append({"world": wid, "skipped": "not in data/store.json"}); log("live-" + wid, "SKIPPED: not in data/store.json"); continue
              res, cdp = watch(wid, "live-" + wid, DEADLINE.get(wid, DEADLINE_DEFAULT), wid == PINNED)
              if cdp is not None and wid == PINNED and res["drawn_s"] is not None:
                  # the #1694 viewport assertion, then one reload to record the whole request timeline of a load
                  s = res["state"]; res["viewport_ok"] = bool(s["mq"] and s["body"] > 0 and s["ch"] > 0)
                  cdp.req.clear(); cdp.order[:] = []
                  cdp.send("Page.reload"); t1 = time.time(); res["reload_drawn_s"] = None
                  while time.time() - t1 < 90:
                      if not cdp.pump(2.0): break
                      st = cdp.js(STATE, 15)
                      if st and json.loads(st)["drawn"] > 0 and on_screen(screen()): res["reload_drawn_s"] = round(time.time() - t1, 1); break
                  cdp.pump(6)
                  res["timeline"] = cdp.timeline(OUT + "/live-" + wid + "-timeline.txt", res["host"])
                  # #1711 who answered the live page's document and its first data request (data/matrix.json?r=<random>): the network, never the pin-offline intercept
                  origin = "https://" + res["host"] + "/"
                  live = [q for q in cdp.req.values() if q["url"] == origin or q["url"].startswith(origin + "data/matrix.json")]
                  res["live_requests"] = [[q["url"][:90], "pin-intercept" if q.get("via") else ("network" if "tr" in q else "unanswered")] for q in live]
                  res["live_by_network"] = bool(live) and all("tr" in q and not q.get("via") for q in live) and any("data/matrix.json" in q["url"] for q in live)
                  log("live-" + wid, "reload drawn_s=%s live document and data: %s timeline=%s" % (res["reload_drawn_s"], json.dumps(res["live_requests"]), json.dumps(res["timeline"])))
              if "skipped" not in res and wid != PINNED and res["drawn_s"] is not None: res["entered_screen"] = enter(cdp, wid, "live-" + wid)
              if cdp is not None: cdp.close()
              if "skipped" not in res: res["diagnostics"] = diagnostics("live-" + wid)
              summary["worlds"].append(res)

          # ── pinned: the origin stops answering, the pinned world must still render (#1711) ─────────────────────────────────
          pinned = {"world": PINNED, "skipped": "not opened"}
          if PINNED in WORLDS and PINNED in URL:
              host = URL[PINNED].split("/")[2]
              ips = sorted(set(a[4][0] for a in socket.getaddrinfo(host, 443, socket.AF_INET)))
              time.sleep(20)   # the copy of the first loads is written in the background
              man = adb("shell", "cat /data/data/" + PKG + "/files/site-cache-v2/" + host + "/manifest.json")
              try: keys = sorted(json.loads(man).get("entries", {}).keys())
              except Exception: keys = []
              open(OUT + "/pinned-copy-urls.txt", "w").write("\n".join(keys) + "\n")
              log("pinned", "copy holds %d urls; origin %s = %s" % (len(keys), host, ips))
              adb("shell", "am", "force-stop", PKG)
              for ip in ips: log("pinned", "drop", ip, adb("shell", "iptables", "-w", "-I", "OUTPUT", "-d", ip, "-j", "DROP").strip() or "ok")
              pinned, cdp = watch(PINNED, "pinned-" + PINNED, PINNED_DEADLINE, True)
              pinned["copy_urls"] = len(keys); pinned["origin"] = ips
              pinned["copy_has_document"] = ("https://" + host + "/") in keys
              pinned["copy_has_matrix"] = any(k.startswith("https://" + host + "/data/matrix.json") for k in keys)
              attempts = [{"how": "cold start", "drawn_s": pinned["drawn_s"], "cdn": (pinned.get("state") or {}).get("cdn")}]
              tries = 0
              while pinned["drawn_s"] is None and tries < 2:
                  # the site's own CDN probe (1 s per CDN) can time out on a slow emulator; the page then asks its dropped origin for
                  # everything, which no copy can answer. That is the site's timing, not the app's: reload and look again.
                  tries += 1
                  if cdp is None: cdp = attach(PKG, host)
                  if cdp is None: break
                  cdp.req.clear(); cdp.order[:] = []
                  cdp.send("Page.reload"); t1 = time.time()
                  while time.time() - t1 < 100:
                      if not cdp.pump(2.0): cdp.close(); cdp = None; break
                      st = cdp.js(STATE, 15)
                      if st is None: continue
                      st = json.loads(st); scr = screen(); pinned["state"] = st; pinned["screen"] = scr
                      if st["drawn"] > 0 and on_screen(scr): pinned["drawn_s"] = round(time.time() - t1, 1); break
                  attempts.append({"how": "reload %d" % tries, "drawn_s": pinned["drawn_s"], "cdn": (pinned.get("state") or {}).get("cdn")})
              pinned["attempts"] = attempts
              pinned["final_screen"] = screen("pinned-" + PINNED)
              log("pinned", "attempts", json.dumps(attempts), "copy has document/matrix:", pinned["copy_has_document"], pinned["copy_has_matrix"])
              if cdp is not None:
                  cdp.pump(3); pinned["timeline"] = cdp.timeline(OUT + "/pinned-" + PINNED + "-timeline.txt", host); cdp.close()
                  log("pinned", "timeline", json.dumps(pinned["timeline"]))
              pinned["diagnostics"] = diagnostics("pinned-" + PINNED)
              log("pinned", "iptables", adb("shell", "iptables", "-w", "-L", "OUTPUT", "-v", "-n").strip().replace("\n", " | ")[:400])
              for ip in ips: adb("shell", "iptables", "-w", "-D", "OUTPUT", "-d", ip, "-j", "DROP")
          summary["pinned"] = pinned

          # ── Cloud-Browser on the same emulator, the same address (side by side, recorded only) ─────────────────────────────
          if os.path.exists("browser.apk") and PINNED in URL:
              adb("install", "-r", "-g", "browser.apk", timeout=240)
              adb("shell", "am", "start", "-a", "android.intent.action.VIEW", "-d", URL[PINNED], "-p", BROWSER); time.sleep(30)
              c = attach(BROWSER, URL[PINNED].split("/")[2])
              if c is not None:
                  c.pump(2); summary["cloud_browser"] = {"state": c.js(STATE, 15), "screen": screen("cloud-browser-" + PINNED)}; c.close()
                  log("cloud-browser", json.dumps(summary["cloud_browser"])[:400])

          # ── verdict ───────────────────────────────────────────────────────────────────────────────────────────────────────
          bad = []
          for r in summary["worlds"]:
              if "skipped" in r: bad.append("%s was not opened: %s" % (r["world"], r["skipped"])); continue
              if r["drawn_s"] is None: bad.append("%s did not reach drawn content in %d s (%s)" % (r["world"], r["deadline_s"], json.dumps(r.get("screen"))))
              if r["world"] == PINNED and r["drawn_s"] is not None and not r.get("viewport_ok", False): bad.append("%s: the layout viewport is zero (#1694)" % r["world"])
              if r["world"] == PINNED and r["drawn_s"] is not None and not r.get("live_by_network", False):
                  bad.append("%s: the live page's document or its data/matrix.json request was not answered by the network: %s (#1711)" % (r["world"], json.dumps(r.get("live_requests"))))
          if "skipped" in pinned: bad.append("the pinned world was not checked: " + pinned["skipped"])
          elif pinned["drawn_s"] is None: bad.append("%s did not render from its pinned copy while its origin did not answer (%d s): %s" % (PINNED, PINNED_DEADLINE, pinned.get("overlay")))
          summary["failed"] = bad
          json.dump(summary, open(OUT + "/summary.json", "w"), indent=1)
          for b in bad: log("FAIL", b)
          log("VERDICT", "GREEN" if not bad else "RED (%d)" % len(bad), "mode", MODE)
          sys.exit(0 if (not bad or MODE == "baseline") else 3)
          PY
          cat > run.sh <<'EOF'
          #!/bin/bash
          mkdir -p probe
          adb root; sleep 3; adb wait-for-device
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb shell settings put global hide_error_dialogs 1 || true
          adb install -r -g app.apk || exit 2
          adb logcat -v threadtime "*:W" CloudWebConsole:I CloudWebPin:I CgoRender:I chromium:I > probe/logcat.txt 2>&1 &
          adb shell dumpsys package com.diegonmarcos.cgomniverse | grep -E "versionName|firstInstallTime" > probe/package.txt || true
          python3 check.py; RC=$?
          rm -f probe/_poll.png
          # what the app itself logged: the pin-offline decisions and the render verdicts
          grep -E " CloudWebPin: | CgoRender: " probe/logcat.txt > probe/app-pin-and-render.log || true
          exit $RC
          EOF
          chmod +x run.sh
      - name: Boot emulator + check
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: ${{ inputs.mode }}
          WORLDS: ${{ inputs.worlds }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./run.sh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-omniverse-galaxy-check-${{ matrix.api }}
          path: probe
          retention-days: 14
