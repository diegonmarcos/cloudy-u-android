name: "Probe → CG-Omniverse floor796 (CDP on the emulator)"

# #1694 on demand: installs the x86_64 APK of a Ship run (debuggable) on an emulator, opens floor796 in Galaxy, attaches to the
# WebView over DevTools (adb forward) and records every console message, failed request and, every 15 s, the page's real
# viewport / canvas / DOM state. Same for Cloud-Browser when its APK is available. Uploads `cg-omniverse-f796-cdp`.

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship -> CG-Omniverse run whose x86_64 APK to use (empty = the rolling release)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Get the APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.ship_run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN" ]; then gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64-*' -D apk
          else gh release download latest -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64.apk' -D apk; fi
          pick=$(find apk -name '*.apk' | head -1); [ -n "$pick" ] || { echo "::error::no APK"; exit 1; }
          cp "$pick" app.apk
          gh release download latest -R "$GITHUB_REPOSITORY" -p 'Cloud-Browser-x86_64.apk' -D browser 2>/dev/null \
            || gh release download latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'Cloud-Browser-x86_64.apk' -D browser 2>/dev/null || true
          [ -f browser/Cloud-Browser-x86_64.apk ] && cp browser/Cloud-Browser-x86_64.apk browser.apk || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the probe
        run: |
          pip install websocket-client
          cat > cdp.py <<'PY'
          import json, subprocess, sys, time, urllib.request, websocket
          pkg, label, secs = sys.argv[1], sys.argv[2], int(sys.argv[3])
          def sh(*a): return subprocess.run(["adb", *a], capture_output=True, text=True, timeout=60).stdout
          out = open("probe/%s.log" % label, "w")
          def log(*a):
              s = " ".join(str(x) for x in a); out.write(s + "\n"); out.flush(); print(s)
          pid = sh("shell", "pidof", pkg).split()[0]
          sock = None
          for l in sh("shell", "cat", "/proc/net/unix").splitlines():
              if "webview_devtools_remote_" + pid in l: sock = l.split("@")[-1]
          log("pid", pid, "socket", sock)
          sh("forward", "tcp:9222", "localabstract:" + sock)
          pages = json.load(urllib.request.urlopen("http://localhost:9222/json"))
          log("pages", json.dumps([(p.get("url"), p.get("type")) for p in pages]))
          page = [p for p in pages if p.get("type") == "page" and "floor796" in p.get("url", "")] or [p for p in pages if p.get("type") == "page"]
          ws = websocket.create_connection(page[0]["webSocketDebuggerUrl"], timeout=5, suppress_origin=True)
          n = [0]
          def send(m, p=None):
              n[0] += 1; ws.send(json.dumps({"id": n[0], "method": m, "params": p or {}})); return n[0]
          for m in ("Runtime.enable", "Log.enable", "Network.enable", "Page.enable"): send(m)
          STATE = "(function(){var c=document.querySelectorAll('canvas'),o={url:location.href,rs:document.readyState,vis:document.visibilityState,iw:innerWidth,ih:innerHeight,dpr:devicePixelRatio,cw:document.documentElement.clientWidth,ch:document.documentElement.clientHeight,bw:document.body&&document.body.clientWidth,bh:document.body&&document.body.clientHeight,cdn:document.documentElement.dataset.cdn,nodes:document.getElementsByTagName('*').length,canv:[],body:(document.body?document.body.className:'')};for(var i=0;i<c.length&&i<6;i++){var r=c[i].getBoundingClientRect(),s=getComputedStyle(c[i]);o.canv.push([c[i].width,c[i].height,r.width,r.height,s.display,s.position,c[i].parentElement&&c[i].parentElement.tagName+'.'+c[i].parentElement.className,c[i].parentElement&&c[i].parentElement.clientWidth+'x'+c[i].parentElement.clientHeight])}var l=document.getElementById('initial-loader');o.loader=!!l;o.ls=(function(){try{return localStorage.getItem('modern-agent')}catch(e){return 'x'}})();o.top=Array.from(document.body.children).slice(0,12).map(function(e){return e.tagName+'#'+e.id+'.'+e.className+' '+e.clientWidth+'x'+e.clientHeight});return JSON.stringify(o)})()"
          STATE2 = "(async function(){var o={compat:document.compatMode,doctype:document.doctype&&document.doctype.name,sheets:[]};for(var i=0;i<document.styleSheets.length;i++){var ss=document.styleSheets[i];var n=-1;try{n=ss.cssRules.length}catch(e){n='err '+e}o.sheets.push([ss.href,n,ss.disabled])}var h=document.documentElement,b=document.body,m=document.querySelector('main');function cs(e){var c=getComputedStyle(e);return [e.tagName,c.height,c.display,c.position,c.overflow,e.getBoundingClientRect().height]}o.html=cs(h);o.body=cs(b);o.main=cs(m);try{var r=await fetch('/front.5be05bf611184a967d9a.css');var t=await r.text();o.css=[r.status,r.headers.get('content-type'),t.length,t.slice(0,160)]}catch(e){o.css='err '+e}b.style.height='100%';o.bodyAfterInline=b.getBoundingClientRect().height;return JSON.stringify(o)})()"
          STATE3 = "(function(){var o={inline:document.documentElement.style.cssText,attrs:Array.from(document.documentElement.attributes).map(function(a){return a.name+'='+a.value}),bodyAttrs:document.body.style.cssText,rules:[],hh:getComputedStyle(document.documentElement).height,mq:matchMedia('(min-height:1px)').matches,orient:screen.width+'x'+screen.height+' '+outerWidth+'x'+outerHeight};function walk(rs,ctx){for(var i=0;i<rs.length;i++){var r=rs[i];if(r.cssRules&&r.conditionText!==undefined){walk(r.cssRules,ctx+' @'+r.conditionText)}else if(r.selectorText&&/(^|[ ,])(html|:root|body|main)([ ,:.#\\[]|$)/.test(r.selectorText)){o.rules.push(ctx+' '+r.cssText.slice(0,200))}}}for(var j=0;j<document.styleSheets.length;j++){try{walk(document.styleSheets[j].cssRules,'')}catch(e){}}return JSON.stringify(o)})()"
          ASSERT = "(function(){var c=document.querySelector('canvas');var r=c&&c.getBoundingClientRect();return JSON.stringify({mq:matchMedia('(min-height:1px)').matches,body:document.body.getBoundingClientRect().height,cssH:r?r.height:-1,ih:innerHeight})})()"
          t0 = time.time(); nxt = 0; reloaded = False
          send("Page.getLayoutMetrics"); send("Emulation.getDeviceMetricsOverride") if False else None
          send("Page.reload")
          ws.settimeout(1)
          verdict = []
          while time.time() - t0 < secs:
              if time.time() - t0 >= nxt:
                  nxt += 15; send("Runtime.evaluate", {"expression": ASSERT, "returnByValue": True}); send("Runtime.evaluate", {"expression": STATE3, "returnByValue": True}); send("Runtime.evaluate", {"expression": STATE2, "returnByValue": True, "awaitPromise": True}); i = send("Runtime.evaluate", {"expression": STATE, "returnByValue": True}); log("[%ds] eval sent id %d" % (time.time() - t0, i))
              try: m = json.loads(ws.recv())
              except websocket.WebSocketTimeoutException: continue
              meth = m.get("method")
              if meth == "Runtime.consoleAPICalled":
                  p = m["params"]; log("[%ds] console.%s" % (time.time() - t0, p["type"]), " | ".join(str(a.get("value", a.get("description", ""))) for a in p["args"])[:400])
              elif meth == "Runtime.exceptionThrown": log("[%ds] EXC" % (time.time() - t0), json.dumps(m["params"])[:600])
              elif meth == "Log.entryAdded": e = m["params"]["entry"]; log("[%ds] log" % (time.time() - t0), e.get("level"), e.get("text", "")[:300], e.get("url", ""))
              elif meth == "Network.loadingFailed": log("[%ds] NETFAIL" % (time.time() - t0), json.dumps(m["params"])[:300])
              elif meth in ("Page.frameNavigated",): log("[%ds] nav" % (time.time() - t0), m["params"]["frame"].get("url"))
              elif meth == "Network.responseReceived":
                  r = m["params"]["response"]; log("[%ds] resp" % (time.time() - t0), r["status"], r["url"][:140], r.get("encodedDataLength", ""))
              elif "result" in m and "layoutViewport" in m["result"]: log("[%ds] METRICS" % (time.time() - t0), json.dumps(m["result"]))
              elif "result" in m and "result" in m["result"] and "value" in m["result"]["result"] and m["result"]["result"]["value"].startswith('{"mq"'): verdict.append(json.loads(m["result"]["result"]["value"])); log("[%ds] ASSERT" % (time.time() - t0), m["result"]["result"]["value"])
              elif "result" in m and "result" in m["result"] and "value" in m["result"]["result"]: log("[%ds] STATE" % (time.time() - t0), m["result"]["result"]["value"])
          # the regression test (#1694): once the tab is shown, the page's layout viewport is not zero and floor796 sizes its canvas
          last = verdict[-1] if verdict else None
          log("VERDICT", json.dumps(last))
          sys.exit(0 if last and last["mq"] and last["body"] > 0 and last["cssH"] > 0 else 3)
          PY
          cat > run.sh <<'EOF'
          #!/bin/bash
          mkdir -p probe screens
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb install -r -g app.apk || exit 2
          adb logcat -v threadtime "*:W" CloudWebConsole:I chromium:I > probe/logcat.txt 2>&1 &
          adb shell am start -S -W -n com.diegonmarcos.cgomniverse/.MainActivity -e section galaxy; sleep 20
          adb shell run-as com.diegonmarcos.cgomniverse sh -c 'cd files/site-cache-v2 && ls -R | head -40; cat floor796.com/manifest.json | head -c 4000' > probe/cache-manifest.txt 2>&1
          adb shell dumpsys activity top | grep -iE "WebView|AndroidViewsHandler|ComposeView|AndroidComposeView" | head -20 > probe/views-galaxy.txt
          python3 cdp.py com.diegonmarcos.cgomniverse galaxy 50; RC=$?
          adb shell run-as com.diegonmarcos.cgomniverse sh -c 'cd files/site-cache-v2/floor796.com && for f in blobs/*; do s=$(wc -c < $f); echo $f $s; done | sort -k2 -n | head -60' >> probe/cache-manifest.txt 2>&1
          adb exec-out screencap -p > probe/galaxy.png
          if [ -f browser.apk ]; then
            adb install -r -g browser.apk
            adb shell am start -a android.intent.action.VIEW -d https://floor796.com -p com.diegonmarcos.cloudbrowser; sleep 20
            adb shell dumpsys activity top | grep -iE "WebView|AndroidViewsHandler|ComposeView|AndroidComposeView" | head -20 > probe/views-browser.txt
            python3 cdp.py com.diegonmarcos.cloudbrowser browser 40
            adb exec-out screencap -p > probe/browser.png
          fi
          exit $RC
          EOF
          chmod +x run.sh
      - name: Boot emulator + probe
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./run.sh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-omniverse-f796-cdp
          path: probe
          retention-days: 14
