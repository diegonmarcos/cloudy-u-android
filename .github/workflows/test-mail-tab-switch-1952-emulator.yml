name: "Test -> Cloud Mail tab switch keeps the list (emulator: Mail, Alerts and back three times with first-row timings, then a 502 server and a cold relaunch)"

# #1952 proof. The Cloud Mail test variant (-PtestApp, with libmail_core.so for x86_64) syncs a fake JMAP server on this runner
# (ac_cloud-mail/test/fake-jmap-server.py, 300 extra Inbox messages), the list is scrolled, Mail -> Alerts -> Mail is walked three times
# (same rows, same scroll position, ONE list ViewModel, first row within 300 ms, read from the app's own MailList log), then the server
# answers 502 to everything and the app is killed and relaunched: the cached list shows under a banner (reason, last sync, Retry).
# Input mutation=tab-push applies the code before the fix (a bar tap pushes a new list entry): the walk then only has to REPRODUCE the
# defect (several list ViewModels) and records its timings. Evidence: the artifact mail-1952-evidence. Dispatch only; nothing is published.

on:
  workflow_dispatch:
    inputs:
      mutation:
        description: 'none | tab-push (the bar pushes a new list entry again: reproduces the defect)'
        required: false
        default: 'none'

permissions:
  contents: read

jobs:
  mail-tab-switch-1952:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The Rust core is REQUIRED here: without it the proof would silently run on the Kotlin sync and prove nothing about #1837.
      MAIL_CORE_RS_REQUIRED: "1"
      MAIL_CORE_ABIS: "x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}

      - name: The testers of the fake server and of the walk
        run: |
          set -eu
          python3 -I ac_cloud-mail/test/fake-jmap-server.py --selftest
          bash -n ac_cloud-mail/test/walk-mail-tab-switch-1952.sh

      - name: Apply mutation ${{ inputs.mutation }}
        if: inputs.mutation == 'tab-push'
        run: |
          set -eu
          F=ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/TabMove.kt
          sed -i 's/is TabMove.Return -> if (!popBackStack(move.route, inclusive = false, saveState = true)) navigate(move.route)/is TabMove.Return -> navigate(move.route)/' $F
          sed -i 's/popUpTo(move.above) { saveState = true }//; s/launchSingleTop = true//; s/restoreState = true//' $F
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
          git diff
          echo "EXPECT_BROKEN=1" >> "$GITHUB_ENV"

      - name: Resolve the native core toolchain (build.json::native_core.toolchain)
        id: native
        working-directory: ac_cloud-mail
        run: |
          set -eu
          targets="$(jq -r '.native_core.toolchain.rust_targets | join(",")' build.json)"
          ndk="$(jq -r '.native_core.toolchain.ndk' build.json)"
          [ -n "$targets" ] && [ "$ndk" != "null" ] || { echo "::error::build.json::native_core.toolchain is incomplete"; exit 1; }
          { echo "targets=$targets"; echo "ndk=$ndk"; } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.native.outputs.targets }}

      - name: Point the build at the NDK
        run: |
          set -eu
          ndk="${{ steps.native.outputs.ndk }}"
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          fi
          [ -x "$ANDROID_HOME/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ] || { echo "::error::NDK $ndk is not installed"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the test variant (with the x86_64 Rust core)
        run: |
          set -eu
          cd ac_cloud-mail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PtestApp
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | sort | head -1)
          [ -n "$apk" ] || { echo "::error::no APK built"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/app-under-test.apk"
          unzip -l "$GITHUB_WORKSPACE/app-under-test.apk" | grep -E 'lib/x86_64/libmail_core\.so' || { echo "::error::the APK carries no libmail_core.so"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "PKG=$("$AAPT" dump packagename "$GITHUB_WORKSPACE/app-under-test.apk")" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + the tab switch walk
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-mail/test/walk-mail-tab-switch-1952.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-1952-evidence
          path: walk-out-1952
          if-no-files-found: warn
