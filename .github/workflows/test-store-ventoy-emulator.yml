# #1405 Cloud Store > Cloud > Ventoy on an emulator: vold's virtual disk is the USB-C drive (the #1375 method); the run
# shoots the Ventoy tab after Tiny-ML, the drive picker, the per-drive SAF grant, the four tables, and a small test image
# installed onto the virtual drive (its sha256 read back from the drive). Script: ac_cloud-store/test/emulator-ventoy.sh.
name: "Test -> Store Ventoy (emulator)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Ship cloud-store run id whose x86_64 APK artifact to test"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  ventoy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the Store APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p apk
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name|startswith("Cloud-Store-x86_64-")) | .name' |
          while read -r name; do gh run download "$RUN_ID" -R "$REPO" -n "$name" -D "apk/dl-$name"; done
          find apk -name '*.apk' -path '*dl-*' | head -1 | xargs -I{} cp {} apk/store.apk
          ls -l apk/store.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + Store Ventoy (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-store/test/emulator-ventoy.sh apk/store.apk out

      - name: Boot emulator + Store Ventoy (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-store/test/emulator-ventoy.sh apk/store.apk out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-ventoy-evidence
          path: out/
          if-no-files-found: warn
