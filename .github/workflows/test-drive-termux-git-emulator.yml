# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test -> Drive git jobs in cld.termux, healthy and broken rootfs (#1436) ║
# ║ Installs cld.termux + cloud-lib-rootfs-termux + Cloud Drive (release-  ║
# ║ signed) on an x86_64 API-34 emulator; clone, bare clone and force_pull ║
# ║ with a healthy rootfs, then from the phone's broken state (tarball     ║
# ║ gone, stamp stale) with no user action; the rootfs must end repaired.  ║
# ║ Script: ac_cloud-drive/test/emulator-termux-git-modes.sh.              ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test -> Drive git in cld.termux, both modes (emulator)"

on:
  workflow_dispatch:
    inputs:
      drive_run_id:
        description: "Ship cloud-drive run id whose x86_64 APK artifact to test (empty = the latest release asset)"
        required: false
        default: ""
      termux_run_id:
        description: "Ship cloud-termux run id whose x86_64 APK artifact to test (empty = the latest release asset)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  termux-git-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Drive, cld.termux and the rootfs lib
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRIVE_RUN: ${{ inputs.drive_run_id }}
          TERMUX_RUN: ${{ inputs.termux_run_id }}
        run: |
          set -eu
          mkdir -p apk
          art() {  # $1 run id, $2 artifact name prefix, $3 output apk
            gh api "repos/$REPO/actions/runs/$1/artifacts" --paginate --jq ".artifacts[] | select(.name|startswith(\"$2\")) | .name" |
            while read -r name; do gh run download "$1" -R "$REPO" -n "$name" -D "apk/dl-$name"; done
            find apk -name '*.apk' -path "*dl-$2*" | head -1 | xargs -I{} cp {} "$3"
          }
          if [ -n "$DRIVE_RUN" ]; then art "$DRIVE_RUN" Cloud-Drive-x86_64- apk/drive.apk
          else gh release download latest -R "$REPO" -p Cloud-Drive-x86_64.apk -O apk/drive.apk; fi
          if [ -n "$TERMUX_RUN" ]; then art "$TERMUX_RUN" cloud-terminal-x86_64- apk/terminal.apk
          else gh release download latest -R "$REPO" -p cloud-terminal-x86_64.apk -O apk/terminal.apk; fi
          gh release download latest -R "$REPO" -p Cloud-Lib-Rootfs-Termux-x86_64.apk -O apk/rootfs.apk
          ls -l apk

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + clone / bare clone / force_pull, healthy and broken rootfs
        timeout-minutes: 105
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 12000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-drive/test/emulator-termux-git-modes.sh apk/drive.apk apk/terminal.apk apk/rootfs.apk out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-git-modes-evidence
          path: out/
          if-no-files-found: warn
