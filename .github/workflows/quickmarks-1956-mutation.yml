# #1956 Phone Quickmarks mutation runs: each leg applies ONE deliberate break to the declared quickmarks (aa_cloud-superapp/build.json) or to
# the folder face renderer and runs the SuperApp JVM suite, whose named Quickmarks1956Test test must catch it. The suite is RED (expected);
# the JOB is green only when the verdict step reads that test as failed in the XML (KILLED). A survivor, or a test that never ran, fails the job. Manual only.
name: quickmarks-1956-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'social-back-in-prj | link-dropped | lnktree-differs | tidal-dropped | prime-back | quickmark-dropped | gemini-dropped | github-in-code | icon-swapped | face-first-installed | linkedin-dropped'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: aa_cloud-superapp
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate the dispatch input against the allow-list
        env:
          M: ${{ inputs.name }}
        run: |
          case "$M" in
            social-back-in-prj|link-dropped|lnktree-differs|tidal-dropped|prime-back|quickmark-dropped|gemini-dropped|github-in-code|icon-swapped|face-first-installed|linkedin-dropped) ;;
            *) echo "::error::unknown mutation"; exit 2 ;;
          esac
      - name: Apply the mutation
        env:
          M: ${{ inputs.name }}
        run: |
          python3 -I - "$M" <<'PY'
          import json, sys
          m = sys.argv[1]
          P = 'aa_cloud-superapp/build.json'
          K = 'aa_cloud-superapp/app/src/main/java/com/diegonmarcos/superapp/apps/SuitePhoneAppsFragment.kt'
          if m == 'face-first-installed':
              s = open(K).read()
              t = s.replace('FolderTile(folder.label, contents, null, folder.iconRes)', 'FolderTile(folder.label, contents, contents.firstOrNull { it.installed }, "")')
              assert s != t
              open(K, 'w').write(t); sys.exit(0)
          s = open(P).read()
          # only the phone_app_groups array is rewritten; the rest of build.json stays byte-identical (other suites read it as text)
          i = s.index('"phone_app_groups": [') + len('"phone_app_groups": ')
          ph, j = json.JSONDecoder().raw_decode(s, i)
          fo = lambda g, l: [f for x in ph if x['title'] == g for f in x['folders'] if f['label'] == l][0]
          def drop(g, l, p): f = fo(g, l); f['packages'] = [x for x in f['packages'] if x['pkg'] != p]
          def add(g, l, p): fo(g, l)['packages'].append({'pkg': p, 'label': p})
          if m == 'social-back-in-prj': drop('Me', 'Me-Pers', 'com.pinterest'); add('Me', 'Me-Prj', 'com.pinterest')
          elif m == 'link-dropped': fo('Me', 'Me-Prj').pop('links')
          elif m == 'lnktree-differs': fo('Me', 'Lnktree').pop('links')
          elif m == 'tidal-dropped': drop('Services · Leisure', 'Media Center', 'com.aspiro.tidal')
          elif m == 'prime-back': add('Services · Leisure', 'Media Center', 'com.amazon.avod.thirdpartyclient')
          elif m == 'quickmark-dropped': drop('Me', 'Me-Pers', 'com.strava')
          elif m == 'gemini-dropped': drop('AGI', 'AI', 'com.google.android.apps.bard')
          elif m == 'github-in-code': drop('Data', 'Drive', 'com.github.android'); add('AGI', 'Code', 'com.github.android')
          elif m == 'linkedin-dropped': drop('Services · City', 'Jobs & Business', 'com.linkedin.android')
          elif m == 'icon-swapped': fo('Me', 'Me-Prj')['icon_res'] = 'ic_file_stack'
          out = json.dumps(ph, indent=2, ensure_ascii=False).replace('\n', '\n        ')
          open(P, 'w').write(s[:i] + out + s[j:])
          PY
          git diff --stat
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;28.0.13004108 ndk;26.1.10909125"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected; the verdict step reads the XML)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" || true
      - name: Verdict (KILLED = the named test failed)
        env:
          M: ${{ inputs.name }}
        run: |
          C=Quickmarks1956Test
          case "$M" in
            social-back-in-prj)   N="the social apps sit in Me-Pers and no longer in Me-Prj" ;;
            link-dropped)         N="Me-Prj holds a web link quickmark to the Linktree page" ;;
            lnktree-differs)      N="Lnktree holds the same icons as Me-Prj" ;;
            tidal-dropped)        N="Tidal is in Media Center and Prime Video is not" ;;
            prime-back)           N="every quickmark that existed before is still present, except Prime Video in Media Center" ;;
            quickmark-dropped)    N="every quickmark that existed before is still present, except Prime Video in Media Center" ;;
            gemini-dropped)       N="Gemini is in AI" ;;
            github-in-code)       N="GitHub is in the Drive folder and not in Code" ;;
            linkedin-dropped)     N="LinkedIn is in Jobs and Business after Indeed and stays in Me-Pers" ;;
            icon-swapped)         N="every folder icon equals the icon of the same tile on the Cloud page" ;;
            face-first-installed) N="the folder face draws the declared Cloud icon and not the first installed app" ;;
            *) echo "::error::unknown mutation"; exit 2 ;;
          esac
          X="$(find aa_cloud-superapp/app/build -path '*test-results*' -name "TEST-*.$C.xml" | head -1)"
          [ -n "$X" ] || { echo "::error::LEG ERROR $M: no result for $C (did not compile or run); not a kill"; exit 1; }
          python3 -I - "$X" "$N" "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, want, leg = sys.argv[1:]
          cases = {c.get("name"): c for c in ET.parse(path).getroot().iter("testcase")}
          failed = sorted(n for n, c in cases.items() if c.find("failure") is not None or c.find("error") is not None)
          print("failed tests:", failed)
          if want not in cases: print("::error::LEG ERROR %s: the named test did not run: %s" % (leg, want)); sys.exit(1)
          if want not in failed: print("::error::LEG SURVIVED %s: the named test stayed green: %s" % (leg, want)); sys.exit(1)
          print("KILLED %s by: %s" % (leg, want))
          PY
