name: "zz office peek (temporary, #1630)"
on:
  workflow_dispatch: {}
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pin
        id: pin
        run: echo "revision=$(jq -r '.upstream.online.revision' ac_cloud-office/build.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cloud-office/online/.git
          key: cloud-office-online-${{ steps.pin.outputs.revision }}
      - name: materialize + print
        run: |
          bash ac_cloud-office/build.sh materialize
          O="$RUNNER_TEMP/cloud-office/online/android"
          for f in build.gradle settings.gradle gradle.properties gradle/wrapper/gradle-wrapper.properties app/build.gradle; do echo "=====FILE $f"; cat "$O/$f"; done
