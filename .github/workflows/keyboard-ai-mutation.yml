# Cloud Keyboard AI Routing mutation proof: the OpenRouter model list (parse, cache with timestamp, offline keeps the
# cache, search and free filter), the per-task model choice, the ML libs vs OpenRouter routing rule with its fallback,
# and Grammar Check's Highlight Ignore are pinned by the JVM tests in libs:keyboard helium314.keyboard.latin.ai.
# This job runs those tests once on the real tree (GREEN expected), then once per planted mutant (RED expected, one
# break each). It fails if the real tree is red or any mutant stays green. Manual only.
name: keyboard-ai-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: "all | one of the mutant names below"
        required: false
        default: "all"
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-keyboard
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools ndk;28.0.13004108 ndk;26.1.10909125"
      - name: Set up Gradle 8.14 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: Real tree GREEN, every mutant RED
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ONLY: ${{ inputs.name }}
        run: |
          set -u
          L=ab_cloud-libs-shared/libs/keyboard/src/main/java/helium314/keyboard/latin
          C=$L/OpenRouterCatalog.kt; R=$L/AiTaskRouting.kt; H=$L/GrammarHighlights.kt
          suite() { gradle --no-daemon -p "$WORK_DIR" :libs:keyboard:testDebugUnitTest --tests 'helium314.keyboard.latin.ai.*' > /tmp/suite.log 2>&1; }
          # a mutant line is name@anchor@replacement@file, file = C (catalog) | R (routing) | H (highlights)
          sub() { python3 -c 'import sys; p, a, b = sys.argv[1:]; s = open(p).read(); assert a in s, "anchor missing: " + a; open(p, "w").write(s.replace(a, b, 1))' "$3" "$1" "$2"; }
          suite || { tail -80 /tmp/suite.log; echo "::error::the real tree is RED"; exit 1; }
          grep -c 'testcase' "$WORK_DIR"/../ab_cloud-libs-shared/libs/keyboard/build/test-results/testDebugUnitTest/TEST-helium314.keyboard.latin.ai.*.xml 2>/dev/null || true
          echo "real tree: GREEN"
          stayed=0
          while IFS='@' read -r name a b f; do
            [ -z "$name" ] && continue
            [ "$ONLY" != "all" ] && [ "$ONLY" != "$name" ] && continue
            git checkout -- "$C" "$R" "$H"
            case "$f" in C) F="$C" ;; R) F="$R" ;; *) F="$H" ;; esac
            sub "$a" "$b" "$F" || { echo "::error::$name: mutation anchor missing"; stayed=$((stayed + 1)); continue; }
            if suite; then echo "::error::mutant stayed GREEN: $name"; stayed=$((stayed + 1)); else echo "RED (caught): $name"; fi
          done <<'MUTANTS'
          per-million@?.let { it * 1_000_000.0 }@?.let { it * 1_000.0 }@C
          free-suffix@id.endsWith(":free") ||@id.endsWith(":paid") ||@C
          name-prefix@.substringAfter(": ")@.substringAfter(":: ")@C
          offline-class@return if (isOffline(e)) RefreshResult.Offline@return if (false) RefreshResult.Offline@C
          cache-timestamp@val c = Catalog(now, models)@val c = Catalog(0L, models)@C
          empty-is-failure@if (models.isEmpty()) return@if (false) return@C
          filter-free@(!freeOnly || m.free)@(freeOnly || m.free)@C
          search-all-words@words.all { w ->@words.any { w ->@C
          task-key@"ai_task_model_${task.id}"@"ai_task_model"@R
          switch-default-ml@AiEngine.fromId(store.get(key(task))) ?: AiEngine.ML@AiEngine.fromId(store.get(key(task))) ?: AiEngine.OPENROUTER@R
          online-required@val orUsable = online && hasKey@val orUsable = hasKey@R
          offline-fallback-ml@mlAvailable -> EngineResolution(chosen, AiEngine.ML, fallback,@false -> EngineResolution(chosen, AiEngine.ML, fallback,@R
          ml-unavailable-uses-or@AiEngine.OPENROUTER, fallback, EngineResolution.Reason.ML_UNAVAILABLE@null, fallback, EngineResolution.Reason.ML_UNAVAILABLE@R
          grammar-ai@active == AiEngine.OPENROUTER -> "ai"@active == AiEngine.OPENROUTER -> "local"@R
          ignore-removes@issues.remove(issue)@issues.size@H
          ignore-remembered@ignored += issue.ignoreKey@Unit@H
          recheck-skips-ignored@found.filter { it.ignoreKey !in ignored }@found.filter { true }@H
          replace-shift@if (o.start >= issue.end) issues[i]@if (false) issues[i]@H
          tap-edge@cursor >= it.start && cursor <= it.end@cursor > it.start && cursor < it.end@H
          session-clears-ignores@issues.clear(); ignored.clear()@issues.clear()@H
          MUTANTS
          git checkout -- "$C" "$R" "$H"
          [ "$stayed" -eq 0 ] || { echo "::error::$stayed mutant(s) stayed green"; exit 1; }
          echo "every mutant RED"
