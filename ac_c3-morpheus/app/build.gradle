apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def a = buildJson.android
def s = buildJson.surfaces

// versionCode MUST move on every build, or nothing lands.
//
// Same encoding as ac_c3-watchdog, ac_cloud-mail and lib-apks, and for the
// same reason: minutes since 2026-01-01 UTC over a 3,000,000 base. A build
// counter (GITHUB_RUN_NUMBER) is per-WORKFLOW, so the moment an app is built by
// a different workflow than the one that produced the installed APK the number
// handed out can be SMALLER and Android refuses the update outright. Wall clock
// only moves forward and is identical for every workflow, runner and trigger.
// COMMS_BUILD_TIMESTAMP is honoured when CI provides one so the code matches
// the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

// #826 the build commit, baked into versionName "(sha-xxxxxxxx)" + BuildConfig.GIT_SHORT_SHA so
// Store Details (libs/appstore BuiltFrom) and About can name the installed build. Same
// derivation as the rest of the fleet: GITHUB_SHA first, `git rev-parse` locally. versionCode
// is untouched — identity on the fleet's update path stays what it was.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

android {
    namespace 'com.diegonmarcos.morpheus'
    compileSdk a.compile_sdk

    defaultConfig {
        applicationId a.application_id
        resValue "string", "app_name", buildJson.display_name
        minSdk        a.min_sdk
        targetSdk     a.target_sdk
        versionCode   codeFinal
        versionName   "${a.version_name} (sha-${shortSha})"
        buildConfigField "String", "GIT_SHORT_SHA", "\"${shortSha}\""
        ndk { abiFilters a.abi_filters as String[] }

        // The surfaces are DATA, in build.json — never Kotlin constants. Same
        // rule libs/ops follows for DAGU_DEFAULT_SERVER, and the reason is that
        // a URL hardcoded in a class is a URL that gets copied and then
        // diverges from the one the rest of the fleet uses.
        buildConfigField "String", "DAGU_URL", "\"${s.dagu_url}\""
        buildConfigField "String", "PACA_URL", "\"${s.paca_url}\""
        buildConfigField "String", "SUPERAPP_PACKAGE", "\"${s.superapp_package}\""
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // No feature lib module: v1 draws four panels over surfaces that already
    // exist. When `run` gets wired, it takes the trigger client from libs/ops
    // rather than growing one here.
    // #743 fleet mesh membership: core defines + requests CONSTELLATION_DATA and
    // carries libs:devtools (fleet provider, MESH_MEMBER receiver and query).
    implementation project(':libs:web-core')   // #1371 the fleet's one web view (CloudWeb, WebProfile)
    implementation project(':libs:core')
    // 2026-10-15 owner decision: all apps must be Compose. The screen is a Compose host under
    // the fleet's CloudKitTheme, shared BY REFERENCE like the modules above.
    implementation project(':libs:ui-kit')
    // #1352 Configs ▸ General / ▸ About (FleetConfigsMenu, libs:ui-nav-bars)
    implementation project(':libs:ui-nav-bars')
    // #1630 fleet-default Configs tail: Agents, Logcat, X-Ray App register themselves on the shared strip.
    implementation project(':libs:fleetconfigs-agents')
    implementation project(':libs:fleetconfigs-logcat')
    implementation project(':libs:fleetconfigs-xray')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
