// libs:wysiwyg (#1484) — THE shared WYSIWYG engine: a block document model with inline marks (bold, italic, code, link),
// the Markdown and HTML codecs (both round-trip), the edit operations (mark tracking through typing, toggle, split) and a
// Compose editor and viewer on top. Consumed by BOTH Cloud-Drive (the Editor tab) and Cloud-Notes (its native Markdown
// view); who owns it is decided later, so it imports nothing from any application.
//
// Shared BY REFERENCE; lib-apks excludes it (compiled into its consumers, nothing to install). TESTED in src/test (JVM,
// no emulator) inside the consuming app's `gradle test`; the model, the ops and the codecs are plain Kotlin.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.wysiwyg'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // KitDensity: the fleet's dense spacing and type ramp (no dp or sp literal in this module).
    implementation project(':libs:ui-kit')

    testImplementation 'junit:junit:4.13.2'
}
