// libs:scraper — #1427/#1428 the Cloud Browser's Scrapers section (Site Files, Apify, SelfHosted), shared by
// reference like every lib (build.json::modules dir). Separate from libs:browser on purpose: it reads the
// browser's stores as files/JSON (WebView simple cache, browser_downloads, offline index, browser_history)
// and never links the browser's code, so a tool here cannot break browsing.
//
// Heavy work is NOT here: YouTube extraction (yt-dlp) runs in the scrappers-api container (#1429). This lib
// builds the request, calls the API (mesh first, public fallback) and keeps the light on-device paths;
// the Music page (#1459: Spotify, YouTube Music, Deezer, Apple Music read, matching, playlist sync, CSV/JSON export) talks to each
// service's own API and keeps its tokens encrypted; audio extraction is its own lib, libs:media-convert-audio (MediaExtractor/MediaMuxer, no FFmpeg).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.scraper'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    api project(':libs:theme-background')
    api project(':libs:ui-kit')   // #1459 KitFileTree: the shared folder-explorer tree and its Store-dense rows
    implementation project(':libs:web-core')   // #1371 the viewer's page view is CloudWeb's (profile BROWSER, local archive)
    implementation project(':libs:media-convert-audio')
    implementation project(':libs:apify')   // #1468 the fleet's one Apify backend choice + encrypted token store
    implementation project(':libs:crash')   // #1459 SafeEncryptedPrefs: the Music tokens' only store
    implementation 'androidx.security:security-crypto:1.1.0'   // crash links it compileOnly: the app that opens an encrypted file brings it
    api platform('androidx.compose:compose-bom:2025.11.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.foundation:foundation'
    api 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
