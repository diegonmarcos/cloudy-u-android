// libs:repo-workspace (#1855 P1) - the boundary the fleet reaches Cloud Drive's git workspace across,
// and NOTHING else. Cloud Drive owns git (STORE / EMULATED / EXTERNAL volumes, the sync engine, the
// clone flow); an app that wants to know where a repository is, or to have it cloned, binds this
// contract instead of building a sync engine or probing volumes of its own (Cloud Code, Notes, ...).
//
// This module holds only the AIDL contract, its wire rows (RepoInfo) and the client that binds it.
// Deliberately dependency-free beyond core-ktx: every consumer links this.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.repoworkspace'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    buildFeatures {
        aidl true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
