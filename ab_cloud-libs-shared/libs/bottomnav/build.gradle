// libs:bottomnav: THE bottom nav of the whole fleet, in Compose, shared by reference.
//
// Decree 2026-09-24: every app converts to Compose, and Compose is mandatory. This module is
// the ONE declaration of the bottom nav they all render (#565). It began as cloud-mail's
// icon-only bar (#465/#493). It now holds the port of superapp's View-era design
// (CloudBottomNavView + bg_nav_island + bg_bottom_nav_item_checked + the bottom_nav_* tokens):
// a full-pill island at 80% width, a selected PILL around icon+label, concentric end insets, a
// one-dimen bottom clearance plus the live cutout inset, and scroll-collapse to icons only —
// driven in a Compose shell by BottomNavCollapse and in a View shell by
// BottomNavIslandView.collapseOnScrollIn, which #673 added because the View shells drove the
// collapse from nowhere and so never showed it. It
// is ported, not wrapped: there is no AndroidView here. Items are injected (BottomNavEntry), so
// no app's menu is baked in. cloud-mail owns its own five-item table (#868 moved it out of this module).
// superapp consumes it since #531 through BottomNavIslandView, the Compose host an XML shell
// drops into its layout. me / nav / notes still draw their own View navs until their pushes.
//
// Deliberately sparse on the independent-version axis (text-tools / core precedent): it builds
// under whichever AGP the app that pulls it in uses. The versions below match cloud-mail's
// catalog.
//
// The app TOP bar (AppTopBar: hamburger + drawer slot, title, AI panel, Settings dropdown, declared by
// build.json::ui.top_bar) lives beside the island because the page tabs and the island are the rest of the same
// chrome; its AI panel is a slot, so this module does not link libs:ai (the host fills it).
//
// TESTED where it builds: src/test/ (Robolectric, JVM, no emulator) runs as
// :libs:bottomnav:testReleaseUnitTest inside the consuming app's own `testReleaseUnitTest`
// (ac_cloud-mail/build.json::tests.unit). The consuming app's ship workflow watches this
// directory, so a change here re-runs that test.

plugins {
    id 'com.android.library'
}
// Conditional: an AGP 9 consumer (cloud-camera) self-registers the 'kotlin' extension and
// hard-errors on a second apply ("Cannot add extension with name 'kotlin'"); AGP 8 consumers still
// need it. Same pattern as libs/core/build.gradle and libs/analytics/build.gradle.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}
// @Composable source needs the compose compiler. Resolved from the consuming app's root build
// (cloud-mail declares it `apply false` in its root, so the bare id works here; cloud-camera puts
// it on its buildscript classpath).
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.diegonmarcos.superapp.bottomnav'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        compose = true
    }

    // #876: the pure-Compose sources live in src/commonMain/kotlin so the wasm web root
    // (ab_cloud-libs-shared/web) compiles the very same files; the Android build adds them here.
    sourceSets.main.kotlin.srcDirs += 'src/commonMain/kotlin'

    // Robolectric resolves this module's own R.dimen / R.color / R.fraction, which is how the
    // geometry test reads the tokens back instead of restating them.
    testOptions {
        unitTests {
            includeAndroidResources = true
            // Print the assertion MESSAGE in the CI log. Gradle's default prints only the
            // exception class and line, and the measured numbers are the whole point of the test.
            all {
                testLogging {
                    events 'failed', 'standardOut'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // #1160 the nav icon catalog: navEntry() / catalogEntries() draw every nav glyph from it.
    api project(':libs:ui-icons')
    // Compose UI + Material3 + the extended icon set the island draws, and the
    // navigation-compose NavController that drives destination moves. Pinned to
    // the same BOM and versions cloud-mail's app module links, so this lib
    // composes against the app's own compose/AGP toolchain.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    // AppTopBar's drawer closes on Back (BackHandler); navigation-compose already carries it, named here so it is not by accident.
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'

    // The geometry test (BottomNavIslandTest): renders the real island under Robolectric and
    // measures it. NATIVE graphics lets it read pixels back.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
