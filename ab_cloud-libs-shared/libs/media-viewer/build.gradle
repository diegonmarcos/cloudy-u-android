// libs:media-viewer (#1484) — VIEW-ONLY image, audio and video. Platform APIs only: BitmapFactory (down-sampled, pinch zoom),
// MediaPlayer (play/pause, seek) and VideoView with the platform MediaController. No third-party dependency, so no licence
// entry. It edits nothing: editor-core routes media files with editable=false.
//
// Shared BY REFERENCE; lib-apks excludes it (compiled into its consumers, nothing to install). TESTED in src/test (JVM, no
// emulator): the sampling arithmetic, the kind mapping and the time format are plain Kotlin.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.mediaviewer'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // KitDensity: the fleet's dense spacing and type ramp (no dp or sp literal in this module).
    implementation project(':libs:ui-kit')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}
