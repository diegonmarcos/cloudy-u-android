// libs:tile-grid (#1893): the sectioned icon-tile grid of Cloud SuperApp's Cloud page, extracted from the SuperApp module so Cloud Calc's Home
// draws the very same component: the group and subgroup headings (TileGroupHeader, TileSubgroupHeader), the index card grid
// (IndexTiles, IndexTileGrid) and the sizing arithmetic (TileSizing, which settings/GridColumns delegates to). Kotlin package unchanged
// (com.diegonmarcos.superapp.launcher), so the SuperApp's call sites are as they were.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.tilegrid'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api platform('androidx.compose:compose-bom:2025.11.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.foundation:foundation'
    api 'androidx.compose.material3:material3'
    api project(':libs:ui-kit')
    testImplementation 'junit:junit:4.13.2'
}
