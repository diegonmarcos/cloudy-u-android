// libs:fleetconfigs-agents: the Configs > Agents tab (#1630): the agents THIS app declares in build.json::fleet_agents (baked by ui-nav-bars as FleetConfigs.current.agents). Registers itself on the shared Configs strip; the strip draws it first after the | (Agents, Perms, Logcat, X-Ray App, About). Reverse dependency on libs:ui-nav-bars like libs:fleetconfigs-logcat.
plugins {
    id 'com.android.library'
}
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.diegonmarcos.superapp.fleetagents'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api project(':libs:ui-nav-bars')     // the Configs framework + FleetConfigsExtensions registry (brings theme-background via api)
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.15.0'

    testImplementation 'junit:junit:4.13.2'
}
