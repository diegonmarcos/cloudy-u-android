[package]
name = "browser-core-rs"
version = "0.1.0"
edition = "2021"
description = "Cloud Browser's native core (#1841): the session/tab snapshot store (bundled SQLite), history and bookmark search, and content-blocking filter matching, behind a thin JNI layer."
publish = false

[lib]
# libbrowser_core.so: System.loadLibrary("browser_core") from libs:browser-core-rs' NativeBridge.
name = "browser_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The session store: SQLite compiled in (`bundled`, so every ABI gets the same SQLite and no system library is assumed).
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The JNI layer (src/jni_api.rs).
jni = "0.21"

# The bundled SQLite is C: optimise it in test builds too, so the CI performance budgets measure real SQLite, not -O0.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NEVER "abort": a panic must unwind to the catch_unwind at the JNI boundary so Kotlin can fall back (as mail-core-rs, #1837).
panic = "unwind"
