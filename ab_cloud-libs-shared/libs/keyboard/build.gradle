// SPDX-License-Identifier: GPL-3.0-only
//
// libs:keyboard — Cloud Keyboard, the owned keyboard provider (derived from
// HeliBoard, github.com/Helium314/HeliBoard, GPL-3.0 — see README.md). The
// whole src/main tree is ours: edit it directly, no upstream sync.
//
// Toolchain pins: see build.json::toolchain.
//
// Native: ndk-build of src/main/jni/Android.mk -> libjni_latinime.so. Glide
// typing needs Google's proprietary libjni_latinimegoogle.so, which is NEVER
// bundled (keeps the APK FOSS) — the in-app "Load gesture typing library"
// setting fetches it at runtime into app data.
//
// namespace MUST be helium314.keyboard.latin: the manifest declares
// the IME service relatively (android:name="LatinIME"), which resolves against
// the namespace -> helium314.keyboard.latin.LatinIME (the real class path).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // HeliBoard uses kotlinx.serialization (@Serializable settings models).
    id 'org.jetbrains.kotlin.plugin.serialization'
    // Kotlin 2.0+ Compose compiler plugin — HeliBoard's settings UI is Compose
    // (material3 + navigation-compose). Version pinned in root build.gradle.
    id 'org.jetbrains.kotlin.plugin.compose'
}

// HeliBoard is an APPLICATION upstream, so its code reads BuildConfig.{VERSION_CODE,
// VERSION_NAME,APPLICATION_ID} — fields AGP only auto-generates for application
// modules, NOT libraries (DEBUG + BUILD_TYPE are auto for both). As a library we
// inject them below from the consuming app's build.json, so the keyboard's
// About/upgrade/gesture code resolves against the app it is built into.
// rootDir, NOT '../../': this module is shared by reference into cloud-keyboard,
// so a module-relative path resolves to aa_cloud-superapp/build.json and the
// keyboard APK was being baked with SUPERAPP's application_id and version -
// its own BuildConfig identified it as cloud-superapp. rootDir is the
// CONSUMING app's build.json, which is what 'single source of truth' meant.
apply from: '../fleet-urls.gradle'   // #1093 fleetUrl(): the LanguageTool host comes from the one fleet declaration
def kbBuildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
// Data-driven LLM routing registry (build.json::keyboard_ai) — providers, model
// lists, enhancement prompts. Consuming app's build.json first, this module's
// own repo (ab_cloud-libs-shared/build.json) as the fallback — identical rule to
// libs/voice. Baked as base64 so quotes/newlines in prompts survive BuildConfig.
def kbAi = kbBuildJson.keyboard_ai ?: new groovy.json.JsonSlurper().parse(file('../../build.json')).keyboard_ai
def kbAiB64 = groovy.json.JsonOutput.toJson(kbAi).bytes.encodeBase64().toString()
// #776 Config ▸ Update: where the fleet Store's row for this app is (build.json::update).
// Consuming app's build.json only - an app that declares none gets {} and no Update page.
def kbUpdateB64 = groovy.json.JsonOutput.toJson(kbBuildJson.update ?: [:]).bytes.encodeBase64().toString()

android {
    namespace 'helium314.keyboard.latin'
    compileSdk 36
    ndkVersion '28.0.13004108'

    defaultConfig {
        minSdk 26
        buildConfigField "int",    "VERSION_CODE",   "${kbBuildJson.android.version_code}"
        buildConfigField "String", "VERSION_NAME",   "\"${kbBuildJson.android.version_name}\""
        buildConfigField "String", "APPLICATION_ID", "\"${kbBuildJson.android.application_id}\""
        // build.json::keyboard_ai — read by helium314.keyboard.latin.AiRouter.
        // #1093 the LanguageTool check URL = the declared (public) URL of the languagetool service (../fleet-urls.gradle).
        buildConfigField "String", "LANGUAGETOOL_URL", "\"${fleetUrl('languagetool')}/v2/check\""
        buildConfigField "String", "AI_ROUTING_B64", "\"${kbAiB64}\""
        // build.json::update - read by helium314.keyboard.latin.utils.KeyboardUpdate.
        buildConfigField "String", "UPDATE_B64", "\"${kbUpdateB64}\""
    }

    buildFeatures {
        compose = true
        // HeliBoard reads generated BuildConfig fields (version/applicationId).
        buildConfig = true
        // ClipboardHistoryManager binds res/layout/clipboard_suggestion.xml via
        // generated helium314.keyboard.latin.databinding.ClipboardSuggestionBinding.
        viewBinding = true
    }

    externalNativeBuild {
        ndkBuild {
            // HeliBoard's AOSP-derived native decoder. Produces
            // libjni_latinime.so for the configured ABI.
            path 'src/main/jni/Android.mk'
        }
    }

    defaultConfig {
        ndk {
            // Match the rest of the app — arm64-v8a only (see app/build.gradle
            // abi_filters; the SuperApp ships a single-ABI phone build).
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        // HeliBoard requires core-library desugaring (java.time / java.nio
        // APIs below minSdk). Dep below.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        // Vendored upstream — do not fail the SuperApp build on HeliBoard's
        // own lint debt.
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':libs:perms')   // #1274 PermsLink: the host's Permissions page asks, not this lib
    // SuperApp addition (NOT upstream): on-device translator behind the
    // TRANSLATE toolbar key. Injected by patches/0001-translate-toolbar.patch;
    // the KeyCode.TRANSLATE handler in InputLogic calls into this module.
    // The binder a sibling app reaches the Text tools across (Enhance, Translate).
    // The engines stay here; only text crosses. Deliberately NOT api: nothing this
    // module exposes takes a text-tools type, and a consumer that wants the client
    // depends on :libs:text-tools directly rather than on the keyboard.
    implementation project(':libs:text-tools')
    implementation project(':libs:fleetconfig-model')   // #1093 FleetHttpSeam (GrammarChecker)
    implementation project(':libs:decisions-link')   // #883 keyboard_style: asks the decisions engine, holds no key

    implementation project(':libs:translate')

    // Tier 3 of the fleet autofill (a0_docs/eng-specs/autofill-3-tier.md): the Cloud Account SOT contract,
    // read for row-2 candidates (emails, phones, postal codes, names, snippets) under AUTOFILL_PROFILE_READ.
    implementation project(':libs:autofill')

    // SuperApp addition (NOT upstream): offline Vosk voice-input behind the
    // VOICE toolbar key. Injected by patches/0005-voice-input.patch; the
    // KeyCode.VOICE_INPUT handler in LatinIME calls VoiceInput.toggle.
    implementation project(':libs:voice')

    // SuperApp addition (NOT upstream): Sticker + GIF panel hosted inside the
    // emoji surface. Injected by patches/0007-emoji-media-tabs.patch; the
    // EmojiPalettesView type-tab row shows a MediaPanelView from this module.
    implementation project(':libs:media')

    // #773 libs:ui-kit: CloudKitTheme + KitImeComposeView, the Compose host every IME surface below
    // (strip, emoji, clipboard, key surface) is built on. Already in every consumer's module graph
    // (voice/media/translate pull it), so no build.json change.
    api project(':libs:ui-kit')

    // #843: JVM tests of the view-state model (KeyboardViewStateTest). Pure Kotlin, no Robolectric.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar's copy is a stub that throws on the JVM (KeyboardJevTest).
    testImplementation 'org.json:json:20240303'
    // #1813 a real SQLite on the JVM for the clipboard-table migration test.
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    // ── Keyboard engine dependencies. ─────────────────────────────────────
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // androidx
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.autofill:autofill:1.3.0'

    // kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    // compose (BOM-pinned, same release the rest of the app uses)
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'sh.calvin.reorderable:reorderable:3.1.0'
    // JitPack — settings.gradle already declares the jitpack repo.
    implementation 'com.github.skydoves:colorpicker-compose:1.1.3'
}
