// libs:pdf (#1484) — PDF view AND edit, in its own lib. VIEW: the platform's android.graphics.pdf.PdfRenderer (pdfium inside the
// OS; no extra native code in the APK). EDIT: PdfBox-Android (com.tom-roush:pdfbox-android, Apache-2.0, a port of Apache PDFBox):
// ink and text annotations, note annotations, form fill, page delete, reorder and rotate, each applied to the file and the
// view reloaded. Licence inventory entry: licenses/curated.json (maven:com.tom-roush:pdfbox-android).
//
// The owner-approved exception to the one-PDF-engine rule (1_cicd/src/data/one-pdf-engine-guard.json names this directory):
// the Editor tab shows a PDF in a tab, next to the viewer of Cloud-Drive's own PDF reader activity. Only Cloud-Drive consumes it.
//
// Shared BY REFERENCE; lib-apks excludes it (compiled into its consumer, nothing to install). TESTED in src/test (JVM, no
// emulator): the edit round-trip runs PdfBox on a tiny generated fixture; the page geometry is plain Kotlin.

plugins {
    id 'com.android.library'
}
// Conditional: an AGP 9 consumer (cloud-camera, #1908) self-registers the 'kotlin' extension and hard-errors on a
// second apply; AGP 8 consumers still need it. Same pattern as libs/bottomnav/build.gradle.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// #1949 THE ONE PDF ENGINE lives here now (owner order 2026-11-27): the pdfium binding is pinned by ac_cloud-drive/build.json::pdf.engine,
// read here so the pin stays in data; a missing or partial declaration fails the build instead of shipping a reader with no engine.
def pdfEngine = new groovy.json.JsonSlurper().parse(file("${projectDir}/../../../ac_cloud-drive/build.json")).pdf?.engine ?: [:]
['group', 'version'].each { key ->
    if (!(pdfEngine[key] ?: '').toString().trim()) {
        throw new GradleException("ac_cloud-drive/build.json::pdf.engine.${key} is required (libs:pdf's one engine, #1949)")
    }
}
if (!(pdfEngine.artifacts ?: [])) {
    throw new GradleException("ac_cloud-drive/build.json::pdf.engine.artifacts is required (libs:pdf's one engine, #1949)")
}
def pdfEngineCoordinates = pdfEngine.artifacts.collect { "${pdfEngine.group}:${it}:${pdfEngine.version}".toString() }

android {
    namespace 'com.diegonmarcos.cloudlib.pdf'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // KitDensity: the fleet's dense spacing and type ramp (no dp or sp literal in this module).
    implementation project(':libs:ui-kit')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // The editing engine, Apache-2.0.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // The pdfium reader engine (Apache-2.0 binding, BSD-3 PDFium): the JNI half's .so files ride in the consumer's APK for the ABIs it keeps.
    pdfEngineCoordinates.each { api it }
    implementation 'androidx.activity:activity-compose:1.9.3'

    testImplementation 'junit:junit:4.13.2'
}
