// libs:json-canvas (#1932): the JSON Canvas 1.0 format Obsidian uses (nodes text/file/link/group, edges with sides and ends). The parser, the
// geometry (bounds, fit, hit test, edge curves) and the Markdown-light model are pure Kotlin (no Android, no org.json) so the consuming app's JVM
// suite covers them; CanvasView.kt is the Compose renderer. Shared by reference, so any app draws a .canvas the same way.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.jsoncanvas'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api platform('androidx.compose:compose-bom:2025.11.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.foundation:foundation'
    api 'androidx.compose.material3:material3'
}
