// libs:cad-dxf (#1404): Hardtech-CAD's viewer lib for DXF through dxf-parser 1.1.2 (MIT).
// Assets only: assets/cad/dxf/loader.js (imported by libs:cad-core's viewer.js) and vendor/ with the upstream licence beside it.
// Compile-in only (lib-apks exclude), no code.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.diegonmarcos.superapp.cad.dxf'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
