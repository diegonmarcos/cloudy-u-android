plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    // 2026-10-15 owner decision: all apps must be Compose. The overlay is a ComposeView; the compiler is
    // resolved from the consuming app's root build (declared `apply false` there), like libs:bottomnav's.
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Inject build.json::release into BuildConfig — runtime code uses the same
// source of truth as build.sh oras-push / phone-install. No hardcoded URLs.
// rootDir, NOT '../../': this module is shared by reference (projectDir) into
// every constellation app, so it must read the CONSUMING app's build.json.
// A module-relative path would resolve to superapp's build.json and hand every
// app superapp's GHCR image + auto_update block — i.e. cloud-browser would
// update itself into cloud-superapp.
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))

// The constellation fleet, so the periodic worker can update the OTHER apps
// and not just this one.
//
// This resolves the OPPOSITE way to build.json above, and the difference is the
// whole point. build.json is PER-APP, so it must come from the consuming app's
// rootDir. The fleet manifest is FLEET-WIDE - one list of every published app,
// identical for every consumer - so resolving it from rootDir was wrong: only
// aa_cloud-superapp carries a data/ dir, so `${rootDir}/data/...` existed for
// exactly one of the eleven consumers and every other app baked the EMPTY
// STRING. That has no symptom. An empty manifest draws an empty page that looks
// exactly like a working one, and an app that cannot see the fleet reports
// "nothing to update" in the same words as an app that is genuinely current.
//
// So: the canonical copy is named once, module-relative (projectDir, not
// rootDir, because this module is shared by reference into every app and must
// reach the same file whichever app is building). An app MAY still override it
// by shipping its own data/constellation-fleet.json - that path is kept so a
// future app can pin a narrower fleet - but absence is no longer silent.
def fleetOverride = file("${rootDir}/data/constellation-fleet.json")
def fleetCanonical = new File(projectDir, '../../../aa_cloud-superapp/data/constellation-fleet.json').canonicalFile
def fleetFile = fleetOverride.exists() ? fleetOverride : fleetCanonical
if (!fleetFile.exists()) {
    throw new GradleException("constellation-fleet.json not found at ${fleetCanonical.path} " +
        "(nor overridden at ${fleetOverride.path}). :libs:updater bakes it into " +
        "CONSTELLATION_FLEET_B64 so the unattended pass can reach the rest of the fleet. " +
        "An empty manifest is not a broken build, it is a silently fleet-blind one - which " +
        "is why this throws instead of defaulting to \"\".")
}
def fleetB64 = fleetFile.text.bytes.encodeBase64().toString()
// bakeB64(): the ONE chunked bake (#654). It lives beside this file, so every app
// that links :libs:updater can apply it by the same relative path.
apply from: 'bake-b64.gradle'
// #1093 the git-proxy mesh mirror base comes from the fleet declaration, not a literal (see ../fleet-urls.gradle).
apply from: '../fleet-urls.gradle'
def ghcr = buildJson.release.ghcr
def au   = buildJson.release.auto_update
// #625 THE APK CACHE POLICY, DECLARED ONCE.
//
// Resolved exactly like constellation-fleet.json above and for the same reason:
// where a download lives and when it may be deleted is a FLEET-WIDE rule, not a
// per-app one, so an app that says nothing inherits the canonical block instead
// of baking a different retention policy per consumer. An app MAY narrow it by
// declaring release.apk_cache of its own.
//
// Unresolvable is a hard build failure, never a default. A defaulted cache
// directory is how the cache silently went back to cacheDir — which Android
// reclaims without asking, and which is the whole bug (#625).
def apkCacheDecl = buildJson.release.apk_cache ?: new groovy.json.JsonSlurper()
    .parse(new File(projectDir, '../../../aa_cloud-superapp/build.json').canonicalFile).release.apk_cache
if (!apkCacheDecl?.dir || !apkCacheDecl?.max_bytes || !apkCacheDecl?.evict ||
        !apkCacheDecl?.min_bytes || apkCacheDecl?.reserve_bytes == null) {
    throw new GradleException("release.apk_cache{dir,min_bytes,max_bytes,reserve_bytes,evict} is missing from " +
        "${rootDir}/build.json and from the canonical aa_cloud-superapp/build.json. " +
        ":libs:updater bakes it into APK_CACHE_DIR/APK_CACHE_MAX_BYTES/APK_CACHE_EVICT; " +
        "ApkCache has no fallback on purpose, because the fallback WAS cacheDir and " +
        "cacheDir is what the OS deletes under the user's downloads.")
}
// WHICH GHCR IMAGE THIS APP UPDATES ITSELF FROM, named exactly once.
//
// Most apps publish a single artefact and say so in release.ghcr.image. A FORK
// app publishes under build.json::forks.<key>.image instead, and that is the
// name the ship engine pushes to and the name constellation-fleet.json carries
// - so for those apps release.ghcr.image would be a SECOND copy of a string
// that already exists in the same file. Two copies of an image name is not a
// tidiness problem here: get them out of step and UpdateChecker asks GHCR for
// a repository that does not exist, GHCR answers 404, and 404 is deliberately
// read as "no build for this ABI yet - up to date". The app would then report
// itself current, forever, having never once reached its own image.
//
// So a fork app points at its fork entry with release.ghcr.image_from_fork
// instead of restating the value. Unresolvable is a hard build failure rather
// than an empty string, for the same reason: an empty image is not a broken
// build, it is a silently un-updatable one.
def ghcrImage = ghcr.image ?: (ghcr.image_from_fork
    ? buildJson.forks?.get(ghcr.image_from_fork)?.image
    : null)
if (!ghcrImage) {
    throw new GradleException("${rootDir}/build.json: :libs:updater needs release.ghcr.image, " +
        "or release.ghcr.image_from_fork naming a forks.<key> that declares one. Without it " +
        "this app cannot reach its own published APK and would report itself up to date forever.")
}
// Short git sha = code-identity stamp (matches build.sh oras-push manifest
// revision annotation) so UpdateChecker can skip an identical-code rebuild.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)
// ABI→update-tag map for the ABI-aware updater. Flattened from
// release.variants[]: each variant's supported_abis all point at its
// update_tag. The updater resolves the device's tag by the first
// Build.SUPPORTED_ABIS entry present in this map, falling back to
// AUTO_UPDATE_TAG (arm64 `latest`). Format: "abi=tag;abi=tag;…".
def auTagMap = (buildJson.release.variants ?: []).collectMany { v ->
    (v.supported_abis ?: []).collect { abi -> "${abi}=${v.update_tag}" }
}.join(';')

android {
    namespace 'com.diegonmarcos.superapp.updater'
    compileSdk 36

    // Two source sets, never both: shell/ talks to the real ShellChannels,
    // noshell/ hands Fleet a null channel. Source sets rather than reflection
    // because app/build.gradle runs R8 with minifyEnabled — a reflective
    // lookup would be renamed away and zero-dialog install would die silently
    // in the one app that wants it. Both variants are real compiled source, so
    // a rename in ShellChannels fails the SuperApp build out loud.
    sourceSets {
        main {
            java.srcDir(findProject(':libs:shizuku-adb-debug-tools') != null
                ? 'src/shell/java' : 'src/noshell/java')
        }
    }

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField "String",  "MESH_MIRROR_BASE",     "\"${fleetMeshUrl('git-proxy-api')}\""
        buildConfigField "String",  "GHCR_REGISTRY",        "\"${ghcr.registry}\""
        buildConfigField "String",  "GHCR_NAMESPACE",       "\"${ghcr.namespace}\""
        buildConfigField "String",  "GHCR_IMAGE",           "\"${ghcrImage}\""
        buildConfigField "String",  "GHCR_MEDIA_TYPE",      "\"${ghcr.media_type}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG",      "\"${au.tag}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG_MAP",  "\"${auTagMap}\""
        buildConfigField "long",    "AUTO_UPDATE_INTERVAL_HOURS",  "${au.interval_hours}L"
        buildConfigField "boolean", "AUTO_UPDATE_ENABLED",         "${au.enabled}"
        // Most install sessions ONE unattended background pass may open. The
        // background pass cannot show the system install dialog (Android 10+
        // blocks background activity starts), so each install it starts leaves a
        // tap-to-install notification holding a PackageInstaller session until
        // the user answers it. Unbounded, a pass over a 40-entry fleet opens 40
        // at once and the installer hits Android's 50-session cap - "Too many
        // active sessions for UID". User-initiated "Update all" is NOT capped:
        // it runs in the foreground where the dialog appears and sessions
        // resolve immediately.
        buildConfigField "int", "AU_MAX_PER_PASS", "${au.max_installs_per_pass ?: 3}"
        // Fail-safe, not fail-open: an app that never declares the key gets
        // Wi-Fi-only, because the cost of guessing wrong is the user's mobile
        // data. Not `?: true` (the style used above for the int): Groovy's
        // elvis treats an explicit `false` as absent, so that form would make
        // the value unexpressible rather than defaulted. Test for null.
        buildConfigField "boolean", "AU_REQUIRE_UNMETERED",        "${au.require_unmetered_network == null ? true : au.require_unmetered_network}"
        buildConfigField "boolean", "AU_REQUIRE_CHARGING",         "${au.require_charging}"
        buildConfigField "String",  "AU_INSTALL_MODE",             "\"${au.install_mode}\""
        buildConfigField "String",  "GIT_SHORT_SHA",               "\"${shortSha}\""
        // #625 the apk cache: directory name, size bound, eviction policy.
        buildConfigField "String",  "APK_CACHE_DIR",               "\"${apkCacheDecl.dir}\""
        buildConfigField "long",    "APK_CACHE_MAX_BYTES",         "${apkCacheDecl.max_bytes}L"
        // #812 the bound is DERIVED from real free storage within [min, max],
        // keeping reserve_bytes free for the device — never a fixed max alone.
        buildConfigField "long",    "APK_CACHE_MIN_BYTES",         "${apkCacheDecl.min_bytes}L"
        buildConfigField "long",    "APK_CACHE_RESERVE_BYTES",     "${apkCacheDecl.reserve_bytes}L"
        buildConfigField "String",  "APK_CACHE_EVICT",             "\"${apkCacheDecl.evict}\""
        // javac caps ONE string constant at 65,535 UTF-8 bytes (JVMS 4.4.7, CONSTANT_Utf8).
        // The fleet manifest's base64 crossed that on 2026-09-24 — 68,072 bytes at 72
        // entries, once the four #567 engine libraries registered — and every consumer's
        // BuildConfig stopped compiling: "constant string too long". Baked as parts joined
        // at class-init time, which is NOT a constant expression and has no cap, so the
        // readers' one CONSTELLATION_FLEET_B64 String is unchanged and the manifest can
        // keep growing. The fleet-manifest guard fails any bake that goes back to one literal.
        buildConfigField "String",  "CONSTELLATION_FLEET_B64",     bakeB64(fleetB64)
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation project(':libs:fleetconfig-model')   // #1093 FleetHttpSeam
    implementation project(':libs:decisions-link')   // #882 updater_urgency: asks the decisions engine, holds no key
    // Fleet.shellInstall uses the shell channel (uid 2000, holds INSTALL_PACKAGES)
    // so "Update all" installs with no confirm dialog. No cycle: this module only
    // depends on :libs:core, same as us.
    //
    // Conditional, because :libs:updater is linked into ALL EIGHT constellation
    // apps while :libs:shizuku-adb-debug-tools is declared by SuperApp alone.
    // Unconditionally, this line broke every other app at configuration time
    // ("Project with path ':libs:shizuku-adb-debug-tools' could not be found"),
    // and had they declared it they would each have swallowed BouncyCastle,
    // Conscrypt, libadb-android and the Shizuku client for a dialog-free
    // install only SuperApp performs. The matching source-set switch above
    // supplies a stub channel to the apps that opt out.
    if (findProject(':libs:shizuku-adb-debug-tools') != null) {
        implementation project(':libs:shizuku-adb-debug-tools')
    }
    implementation 'androidx.core:core-ktx:1.13.1'
    // 2026-10-15 owner decision: all apps must be Compose. UpdateOverlayFragment is a ComposeView; the
    // BOM is the one every Compose module in the fleet resolves, so app and library compose together.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // UpdateOverlayFragment lives here now (it was four vendored copies in the
    // app modules and browser/vault/wallet were stale); the module owns the UI
    // for its own progress states, so it owns the fragment dependency too.
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
}
