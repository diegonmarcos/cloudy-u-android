// libs:ml-l-image-ocr (#1418) — the fleet's OCR: ML Kit Text Recognition ON-DEVICE (the bundled Latin model
// plus the bundled Chinese, Devanagari, Japanese and Korean models, so no download and no network)
// and the OpenRouter vision transport as the alternative. Shared BY REFERENCE (build.json::modules
// `dir`), first linked by Cloud Writer. Which engine runs, and the fallback from OpenRouter to ML,
// is the consuming app's routing (Cloud Writer: core Ocr.run over Routing.run, PIT-gated).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.mlocr'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Bundled models (no Play Services download): Latin, then the four non-Latin scripts ML Kit ships.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
