//
// libs:battery — battery/energy engine + its dialogs, extracted from the
// app module so it sits as a sibling of libs:firewall under libs/.
//
// Tiered energy model:
//   - Tier-1 (no root): BatteryManager / sysfs correlation — SysfsProc,
//     BatterySessionStats, BatteryCapacity, PowerFlow, EnergyWatchdog.
//   - Tier-2 (privileged): BatteryPrivileged reads `dumpsys battery` and
//     `dumpsys batterystats` through the app's own privileged adb channel
//     (ShellChannels in libs:shizuku-adb-debug-tools, never the Shizuku
//     rung) — hence the lib→lib dependency below (NOT lib→app).
//
// UI dialogs (EnergyUsageDialog, BatteryEstimatePopup) live here too,
// mirroring how libs:firewall keeps FirewallDialog in-lib.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. EnergyUsageDialog and BatteryEstimatePopup are ComposeViews under CloudKitTheme;
    // the compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.battery'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // EnergyUsageDialog / BatteryEstimatePopup are ComposeViews; the BOM is the one every Compose module in the fleet resolves.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation project(':libs:core')
    api project(':libs:ui-kit')   // CloudKitTheme
    // Tier-2 privileged read: ShellChannels (embedded adb / our app_process server) + AdbShellLink.
    implementation project(':libs:shizuku-adb-debug-tools')
    // BatterySessionWorker's 15-min tick also folds the current month into
    // the permanent data-usage ledger, so the monthly history survives
    // NetworkStatsManager's ~90-day retention without a second scheduler.
    implementation project(':libs:datamanager')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'   // EnergyUsageDialog / BatteryEstimatePopup
    implementation 'androidx.work:work-runtime-ktx:2.12.0'   // BatterySessionWorker
}
