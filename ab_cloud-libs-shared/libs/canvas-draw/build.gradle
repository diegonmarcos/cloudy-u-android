// libs:canvas-draw (#1865): the Draw section of Cloud Canvas, moved out of the app module unchanged: the paint model (draw/Model.kt: tools,
// ops, layers, undo/redo), the renderer and the pixel/PNG code (draw/DocRenderer.kt, draw/Pixels.kt), the Draw page and its controller
// (ui/DrawScreen.kt, ui/DrawController.kt) and its sibling page Board (ui/BoardScreen.kt over board/BoardStore.kt, the vendored Quickdraw
// whiteboard the app ships in assets/board, built through libs:web-core). The model is pure Kotlin: the app's JVM suite covers it.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.canvas.draw'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api platform('androidx.compose:compose-bom:2025.11.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.foundation:foundation'
    api 'androidx.compose.material3:material3'
    api project(':libs:canvas-core')
    // Board: the fleet's one embedded web view (CloudWeb, WebProfile.APP_PAGE) and androidx.webkit (WebViewAssetLoader, the bridge)
    implementation project(':libs:web-core')
    // #1865 the floating toolbar and the brush rail glyphs
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
}
