// libs:git-ui — #1408 Cloud Drive's git manager UI, out of the app. The host passes its look in through
// LocalGitUiKit (metrics, the fade modifier, test tags); strings live in this module's res. First slice: the
// repo table's columns, its sortable header and the metadata table. Compiled into cloud-drive, Cloud Me and Cloud Account (#1445: GitConnect, the one GitHub connect + repo picker + auto-commit-and-push); ships no APK.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.gitui'
    compileSdk 36
    defaultConfig { minSdk 26 }
    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests { all { testLogging { events 'failed'; exceptionFormat 'full' } } } }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation project(':libs:git-repos')   // GitRepoScan.humanBytes for the size cells
    implementation project(':libs:git-core')    // the models the solver reads (GitStatusSnapshot, ConflictSide)
    implementation project(':libs:git-sync')    // #1445 GitConnect: GitEngine + GitCredentialStore, the ONE GitHub connect Drive, Cloud Me and Cloud Account call
    testImplementation 'junit:junit:4.13.2'
}
