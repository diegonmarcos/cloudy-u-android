// libs:git-ui — #1408 Cloud Drive's git manager UI, out of the app. The host passes its look in through
// LocalGitUiKit (metrics, the fade modifier, test tags); strings live in this module's res. First slice: the
// repo table's columns, its sortable header and the metadata table. Compiled into cloud-drive; ships no APK.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.gitui'
    compileSdk 36
    defaultConfig { minSdk 26 }
    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests { all { testLogging { events 'failed'; exceptionFormat 'full' } } } }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    testImplementation 'junit:junit:4.13.2'
}
