// libs:cymatics (#1892): the Chladni (cymatics) plate shared BY REFERENCE by Cloud Canvas Play (#1865) and Cloud Calc's sound meter: the
// pattern math (Cymatics.kt, no Android type: mode numbers from a frequency, the symmetric standing-wave amplitude, the weighted blend;
// its JVM suite holds byte parity with the pre-move field) and the Compose drawing (CymaticsPlate.kt). One implementation, no copy in either app.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.cymatics'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api platform('androidx.compose:compose-bom:2025.11.01')
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.foundation:foundation'
    testImplementation 'junit:junit:4.13.2'
}
