// libs:cymatics-core (#1892): the Chladni (cymatics) pattern math as a plain-JVM module, the ONE implementation both Cloud Canvas Play
// (#1865, its Cymatics panel) and Cloud Calc (#1892, the sound meter's Cymatics figure) draw: mode numbers from a frequency, the symmetric
// standing-wave amplitude of a mode, and the blend of several weighted frequencies into a normalised grid. No Android here, so the JVM suite
// (parity with the pre-move reference values, determinism, symmetry) runs in milliseconds. The Compose drawing is libs:cymatics.
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
