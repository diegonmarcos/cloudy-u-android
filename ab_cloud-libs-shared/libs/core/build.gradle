plugins {
    id 'com.android.library'
    // apply false + conditional apply below: AGP 9 consumers (mail,
    // media-center) register the 'kotlin' extension themselves and hard-error
    // on a second apply; AGP 8 consumers still need the explicit one. Same
    // pattern, same reason, same wording as libs/analytics/build.gradle.
    id 'org.jetbrains.kotlin.android' apply false
}

if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

// canonicalFile: a fetched-tree consumer (cloud-office) LINKS this module at android/libs/core, and Gradle joins '..' lexically,
// which lands on android/libs/ (no fleet-urls.gradle there). The canonical dir is the real ab_cloud-libs-shared/libs/core.
apply from: new File(projectDir.canonicalFile.parentFile, 'fleet-urls.gradle')

android {

    // #825 IDataBackend (the engine wire) and its client/service left for
    // libs:databackend: compiled only by the engines and the apps that bind one,
    // so a wire edit no longer rebuilds every app, and a core edit cannot touch it.

    namespace 'com.diegonmarcos.superapp.core'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        // Telemetry's per-app crash/log route: both origins of c3-infra-api come from the one fleet declaration.
        buildConfigField "String", "INFRA_API_MESH",   "\"${fleetMeshUrl('c3-infra-api')}\""
        buildConfigField "String", "INFRA_API_PUBLIC", "\"${fleetUrl('c3-infra-api')}\""
    }

    // #825 IFleetConfigEngine: the provider's one wire to the fleet-config policy engine
    // (Cloud-Lib-Fleetconfig). Tiny and versioned (FleetConfigEngine.CONTRACT_VERSION); the policy
    // it replaced in this module was ~300 lines every app recompiled on each edit.
    // #1122 lifecycle's NullSafeMutableLiveData detector (on lint's classpath through libs:crash's activity/compose
    // dependencies) throws IncompatibleClassChangeError under the older AGP lint of the Termux-line apps and fails
    // lintVitalAnalyzeRelease. Neither module touches LiveData, so the one detector is off, not lint.
    lint {
        disable 'NullSafeMutableLiveData'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// jvmTarget via the top-level `kotlin` extension, NOT android.kotlinOptions:
// AGP 9 removed kotlinOptions from the android extension and this module is
// consumed by both AGP 8 and AGP 9 apps. Same pattern as libs/analytics.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}


dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'

    // StoreNotifyPrefsTest: the pure notification-matrix logic, no device.
    testImplementation 'junit:junit:4.13.2'

    // #783 FleetConfig reads and writes an app's EncryptedSharedPreferences through the same
    // cipher the app uses (default MasterKey). compileOnly, NOT implementation: only an app that
    // keeps an encrypted store has one to migrate, and that app already ships the cipher. As an
    // implementation dep it dragged tink-android into all 31 apps — duplicate classes against
    // mail's own tink, R8 missing classes in dialer and webserver, a META-INF clash in myterminal.
    compileOnly 'androidx.security:security-crypto:1.1.0'

    // libs:devtools rides on core so the constellation-wide debug API reaches
    // every app without eight separate app/build.gradle edits that would drift
    // the moment someone adds a ninth app. `api`, not `implementation`, so the
    // consuming app can also call AppDebugServer directly (SuperApp's Configs
    // screen reports the bound port).
    //
    // Safe from cycles: devtools depends on androidx.core only, never on
    // libs:core. Keep it that way — a devtools→core edge would break every
    // app's build at once.
    api project(':libs:devtools')

    // #873 the setup contract (`<package>.fleetsetup`): every app answers describe / export /
    // apply / status for the stores fleet-config.json declares for it. Rides on core for the
    // devtools reason (no per-app gradle edit). fleetconfig-model depends on nothing here, so
    // there is no cycle; it carries the baked fleet-config.json, hashed (never watched) by the
    // rebuild-isolation rule for manifests.
    api project(':libs:fleetconfig-model')

    // #1122 the crash-safe default (persist-first report, the phone's local C3 sink, the generic crash screen)
    // lives in its own module, installed from CoreInitProvider below. crash depends on nothing here (no cycle).
    api project(':libs:crash')
}
