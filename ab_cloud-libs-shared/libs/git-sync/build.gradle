// libs:git-sync — the git manager's client and its screen: the GitEngine client (a thin face over the
// verbs, the same ones the screens were written against), the repository registry, the credential store,
// the auth-chain walker and GitSyncScreen.
//
// #1408 THE ENGINE IS IN-PROCESS: JGit, the verbs, the models and the wire are libs:git-core (`api` below),
// answered in the host's own process by InProcessGitTransport. The separate engine APK
// (Cloud-Lib-Git-Sync-Engine.apk) is retired; a host may still route a directory to another transport
// (Cloud Drive's optional Termux backend) through GitTransports.router.
//
// ONE OF THE FOUR cloud-drive ENGINE LIBRARIES (#567). The owner's rule for that
// application: the main APK is chrome, every tooling is its own library, and the
// module boundary is law — this module imports NOTHING from any application
// (lib -> app is forbidden; ac_cloud-drive/test/test-drive-engine-modules.sh
// fails the build on the first such import). Compose only (#565): the screen
// this module exports is a @Composable, hosted by whichever app links it.
//
// Shared BY REFERENCE the way every module on this shelf is: cloud-drive names
// this directory in build.json::modules, and lib-apks discovers it and ships
// cloud-lib-git-sync as its own installable APK (#474 naming, from the one
// declaration in aa_cloud-superapp/data/regen.sh).
//
// Deliberately sparse on the independent-version axis (bottomnav / text-tools
// precedent): it builds under whichever AGP the app that pulls it in uses —
// cloud-drive's 8.7.3 and lib-apks' 8.13.2 both. Compose BOM and versions match
// libs:bottomnav so the two compose against one toolchain inside one app.
//
// TESTED where it builds: src/test/ (JVM, no emulator) runs inside the consuming
// app's own `gradle test` (ac_cloud-drive/build.json::tests.unit is enabled), and
// that app's ship workflow watches this directory, so a change here re-runs it.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // ManagedRepo and the models are @Serializable (RepoRegistry persists ManagedRepo as JSON; the models
    // travel as the libs:git-core wire); kotlinx-serialization, like libs:updater, so the JVM
    // tests exercise the real (de)serialisation rather than android.jar's org.json stubs.
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.diegonmarcos.cloudlib.gitsync'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Tokens and passphrases at rest (GitCredentialStore): keystore-backed,
    // the same dependency libs:mail / libs:chat / libs:ops already carry.
    implementation 'androidx.security:security-crypto:1.1.0'
    // #1106 the one safe way to open an EncryptedSharedPreferences file (never throws on a mismatched Keystore key).
    implementation project(':libs:crash')
    // #1408 THE engine, in-process: JGit, the verbs, the models and the wire. `api` because the models are this module's API.
    api project(':libs:git-core')

    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar's copy is a stub that throws on the JVM.
    testImplementation 'org.json:json:20240303'
}
