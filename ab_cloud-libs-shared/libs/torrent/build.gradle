// libs:torrent (#1600) — the fleet's BitTorrent engine, as code only. It owns: the engine API an app drives
// (TorrentEngine: add a magnet or a .torrent, per-torrent status, pause / resume / remove, a save folder,
// seed control), the declarative torrent search sources (TorrentIndexers: one entry per public indexer, the
// result list parsed by a pure function), the Downloads/Cloudy-store/Torrent folder rule (TorrentPaths) and
// the .torrent reader (info-hash and name without the native library). NO DATA IS BAKED INTO THIS AAR: no
// asset, no raw resource, no BuildConfig field, no mock list; the torrent list, the settings and the save
// folder are read from the app's private storage at runtime.
//
// THE BITTORRENT IMPLEMENTATION is libtorrent 2.1 through libtorrent4j (#1790; it replaced jlibtorrent 1.2.0.18, i.e. libtorrent
// 1.2.0.0 of 2019, whose x86_64 build was 4 KB-linked so the emulator APK had no engine): real DHT, trackers, uTP, web seeds
// (BEP 19), magnet metadata fetch, resume. Its prebuilt JNI libraries ship in the artifacts below (lib/<abi>/libtorrent4j.so,
// PT_LOAD aligned 16 KB on arm64 AND x86_64, the same artifacts Cloud Browser links), so nothing is cross-compiled in CI. The
// engine talks to it only through TorrentBackend (LibtorrentBackend is the one class that touches the native classes), so the engine logic is tested on
// the JVM against a fake backend, with no peers and no .so. If the native library cannot load on a device
// the engine reports EngineState.Unavailable with the reason; it never crashes the host.
//
// Shared BY REFERENCE; lib-apks excludes it (a static lib, no component).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.torrent'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // libtorrent 2.1 JNI (libtorrent4j, MIT). The Java half, then the prebuilt native half per ABI (jar-packed lib/<abi>/*.so,
    // merged by AGP; abiFilters keeps only the matrix ABI's copy in each APK). arm64-v8a is the phone, x86_64 the emulator: both
    // are 16 KB-aligned, so the x86_64 CI APK runs the real engine and the emulator test downloads for real.
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
    runtimeOnly 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
    runtimeOnly 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-39'

    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar's copy is a stub that throws on the JVM.
    testImplementation 'org.json:json:20240303'
}
