// libs:media-convert-audio — #1428 one converter per lib: the audio track of a video, remuxed on the phone
// with the platform's MediaExtractor + MediaMuxer (no re-encode, no FFmpeg: FFmpeg-kit is retired).
// A later transcode (bitrate/codec change) is its own lib on Media3 Transformer, not a flag here.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.mediaconvert.audio'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
