// libs:health-core-rs (#1955 C A1): Cloud C3's health engine on the phone. The check logic is the Rust crate ./rust (health-core, std only:
// c3-report/v1 envelope, dependency graph and root cause, redact, diff, budget, merge, phased prober, mesh matrix); this module is the thin
// JNI layer (Cargo.toml + src/*.rs) and the Kotlin API (HealthCore). Kotlin makes no check decision.
//
// BUILD, the pattern of libs:health-core-rs: one `cargo build --release --target <triple>` per ABI with the NDK clang as linker, the .so
// copied to build/rustJniLibs/<abi>/ (a jniLibs source dir). HEALTH_CORE_ABIS (comma list, default arm64-v8a,x86_64: the phone and the
// emulator) picks the ABIs. HEALTH_CORE_RS_REQUIRED=1 (CI) turns a missing toolchain into a build failure, so a shipped APK without the
// engine cannot go green; without it the build WARNS and the page prints "phone probe engine not in this build".
apply plugin: 'com.android.library'
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

def required = System.getenv('HEALTH_CORE_RS_REQUIRED') == '1'
def jniOut = layout.buildDirectory.dir('rustJniLibs').get().asFile
def targetDir = layout.buildDirectory.dir('cargo-target').get().asFile
def minApi = 26

// Found by looking at PATH (and rustup's default bin dir), not by running `cargo --version`: an external process at configuration time is
// refused by Gradle's configuration cache.
def hasCargo = {
    def dirs = (System.getenv('PATH') ?: '').split(File.pathSeparator).toList() + [System.getProperty('user.home') + '/.cargo/bin']
    dirs.any { it && new File(it, 'cargo').canExecute() }
}.call()

// The rust standard library of an Android target is installed (rustup target add). A runner that has cargo but not the target
// (every workflow other than the ship, which installs them) builds the app without the core instead of failing.
def hasRustTarget = { String triple ->
    def home = System.getenv('RUSTUP_HOME') ?: (System.getProperty('user.home') + '/.rustup')
    new File(home, 'toolchains').listFiles()?.any { new File(it, "lib/rustlib/${triple}").isDirectory() } ?: false
}

def ndkHome = {
    def env = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
    if (env && new File(env).isDirectory()) return env
    def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def ndks = sdk ? new File(sdk, 'ndk').listFiles()?.findAll { it.isDirectory() }?.sort { it.name } : null
    return ndks ? ndks.last().absolutePath : null
}.call()

android {
    namespace 'com.diegonmarcos.cloudlib.healthcore'
    compileSdk 36
    defaultConfig {
        minSdk 26
        // R8 must keep the JNI surface the Rust side binds by name.
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Cloud C3's toolchain is Kotlin 2.1 (kotlinOptions), the consumer of this module.
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.jniLibs.srcDir(jniOut)
}


// abi -> [rust triple, NDK clang prefix]
def abis = [
    'arm64-v8a'  : ['aarch64-linux-android', 'aarch64-linux-android'],
    'x86_64'     : ['x86_64-linux-android', 'x86_64-linux-android'],
]

def wantedAbis = (System.getenv('HEALTH_CORE_ABIS') ?: 'arm64-v8a,x86_64').split(',').collect { it.trim() }.findAll { it }
def rustTasks = []
abis.findAll { abi, spec -> abi in wantedAbis }.each { abi, spec ->
    def triple = spec[0]
    def clang = spec[1]
    def taskName = 'cargoBuild' + abi.replace('-', '_')
    def targetOk = hasRustTarget(triple)
    def t = tasks.register(taskName, Exec) {
        group = 'rust'
        description = "cargo build --release --target ${triple} -> jniLibs/${abi}/libhealth_core_jni.so"
        workingDir projectDir
        inputs.files(fileTree(projectDir) { include 'Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'rust/Cargo.toml', 'rust/src/**/*.rs' })
        outputs.dir(new File(jniOut, abi))
        onlyIf {
            if (!hasCargo || ndkHome == null || !targetOk) {
                def why = !hasCargo ? 'cargo is not installed' : (ndkHome == null ? 'no Android NDK (ANDROID_NDK_HOME)' : "the rust target ${triple} is not installed")
                if (required) throw new GradleException("HEALTH_CORE_RS_REQUIRED=1 but ${why}: libhealth_core_jni.so cannot be built")
                logger.warn("health-core-rs: ${why}; ${abi} ships no native core (the page prints the engine as not in this build)")
                return false
            }
            return true
        }
        def bin = "${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        def envTriple = triple.toUpperCase().replace('-', '_')
        environment "CARGO_TARGET_DIR", targetDir.absolutePath
        environment "CARGO_TARGET_${envTriple}_LINKER", "${bin}/${clang}${minApi}-clang"
        environment "CC_${triple.replace('-', '_')}", "${bin}/${clang}${minApi}-clang"
        environment "AR_${triple.replace('-', '_')}", "${bin}/llvm-ar"
        // 16 KB page size (Android 15+): LOAD segments aligned to 16 KB whatever the NDK default is (page-size guard).
        environment "CARGO_TARGET_${envTriple}_RUSTFLAGS", '-C link-arg=-Wl,-z,max-page-size=16384'
        commandLine 'cargo', 'build', '--release', '--target', triple
        def builtSo = new File(targetDir, "${triple}/release/libhealth_core_jni.so")
        def abiDir = new File(jniOut, abi)
        doLast {
            abiDir.mkdirs()
            java.nio.file.Files.copy(builtSo.toPath(), new File(abiDir, 'libhealth_core_jni.so').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
    rustTasks << t
}

tasks.matching { it.name ==~ /merge.*JniLibFolders/ }.configureEach { dependsOn(rustTasks) }
