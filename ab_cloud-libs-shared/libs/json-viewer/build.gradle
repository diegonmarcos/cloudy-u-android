// libs:json-viewer (#1484) — a JSON viewer in its own lib: a collapsible tree with syntax colour, search that keeps the matching
// rows with their parents, and copy of the selected row's path ($.a.b[0]) or value. Its design follows the cloud-webserver's JSON
// viewer (GitHub-dark page, key/value rows, collapsible sections, row filter, copy buttons), drawn on the Material roles and the
// ui-kit KitDensity ramp. View only: Edit falls back to the source editor (libs:wysiwyg, raw text), by the Editor's glue.
// Shared BY REFERENCE; lib-apks excludes it. TESTED in src/test (JVM): the tree, the paths, the search and the copy values.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.cloudlib.jsonviewer'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // KitDensity: the fleet's dense spacing and type ramp (no dp or sp literal in this module).
    implementation project(':libs:ui-kit')
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    testImplementation 'junit:junit:4.13.2'
}
