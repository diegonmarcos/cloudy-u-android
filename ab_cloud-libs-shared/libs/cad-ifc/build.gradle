// libs:cad-ifc (#1404): Hardtech-CAD's viewer lib for IFC through web-ifc 0.0.78 (MPL-2.0, WASM), loaded unmodified as separate files.
// Assets only: assets/cad/ifc/loader.js (imported by libs:cad-core's viewer.js) and vendor/ with the upstream licence beside it.
// Compile-in only (lib-apks exclude), no code.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.diegonmarcos.superapp.cad.ifc'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
