plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // The channel panel (AdbShellPage / ChannelModeBar) is Compose, compiled against the host's Compose
    // (compileOnly below): every app that links the module can open it (Cloud Store, Cloud Account, the SuperApp); one that never opens it never loads it.
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ── Shizuku diagnostic catalog ──────────────────────────────────────
// Read build.json once at config time, base64-encode the
// shizuku_diagnostics.bundles[] block, and expose it as a BuildConfig
// string. AdbDiagnostics decodes it once at runtime and runs the chosen
// bundle through the Shizuku shell channel. Adding/removing a diagnostic
// bundle = one entry in build.json::shizuku_diagnostics.bundles[] — no
// Kotlin edit (Pillar: DATA-DRIVEN).
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ab_cloud-libs-shared/lib-apks ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `shizuku_diagnostics` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def adbBuildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def adbOwnServer = adbBuildJson.shizuku_diagnostics?.local_server != null
if (adbBuildJson.shizuku_diagnostics == null) adbBuildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def adbDiag       = adbBuildJson.shizuku_diagnostics ?: [:]
def adbBundlesRaw = adbDiag.bundles ?: []
def adbBundlesJson = groovy.json.JsonOutput.toJson(adbBundlesRaw)
def adbBundlesB64  = adbBundlesJson.bytes.encodeBase64().toString()

// Self-contained app_process server config (data-driven).
def adbServer     = adbDiag.local_server ?: [:]
def adbServerPort = (adbServer.port ?: 38099) as int
// NB: adbServer['class'] (bracket) — Groovy's `.class` returns getClass().
def adbServerClass = adbServer['class'] ?: 'com.diegonmarcos.superapp.adbdebug.AdbShellServer'
def adbServerNice = adbServer.nice_name ?: 'superapp-adb'
// R8 keep for the app_process entry point, generated from the SAME value the
// server-command bakes (ONE declaration: build.json::local_server.class). The
// release APK stripped AdbShellServer — nothing in the app references it, only
// app_process does, by name — so the launch died with "could not find class"
// (rc 134) and the PRIMARY channel could never come up.
def adbServerKeep = new File(buildDir, 'generated/adb-server-keep.pro')
adbServerKeep.parentFile.mkdirs()
adbServerKeep.text = "-keep class ${adbServerClass} { public static void main(java.lang.String[]); }\n" +
                     "-keep class ${adbServerClass}\$* { *; }\n"

// Samsung SFC verdict config (model->max-watts cap map + thresholds).
// Data-driven: baked into BuildConfig for the PURE SfcVerdict parser to read
// at runtime — adding a Galaxy model is a build.json edit, never a Kotlin one.
def sfcCfg    = adbDiag.samsung_sfc ?: [:]
def sfcCfgB64 = groovy.json.JsonOutput.toJson(sfcCfg).bytes.encodeBase64().toString()

// ── Shizuku-client block (data-driven, consumer-owned) ──────────────
// The CONSUMING app's build.json::shizuku_client declares its provider
// order, the rish paths + application_id, the SuperApp loopback bridge
// and the enter-time binds. Read here with the same consumer-wins path
// as adbBuildJson above (adbBuildJson already resolved the consuming
// app's build.json, falling back to this module's home repo), base64'd
// into BuildConfig so RishBridge + SuperappBridgeChannel read ONE block
// at runtime. A terminal with no shizuku_client (e.g. the SuperApp
// itself) bakes "{}" and the lib's rish/export paths simply no-op.
//
// NB: adbBuildJson was REASSIGNED to this module's home repo above when
// the consumer declares no shizuku_diagnostics (the terminals don't), so
// it can no longer be trusted to be the CONSUMER's file. Re-parse the
// consumer's build.json (rootDir is the consuming app) for this block;
// shizuku_client is a terminal-owned block the SuperApp never redeclares.
def shizukuClientJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def shizukuClient    = shizukuClientJson.shizuku_client ?: [:]
// The HOST app's own identity (name + application_id): AdbIdentity derives the pairing label, key subject and the
// state scope from these, so nothing about the adb identity is typed in Kotlin. rootDir is the CONSUMING app.
def hostAppName = (shizukuClientJson.name ?: '') as String
def hostAppId   = (shizukuClientJson.android?.application_id ?: '') as String
def shizukuClientB64 = groovy.json.JsonOutput.toJson(shizukuClient).bytes.encodeBase64().toString()

// ── Declared needs (consumer-owned) ─────────────────────────────────
// What the CONSUMING app says it needs the privileged channel for
// (build.json::privileged_channel.needs[]). Same re-parse of rootDir's
// build.json as shizuku_client above; baked into BuildConfig so the ADB Shell
// page (AdbShellPage > Declared needs) lists the app's own declaration and
// nothing is typed in Kotlin. An app with no block bakes "{}" and lists none.
// build.json first; privileged-channel.json beside it when build.json has no such block (Nix-on-Droid: its
// build.json is an input of the rootfs library's content address, so editing it would republish ~400 MB).
def privilegedChannel    = shizukuClientJson.privileged_channel
if (privilegedChannel == null && file("${rootDir}/privileged-channel.json").exists())
    privilegedChannel = new groovy.json.JsonSlurper().parse(file("${rootDir}/privileged-channel.json"))
privilegedChannel = privilegedChannel ?: [:]
def privilegedChannelB64 = groovy.json.JsonOutput.toJson(privilegedChannel).bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.adbdebug'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro', adbServerKeep
        buildConfigField "String", "ADB_DIAG_BUNDLES_B64", "\"${adbBundlesB64}\""
        buildConfigField "boolean", "ADB_SHELL_SERVER_OWN",  "${adbOwnServer}"
        buildConfigField "int",    "ADB_SHELL_SERVER_PORT",  "${adbServerPort}"
        buildConfigField "String", "ADB_SHELL_SERVER_CLASS", "\"${adbServerClass}\""
        buildConfigField "String", "ADB_SHELL_SERVER_NICE",  "\"${adbServerNice}\""
        buildConfigField "String", "SFC_CONFIG_B64",          "\"${sfcCfgB64}\""
        buildConfigField "String", "SHIZUKU_CLIENT_B64",      "\"${shizukuClientB64}\""
        buildConfigField "String", "CHANNEL_NEEDS_B64",       "\"${privilegedChannelB64}\""
        buildConfigField "String", "HOST_APP_NAME",           "\"${hostAppName}\""
        buildConfigField "String", "HOST_APP_ID",             "\"${hostAppId}\""
    }
    buildFeatures {
        buildConfig = true
        // AIDL — the Shizuku UserService interface (IShellService.aidl)
        // whose impl (ShellUserService) runs in shell context (uid 2000)
        // so exec() can run privileged dumpsys / getprop / sysfs reads.
        aidl = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:perms')   // #1274 PermsLink: the host's Permissions page asks, not this lib
    compileOnly platform('androidx.compose:compose-bom:2025.11.01')
    compileOnly 'androidx.compose.ui:ui'
    compileOnly 'androidx.compose.foundation:foundation'
    compileOnly 'androidx.compose.material3:material3'
    compileOnly 'androidx.compose.runtime:runtime'
    // The Compose compiler plugin runs on the unit-test source set too, and compileOnly is not on its
    // classpath: a host whose ship runs every module's unit tests (Cloud Drive) needs the runtime here.
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.runtime:runtime'
    // AdbShellActivity (the page opened from a status chip) is a ComponentActivity hosting the Compose
    // page: every consumer already has androidx.activity (AppCompat / activity-compose), so it is not bundled here.
    compileOnly 'androidx.activity:activity:1.9.3'
    implementation project(':libs:core')
    // HostShell: the re-arm job a host app schedules (WorkManager), shared by Cloud Store and Cloud Account.
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    implementation 'androidx.core:core-ktx:1.13.1'

    // Shizuku — OPTIONAL fallback channel only. api = client binder;
    // provider = the ShizukuProvider already declared in app/'s manifest
    // (same authority, shared across the whole APK). Pinned identically
    // to app/'s existing ShizukuEnergy deps so there's one Shizuku
    // version in the merged APK.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // ── Embedded on-device ADB client (the LADB approach) ───────────
    // THIS is what makes the app a self-contained "Shizuku": it pairs
    // with the phone's OWN Wireless-Debugging adbd on 127.0.0.1 (user
    // enters the 6-digit code) and opens a `shell:` stream as uid 2000
    // — no third-party Shizuku app, no PC. conscrypt provides the TLS
    // stack libadb needs for the pairing handshake; BouncyCastle mints
    // the device keypair + self-signed cert (same recipe as KdeCrypto).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // BouncyCastle MUST be ONE consistent version across bcprov/bcpkix/bcutil.
    // libadb-android pulls bcprov-jdk15to18:1.81, and Gradle bumps the shared
    // bcprov to that highest version — so bcpkix/bcutil MUST also be 1.81 or
    // the JcaContentSignerBuilder clinit fails (NoClassDefFound
    // EdECObjectIdentifiers). Pin the whole suite to 1.81.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcutil-jdk15to18:1.81'

    // JVM unit tests for the PURE SfcVerdict parser (no Android/device deps —
    // it parses dumpsys text + a device-cap map and emits a verdict).
    testImplementation 'junit:junit:4.13.2'
    // The pure models parse build.json fragments with org.json (Android ships it; the JVM test classpath does not).
    testImplementation 'org.json:json:20250107'
}
