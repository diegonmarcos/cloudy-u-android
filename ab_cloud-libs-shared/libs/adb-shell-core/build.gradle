// #1682 P2a libs:adb-shell-core: the ADB Shell's pure core moved out of the SuperApp so the owner (Cloud Webserver, P2b) and the
// SuperApp share ONE copy: AdbReadinessOwner (the owner half of the #1678 readiness source; AdbReadiness itself is libs:adb-readiness), AdbCockpitModel (the #1647 Status cockpit model)
// and AdbPrereqs (the #1676 Perms chain). Packages are kept (com.diegonmarcos.superapp.system / .configs) so no consumer changes.
// No UI, no service, no receiver: the host installs AdbReadiness.connector / hostOpener at process start.
apply plugin: 'com.android.library'
// #1682 P3 step 4c: the cockpit / terminal / broker-page Compose UI lives here too (the compiler is resolved from each consuming root).
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.adbshellcore'
    compileSdk 36
    defaultConfig { minSdk 26 }
    buildFeatures { compose = true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api project(':libs:shizuku-adb-debug-tools')
    api project(':libs:shell-broker')
    // #1682 P3 step 5: AdbReadiness is client-safe and lives in its own lib; the owner side adds AdbReadinessOwner on top of it
    api project(':libs:adb-readiness')
    // BrokerGrantChannel / AdbToggle / ShellAudit are client-safe too (libs:adb-grants)
    api project(':libs:adb-grants')
    // #1682 P3 BrokerGrantChannel implements libs:perms PermsGrant.GrantChannel
    implementation project(':libs:perms')
    // #1682 P3 step 4c: the cockpit pages draw with the fleet UI kit (KitStoreRow, LocalKitPalette); it brings compose + fragment-ktx
    api project(':libs:ui-kit')
    // #1682 P3 step 4d: WirelessDebugKeeper (WorkManager worker) withdraws its legacy alert through libs:core FleetAlerts
    implementation project(':libs:core')
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
