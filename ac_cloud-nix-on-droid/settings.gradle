include ':app', ':termux-shared', ':terminal-emulator', ':terminal-view', ':rootfs-lib'

// #744 Fleet mesh membership: libs:core manifest-merges the CONSTELLATION_DATA
// signature permission and, through libs:devtools, FleetTokenProvider +
// FleetMemberReceiver + the MESH_MEMBER <queries> intent — without them the
// SuperApp and every sibling cannot see or reach this terminal. devtools is not
// optional: core declares `api project(':libs:devtools')`, which resolves
// against THIS settings file. Shared BY REFERENCE, never copied.
include ':libs:core', ':libs:devtools', ':libs:shell-client'
project(':libs').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs')
project(':libs:core').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/core')
project(':libs:devtools').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/devtools')
// #873 libs:core declares `api project(':libs:fleetconfig-model')` (the setup contract): the include is not optional.
include ':libs:fleetconfig-model'
project(':libs:fleetconfig-model').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/fleetconfig-model')
// #1122 libs:core declares `api project(':libs:crash')` (the default crash handler and screen): the include is not optional.
include ':libs:crash'
project(':libs:crash').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/crash')
// #1512 the SuperApp's shell broker client + the rish relay, shared BY REFERENCE (no project dependency of its own).
project(':libs:shell-client').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/shell-client')
// #1274 libs:perms (PermsShell: the one place a pm grant line is written): kept included, the Compose libs below may link it.
include ':libs:perms'
project(':libs:perms').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/perms')
// #1352 Configs ▸ General / ▸ About (libs:ui-nav-bars, in the terminal's menu) and its deps.
include ':libs:ui-nav-bars'
project(':libs:ui-nav-bars').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/ui-nav-bars')
include ':libs:bottomnav'
project(':libs:bottomnav').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/bottomnav')
include ':libs:ui-icons'
project(':libs:ui-icons').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/ui-icons')
include ':libs:theme-background'
project(':libs:theme-background').projectDir = new File(rootDir, '../ab_cloud-libs-shared/libs/theme-background')
