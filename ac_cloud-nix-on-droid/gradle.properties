## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# #787 4 GB, not 2: :rootfs-lib:compressReleaseAssets holds the ~624 MB x86_64 bootstrap.zip
# in this daemon while the app's R8 and lint run beside it, and ran out of heap on two ship runs
# in a row (37119929619, 37121703176). The hosted runner has 16 GB.
org.gradle.jvmargs=-Xmx4096M \
--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
android.useAndroidX=true
# #744 AGP 8 flipped these three defaults. Held at AGP 4/7's values so the
# toolchain move changes no behaviour: R stays transitive and final (code reads
# library resources through the app's R), and R8 stays in compat mode, the
# mode this fork's proguard-rules.pro was written and shipped against.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=false

minSdkVersion=26
# #1708 35 (was 28): Cloud Store updates this app silently on Android 17 only at 35+. 28 was
# kept for one reason, exec of files in the app's data dir, which Android forbids from 29. Here
# that is bin/login, bin/proot-static and the loader proot extracts: login is started by
# /system/bin/sh (termux-shared SystemLinkerExec) and proot with its loader runs from the native
# library directory (termux-shared NativeProot, app/build.gradle stageNativeProot).
# test/test-system-linker-exec.sh pins it; test-terminal-target-sdk.yml runs it on API 34 and 35
# emulators in every ship, and prove-terminal-target-sdk.yml proved parity with the 28 build
# before this moved.
# 35 and not 36: at 36 the edge-to-edge opt-out the terminal's screens rely on is ignored.
targetSdkVersion=35
ndkVersion=22.1.7171670
compileSdkVersion=36

markwonVersion=4.6.2

