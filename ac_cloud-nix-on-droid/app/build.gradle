plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

// #826 the build commit, baked into versionName "(sha-xxxxxxxx)" + BuildConfig.GIT_SHORT_SHA so
// Store Details (libs/appstore BuiltFrom) and About can name the installed build. Same
// derivation as the rest of the fleet: GITHUB_SHA first, `git rev-parse` locally. versionCode
// is untouched — identity on the fleet's update path stays what it was.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

android {
    // #758 SystemDnsBridge is compiled from libs/sysdns BY REFERENCE (plain Java, its own
    // source dir), as the termux terminal does, so there is one bridge and no copy.
    sourceSets {
        main {
            java.srcDirs += new File(cloudDnsBridge().sourceFile.parentFile.parentFile, 'src/bridge/java')
        }
    }

    // #744 AGP 8: the namespace (R and BuildConfig's package) lives here, not in
    // the manifest, and BuildConfig and AIDL are opt-in — this app's own code
    // reads BuildConfig, and CloudSessionService implements ICloudSession.aidl.
    namespace 'com.termux'
    buildFeatures {
        buildConfig true
        aidl true
    }

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.core:core:1.6.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.4.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation project(":terminal-view")
        implementation project(":termux-shared")

        // #744 Fleet mesh member: libs:core (+ devtools via `api`) merges the
        // fleet provider, receiver, <queries> and the CONSTELLATION_DATA
        // signature permission into this APK; without them the SuperApp and
        // every sibling cannot see or reach this terminal.
        implementation project(":libs:core")
        // #1547 the terminal selftest list is read at RUNTIME from Cloud Store's provider, never baked into the APK.
        implementation project(":libs:fleet-data-client")
        // #1352 Configs ▸ General / ▸ About in the terminal's menu (FleetConfigsEntries, libs:ui-nav-bars)
        implementation project(":libs:ui-nav-bars")
        // #1630 fleet-default Configs tail: Agents, Logcat, X-Ray App register themselves on the shared strip.
        implementation project(':libs:fleetconfigs-agents')
        implementation project(':libs:fleetconfigs-logcat')
        implementation project(':libs:fleetconfigs-xray')
        // #1512 rish over the SuperApp's shell broker (ShellRish + RishRelay): the thin client, no channel of its own.
        implementation project(":libs:shell-client")
        implementation project(":libs:shell-rish")
        // The ADB Shell page (AdbShellActivity) is Compose, compiled against the HOST's Compose
        // (compileOnly in the lib): this terminal supplies the runtime. ONE BOM for the fleet
        // (test-compose-bom-one-version.sh): FlowRow is experimental and has no binary compatibility
        // across Compose versions, so the lib and the host must run the same one.
        implementation platform('androidx.compose:compose-bom:2025.11.01')
        implementation 'androidx.compose.ui:ui'
        implementation 'androidx.compose.foundation:foundation'
        implementation 'androidx.compose.material3:material3'
        implementation 'androidx.compose.runtime:runtime'
        implementation 'androidx.activity:activity-compose:1.9.3'
        // core's androidx.core 1.13.1 brings concurrent-futures and with it
        // listenablefuture 1.0, whose one class guava 24.1-jre (above) already
        // carries: a duplicate-class build failure. The empty 9999 artifact is
        // guava's own published answer, the same line upstream termux-app added.
        implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    }

    // NIX-ON-DROID: Downstream version.
    defaultConfig {
        applicationId "cld.termux"
        applicationIdSuffix ".nix"
        // #789 the run's build stamp (root build.gradle), no longer a literal
        // bumped by hand (188051 until #789: #628, #744, #748 and the login
        // fixes each bumped it).
        versionCode rootProject.ext.cloudVersionCode()
        versionName "0.118.0_v0.3.12_nix"
        ndk {
          abiFilters 'arm64-v8a', 'x86_64'
        }

        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()

        if (appVersionName) versionName = appVersionName
        //validateVersionName(versionName)
        // #826 suffix AFTER the upstream semver check: "(sha-…)" is not semver build metadata.
        versionName = "${versionName} (sha-${shortSha})"
        buildConfigField "String", "GIT_SHORT_SHA", "\"${shortSha}\""

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        // #628 Slice 2 -- the applicationId of the companion lib TermuxInstaller
        // resolves at runtime (PackageManager.getApplicationInfo) to read the
        // rootfs out of. Read from build.json::release.companions, never a
        // literal, so the two agree by construction.
        buildConfigField "String", "CLOUD_ROOTFS_LIB_PACKAGE", "\"" + rootfsLibPackage() + "\""

        // #698 -- the rootfs content address THIS build was made against, by the
        // same function rootfs-lib stamps its versionName with. The Store updates
        // this app and that lib independently, so any pairing can be installed;
        // TermuxInstaller.rootfsVersionNotice says so on the terminal screen when
        // the rootfs about to run is not this one.
        buildConfigField "String", "CLOUD_ROOTFS_LIB_VERSION", "\"" + bootstrapArtifactId(bootstrapSpec().artifact) + "\""

        // #747 -- the login shell TerminalDebugApi runs a command in, so /api/terminal/exec gets
        // the shell a typed session gets. The same declaration bake_default_packages.py retargets
        // login-inner's usershell at; read, never restated.
        def cloudLoginShell = bootstrapSpec().default_packages?.login_shell_attr
        if (!cloudLoginShell)
            throw new GradleException("build.json forks.nixdroid.bootstrap.default_packages declares no login_shell_attr")
        buildConfigField "String", "CLOUD_LOGIN_SHELL", "\"" + cloudLoginShell + "\""

        // #758 where TermuxService's bridge answers the shell's lookups (bin/login's proot -p lands :53 here).
        buildConfigField "int", "CLOUD_DNS_BRIDGE_PORT", "${cloudDnsBridge().port}"

        // #790 the file AgentAuth writes the agent CLIs' credentials to and login-init.sh sources:
        // ab_cloud-terminal-store/store.json::agent_auth.env_file, the one declaration both read.
        buildConfigField "String", "CLOUD_AGENT_AUTH_ENV", "\"${new groovy.json.JsonSlurper().parse(new File(projectDir.parentFile.parentFile, "ab_cloud-terminal-store/store.json")).agent_auth.env_file}\""

        // #787 the session wake lock: build.json::wake_lock, the one declaration (ON by default).
        buildConfigField "boolean", "CLOUD_WAKE_LOCK_DEFAULT_ON", "${cloudWakeLock().default_on}"
        buildConfigField "boolean", "CLOUD_WIFI_LOCK", "${cloudWakeLock().wifi_lock}"

        // The mesh sshd started on boot: build.json::mesh_sshd, the one declaration.
        buildConfigField "int", "CLOUD_MESH_SSHD_PORT", "${cloudMeshSshd().port}"
        buildConfigField "String", "CLOUD_MESH_SSHD_BIND", "\"${cloudMeshSshd().bind.join(',')}\""
        buildConfigField "boolean", "CLOUD_MESH_SSHD_ON_BOOT", "${cloudMeshSshd().start_on_boot}"
        // Mesh-only (build.json::mesh_sshd.mesh_only): the default, the VPN interface name pattern, the mesh CIDRs and loopback.
        buildConfigField "boolean", "CLOUD_MESH_ONLY_DEFAULT", "${cloudMeshSshd().mesh_only.default_on}"
        buildConfigField "String", "CLOUD_MESH_IFACES", "\"${cloudMeshSshd().mesh_only.ifaces}\""
        buildConfigField "String", "CLOUD_MESH_CIDRS", "\"${cloudMeshSshd().mesh_only.cidrs.join(',')}\""
        buildConfigField "String", "CLOUD_MESH_LOOPBACK", "\"${cloudMeshSshd().mesh_only.loopback.join(',')}\""

        // cloud-shared-store (ac_cloud-termux/build.json::shared_store + ::storage, the owner's ONE
        // declaration): the migration notice's backup drop and marker. The store itself is linked by
        // bin/login (bake_default_packages.py storage_setup) through the shared uid.
        buildConfigField "String", "CLOUD_LEGACY_SHARED_ROOT", "\"${sharedRootName()}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_MIGRATION_DIR", "\"${cloudSharedStoreDecl().migration.backup_dir}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_MIGRATION_ARCHIVE", "\"${cloudSharedStoreDecl().migration.archive}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_MIGRATION_MARKER", "\"${cloudSharedStoreDecl().migration.marker}\""
        manifestPlaceholders.TERMUX_PACKAGE_NAME = "cld.termux.nix"
        manifestPlaceholders.TERMUX_APP_NAME = "Cloud Terminal Nix"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        /* NIX-ON-DROID: Unused
        // ABI, from the active release.variants[] entry. Same hook as
        // ac_cloud-nav: the engine exports CLOUDNAV_ABIS from the variant it
        // was asked to build, so one matrix job produces the arm64 APK and the
        // other the x86_64 one.
        //
        // Upstream's own `splits` block stays off (F-Droid cannot take split
        // APKs, so it defaults to a single universal build). Filtering here
        // instead is what every other app in this constellation does, and it
        // is why the first build shipped one 115MB APK carrying all four ABIs.
        ndk {
            def abiOverride = System.getenv('CLOUDNAV_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : ['arm64-v8a']
            abiFilters.addAll(abis as List)
        }

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
        */
        splits {
            abi {
                reset ()
                include 'arm64-v8a'
                universalApk false
            }
        }
    }


    signingConfigs {
        // Release signing, from the ONE shared constellation keystore.
        //
        // Upstream ships only a debug config, so assembleRelease produced an
        // unsigned APK. Ours must carry the same key as every other app here,
        // because CLOUD_EXEC is a signature-level permission: a build signed
        // with anything else is refused the bind exactly as if it were not
        // installed — a silent failure indistinguishable from "not there".
        //
        // Values come from the environment the fork engine writes
        // (signing=vault_jks_env, see build.json::forks.*.build.signing_env),
        // never from a file in the tree and never a literal here.
        release {
            def ksPath = System.getenv('TERMUX_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('TERMUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TERMUX_KEY_ALIAS')
                keyPassword System.getenv('TERMUX_KEY_PASSWORD')
            }
        }

        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            // Only when the engine supplied a key: an IDE build with no vault
            // signs debug-style rather than failing, and a CI build without it
            // would produce an unsigned APK that cannot bind — which is worth
            // noticing at install time, not at first use.
            if (System.getenv('TERMUX_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    /* NIX-ON-DROID: Unused
    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }
    */

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

// ---------------------------------------------------------------------------
// #348 — bake the proot + glibc root filesystem into the APK.
//
// This is the RUNTIME, not packaging convenience. The zip carries
// bin/proot-static (built aarch64-unknown-linux-android, so bionic runs it
// natively) and under it glibc-2.37-45 with lib/ld-linux-aarch64.so.1 and
// lib/libc.so.6. #288 proved with ELF evidence that a glibc binary has no
// loader on Android; proot supplies one. Nothing else in this APK makes a
// glibc CLI runnable.
//
// Before this task, TermuxInstaller downloaded the zip on FIRST LAUNCH from a
// url typed into an editable dialog box, with no integrity check whatsoever.
// That is three failures at once: no network means no terminal ever, a host
// nobody here controls sits in the boot path, and unverified bytes get marked
// executable. Fetching once in CI against a pinned sha256 removes all three.
//
// EVERY value below is read from build.json. Nothing about which bootstrap,
// from where, for which ABI, or under which package name is written here --
// extending this to a new ABI or a new release is a JSON edit.
//
// Nothing enters git: *.zip is gitignored and the output lives in
// app/build/generated/bootstrap/.
// ---------------------------------------------------------------------------

// #758 the shell's DNS bridge: build.json's declaration, with the port read from its one
// source (libs/sysdns data/sysdns.json::bridge_port), never restated.
def cloudDnsBridge() {
    def decl = bootstrapSpec().dns_bridge
    if (decl == null)
        throw new GradleException("build.json forks.nixdroid.bootstrap declares no dns_bridge -- the shell would resolve past the SuperApp's DNS menu")
    def source = new File(projectDir.parentFile, decl.source)
    if (!source.exists())
        throw new GradleException("missing " + source + " (dns_bridge.source)")
    return decl + [port: new groovy.json.JsonSlurper().parse(source).bridge_port as int, sourceFile: source]
}

def bootstrapSpec() {
    def declaration = new File(projectDir.parentFile, "build.json")
    if (!declaration.exists())
        throw new GradleException("missing " + declaration + " -- the bootstrap pin is declared there, not here")
    def spec = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8"))
            ?.forks?.nixdroid?.bootstrap
    if (spec == null)
        throw new GradleException(declaration.toString() + " has no forks.nixdroid.bootstrap block; refusing to "
                + "ship an APK whose terminal would fall back to a first-run download")
    return spec
}

// #628 Slice 2 -- the ONE declaration of the rootfs companion lib's
// applicationId, read from build.json::release.companions so BuildConfig's
// CLOUD_ROOTFS_LIB_PACKAGE and rootfs-lib/build.gradle's own applicationId
// can never drift apart from each other.
def rootfsLibPackage() {
    def declaration = new File(projectDir.parentFile, "build.json")
    if (!declaration.exists())
        throw new GradleException("missing " + declaration)
    def declared = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8"))
    def companion = (declared.release?.companions ?: []).find { it.id == "rootfs-nixdroid" }
    if (companion == null || !companion.package)
        throw new GradleException(declaration.toString() + " has no release.companions[] entry with id "
                + "'rootfs-nixdroid' declaring .package")
    return companion.package
}

// The ABI this APK is for, from the release.variants[] entry the engine
// selected. Same CLOUDNAV_ABIS hook every other per-ABI app here uses. One
// rootfs per APK: baking all of them would multiply ~38MB by four for three
// root filesystems this APK can never execute.
def bootstrapAbi() {
    def selected = System.getenv("CLOUDNAV_ABIS")
    def abi = (selected?.trim()) ? selected.split(",")[0].trim() : "arm64-v8a"
    def known = bootstrapSpec().archs
    if (!known.containsKey(abi))
        throw new GradleException("CLOUDNAV_ABIS names ABI '" + abi + "', which build.json's "
                + "forks.nixdroid.bootstrap.archs does not declare (known: " + known.keySet().join(", ") + ")")
    return abi
}

// #612 -- the ONE declaration of the cloud-drive shared store, read from the
// sibling app so this app never keeps its own copy of the value to drift out
// of sync with. ac_cloud-termux/build.json::storage.shared_root (cloud-shared-store: the store's
// owner declares it; here it is the LEGACY mirror the bin/login fallback links to).
// cloud-shared-store: the owner's declaration, and the guard that this manifest's
// android:sharedUserId is the SAME literal (the shared uid is what lets bin/login link the store).
def cloudSharedStoreDecl() {
    def declaration = new File(projectDir.parentFile.parentFile, "ac_cloud-termux/build.json")
    def decl = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8")).shared_store
    if (!decl?.shared_user_id || !decl?.migration)
        throw new GradleException(declaration.toString() + " has no shared_store.shared_user_id / migration")
    def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText("UTF-8")
    if (!manifest.contains('android:sharedUserId="' + decl.shared_user_id + '"'))
        throw new GradleException("AndroidManifest.xml android:sharedUserId must be the literal shared_store.shared_user_id (" + decl.shared_user_id + ")")
    return decl
}

def sharedRootName() {
    def declaration = new File(projectDir.parentFile.parentFile, "ac_cloud-termux/build.json")
    if (!declaration.exists())
        throw new GradleException("missing " + declaration + " -- #612's shared-store mount needs storage.shared_root from there")
    def sharedRoot = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8"))?.storage?.shared_root
    if (!sharedRoot)
        throw new GradleException(declaration.toString() + " has no storage.shared_root")
    return sharedRoot
}

// #618 -- the published asset's name IS the content address of everything that
// determines the baked zip: sha256 over artifact.identity_files, first 12 hex,
// plus the release.variants[] id. A pin or script change renames the asset, so
// it is uploaded and every phone refetches by its new digest; an app-code
// change leaves the name alone, so nothing is uploaded and no phone refetches.
// That is the whole reason there is no hand-maintained version to forget.
def bootstrapArtifactId(art) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    art.identity_files.each { rel ->
        def f = new File(projectDir.parentFile, rel)
        if (!f.isFile())
            throw new GradleException("build.json::...artifact.identity_files names " + rel + ", which does not exist")
        digest.update(java.security.MessageDigest.getInstance("SHA-256").digest(f.bytes))
    }
    return digest.digest().encodeHex().toString().substring(0, 12)
}

// The release.variants[] id for an Android ABI, so the asset is named the way
// the APK beside it is: the variant id, never the raw ABI.
def bootstrapVariantId(abi) {
    def declared = new groovy.json.JsonSlurper()
            .parseText(new File(projectDir.parentFile, "build.json").getText("UTF-8"))
    def variant = declared.release.variants.find { it.abis && it.abis[0] == abi }
    if (variant == null)
        throw new GradleException("no build.json release.variants[] entry declares abi " + abi)
    return variant.id
}

def bootstrapArtifactAsset(art, abi) {
    return art.asset.replace("{id}", bootstrapArtifactId(art)).replace("{abi}", bootstrapVariantId(abi))
}

def bootstrapAssetsDir = new File(buildDir, "generated/bootstrap/assets")

task bakeBootstrap() {
    outputs.dir bootstrapAssetsDir
    doLast {
        def spec = bootstrapSpec()
        def abi = bootstrapAbi()
        // #847 -- `source` picks which declared zip the bake starts from: "self_built" (ours,
        // bootstrap-src/, from the bake's nixpkgs pin) or anything else for the top-level
        // third-party 24.05 pins, kept as the declared fallback.
        def source = (spec.source == "self_built" && spec.self_built != null) ? spec.self_built : spec
        def pin = source.archs[abi]
        def art = spec.artifact
        if (art == null)
            throw new GradleException("build.json::forks.nixdroid.bootstrap has no artifact block -- refusing to "
                    + "bake the payload with nothing to version it by (#618/#628)")

        // #628 Slice 2 -- the payload's final home is rootfs-lib's staging
        // area, not a GH release. If a previous run already staged both files
        // there, this run is free: no re-download, no re-patch, no re-bake of
        // ~400 MB for a rerun that changed nothing.
        def payloadDir = new File(rootProject.buildDir, "rootfs-payload")
        def stagedPayload = new File(payloadDir, "bootstrap.zip")
        def stagedManifest = new File(payloadDir, "rootfs-lib.json")
        if (stagedPayload.isFile() && stagedManifest.isFile()) {
            logger.quiet("bakeBootstrap: " + abi + " -> already staged at " + payloadDir)
            return
        }

        def staging = new File(buildDir, "generated/bootstrap/download")
        staging.mkdirs()
        bootstrapAssetsDir.mkdirs()

        def downloaded = new File(staging, "bootstrap-" + pin.arch + ".zip")
        def remoteUrl = source.url_base + "/" + source.release + "/bootstrap-" + pin.arch + ".zip"

        // Re-use a cached download only when it already hashes to the pin.
        if (!downloaded.exists() || sha256Of(downloaded) != pin.sha256) {
            logger.quiet("bakeBootstrap: downloading " + remoteUrl + " ...")
            downloaded.delete()
            def connection = new URL(remoteUrl).openConnection()
            connection.setInstanceFollowRedirects(true)
            def out = new BufferedOutputStream(new FileOutputStream(downloaded))
            out << connection.inputStream
            out.close()
        }

        def actual = sha256Of(downloaded)
        if (actual != pin.sha256) {
            downloaded.delete()
            throw new GradleException("bakeBootstrap: wrong sha256 for " + remoteUrl
                    + "\n  expected " + pin.sha256 + " (build.json::forks.nixdroid.bootstrap" + (source.is(spec) ? "" : ".self_built") + ".archs['" + abi + "'])"
                    + "\n  actual   " + actual
                    + "\nThe pin is the only thing standing between this APK and whatever that third-party host "
                    + "served today. Verify the new bytes by hand before touching the pin.")
        }

        // The published bootstrap hardcodes the UPSTREAM package id in
        // bin/login and usr/lib/login-inner -- generated shell scripts, not
        // ELF, whose absolute paths no runtime call rewrites. Unpatched, the
        // terminal execs a proot-static under a package directory that is not
        // installed and dies ENOENT naming another app's path. Both ids are
        // the same byte length, which is what the 2026-08-30 rename bought us.
        def rewrite = spec.package_name_rewrite
        def patcher = new File(projectDir, "src/main/cpp/patch_bootstrap_ids.py")
        if (!patcher.exists())
            throw new GradleException("missing " + patcher + " (the app-id rewrite gate)")
        def idPatched = new File(bootstrapAssetsDir, spec.asset_name + ".idpatched")
        def result = exec {
            commandLine "python3", patcher.absolutePath, downloaded.absolutePath, idPatched.absolutePath,
                    rewrite.from + "=" + rewrite.to
            ignoreExitValue = true
        }
        if (result.exitValue != 0)
            throw new GradleException("patch_bootstrap_ids.py failed for " + downloaded
                    + " (exit " + result.exitValue + "); see log above")

        // #595 -- agent tooling (git, node, claude), baked into the same store
        // this bootstrap already carries, so the terminal opens ready-to-use
        // instead of needing upstream's interactive, networked setup wizard.
        def tooling = spec.default_packages
        def baked = new File(bootstrapAssetsDir, spec.asset_name)
        if (tooling == null) {
            idPatched.renameTo(baked)
        } else {
            def toolingBaker = new File(projectDir, "src/main/cpp/bake_default_packages.py")
            if (!toolingBaker.exists())
                throw new GradleException("missing " + toolingBaker + " (the default-tooling bake gate)")
            // The CI runner is x86_64 for every ABI matrix job -- only the
            // DOWNLOADED bootstrap differs per ABI. Without forcing --system
            // here, a plain `nix profile install` targets the runner's own
            // arch, so the arm64 job would bake x86_64-linux binaries into an
            // aarch64 rootfs. cache.nixos.org already carries pre-built
            // aarch64-linux substitutes for git/nodejs_22/claude-code, so this
            // needs no qemu -- it just fetches the right arch's binaries.
            def nixSystem = pin.arch == "aarch64" ? "aarch64-linux" : "x86_64-linux"
            // #795 -- the proot both terminals ship (ab_cloud-terminal-store/proot.json), replacing
            // the zip's 24.05 copy, which hands glibc 2.42's TCGETS2 to Android and gets EACCES.
            def prootFetcher = new File(projectDir.parentFile.parentFile, "ab_cloud-terminal-store/fetch-proot.py")
            def fetchedProot = new File(staging, "proot-static-" + abi)
            def prootResult = exec {
                commandLine "python3", prootFetcher.absolutePath, abi, fetchedProot.absolutePath
                ignoreExitValue = true
            }
            if (prootResult.exitValue != 0)
                throw new GradleException("fetch-proot.py failed (exit " + prootResult.exitValue + "); see log above")
            def toolingResult = exec {
                commandLine "python3", toolingBaker.absolutePath, idPatched.absolutePath, baked.absolutePath,
                        tooling.nixpkgs_pin, tooling.attrs.join(","), tooling.profile_link,
                        tooling.fallback_init_script, rewrite.to, nixSystem, sharedRootName(),
                        // #641 -- which baked attr becomes the login shell. Declared, never
                        // a literal here: the bake step resolves it under profile_link.
                        tooling.login_shell_attr,
                        // #758 -- the shell's resolv.conf and its loopback-only servers.
                        cloudDnsBridge().resolv_conf, cloudDnsBridge().nameservers.join(","),
                        // #771 -- goose, hermes and the noexec shim, from rootfs-extras.nix.
                        new File(projectDir.parentFile, tooling.extras.expr).absolutePath,
                        tooling.extras.attrs.join(","), tooling.extras.preload,
                        fetchedProot.absolutePath
                ignoreExitValue = true
            }
            idPatched.delete()
            if (toolingResult.exitValue != 0)
                throw new GradleException("bake_default_packages.py failed (exit " + toolingResult.exitValue
                        + "); see log above")
        }

        // #698 -- the login closure gate, on the bytes that will ship. The bake's
        // own gates look at the CI runner's /nix/store and rootfs-lib's
        // verifyRootfsPayload only checks the file exists; this opens the zip and
        // resolves every path bin/login and login-inner need the way the phone
        // will. It verifies the payload and shapes none of it, so its declaration
        // lives in ../login-closure.json, outside the identity_files.
        def closureGate = new File(projectDir, "src/main/cpp/verify_login_closure.py")
        if (!closureGate.exists())
            throw new GradleException("missing " + closureGate + " (the login closure gate)")
        def closureResult = exec {
            commandLine "python3", closureGate.absolutePath, baked.absolutePath,
                    new File(projectDir.parentFile, "build.json").absolutePath,
                    new File(projectDir.parentFile, "login-closure.json").absolutePath
            ignoreExitValue = true
        }
        if (closureResult.exitValue != 0)
            throw new GradleException("verify_login_closure.py: the baked rootfs would not log in on the phone (exit "
                    + closureResult.exitValue + "); see the FAIL lines above")

        // #628 Slice 2 -- stage the FINAL (id-patched, tooling-baked) zip for
        // rootfs-lib instead of publishing it to a GH release. NO network in
        // this step: art.repo/.tag/.url describe the transport #628 removes,
        // and nothing here reads them. The sha256 gates TermuxInstaller's
        // extraction (openBootstrapFromLib) exactly as it gated fetchBootstrap
        // before it -- it is computed from the bytes that actually go into
        // the lib APK, so it cannot describe anything else. version is the
        // same 12-hex content address the app's own BOOTSTRAP_VERSION
        // comparison already keyed on, unchanged by this move.
        def bakedLength = baked.length()
        def digest = sha256Of(baked)
        def version = bootstrapArtifactId(art)
        payloadDir.mkdirs()
        // THE line that shrinks the app APK: the zip goes to rootfs-lib's
        // staging area, never into this module's own assets/.
        if (!baked.renameTo(stagedPayload))
            throw new GradleException("could not move " + baked + " to " + stagedPayload
                    + " -- the app APK would carry the bootstrap it should not (#618/#628)")
        stagedManifest.text = groovy.json.JsonOutput.toJson(
                [version: version, payload: stagedPayload.name, sha256: digest])

        logger.quiet("bakeBootstrap: " + abi + " -> " + stagedPayload
                + " (" + bakedLength + " B, from " + downloaded.length() + " B), sha256 " + digest)
    }
}

def sha256Of(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    def buffer = new byte[8192]
    def input = new FileInputStream(file)
    try {
        while (true) {
            def read = input.read(buffer)
            if (read < 0) break
            digest.update(buffer, 0, read)
        }
    } finally {
        input.close()
    }
    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) checksum = "0" + checksum
    return checksum
}

// #628 Slice 2 -- bootstrapAssetsDir carries only INTERMEDIATE files now
// (the id-patched, tooling-baked zip on its way to rootfs-lib's staging
// area). Nothing that ends up there is meant for this APK's own assets/ any
// more -- the whole point of the companion lib is that this app carries no
// part of the ~400 MB payload -- so it is no longer wired as a sourceSet.

// Assets are merged long before javaCompile, so depending on javaCompile (the
// hook the sibling termux bootstrap uses for its cpp inputs) would bake
// nothing and still go green.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn bakeBootstrap }

