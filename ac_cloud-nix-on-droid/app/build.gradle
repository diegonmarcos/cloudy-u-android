// The debug keystore is GENERATED, not committed.
//
// Upstream ships it as a binary blob with its password in this file, which is
// harmless — it signs debug builds and nothing trusts it — but *.jks is
// ignored repo-wide here, so vendoring dropped it and left a build.gradle
// pointing at a file that is not there. Committing a key to defeat the rule
// that ignores keys is the wrong way round; making it reproducible is not.
//
// Release builds never reach this: AGP validates a signingConfig only where
// it is used, and release is signed with the constellation keystore.
tasks.register('devKeystore') {
    description = 'Create the throwaway debug keystore if it is absent.'
    def ks = file('testkey_untrusted.jks')
    outputs.file ks
    onlyIf { !ks.exists() }
    doLast {
        exec {
            commandLine 'keytool', '-genkeypair', '-keystore', ks.absolutePath,
                '-alias', 'alias', '-storepass', 'xrj45yWGLbsO7W0v', '-keypass', 'xrj45yWGLbsO7W0v',
                '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
                '-dname', 'CN=debug, OU=cloud, O=cloud, C=US'
        }
    }
}
tasks.matching { it.name.toLowerCase().contains('debug') && it.name.startsWith('validateSigning') }
     .configureEach { dependsOn 'devKeystore' }

// #787 build.json::wake_lock -- whether a session takes the wake lock without being asked, and
// whether the Wi-Fi lock comes with it. Both must be declared booleans: a missing key must not
// quietly become "off".
def cloudMeshSshd() {
    def declaration = new File(projectDir.parentFile, "build.json")
    def decl = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8")).mesh_sshd
    if (!(decl?.port instanceof Integer) || !(decl?.bind instanceof List) || decl.bind.isEmpty() || !(decl?.start_on_boot instanceof Boolean))
        throw new GradleException(declaration.toString() + " mesh_sshd must declare integer port, non-empty bind list and boolean start_on_boot")
    def mo = decl.mesh_only
    if (!(mo?.default_on instanceof Boolean) || !(mo?.ifaces instanceof String) || !(mo?.cidrs instanceof List) || mo.cidrs.isEmpty() || !(mo?.loopback instanceof List) || mo.loopback.isEmpty())
        throw new GradleException(declaration.toString() + " mesh_sshd.mesh_only must declare boolean default_on, string ifaces, non-empty cidrs and loopback lists")
    return decl
}

def cloudWakeLock() {
    def declaration = new File(projectDir.parentFile, "build.json")
    def decl = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8")).wake_lock
    if (!(decl?.default_on instanceof Boolean) || !(decl?.wifi_lock instanceof Boolean))
        throw new GradleException(declaration.toString() + " wake_lock must declare boolean default_on and wifi_lock")
    return decl
}
