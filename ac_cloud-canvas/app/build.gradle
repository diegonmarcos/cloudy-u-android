plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))

// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base — the fleet encoding
// (ac_cloud-calc / ac_cloud-c3), so an update is never refused as older.
// #1783 P5: deterministic version. The SOURCE commit time (FLEET_SOURCE_TIME 'yyyyMMdd.HHmmss' UTC, else COMMS_BUILD_TIMESTAMP,
// else the HEAD commit's committer time, else the wall clock for a local build): the same commit always builds the same code,
// floored at 3462240 (1_cicd/src/data/version-floor.json, above every code published before) so an installed app is never offered a lower one.
def fleetSourceTime = { ->
    def fmt = java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss')
    def stamp = System.getenv('FLEET_SOURCE_TIME') ?: System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try { return java.time.LocalDateTime.parse(stamp, fmt) } catch (ignored) { }
    }
    try {
        def ct = providers.exec {
            commandLine 'git', 'show', '-s', '--format=%ct', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (ct) return java.time.LocalDateTime.ofEpochSecond(Long.parseLong(ct), 0, java.time.ZoneOffset.UTC)
    } catch (ignored) { }
    return java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
}()
def codeFinal = { ->
    def base = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    long mins = java.time.Duration.between(base, fleetSourceTime).toMinutes()
    return (int) Math.max(3462240L, 3000000L + mins)
}()

def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(java.util.Date.from(fleetSourceTime.toInstant(java.time.ZoneOffset.UTC)))
}

def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-canvas')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// ── the declarations, baked ────────────────────────────────────────────────
// #868 ui.bottom_nav + ui.sections + ui.default_section are THE navigation declaration (libs:bottomnav's NavDecl); Decl.kt is the only decoder.
if (buildJson.ui?.bottom_nav == null || !buildJson.ui?.sections)
    throw new GradleException("build.json::ui.bottom_nav / ui.sections missing — the bottom nav would draw nothing (#868)")
def uiSectionsB64    = b64(buildJson.ui.sections)
def uiBottomNav      = buildJson.ui.bottom_nav.join(',')
def uiDefaultSection = (buildJson.ui.default_section ?: buildJson.ui.bottom_nav[0]).toString()

// ── #1809 the Play page's SoundFont engine (build.json::audio) ──────────────────────────────────────────────────────────────────
// Only the build half is read here (the runtime half is assets/soundfont/soundfont.json, audio.soundfont.config_asset, decoded by
// audio/SoundFont.kt; nothing of it is baked into BuildConfig). FluidSynth's official Android build and the Oboe 1.9.0 headers
// are fetched by fetchFluidSynth from their pinned URLs, verified against their pinned sha256, and only the libraries audio.soundfont.libs
// names are packaged (jniLibs) and linked (CMake). A sha256 mismatch fails the build; nothing unpinned is ever used.
if (!buildJson.audio?.soundfont?.android_zip?.sha256 || !buildJson.audio?.soundfont?.bank?.asset)
    throw new GradleException("build.json::audio.soundfont missing (#1809)")
def sfDecl = buildJson.audio.soundfont
def audioDefaultEngine = (buildJson.audio.default_engine ?: 'soundfont').toString()
def fluidDir = new File(buildDir, 'fluidsynth')
def fluidAbis = { ->
    def o = System.getenv('CLOUDCANVAS_ABIS')
    (o?.trim()) ? o.split(',').collect { it.trim() }.findAll { it } : (buildJson.android.abi_filters ?: ['arm64-v8a'])
}()
/** #1809 fetchFluidSynth: a typed task (the configuration cache is on) with every input declared; plain JDK calls only at execution time. */
abstract class FetchFluidSynth extends DefaultTask {
    @Input abstract Property<String> getZipUrl()
    @Input abstract Property<String> getZipSha()
    @Input abstract Property<String> getAarUrl()
    @Input abstract Property<String> getAarSha()
    @Input abstract ListProperty<String> getLibs()
    @Input abstract ListProperty<String> getAbis()
    @Internal abstract DirectoryProperty getCacheDir()
    @OutputDirectory abstract DirectoryProperty getOutDir()

    static String sha256Of(File f) {
        def md = java.security.MessageDigest.getInstance('SHA-256')
        f.withInputStream { s -> byte[] b = new byte[1 << 16]; int n; while ((n = s.read(b)) > 0) md.update(b, 0, n) }
        md.digest().encodeHex().toString()
    }

    static File fetch(File cache, String url, String sha) {
        def f = new File(cache, sha)
        if (f.isFile() && sha256Of(f) == sha) return f
        def tmp = new File(cache, sha + '.part')
        new URL(url).withInputStream { i -> tmp.withOutputStream { o -> o << i } }
        def got = sha256Of(tmp)
        if (got != sha) { tmp.delete(); throw new GradleException("#1809 ${url}: sha256 ${got}, pinned ${sha}") }
        if (!tmp.renameTo(f)) throw new GradleException("#1809 could not keep ${url} in ${cache}")
        f
    }

    static void extract(java.util.zip.ZipFile z, java.util.zip.ZipEntry e, File dst) {
        dst.parentFile.mkdirs()
        z.getInputStream(e).withStream { i -> dst.withOutputStream { o -> o << i } }
    }

    @TaskAction
    void run() {
        File out = outDir.get().asFile
        File cache = cacheDir.get().asFile
        cache.mkdirs()
        out.deleteDir()
        out.mkdirs()
        List<String> wantAbis = abis.get()
        List<String> wantLibs = libs.get()
        def zip = new java.util.zip.ZipFile(fetch(cache, zipUrl.get(), zipSha.get()))
        try {
            zip.entries().each { e ->
                String n = e.name
                if (e.directory) return
                if (n.startsWith('include/')) extract(zip, e, new File(out, n))
                for (abi in wantAbis) for (lib in wantLibs) if (n == "lib/${abi}/${lib}".toString()) extract(zip, e, new File(out, "jniLibs/${abi}/${lib}"))
            }
        } finally { zip.close() }
        def aar = new java.util.zip.ZipFile(fetch(cache, aarUrl.get(), aarSha.get()))
        try {
            String pre = 'prefab/modules/oboe/include/'
            aar.entries().each { e -> if (!e.directory && e.name.startsWith(pre)) extract(aar, e, new File(out, 'oboe-include/' + e.name.substring(pre.length()))) }
        } finally { aar.close() }
        for (abi in wantAbis) for (lib in wantLibs)
            if (!new File(out, "jniLibs/${abi}/${lib}").isFile()) throw new GradleException("#1809 ${lib} is not in the FluidSynth build for ${abi}")
        if (!new File(out, 'oboe-include/oboe/Oboe.h').isFile()) throw new GradleException('#1809 the Oboe headers are missing from the pinned AAR')
    }
}

def tasksFetchFluidSynth = tasks.register('fetchFluidSynth', FetchFluidSynth) {
    description = '#1809: fetch the pinned FluidSynth Android build and Oboe headers, verify their sha256 (sha256Of), unpack the declared libraries'
    zipUrl.set(sfDecl.android_zip.url.toString())
    zipSha.set(sfDecl.android_zip.sha256.toString())
    aarUrl.set(sfDecl.oboe_headers_aar.url.toString())
    aarSha.set(sfDecl.oboe_headers_aar.sha256.toString())
    libs.set(sfDecl.libs.collect { it.toString() })
    abis.set(fluidAbis.collect { it.toString() })
    cacheDir.set(new File(gradle.gradleUserHomeDir, 'caches/cloud-canvas-pins'))
    outDir.set(fluidDir)
}

android {
    namespace 'com.diegonmarcos.cloudcanvas'
    compileSdk 36
    // #1809 libcanvasaudio.so (app/src/main/cpp): the fleet's pinned NDK and CMake (the same as Cloud Gallery's)
    ndkVersion '29.0.14033849'

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        resValue "string", "app_name", buildJson.display_name
        applicationId 'com.diegonmarcos.cloudcanvas'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDCANVAS_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",      "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",    "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",       "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM",    "\"${logSinkStream}\""
        buildConfigField "String", "UI_SECTIONS_B64",    "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",      "\"${uiBottomNav}\""
        buildConfigField "String", "UI_DEFAULT_SECTION", "\"${uiDefaultSection}\""
        buildConfigField "String", "AUDIO_DEFAULT_ENGINE", "\"${audioDefaultEngine}\""
        externalNativeBuild {
            cmake {
                // FluidSynth needs the shared C++ runtime (libc++_shared.so), so the app's own library uses it too
                arguments "-DANDROID_STL=c++_shared", "-DFLUID_DIR=${fluidDir.absolutePath}"
            }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    // #1809 the FluidSynth libraries fetchFluidSynth unpacked (the NEEDED closure of libfluidsynth.so, Oboe 1.9.0 among them)
    sourceSets { main { jniLibs.srcDirs += [new File(fluidDir, 'jniLibs')] } }

    // ONE shared Cloud-constellation key — same key as every other app in the fleet.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  signingConfig signingConfigs.debug }
    }

    // #1787 the sampled instruments are streamed from the APK by file descriptor (MediaExtractor on assets.openFd): stored, never compressed
    // #1809 the SoundFont bank is read in place through AAssetManager (FluidSynth's sfloader callbacks seek in it): stored as well
    androidResources {
        noCompress 'ogg', 'sf2'
    }

    packaging {
        jniLibs {
            // #1809 16 KB pages: native libraries stay stored and aligned in the APK (page-size-guard.json)
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // The fleet's navigation: NavDecl and the top-bar scaffold's drawer (libs:bottomnav), the first row with
    // Profile at the top right, the second row with icons, the bottom nav, the page gradient (#1154).
    implementation project(':libs:bottomnav')
    // The nav icon catalog (name to ImageVector) every nav glyph is drawn from (#1160); libs:bottomnav depends on it too.
    implementation project(':libs:ui-icons')
    implementation project(':libs:ui-nav-bars')
    // #1630 fleet-default Configs tail: Agents, Logcat, X-Ray App register themselves on the shared strip.
    implementation project(':libs:fleetconfigs-agents')
    implementation project(':libs:fleetconfigs-logcat')
    implementation project(':libs:fleetconfigs-xray')
    implementation project(':libs:theme-background')
    // The fleet's tokens and kit: CloudKitTheme, KitPalette, KitCard, KitSettingsRow, KitButton (libs:ui-kit).
    implementation project(':libs:ui-kit')
    // #1782 the Draw Enhancer: the fleet AI contract and HTTP (libs:ai, for an own key), the model catalogue, the fleet's decisions engine
    // (#1799 libs:decisions-link: the run without an own key, the fleet Account's key held by the engine, never read here) and the
    // runtime dataset reader (the presets are served by Cloud Store, #1547).
    implementation project(':libs:ai')
    implementation project(':libs:model-catalogue')
    implementation project(':libs:decisions-link')
    implementation project(':libs:fleet-data-client')
    // #1787 Draw > Board: the fleet's one embedded web view (CloudWeb, WebProfile.APP_PAGE, render-process recovery) and androidx.webkit
    // (WebViewAssetLoader, the web message listener of the board bridge), shared BY REFERENCE.
    implementation project(':libs:web-core')
    // #1865 the sections, each its own library (the app is the shell that wires them): Draw (+ Board), Painter, Play, and what they share
    // (the palette, AppTheme, the export folders and names). Their Kotlin keeps the app's packages, so nothing was renamed by the move.
    implementation project(':libs:canvas-core')
    implementation project(':libs:canvas-draw')
    implementation project(':libs:canvas-painter')
    implementation project(':libs:canvas-play')
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    // themes.xml's parent, Theme.Material3.Dark.NoActionBar, lives here.
    implementation 'com.google.android.material:material:1.12.0'

    // Android's own org.json at runtime; the real library for the JVM suite.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

// #1809 the FluidSynth libraries and headers exist before anything is configured, compiled or packaged
preBuild.dependsOn tasksFetchFluidSynth
tasks.matching { it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake') || it.name.contains('JniLib') }.configureEach { dependsOn tasksFetchFluidSynth }
