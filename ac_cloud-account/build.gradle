// Root build.gradle — plugin versions only.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library'     version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android'            version '2.3.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20' apply false
    // Compose (#565): the shell is Compose; the account pages it hosts are
    // libs:account's Fragments, embedded through fragment-compose.
    id 'org.jetbrains.kotlin.plugin.compose'       version '2.3.20' apply false
    // #1093 libs:fleet-endpoints (the endpoint fallback shared with Cloud Mail) is plain JVM Kotlin.
    id 'org.jetbrains.kotlin.jvm'                  version '2.3.20' apply false
    // #1445 libs:git-core / libs:git-repos (under libs:git-ui's GitConnect) are mutation-tested by PIT, like Cloud Drive's root.
    id 'info.solidsoft.pitest'                     version '1.19.0' apply false
}
