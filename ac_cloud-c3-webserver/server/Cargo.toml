[package]
name = "c3-webserver"
version = "0.3.0"
edition = "2021"
description = "The phone's local web servers: the emulated drive on :8002 is the shared Linux web UI (ab_cloud-libs-shared/libs/fleet-webserver, nothing of it lives here), the :8003 diagnostics page, and the private DNS for the four .app names. Linked by ../src-tauri and started in the app's own process."

[dependencies]
# THE web server of the fleet, with the verbatim Linux frontend bundled at its build time. :8002 is this crate's
# `start`, rooted at /storage/emulated/0; no page, route or script of it is written here.
fleet-webserver = { path = "../../ab_cloud-libs-shared/libs/fleet-webserver" }
# std does everything here except statvfs (free space on the served root, Home > Storage).
libc = "0.2"
# build.json::serving is compiled in and parsed here; the same crate the Tauri build script already uses.
serde_json = "1"
# The webserver's OWN sshd (src/sshd.rs): russh, pure Rust, embedded in this process. `ring` (not the default aws-lc-rs, which needs
# a C/cmake build) is the crypto backend so it cross-compiles for Android with the NDK clang the Tauri build already provides; `rsa`
# is there because the fleet MCP's deploy key is ssh-rsa. No compression, no agent/forwarding code is used.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
# russh's async runtime: owned by sshd.rs on its own thread, nothing else in this crate is async.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }

[build-dependencies]
# build.rs resolves build.json::serving's ports from their owners' build.json (no port is written twice).
serde_json = "1"
