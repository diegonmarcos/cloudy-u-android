<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server OFF</title>
<style>body{font:16px system-ui,sans-serif;background:#10141a;color:#e6e9ef;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
main{padding:24px}h1{font-size:20px}p{color:#9aa4b2}button{font:inherit;padding:12px 28px;border:0;border-radius:8px;background:#3b82f6;color:#fff}</style></head>
<body><main><h1>Server is OFF</h1><p>No page, listener or site of this phone is served. Every port is released.</p>
<button id="on">Turn Server ON</button><p id="msg"></p></main>
<script>
// #1502 the served pages are down while the server is OFF; this page is bundled in the app and is the way back to ON.
document.getElementById('on').onclick = function () {
  window.__TAURI_INTERNALS__.invoke('power_set', { server: true }).then(function (s) {
    var st = JSON.parse(s);
    location.replace('http://127.0.0.1:' + st.ports[0].port + '/__app__/');
  }).catch(function (e) { document.getElementById('msg').textContent = String(e); });
};
</script></body></html>
