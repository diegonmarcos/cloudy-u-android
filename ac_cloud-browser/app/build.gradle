plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // #823 the Search add-on's page (libs:ai) is themed and hosted here, in Compose.
    id 'org.jetbrains.kotlin.plugin.compose'
}

def gradleScriptStartMs = System.currentTimeMillis()

def buildJson  = new groovy.json.JsonSlurper().parse(file('../build.json'))
// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base.
//
// This used to be build.json's version_code plus GITHUB_RUN_NUMBER, which is
// per-WORKFLOW. Every app here ships from its own ship-*.yml with its own
// independent counter, so the moment an app was built by a different workflow
// than the one that produced the installed APK -- or a workflow was re-created,
// or a dispatch cancelled a push-triggered run via the concurrency group -- the
// number handed out was SMALLER than the last published one and Android refused
// the update with "Update version code 190 is older than current 192". A build
// counter can only be monotonic for the one counter that issued it.
//
// Wall clock only ever moves forward and is identical for every workflow, every
// runner and every trigger, so this cannot go backwards again. Same encoding as
// ac_cloud-mail and ab_cloud-libs-shared/lib-apks, so the whole fleet is
// comparable: ~3.35M in Sep 2026, far above any version code in the field and
// inside the 2^31 limit for centuries. COMMS_BUILD_TIMESTAMP is honoured when
// CI provides one so the code matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}
def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-browser')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }
def uiPermissionsRuntimeB64 = b64(buildJson.ui.permissions?.runtime ?: [])
def uiPermissionsRolesB64   = b64(buildJson.ui.permissions?.roles   ?: [])
// Per-app browser content (pinned-on-first-run tabs, search engines).
// libs:browser is shared by reference and its own defaults pin NOTHING,
// so this block is the only thing that puts tabs in THIS app's browser.
// #802 I8 the Search add-on reads cloud-search's declaration (its config_from), not a copy:
// its engines join the add-on's block, and the whole search block is baked for the chat routes.
def searchDecl = new groovy.json.JsonSlurper().parse(file('../../ac_cloud-search/build.json')).search
(buildJson.ui.browser?.addons ?: []).findAll { it.id == 'search' }.each { it.engines = searchDecl.engines }
def searchConfigB64 = b64(searchDecl)
// libs:ai's shared contract (endpoints, paths, header names, knobs), baked like the search block: the browser spells none of them.
def aiContractB64 = b64(new groovy.json.JsonSlurper().parse(file('../../ab_cloud-libs-shared/libs/ai/src/main/assets/ai/ai.json')))
// #802 I10 an add-on's requires_fleet → its package, from the fleet manifest (and into <queries>,
// without which an installed app reads as "not installed" on API 30+).
def fleetApps = new groovy.json.JsonSlurper().parse(new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json')).apps
(buildJson.ui.browser?.addons ?: []).findAll { it.requires_fleet }.each { a ->
    def row = fleetApps.find { it.id == a.requires_fleet }
    if (row == null) throw new GradleException("add-on ${a.id}: requires_fleet '${a.requires_fleet}' is not in the constellation fleet manifest")
    a.requires_package = row.package.toString()
}
def vaultPackage = ((buildJson.ui.browser?.addons ?: []).find { it.id == 'vault' }?.requires_package ?: '').toString()
// #893 the favourites seed is DERIVED from the fleet's own service declaration (never typed): each source
// file's rows become {title,url,group} items; the sources are dropped from what is baked.
def favDecl = buildJson.ui.browser?.favourites
if (favDecl != null) {
    def favItems = []
    (favDecl.sources ?: []).each { src ->
        def rows = new groovy.json.JsonSlurper().parse(new File(file('../build.json').parentFile, src.file).canonicalFile)
        def protocols = (src.protocols ?: []) as List
        rows.each { r ->
            def raw = (r[src.url_field] ?: '').toString().trim()
            if (!raw) return
            if (protocols && !(protocols.contains((r.protocol ?: '').toString()))) return
            if (src.require_port && r.port == null) return
            def url = raw.contains('://') ? raw : "${src.scheme}://${raw}".toString()
            favItems << [title: (r.name ?: raw).toString(), url: url, group: src.group.toString()]
        }
    }
    // #1422 the derived catalog (tools/gen-favourites-catalog.py): every item already carries '<filter>/<sub-folder>',
    // and its filters (the chips, the Webserver chip's `open` link) are baked beside the items
    if (favDecl.catalog) {
        def cat = new groovy.json.JsonSlurper().parse(new File(file('../build.json').parentFile, favDecl.catalog.toString()).canonicalFile)
        if (!cat.filters || !cat.items) throw new GradleException("ui.browser.favourites.catalog ${favDecl.catalog} has no filters or items: run tools/gen-favourites-catalog.py")
        cat.items.each { favItems << [title: it.name.toString(), url: it.url.toString(), group: it.group.toString()] }
        favDecl.filters = cat.filters
        favDecl.remove('catalog')
    }
    (favDecl.extra ?: []).each { favItems << [title: it.title, url: it.url, group: it.group] }
    favDecl.items = favItems.unique { it.url }
    favDecl.remove('sources'); favDecl.remove('extra')
}
// THE name -> port map of the phone's local servers is ONE declaration: ac_cloud-c3-webserver/build.json::serving
// (names, the private DNS server; no port) and each owner's runtime port, which is resolved from the owner's build.json below.
// The four pins must be exactly those names with those titles; drift fails the build instead of shipping a dead tab. The
// same map is baked below as ui.browser.private_names, which libs:browser PrivateNames resolves through the c3-webserver's
// own loopback DNS (never the system's: termux.app is a real website).
def servingDecl = new groovy.json.JsonSlurper().parse(file('../../ac_cloud-c3-webserver/build.json')).serving
if (servingDecl == null || !servingDecl.endpoints) throw new GradleException("ac_cloud-c3-webserver/build.json::serving is missing: the private names have no declaration")
servingDecl.endpoints.each { e ->
    // serving holds NO port: it names the owner and the path (`port_from`) of the owner's own declaration, and the number is
    // resolved here, at build time. A literal `port` beside it would be a second copy that could drift, so it fails the build.
    if (e.containsKey('port')) throw new GradleException("ac_cloud-c3-webserver/build.json::serving.endpoints[${e.id}] spells a literal port: name port_from in ${e.owner}/build.json instead")
    def node = new groovy.json.JsonSlurper().parse(file("../../${e.owner}/build.json"))
    e.port_from.toString().split('\\.').each { k -> node = (node instanceof Map) ? node[k] : null }
    if (!(node instanceof Integer)) throw new GradleException("${e.owner}/build.json has no integer at ${e.port_from} (serving.endpoints[${e.id}].port_from)")
    e.port = node
    def want = "http://${e.name}".toString()
    def got  = (buildJson.ui.browser?.local_pinned_tabs ?: [:])[e.title]
    if (got != want) throw new GradleException("ui.browser.local_pinned_tabs.${e.title} is '${got}', but ac_cloud-c3-webserver/build.json::serving names it ${e.name}")
    // A pin is a plain URL string or {url, title}; libs:browser accepts both.
    def pin = (buildJson.ui.browser.default_pinned_tabs ?: []).find { (it instanceof Map ? it.url : it)?.toString() == want }
    if (pin == null) throw new GradleException("ui.browser.default_pinned_tabs is missing ${want} (${e.title})")
    if (!(pin instanceof Map) || pin.title?.toString() != e.title) throw new GradleException("ui.browser.default_pinned_tabs entry ${want} must carry title '${e.title}'")
}
// serving.keepalive: the web server app's persistent foreground service, which this browser starts (explicit intent)
// when a private name's server does not answer; its package is also the <queries> entry that makes it visible.
def keepaliveDecl = servingDecl.keepalive
if (keepaliveDecl == null || !keepaliveDecl['package'] || !keepaliveDecl['service']) throw new GradleException("ac_cloud-c3-webserver/build.json::serving.keepalive (package, service) is missing: the browser could not start the servers")
def webserverPackage = keepaliveDecl['package'].toString()
buildJson.ui.browser.private_names = [
    dns  : [host: servingDecl.dns.host, port: servingDecl.dns.port],
    names: servingDecl.endpoints.collectEntries { [(it.name): it.port] },
    // `resolve: declared` = the declaration itself answers (serving.dns.answer), no DNS query; anything else asks the DNS.
    owned: servingDecl.endpoints.findAll { it.resolve == 'declared' }.collectEntries { [(it.name): servingDecl.dns.answer] },
    service: ['package': webserverPackage, 'class': keepaliveDecl['service']],
]
// #1141 the `_doc*` keys are prose for people reading build.json; javac refuses a String constant over 65535 bytes (BuildConfig),
// and the config had grown to it. The app reads no `_doc` key, so they stay out of the baked copy.
def stripDocs
stripDocs = { o ->
    o instanceof Map ? o.findAll { k, v -> !k.toString().startsWith('_doc') }.collectEntries { k, v -> [(k): stripDocs(v)] }
        : (o instanceof List ? o.collect { stripDocs(it) } : o)
}
def uiBrowserConfigB64 = b64(stripDocs(buildJson.ui.browser ?: [:]))
// #868 the nav declaration: ui.bottom_nav (the island), ui.sections (what each item opens), ui.default_section.
def uiBottomNav      = (buildJson.ui.bottom_nav ?: []).join(',')
def uiSectionsB64    = b64(buildJson.ui.sections ?: [])
def uiDefaultSection = (buildJson.ui.default_section ?: '').toString()
// #802 the /api/<group>/* name this app's routes register under (cloud-search's shape).
def debugGroup = (buildJson.ui?.debug_api?.group ?: '').toString()
if (!debugGroup) throw new GradleException("build.json::ui.debug_api.group missing — /api/<group>/* would register under no name")
// #684 THE AUTH-MISSION CONTRACT cloud-browser ANSWERS. It is declared once, by libs:auth
// (ab_cloud-libs-shared/build.json::auth.browser_mission); this is the FLEET'S browser, so it
// reads the same block and bakes it (with {package} resolved to this app) so AuthMissionActivity
// reads the DECLARED extra/result keys and the manifest guards the activity with the DECLARED
// signature permission. A missing block is a hard error: an unanswerable mission is a dead sign-in.
def sharedAuthFile = new File(rootDir, '../ab_cloud-libs-shared/build.json')
if (!sharedAuthFile.exists()) throw new GradleException("ab_cloud-libs-shared/build.json is missing; cloud-browser cannot answer the #684 auth mission")
def missionDecl = new groovy.json.JsonSlurper().parse(sharedAuthFile).auth?.browser_mission
if (missionDecl == null) throw new GradleException("ab_cloud-libs-shared/build.json::auth.browser_mission must declare the auth-mission contract (#684)")
def missionPkg = buildJson.android.application_id.toString()
def resolveMission
resolveMission = { obj ->
    if (obj instanceof Map) return obj.collectEntries { k, v -> [(k): resolveMission(v)] }
    if (obj instanceof List) return obj.collect { resolveMission(it) }
    if (obj instanceof String) return obj.replace('{package}', missionPkg)
    return obj
}
def missionResolved = resolveMission(missionDecl)
missionResolved.package = missionPkg
missionResolved.remove('fleet')
def authMissionB64 = b64(missionResolved)
def authMissionAction = missionResolved.action.toString()
def authMissionPermission = missionResolved.permission.toString()
def profileDefault   = buildJson.ui.profile_default ?: [:]
def profileName      = (profileDefault.name      ?: '').toString()
def profileEmail     = (profileDefault.email     ?: '').toString()
def profileInitials  = (profileDefault.initials  ?: '').toString()
def profileCompany   = (profileDefault.company   ?: '').toString()
def profileLocation  = (profileDefault.location  ?: '').toString()
def profileWebsite   = (profileDefault.website   ?: '').toString()
def profileTitles    = (profileDefault.titles    ?: '').toString()
def profileReposB64  = b64(profileDefault.repos  ?: [])
def consolidatedCfg  = (profileDefault.consolidated_config ?: '').toString()

// Stack scan — baked into BuildConfig for the About page.
def repoRoot = rootDir
def stackExtMap = [
    "kt": "Kotlin", "java": "Java", "xml": "XML (resources/manifest)",
    "json": "JSON (config)", "gradle": "Gradle (Groovy)", "kts": "Gradle (Kotlin DSL)",
    "sh": "Shell", "md": "Markdown", "nix": "Nix", "pro": "ProGuard",
]
def stackSkipDirs = ["build", ".gradle", ".idea", "dist", ".result"]
def stackStats = [:]
[new File(repoRoot, "app/src/main"), new File(repoRoot, "libs"),
 new File(repoRoot, "build.json"),   new File(repoRoot, "build.sh"),
 new File(repoRoot, "flake.nix"),    rootDir].each { root ->
    if (!root.exists()) return
    if (root.isFile()) {
        def ext = root.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label != null) {
            def loc = 0; try { loc = root.readLines("UTF-8").size() } catch (Throwable t) {}
            def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
        }
        return
    }
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]; if (label == null) return
        def loc = 0; try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
    }
}
def stackLanguagesB64 = b64(stackStats)
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
[rootDir, new File(repoRoot, "libs")].findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile() || !(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""; try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksB64 = b64(stackDeps.toList())
def stackTreeB64 = "—".bytes.encodeBase64().toString()

def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list',
            '--workflow=ship-cloud-browser.yml',
            '--limit', '10', '--status', 'success',
            '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) {}
        }
    }
} catch (Throwable t) {}
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.cloudbrowser'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy said "Cloud Browser" while
        // the fleet, the store and every roster said cloud-browser.
        resValue "string", "app_name", buildJson.display_name
        applicationId 'com.diegonmarcos.cloudbrowser'
        minSdk 26
        targetSdk 35
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDBROWSER_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",    "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM", "\"${logSinkStream}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermissionsRuntimeB64}\""
        buildConfigField "String", "UI_PERMISSIONS_ROLES_B64",   "\"${uiPermissionsRolesB64}\""
        buildConfigField "String", "UI_BROWSER_CONFIG_B64",      "\"${uiBrowserConfigB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",              "\"${uiBottomNav}\""
        buildConfigField "String", "UI_SECTIONS_B64",            "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_DEFAULT_SECTION",         "\"${uiDefaultSection}\""
        buildConfigField "String", "SEARCH_CONFIG_B64",          "\"${searchConfigB64}\""
        buildConfigField "String", "AI_CONFIG_B64",              "\"${aiContractB64}\""
        buildConfigField "String", "DEBUG_API_GROUP",           "\"${debugGroup}\""
        buildConfigField "String", "AUTH_MISSION_B64",          "\"${authMissionB64}\""
        // #684 the manifest cannot read JSON; the declared action and signature permission are
        // injected as placeholders so the guarded activity and its intent-filter are data-driven.
        manifestPlaceholders = [authMissionAction: authMissionAction, authMissionPermission: authMissionPermission, vaultPackage: vaultPackage, webserverPackage: webserverPackage]
        buildConfigField "String", "UI_PROFILE_NAME",      "\"${profileName}\""
        buildConfigField "String", "UI_PROFILE_EMAIL",     "\"${profileEmail}\""
        buildConfigField "String", "UI_PROFILE_INITIALS",  "\"${profileInitials}\""
        buildConfigField "String", "UI_PROFILE_COMPANY",   "\"${profileCompany}\""
        buildConfigField "String", "UI_PROFILE_LOCATION",  "\"${profileLocation}\""
        buildConfigField "String", "UI_PROFILE_WEBSITE",   "\"${profileWebsite}\""
        buildConfigField "String", "UI_PROFILE_TITLES",    "\"${profileTitles}\""
        buildConfigField "String", "UI_PROFILE_REPOS_B64", "\"${profileReposB64}\""
        buildConfigField "String", "UI_CONSOLIDATED_CONFIG", "\"${consolidatedCfg}\""
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "String", "UI_STACK_FOLDER_TREE_B64",     "\"${stackTreeB64}\""
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",  "${System.currentTimeMillis() - gradleScriptStartMs}L"
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",    "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",   "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",      "${buildSampleSize}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig = true; compose = true }

    testOptions {
        unitTests {
            // #900 the Compose UI tests (page dropdown, Configs tabs, Autocomplete editor) run under Robolectric against the
            // app's real resources, the way libs:bottomnav's PageTabsTest and cloud-search's SearchShellTest do.
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    // ONE shared Cloud-constellation key — same key as SuperApp/Nav/Comms/Wallet/IDE.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:web-core')   // #1371 the fleet's one web view (CloudWeb, WebProfile)
    implementation project(':libs:analytics')
    implementation project(':libs:core')
    implementation project(':libs:browser')
    implementation project(':libs:scraper')   // #1426 Scrapers: Site Files + Scrap Tools (YouTube Download)
    // #1222 the Bluetooth stack the Web Bluetooth polyfill drives (the app's tests run the bridge over a fake adapter).
    implementation project(':libs:bluetooth')
    // Tier 2 DOM autofill: the Cloud Account SOT contract libs:browser reads (its types are in DomAutofill's API).
    implementation project(':libs:autofill')
    implementation project(':libs:updater')
    implementation project(':libs:text-tools')
    implementation project(':search-core')
    // #823 the AI chat (libs:ai: the page, the backends, the assistant panel and its consent card), drawn over the
    // browser in the kit palette (libs:ui-kit). It brings libs:model-catalogue along as an `api`.
    implementation project(':libs:ai')
    implementation project(':libs:ui-kit')
    // #868 the fleet's bottom island + NavDecl: MainActivity's Browser | Search | Configs bar.
    implementation project(':libs:bottomnav')
    implementation project(':libs:ui-nav-bars')
    implementation project(':libs:theme-background')
    // #823 Summarize the page, on-device route: ML Kit's GenAI summarizer (runs on AICore / Gemini
    // Nano where the phone ships it; elsewhere it reports UNAVAILABLE and the extractive summary answers).
    implementation 'com.google.mlkit:genai-summarization:1.0.0-beta1'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    // 2026-10-16 owner decision: all apps must be Compose. MainActivity and AuthMissionActivity are Compose screens.
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    // BitTorrent (torrent/LtTorrentBridge): libtorrent via libtorrent4j, MIT. The Java API plus the
    // prebuilt native library for each ABI the ship workflow builds (arm64 for the phone, x86_64 for
    // the emulator); abiFilters keeps only the matrix ABI's copy in each APK.
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-39'

    testImplementation 'junit:junit:4.13.2'

    // org.json is an EMPTY STUB in the android.jar the JVM test source set
    // compiles against — every method throws "not mocked". BrowserConfig
    // parses the ui.browser block with it, so without a real implementation
    // on the test classpath the config tests could only assert the
    // exception. Standard Android fix, test-only: never reaches the APK.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // The download manager's range / resume rules run against a real local HTTP server
    // (DownloadEngineTest: pause -> resume, no range support, ETag changed, dropped connection).
    // 4.12.0 = the last okhttp3.mockwebserver API (5.x moved it to mockwebserver3). Test-only.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // The host (linux x86_64) libtorrent, so TorrentSessionTest starts and stops a real session on the JVM. Test-only.
    testImplementation 'org.libtorrent4j:libtorrent4j-linux:2.1.0-39'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
