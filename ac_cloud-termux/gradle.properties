## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# #1436 6 GB: rootfs-lib:compressReleaseAssets reads the ~480 MB rootfs payload into the heap (Java heap space at 2 GB)
org.gradle.jvmargs=-Xmx6144M \
--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
android.useAndroidX=true
# #744 AGP 8 flipped these three defaults. Held at AGP 4/7's values so the
# toolchain move changes no behaviour: R stays transitive and final (code reads
# library resources through the app's R), and R8 stays in compat mode, the
# mode this fork's proguard-rules.pro was written and shipped against.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=false

minSdkVersion=26
# #1708 28 until the emulator proof is green, then 35 (Cloud Store updates this app silently on
# Android 17 only at 35+). 28 was kept for one reason, exec of files in the app's data dir, which
# Android forbids from 29. The terminal can now start them the way upstream Termux does at 29+:
# the first exec goes through the system linker (termux-shared SystemLinkerExec), every later one
# through the bootstrap's termux-exec library (LD_PRELOAD), and proot with its loader runs from
# the native library directory (app/build.gradle stageNativeProot). All of it is inert at 28
# (SystemLinkerExec.required() is false). prove-terminal-target-sdk.yml builds this tree at 35
# WITHOUT publishing and runs it on API 34 and 35 emulators, against the published build.
# 35 and not 36: at 36 the edge-to-edge opt-out the terminal's screens rely on is ignored.
targetSdkVersion=28
ndkVersion=22.1.7171670
compileSdkVersion=36

markwonVersion=4.6.2

