plugins {
    id "com.android.application"
}

// #470 — the glibc root filesystem this terminal ships (see ../rootfs/rootfs.json).
def cloudRootfs = new groovy.json.JsonSlurper().parse(file("$projectDir/../rootfs/rootfs.json"))
// #741 the shell's DNS bridge: its port and its one source, both libs/sysdns's (rootfs.json::dns_bridge).
def cloudDnsBridgeJson = file("$projectDir/../../${cloudRootfs.dns_bridge.source}")
def cloudDnsBridge = new groovy.json.JsonSlurper().parse(cloudDnsBridgeJson)

// #628 — the companion lib APK (:rootfs-lib) that now carries the rootfs
// payload. ONE declaration of its applicationId, in build.json::release
// .companions[]; read here rather than hardcoded so CloudRootfs.java's
// PackageManager lookup can never name a package rootfs-lib was not built as.
// parseText over a slurper read of the file, deliberately and not cosmetically:
// T6 of aa_cloud-superapp/test/test-app-names-pattern.sh treats a slurper
// parsing this app's declaration directly as "this gradle derives the launcher
// label from the declared name", and then demands a resValue app_name — which
// this fork cannot have, its label lives in vendored Termux strings. (T6 matches
// the raw source, comments included, so the shape is not spelled out here.) The
// sibling cloudRootfsVariantId already uses this idiom for the same reason.
def cloudRootfsLibPackage = new groovy.json.JsonSlurper()
    .parseText(file("$projectDir/../build.json").getText("UTF-8"))
    .release.companions.find { it.id == 'rootfs-termux' }?.package
if (!cloudRootfsLibPackage) throw new GradleException("build.json::release.companions[] declares no 'rootfs-termux' entry")

// #826 the build commit, baked into versionName "(sha-xxxxxxxx)" + BuildConfig.GIT_SHORT_SHA so
// Store Details (libs/appstore BuiltFrom) and About can name the installed build. Same
// derivation as the rest of the fleet: GITHUB_SHA first, `git rev-parse` locally. versionCode
// is untouched — identity on the fleet's update path stays what it was.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

android {
    // #744 AGP 8: the namespace (R and BuildConfig's package) lives here, not in
    // the manifest, and BuildConfig and AIDL are opt-in — this app's own code
    // reads BuildConfig, and CloudExecService implements ICloudExec.aidl.
    namespace 'com.termux'
    buildFeatures {
        buildConfig true
        aidl true
    }

    // #741 SystemDnsBridge is compiled from libs/sysdns BY REFERENCE (plain Java, its own
    // source dir), so every terminal runs the one bridge and none carries a copy.
    sourceSets {
        main {
            java.srcDirs += new File(cloudDnsBridgeJson.parentFile.parentFile, 'src/bridge/java')
        }
    }


    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.core:core:1.6.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation project(":terminal-view")
        implementation project(":termux-shared")

        // #744 Fleet mesh member: libs:core (+ devtools via `api`) merges the
        // fleet provider, receiver, <queries> and the CONSTELLATION_DATA
        // signature permission into this APK; without them the SuperApp and
        // every sibling cannot see or reach this terminal.
        implementation project(":libs:core")
        implementation project(":libs:fleet-notify")   // #1660 FleetNotify + KeepAliveStatus (left libs:core)
        // #1352 Configs ▸ General / ▸ About in the terminal's menu (FleetConfigsEntries, libs:ui-nav-bars)
        implementation project(":libs:ui-nav-bars")
        // #1630 fleet-default Configs tail: Agents, Logcat, X-Ray App register themselves on the shared strip.
        implementation project(':libs:fleetconfigs-agents')
        implementation project(':libs:fleetconfigs-logcat')
        implementation project(':libs:fleetconfigs-xray')
        // #1512 rish over the SuperApp's shell broker (ShellRish + RishRelay): the thin client, no channel of its own.
        implementation project(":libs:shell-client")
        implementation project(":libs:shell-rish")
        // The ADB Shell page (AdbShellActivity) is Compose, compiled against the HOST's Compose
        // (compileOnly in the lib): this terminal supplies the runtime. ONE BOM for the fleet
        // (test-compose-bom-one-version.sh): FlowRow is experimental and has no binary compatibility
        // across Compose versions, so the lib and the host must run the same one.
        implementation platform('androidx.compose:compose-bom:2025.11.01')
        implementation 'androidx.compose.ui:ui'
        implementation 'androidx.compose.foundation:foundation'
        implementation 'androidx.compose.material3:material3'
        implementation 'androidx.compose.runtime:runtime'
        implementation 'androidx.activity:activity-compose:1.9.3'
        // core's androidx.core 1.13.1 brings concurrent-futures and with it
        // listenablefuture 1.0, whose one class guava 24.1-jre (above) already
        // carries: a duplicate-class build failure. The empty 9999 artifact is
        // guava's own published answer, the same line upstream termux-app added.
        implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    }

    defaultConfig {
        applicationId "cld.termux"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        // #789 the run's build stamp (root build.gradle), no longer a literal
        // bumped by hand (1011 until #789: #628, #744 bumped it).
        versionCode rootProject.ext.cloudVersionCode()
        versionName "0.118.4"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
        // #826 suffix AFTER the upstream semver check: "(sha-…)" is not semver build metadata.
        versionName = "${versionName} (sha-${shortSha})"
        buildConfigField "String", "GIT_SHORT_SHA", "\"${shortSha}\""

        // #470: where the baked glibc rootfs lives inside the APK. Read from the
        // declaration so the Java that stages it and the CI that builds it
        // cannot disagree on a directory name.
        buildConfigField "String", "CLOUD_ROOTFS_ASSET_DIR", "\"${cloudRootfs.asset_dir}\""
        // #628 — the companion APK CloudRootfs.java resolves via PackageManager
        // to read the rootfs out of. Never a literal in the Java: one declaration.
        buildConfigField "String", "CLOUD_ROOTFS_LIB_PACKAGE", "\"${cloudRootfsLibPackage}\""
        // #741 where CloudDnsBridge answers the rootfs shell's lookups (enter.sh's proot -p lands :53 here).
        buildConfigField "int", "CLOUD_DNS_BRIDGE_PORT", "${cloudDnsBridge.bridge_port as int}"
        // #790 the file AgentAuth writes the agent CLIs' credentials to and login-init.sh sources:
        // ab_cloud-terminal-store/store.json::agent_auth.env_file, the one declaration both read.
        buildConfigField "String", "CLOUD_AGENT_AUTH_ENV", "\"${new groovy.json.JsonSlurper().parse(file("$projectDir/../../ab_cloud-terminal-store/store.json")).agent_auth.env_file}\""

        // #787 the session wake lock: build.json::wake_lock, the one declaration (ON by default).
        buildConfigField "boolean", "CLOUD_WAKE_LOCK_DEFAULT_ON", "${cloudWakeLock().default_on}"
        buildConfigField "boolean", "CLOUD_WIFI_LOCK", "${cloudWakeLock().wifi_lock}"

        // cloud-shared-store (build.json::shared_store): where the store lives in $HOME and the
        // provider other fleet apps reach it through.
        buildConfigField "String", "CLOUD_SHARED_STORE_DIR", "\"${cloudSharedStore().dir}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_AUTHORITY", "\"${cloudSharedStore().provider.authority}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_LEGACY_NAME", "\"${cloudSharedStore().legacy_name.name}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_EXPORT_FLAG", "\"${cloudSharedStore().export_mirror.flag_file}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_MIGRATION_DIR", "\"${cloudSharedStore().migration.backup_dir}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_MIGRATION_ARCHIVE", "\"${cloudSharedStore().migration.archive}\""
        buildConfigField "String", "CLOUD_SHARED_STORE_MIGRATION_MARKER", "\"${cloudSharedStore().migration.marker}\""
        buildConfigField "String", "CLOUD_LEGACY_SHARED_ROOT", "\"${new groovy.json.JsonSlurper().parseText(file("$projectDir/../build.json").getText("UTF-8")).storage.shared_root}\""

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "cld.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Cloud Terminal Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        // ABI, from the active release.variants[] entry. Same hook as
        // ac_cloud-nav: the engine exports CLOUDNAV_ABIS from the variant it
        // was asked to build, so one matrix job produces the arm64 APK and the
        // other the x86_64 one.
        //
        // Upstream's own `splits` block stays off (F-Droid cannot take split
        // APKs, so it defaults to a single universal build). Filtering here
        // instead is what every other app in this constellation does, and it
        // is why the first build shipped one 115MB APK carrying all four ABIs.
        ndk {
            def abiOverride = System.getenv('CLOUDNAV_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : ['arm64-v8a']
            abiFilters.addAll(abis as List)
        }

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }


    signingConfigs {
        // Release signing, from the ONE shared constellation keystore.
        //
        // Upstream ships only a debug config, so assembleRelease produced an
        // unsigned APK. Ours must carry the same key as every other app here,
        // because CLOUD_EXEC is a signature-level permission: a build signed
        // with anything else is refused the bind exactly as if it were not
        // installed — a silent failure indistinguishable from "not there".
        //
        // Values come from the environment the fork engine writes
        // (signing=vault_jks_env, see build.json::forks.*.build.signing_env),
        // never from a file in the tree and never a literal here.
        release {
            def ksPath = System.getenv('TERMUX_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('TERMUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TERMUX_KEY_ALIAS')
                keyPassword System.getenv('TERMUX_KEY_PASSWORD')
            }
        }

        debug {
            // The shared-uid group needs ONE signing key: a debug terminal signed with the throwaway key
            // below splits cld.termux.shared (INSTALL_FAILED_SHARED_USER_INCOMPATIBLE). So whenever the
            // constellation keystore is in the environment (CI, build.sh) debug signs with it; only a bare
            // IDE build falls back to the throwaway key.
            def constellation = System.getenv('ANDROID_KEYSTORE_FILE')
            if (constellation && file(constellation).exists()) {
                storeFile file(constellation)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            } else {
                storeFile file('dev_keystore.jks')
                keyAlias 'alias'
                storePassword 'xrj45yWGLbsO7W0v'
                keyPassword 'xrj45yWGLbsO7W0v'
            }
        }
    }

    buildTypes {
        release {
            // Only when the engine supplied a key: an IDE build with no vault
            // signs debug-style rather than failing, and a CI build without it
            // would produce an unsigned APK that cannot bind — which is worth
            // noticing at install time, not at first use.
            if (System.getenv('TERMUX_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    // rootfs.tar.zst is already zstd; deflating it again costs build time and
    // makes AssetManager inflate 600 MB on the phone for nothing.
    androidResources {
        noCompress += 'zst'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // Upstream sets this for its own bootstrap; it is now also what makes the
    // fleet binaries runnable. Without it they are page-mapped from inside the
    // APK, nativeLibraryDir is a path within the archive, and CloudExecService
    // has nothing on disk to exec.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.4"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl)
            file.delete()
        }
    }

    def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def version = "2025.03.28-r1+apt-android-7"
        downloadBootstrap("aarch64", "c8d702b6f742935001c37cda81b8ac69504a95d5cf28f2899532dd8cd4b057eb", version)
        downloadBootstrap("arm",     "f3bb9d1b32552b34fff41861dbf193ec5ba2848d67d779ac1c7256da6640f85d", version)
        downloadBootstrap("i686",    "36db3e1ac3547f9a174fd763bd9a484fa1a3449cdd81e1cf2408ff0454f839c6", version)
        downloadBootstrap("x86_64",  "1c124ec2396ee70a51b0b0a574f29aa659526aa2b9f558f993b2fb05d1e51855", version)
    }
}

// This fork renames applicationId com.termux -> cld.termux (same byte
// length, see TermuxConstants.TERMUX_PACKAGE_NAME). The bootstrap zips
// downloaded above are upstream's, still built for com.termux, and contain
// ELF binaries with that path baked in as a fixed-length string. This task
// derives a patched copy (bootstrap-<arch>-cld.zip) next to each original,
// leaving the original (and its checksum pin above) untouched so the
// download cache keeps working. See patch_bootstrap_ids.py for the
// byte-for-byte replacement + hard verification gate.
task patchBootstraps() {
    dependsOn downloadBootstraps
    doLast {
        def cppDir = new File(projectDir, "src/main/cpp")
        def script = new File(cppDir, "patch_bootstrap_ids.py")
        ["aarch64", "arm", "i686", "x86_64"].each { arch ->
            def input = new File(cppDir, "bootstrap-" + arch + ".zip")
            def output = new File(cppDir, "bootstrap-" + arch + "-cld.zip")
            def result = exec {
                commandLine "python3", script.absolutePath, input.absolutePath, output.absolutePath, "com.termux=cld.termux"
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                throw new GradleException("patch_bootstrap_ids.py failed for " + input + " (exit " + result.exitValue + "); see log above")
            }
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(patchBootstraps)
    }
}

// The debug keystore is GENERATED, not committed.
//
// Upstream ships it as a binary blob with its password in this file, which is
// harmless — it signs debug builds and nothing trusts it — but *.jks is
// ignored repo-wide here, so vendoring dropped it and left a build.gradle
// pointing at a file that is not there. Committing a key to defeat the rule
// that ignores keys is the wrong way round; making it reproducible is not.
//
// Release builds never reach this: AGP validates a signingConfig only where
// it is used, and release is signed with the constellation keystore.
tasks.register('devKeystore') {
    description = 'Create the throwaway debug keystore if it is absent.'
    def ks = file('dev_keystore.jks')
    outputs.file ks
    onlyIf { !ks.exists() }
    doLast {
        exec {
            commandLine 'keytool', '-genkeypair', '-keystore', ks.absolutePath,
                '-alias', 'alias', '-storepass', 'xrj45yWGLbsO7W0v', '-keypass', 'xrj45yWGLbsO7W0v',
                '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
                '-dname', 'CN=debug, OU=cloud, O=cloud, C=US'
        }
    }
}
tasks.matching { it.name.toLowerCase().contains('debug') && it.name.startsWith('validateSigning') }
     .configureEach { dependsOn 'devKeystore' }

// ── the fleet binaries this terminal carries ───────────────────────────────
// The watchdog app asks this terminal to run them (see CloudExecService), and
// a caller in another sandbox cannot write into this app's files — so they
// ship here rather than being pushed in at runtime over ssh, which is the
// dependency the exec service exists to remove. Shipping them together also
// means the panel and the app driving it can never be different builds.
//
// jniLibs and not assets: nativeLibraryDir is the only directory an app can
// both ship into and exec from. Nothing dlopens these.
// Per ABI, matching the variant being built. The binaries are static musl
// executables the exec service runs, so an x86_64 APK carrying aarch64 ones
// would ship a terminal that cannot start the panel it was given.
def fleetAbi   = (System.getenv('CLOUDNAV_ABIS') ?: 'arm64-v8a').split(',')[0].trim()
def fleetArch  = fleetAbi == 'x86_64' ? 'x86_64' : 'aarch64'
def fleetToolsDir = file("$projectDir/src/main/jniLibs/$fleetAbi")
tasks.register('fetchFleetTools') {
    description = 'Download the watchdog sampler + panel this terminal runs for the fleet.'
    outputs.dir fleetToolsDir
    doLast {
        fleetToolsDir.mkdirs()
        [["my-watchdog-${fleetArch}", 'libmywatchdog.so'],
         ["my-watchdog-tui-${fleetArch}", 'libmywatchdogtui.so']].each { asset, name ->
            def out = new File(fleetToolsDir, name)
            if (out.exists() && out.length() > 100_000) {
                logger.lifecycle("fleet tool: ${name} cached (${out.length()} bytes)")
                return
            }
            def p = ['gh', 'release', 'download', 'my-watchdog-latest',
                     '--repo', 'diegonmarcos/cloudy-u-linux',
                     '--pattern', asset, '--output', out.absolutePath, '--clobber'].execute()
            p.waitForProcessOutput(System.out, System.err)
            if (p.exitValue() != 0 || !out.exists()) {
                throw new GradleException("could not fetch ${asset} — this terminal ships the fleet tools")
            }
            logger.lifecycle("fleet tool: ${name} (${out.length()} bytes)")
        }
    }
}
preBuild.dependsOn tasks.named('fetchFleetTools')

// ── the agent-coding rootfs (#470), now a COMPANION LIB APK (#628) ─────────
// CI builds and verifies the tree (rootfs/build-rootfs.sh, rootfs/verify-rootfs.sh)
// on a runner of this APK's CPU and drops rootfs.tar.zst, rootfs.sha256, proot
// and enter.sh into assets/<asset_dir>/ before gradle runs. #618 moved the
// ~400 MB tarball out of this APK into a release asset fetched at runtime;
// #628 moves it again, into the sibling :rootfs-lib companion APK the Store
// installs and updates like any other fleet library, so the fetch — and the
// url it fetched from — are gone too. This app ships only proot and enter.sh;
// stageRootfsPayload below hands the tarball to :rootfs-lib and verifyCloudRootfs
// proves nothing of the old scheme is left behind.
def cloudRootfsArtifact = cloudRootfs.artifact
def cloudRootfsAssetsDir = file("$projectDir/src/main/assets/${cloudRootfs.asset_dir}")

// The content address of the declaration that produces the tree: sha256 over
// artifact.identity_files, first 12 hex. A pin bump (claude-code, node, the
// tool-belt ref, the build script) moves this; an app-code change does not —
// it is what :rootfs-lib's versionName is built from, so a phone only sees a
// new companion when the tree itself actually changed.
def cloudRootfsId = {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    cloudRootfsArtifact.identity_files.each { rel ->
        def f = file("$projectDir/../$rel")
        if (!f.isFile()) throw new GradleException("rootfs.json::artifact.identity_files names ${rel}, which does not exist")
        digest.update(java.security.MessageDigest.getInstance("SHA-256").digest(f.bytes))
    }
    return digest.digest().encodeHex().toString().substring(0, 12)
}()

static String sha256Hex(File f) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { input ->
        byte[] buffer = new byte[1 << 16]
        int n
        while ((n = input.read(buffer)) != -1) digest.update(buffer, 0, n)
    }
    return digest.digest().encodeHex().toString()
}

// Stage-if-new, then strip assets/ of everything :rootfs-lib now owns.
// Re-runs are free: an already-staged payload is left alone, so a rebuild that
// does not touch the rootfs costs nothing.
def cloudRootfsStageDir = new File(rootProject.buildDir, 'rootfs-payload')
tasks.register('stageRootfsPayload') {
    description = 'Move the built rootfs tarball into the :rootfs-lib staging dir, with its manifest — no network, no gh release.'
    doLast {
        def tarball = new File(cloudRootfsAssetsDir, 'rootfs.tar.zst')
        def stagedTarball = new File(cloudRootfsStageDir, 'rootfs.tar.zst')
        def manifest = new File(cloudRootfsStageDir, 'rootfs-lib.json')
        if (!tarball.isFile()) {
            if (stagedTarball.isFile() && manifest.isFile()) {
                logger.lifecycle("stageRootfsPayload: already staged (${manifest.text.trim()})")
                return
            }
            throw new GradleException("${tarball} is missing: run ac_cloud-termux/rootfs/build-rootfs.sh <abi> ${cloudRootfsAssetsDir} first (CI does)")
        }
        cloudRootfsStageDir.mkdirs()
        // Computed from the bytes going into the lib APK, not copied from
        // anywhere else — the one digest the app gates extraction on, and it
        // cannot describe anything but what it was hashed from.
        def digest = sha256Hex(tarball)
        if (!tarball.renameTo(stagedTarball)) throw new GradleException("could not move ${tarball} to ${stagedTarball}")
        manifest.text = groovy.json.JsonOutput.toJson([version: cloudRootfsId, payload: 'rootfs.tar.zst', sha256: digest])

        // Leftovers of the #618 scheme: build-rootfs.sh still writes rootfs.sha256
        // next to the tarball for CI's own tests, but this app no longer carries
        // it or the url it never carried again after #618 shipped either.
        [cloudRootfsArtifact.digest_asset, cloudRootfsArtifact.url_asset].each { name ->
            def f = new File(cloudRootfsAssetsDir, name)
            if (f.exists() && !f.delete()) throw new GradleException("could not remove leftover ${f}")
        }
        logger.lifecycle("stageRootfsPayload: ${digest} -> ${manifest}")
    }
}

tasks.register('verifyCloudRootfs') {
    dependsOn 'stageRootfsPayload'
    description = 'Fail unless assets/ holds proot and enter.sh — and NOTHING from the #618 fetch-by-url scheme.'
    doLast {
        // #644 — the declarative link store ships as assets beside enter.sh, NOT
        // inside the tarball, so an engine fix rides an app-code update instead
        // of rebuilding ~400 MB. Required here for the same reason proot is: a
        // missing one means enter.sh declines to wire the store and the terminal
        // silently loses every managed link.
        // #797 -- pty-check and pty-selftest.json are the pty selftest /api/terminal/selftest
        // runs on the phone; missing, the terminal's TTY would again be unprovable from outside.
        ['proot', 'enter.sh',
         'cloud-store/cloud-store', 'cloud-store/declaration.sh',
         'cloud-store/login-init.sh', 'cloud-store/login-exec',
         'cloud-store/pty-check', 'cloud-store/pty-selftest.json'].each { name ->
            def f = new File(cloudRootfsAssetsDir, name)
            if (!f.isFile() || f.length() == 0) {
                throw new GradleException("${f} is missing: run ac_cloud-termux/rootfs/build-rootfs.sh <abi> ${cloudRootfsAssetsDir} first (CI does)")
            }
        }
        // #628's own guard, same shape as #618's before it: a baked tarball or a
        // baked url is the runtime-download path this design removes, so their
        // presence must fail the build rather than ship a quieter regression.
        ['rootfs.tar.zst', cloudRootfsArtifact.digest_asset, cloudRootfsArtifact.url_asset].each { name ->
            def f = new File(cloudRootfsAssetsDir, name)
            if (f.exists())
                throw new GradleException("${f} is still in assets/ — #628 moved the rootfs into the cloud-lib-rootfs-termux companion APK, this app must carry none of it")
        }
    }
}
preBuild.dependsOn tasks.named('verifyCloudRootfs')

// #787 build.json::wake_lock -- whether a session takes the wake lock without being asked, and
// whether the Wi-Fi lock comes with it. Both must be declared booleans: a missing key must not
// quietly become "off".
// cloud-shared-store: build.json::shared_store, THE ONE declaration of the store
// (dir, provider authority + signature permission, the shared uid, the export
// mirror flag and the migration drop). The manifest's android:sharedUserId is a
// LITERAL (a placeholder there is resolved after the merger checks it), so this
// only asserts the literal equals the declaration instead of feeding it.
def cloudSharedStore() {
    def declaration = new File(projectDir.parentFile, "build.json")
    def decl = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8")).shared_store
    ['dir', 'owner_package', 'shared_user_id'].each { k ->
        if (!(decl?."${k}" instanceof String) || !decl."${k}")
            throw new GradleException(declaration.toString() + " shared_store." + k + " is required")
    }
    if (decl.dir.contains('/') || decl.dir.contains('..'))
        throw new GradleException(declaration.toString() + " shared_store.dir must be one relative segment under \$HOME")
    if (decl.provider?.protection_level != 'signature')
        throw new GradleException(declaration.toString() + " shared_store.provider.protection_level must be 'signature'")
    def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText("UTF-8")
    if (!manifest.contains('android:sharedUserId="' + decl.shared_user_id + '"'))
        throw new GradleException("AndroidManifest.xml android:sharedUserId must be the literal build.json::shared_store.shared_user_id (" + decl.shared_user_id + ")")
    // Literals in the manifest for the same reason (and so the ipc-mesh scanner reads them):
    // the provider's authority and its signature permission must be the declared ones.
    [decl.provider.authority, decl.provider.permission].each { v ->
        if (!manifest.contains('"' + v + '"'))
            throw new GradleException("AndroidManifest.xml must name build.json::shared_store.provider value '" + v + "' literally")
    }
    return decl
}

def cloudWakeLock() {
    def declaration = new File(projectDir.parentFile, "build.json")
    def decl = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8")).wake_lock
    if (!(decl?.default_on instanceof Boolean) || !(decl?.wifi_lock instanceof Boolean))
        throw new GradleException(declaration.toString() + " wake_lock must declare boolean default_on and wifi_lock")
    return decl
}
