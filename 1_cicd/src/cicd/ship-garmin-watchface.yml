name: "Ship → Garmin Watch Face (.prg → GHCR via ORAS + GitHub Release)"

# Builds each Connect IQ watch-face design in c_devices/garmin-watchface/faces/<id>/ and
# publishes via the SAME two channels as aa_cloud-superapp — both data-driven by
# c_devices/garmin-watchface/build.json::release:
#
#   1. ORAS push as OCI artifact   → ghcr.io/<ns>/garmin-watchface-<design>:<tags>
#   2. GH Release attachment        → <design>.prg on a rolling `latest` release
#                                      (stable download URL for sideload).
#
# The workflow hardcodes NO registry/tag/asset strings — build.sh reads them from
# build.json. The design matrix is discovered from build.json::build.designs.
# Toolchain is provided in-CI (BYPASS_NIX=1); the Nix flake is the LOCAL path.

on:
  workflow_dispatch:
    inputs:
      push_oras:
        description: "Push .prg to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Attach .prg to the rolling GitHub Release"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "fa_garmin-watchface-*-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # c_devices/garmin-watchface/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-garmin-watchface.yml"
      # ── end MANAGED-PATHS-HEADER ──
      - "c_devices/garmin-watchface/**"
permissions:
  contents: write   # gh release create/upload
  packages: write   # ghcr push (oras)

concurrency:
  group: ship-garmin-watchface-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: c_devices/garmin-watchface

jobs:
  # ── Discover designs (data-driven: build.json::build.designs) ──────
  discover:
    runs-on: ubuntu-latest
    outputs:
      designs: ${{ steps.list.outputs.designs }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - id: list
        working-directory: ${{ env.WORK_DIR }}
        run: echo "designs=$(jq -c '.build.designs' build.json)" >> "$GITHUB_OUTPUT"

  build_and_publish:
    needs: discover
    name: "Build + Publish (${{ matrix.design }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        design: ${{ fromJSON(needs.discover.outputs.designs) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}

      # Every application's testers, and — for the 24 that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Until this
      # step existed, an application with zero testers and one with fifty
      # passing testers produced indistinguishable green ticks, and the ship
      # workflow's only question was "did the build exit 0".
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── connect-iq-sdk-manager CLI (just the tool) ─────────────────
      # The CLI is the ONLY thing CI installs here; build.sh::ensure_sdk drives
      # the actual SDK provisioning (agreement accept → sdk set → login → device
      # download) so the flow stays in the universal engine, not the workflow.
      # Use the official install.sh: it names the binary `connect-iq-sdk-manager`
      # (the canonical name build.sh + flake call). `go install` would instead
      # name it `connect-iq-sdk-manager-cli` (module last element) → not found.
      # Pinned to a release tag for reproducibility.
      - name: Install connect-iq-sdk-manager CLI
        run: |
          set -euo pipefail   # without it a failed curl feeds sh an empty script, which exits 0
          curl -fsSL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v0.8.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/connect-iq-sdk-manager" version

      # ── Stable developer signing key (cached → constant signature) ──
      # Mirrors aa_cloud-superapp's cached debug keystore: a fresh RSA key
      # each run would change the app signature. Cache it so every CI build
      # signs identically. build.sh::_resolve_signing returns early when
      # dist/developer_key.der already exists.
      - name: Restore developer key from cache
        id: key-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/dist/developer_key.der
          key: garmin-watchface-devkey-v1
      - name: Generate developer key (first run only)
        if: steps.key-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          mkdir -p dist
          openssl genrsa -out dist/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in dist/developer_key.pem -out dist/developer_key.der

      - name: Install ORAS (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras

      # build.sh::ensure_sdk runs the Garmin agreement-accept (hash from
      # build.json::toolchain.agreement_hash) + login (creds below) + sdk set +
      # per-design device download, then monkeyc. Creds are GHA secrets.
      - name: Build .prg (engine)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          # Without credentials connect-iq-sdk-manager waits for a browser login
          # on localhost until the job timeout cancels the run (every run since
          # 2026-09-10). Fail at once, naming the missing secrets.
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error title=Garmin SDK login::secrets GARMIN_USERNAME / GARMIN_PASSWORD are not set; the Connect IQ SDK cannot be downloaded without them"
            exit 1
          fi
          chmod +x build.sh
          timeout 20m ./build.sh build "${{ matrix.design }}"
          ls -la "dist/${{ matrix.design }}/"

      - name: Upload .prg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.design }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/${{ matrix.design }}/*.prg
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        # GHCR binds a package to the repo that first pushed it and reads
        # image.source only at CREATION, so packages made under the old name
        # still answer to cloud-infra-desktop. GHCR_TOKEN is packages-scoped;
        # kept on purpose: these packages are bound to another repo, so GITHUB_TOKEN cannot push them (cross-repo exception).
        run: echo "${{ secrets.GHCR_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push .prg to GHCR via ORAS (engine)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push "${{ matrix.design }}"

      - name: Publish to GitHub Releases (engine)
        id: publish
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release "${{ matrix.design }}"

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "c_devices/garmin-watchface" "${{ steps.publish.outcome }}" "false" "${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──

