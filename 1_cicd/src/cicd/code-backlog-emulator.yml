name: "Test -> Cloud Code Backlog page (emulator screenshots: live index, offline copy, reason)"

# #1699: install the APK a Ship run built, put a public fixture index.html where the cloud-me-pvt-tasks clone lives, and screenshot
# the Backlog page in its three states (1_cicd/src/scripts/emulator-code-backlog.sh). Dispatch only. `run` pins a Ship run
# (default: latest green ship-cloud-code.yml run on main).

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Ship run id to take the APK from (optional)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            1_cicd/src/scripts

      - name: Fetch the APK (x86_64) and read its package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ inputs.run }}
        run: |
          set -eu
          if [ -z "$RUN" ]; then
            RUN=$(gh run list -R "$REPO" --workflow ship-cloud-code.yml --branch main --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          [ -n "$RUN" ] || { echo "::error::no green ship-cloud-code.yml run on main"; exit 1; }
          echo "APK from run $RUN"
          mkdir -p dl
          gh api "repos/$REPO/actions/runs/$RUN/artifacts" --paginate --jq '.artifacts[] | select(.expired|not) | select(.name|test("x86_64|universal")) | .name' |
          while read -r name; do gh run download "$RUN" -R "$REPO" -n "$name" -D "dl/$name"; done
          pick=$(find dl -name '*.apk' | sort | head -1)
          [ -n "$pick" ] || { echo "::error::no APK in run $RUN"; exit 1; }
          cp "$pick" app.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PKG=$("$AAPT" dump packagename app.apk)
          [ -n "$PKG" ] || { echo "::error::cannot read the package"; exit 1; }
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + walk the Backlog page
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash 1_cicd/src/scripts/emulator-code-backlog.sh app.apk ${{ env.PKG }} out

      - name: Upload evidence (screenshots, ui dumps, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-backlog-evidence
          path: out/
          if-no-files-found: warn
