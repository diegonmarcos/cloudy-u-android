name: health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# One health run at a time; a slow run is never cancelled by the next tick.
concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - uses: ./.github/actions/setup-deps
      - name: Run repo-level validations
        run: |
          ./build.sh config
          ./build.sh workflow
          echo "Declarative framework sanity ✓"
