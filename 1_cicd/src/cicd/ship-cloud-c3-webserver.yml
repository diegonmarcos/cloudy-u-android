name: "Ship → Cloud-C3-WebServer APK (build + push to GHCR via ORAS + attach to GH Release)"

# The phone's local web server (#1682 P1): a native Kotlin / Compose app over the
# Rust core. build.sh cross-compiles ac_cloud-c3-webserver/core (a cdylib that
# links server/) with cargo and the NDK clang for the variant's ABI
# (build.json::native.targets), then runs the committed gradle project
# (src-tauri/gen/android, its Tauri-era path). Every tool is pinned in
# build.json::toolchain; no Tauri CLI any more. Both ABIs build on ubuntu-latest.
#
# Same data-driven publish path as every other app: the engine reads
# ac_cloud-c3-webserver/build.json::release, so no registry, tag or artifact
# name is written in this file.

on:
  # ── MANAGED-REFRESH-TRIGGER (#836): fleet-refresh.yml dispatches this app ──
  repository_dispatch:
    types: [fleet-refresh-ac_cloud-c3-webserver]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-c3-webserver-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-c3-webserver/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-c3-webserver.yml"
      #   input: "ac_cloud-nix-on-droid/build.json"
      #   input: "ac_cloud-termux/build.json"
      # ── end MANAGED-PATHS-HEADER ──
      # The ONE web server of the fleet (:8002 is its `start`) and the verbatim Linux UI it bundles.
      # A STATIC Rust lib this app compiles, so it is watched and hashed like a module dir.
      - "ab_cloud-libs-shared/libs/adb-grants/**"
      - "ab_cloud-libs-shared/libs/adb-readiness/**"
      - "ab_cloud-libs-shared/libs/adb-shell-core/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleet-data-client/**"
      - "ab_cloud-libs-shared/libs/fleet-notify/**"
      - "ab_cloud-libs-shared/libs/fleet-webserver/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-agents/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-logcat/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-xray/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/shell-broker/**"
      - "ab_cloud-libs-shared/libs/shell-client/**"
      - "ab_cloud-libs-shared/libs/shizuku-adb-debug-tools/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ab_cloud-libs-shared/libs/web-core/**"
      - "ac_cloud-c3-webserver/**"
permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-c3-webserver-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-c3-webserver

jobs:
  build_and_publish:
    name: "Build APK + Push (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            android_abi: arm64-v8a
          - abi: x86_64
            android_abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      # The Linux web UI is ONE copy: cloud-u-linux/da_my-webserver/src. The shared server's vendor/ is a
      # byte-identical mirror of it, and the tests below compare the two, so the source of truth must be on
      # the runner. Public repo: no token. Not part of any gate input: it is read by tests only.
      - name: Checkout cloud-u-linux (the source of the web UI the phone serves)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-linux
          path: .cloud-u-linux
          fetch-depth: 1

      - name: Point the web-UI tests at it
        run: echo "LINUX_REPO=$GITHUB_WORKSPACE/.cloud-u-linux" >> "$GITHUB_ENV"

      # Every application's testers, and — for those that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Needs no
      # JDK, no SDK and no gradle, so it costs seconds and fails before anything
      # is built.
      #
      # DELIBERATELY NOT gated on the publish gate: the gate answers "would
      # these bytes differ?", which is the right question for publishing and the
      # wrong one for testing — editing a tester does not move the APK, and
      # gating here would let a new assertion land without ever running once.
      - name: "Test → this application's testers, and what is not covered"
        env:
          # test-c3-webserver-pages.sh and -render.sh write their Galaxy A37 screenshots here.
          SHOTS_DIR: ${{ runner.temp }}/c3-webserver-shots
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      # One PNG per page of the app (1080x2340 px, Galaxy A37 density): the five tabs, Configs About /
      # Engines / Links, the file view and the link chooser. Uploaded even when a tester failed, because a
      # failing run is the one whose pictures are wanted.
      - name: Upload the page screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: c3-webserver-shots-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ runner.temp }}/c3-webserver-shots
          if-no-files-found: warn
          retention-days: 30

      # The toolchain this job uses, read from build.json — never restated here.
      - name: Resolve the declared toolchain
        id: tc
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -eu
          rust="$(jq -r --arg abi "${{ matrix.android_abi }}" '.native.targets[$abi].rust // empty' build.json)"
          [ -n "$rust" ] || { echo "::error::build.json::native.targets has no Rust triple for ${{ matrix.android_abi }}"; exit 1; }
          ndk="$(jq -r '.toolchain.ndk' build.json)"
          sdk="$(jq -r '.android.compile_sdk' build.json)"
          {
            echo "rust_target=$rust"
            echo "ndk=$ndk"
            echo "sdk_packages=platforms;android-$sdk build-tools;$sdk.0.0 platform-tools ndk;$ndk"
            echo "server_crate=$(jq -r '.native.server_crate' build.json)"
            echo "core_crate=$(jq -r '.native.crate_dir' build.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.tc.outputs.rust_target }}

      # The SHARED web server's suite: the vendored UI is byte-identical to cloud-u-linux's (hash and
      # bytes), every endpoint of the API contract, and parity with the real Linux server run under node.
      - name: "Test → the shared web server (UI mirror, contract, parity with the Linux server)"
        working-directory: ab_cloud-libs-shared/libs/fleet-webserver
        run: |
          ./sync.sh --check --from "$LINUX_REPO"
          cargo test

      # The server crate's own suite — the route table, the About groups, the
      # real server end to end over a socket — on the host, before anything is
      # packaged. Like the testers above, not gated on the publish gate.
      - name: "Test → the server crate (cargo test)"
        working-directory: ${{ env.WORK_DIR }}/${{ steps.tc.outputs.server_crate }}
        run: cargo test

      - name: "Test → the Rust core, the JNI layer of the native app (cargo test)"
        working-directory: ${{ env.WORK_DIR }}/${{ steps.tc.outputs.core_crate }}
        run: cargo test

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      - name: Set up JDK 21 (lint of the shared Compose libs needs the JDK 21 List API)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK + NDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          # compile_sdk and the NDK come from build.json; the NDK is what
          # build.sh links the Rust core with for the Android target.
          packages: ${{ steps.tc.outputs.sdk_packages }}

      # Gradle itself comes from the committed wrapper (src-tauri/gen/android);
      # this only persists its caches between runs.
      - name: Gradle caches
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install gh CLI + jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          command -v gh

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # CLOUDNAV_VARIANT selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          # Kept for the engine's own `gh` calls.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          # build.sh links the Rust core with the NDK clang under NDK_HOME; the version is build.json::toolchain.ndk.
          export NDK_HOME="$ANDROID_HOME/ndk/${{ steps.tc.outputs.ndk }}"
          [ -d "$NDK_HOME" ] || { echo "::error::NDK $NDK_HOME was not installed"; exit 1; }
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      # The size budget is read off this line (the Kotlin-shell APK was 1.1 MB).
      - name: APK size and what is in it
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          for f in dist/*.apk; do
            echo "$f: $(stat -c %s "$f") bytes"
            unzip -lv "$f" | awk 'NR>3 && ($8 ~ /\.so$|\.dex$/) {print "  " $8 ": " $1 " B unpacked, " $3 " B stored"}'
          done

      # #1712 the task flags of the MERGED manifest in the built APK: one normal task, listed in Recents, the ADB deep link's trampoline on
      # its own affinity. Companion of test/test-c3-webserver-task-flags.sh, which reads the sources.
      - name: "Test -> merged manifest task flags (Recents)"
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          for f in dist/*.apk; do bash test/check-apk-task-flags.sh "$f"; done

      # cargo resolved the crate graph on this run; the lockfile is handed out so
      # it can be committed and later runs build the same graph (--locked).
      - name: Hand out the resolved Cargo.lock
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: c3-webserver-cargo-lock-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/core/Cargo.lock
          if-no-files-found: warn
          retention-days: 30

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-c3-webserver" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-C3-WebServer-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-c3-webserver

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-c3-webserver" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"
