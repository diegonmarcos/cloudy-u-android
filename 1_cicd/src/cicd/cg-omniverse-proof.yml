name: "Proof → CG-Omniverse (filter mutants + emulator screens)"

# Two proofs the Ship run cannot give, on demand:
#   mutants  every rule of the Store's filter logic (Store.kt), of Galaxy's tabs (Tabs.kt) and of pin offline (#1711: web-core
#            PinPolicy.kt and SiteCache.kt, the app's ui/Pinned.kt) is held by a JVM test: each job plants ONE mutant and passes only when the suite goes
#            RED (a mutant that stays green fails the run). A baseline job requires the real tree GREEN.
#   screens  installs the x86_64 APK of a Ship run (or the rolling release) on an emulator and walks Store (all selected, filtered)
#            and Galaxy (A Way to Go's offline card, a live world, the list), each opened DIRECTLY by the launch extras
#            (`am start -e section store` / `-e world <id>`, Launch.kt) so they never depend on the Avatar page; Avatar (default,
#            personalised) is walked last. Screenshots upload as `cg-omniverse-screens`.

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship → CG-Omniverse run whose x86_64 APK to walk (empty = the rolling release)"
        required: false
        default: ""
      only:
        description: "mutants | screens | both"
        required: false
        default: "both"

permissions:
  contents: read
  actions: read

env:
  WORK_DIR: ad_CG-Omniverse

jobs:
  mutants:
    if: ${{ inputs.only != 'screens' }}
    name: "Mutant ${{ matrix.mutant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutant: [baseline, type-map, dim-mixed, vr-yes-flat, vr-no-glass, chip-any, group-all, toggle-one, all-clears, is-all, default-all, tabs-default, tabs-open-focus, tabs-open-select, tabs-close-neighbour, tabs-close-keep, tabs-persist-selected, tabs-persist-all, catalogue-floor796, tabs-declared-first, tabs-seed-once, tabs-seed-order, tabs-restore-legacy, pin-miss-live, pin-document-live, pin-refresh-live, pin-copy-newest, pin-record-volatile, pin-scene-parts, pin-scene-wait, cache-variants-bound, cache-blob-whole, cache-newest, cache-one-writer]
    steps:
      - uses: actions/checkout@v4
      - name: Plant the mutant
        env:
          M: ${{ matrix.mutant }}
        run: |
          python3 - <<'PY'
          import os, sys
          p = "ad_CG-Omniverse/app/src/main/java/com/diegonmarcos/cgomniverse/Store.kt"
          T = "ad_CG-Omniverse/app/src/main/java/com/diegonmarcos/cgomniverse/Tabs.kt"
          C = "ad_CG-Omniverse/data/store.json"
          P = "ab_cloud-libs-shared/libs/web-core/src/main/java/com/diegonmarcos/cloudlib/web/PinPolicy.kt"
          S = "ab_cloud-libs-shared/libs/web-core/src/main/java/com/diegonmarcos/cloudlib/web/SiteCache.kt"
          G = "ad_CG-Omniverse/app/src/main/java/com/diegonmarcos/cgomniverse/ui/Pinned.kt"
          M = {
            "baseline":    None,
            "type-map":    ('"Others" -> setOf(OTHERS)', '"Others" -> setOf(WEBSITES)'),
            "dim-mixed":   ('"2D/3D", "3D/Video" -> setOf(D2, D3)', '"2D/3D", "3D/Video" -> setOf(D3)'),
            "vr-yes-flat": ('if (w.vr) setOf(FLAT, VR_GLASS) else', 'if (w.vr) setOf(VR_GLASS) else'),
            "vr-no-glass": ('else setOf(FLAT)\n', 'else setOf(FLAT, VR_GLASS)\n'),
            "chip-any":    ('tags(w, g).any {', 'tags(w, g).all {'),
            "group-all":   ('FilterGroup.entries.all { g ->', 'FilterGroup.entries.any { g ->'),
            "toggle-one":  ('if (chip in cur) cur - chip else cur + chip', 'if (chip in cur) emptySet() else cur + chip'),
            "all-clears":  ('if (isAll(sel, group)) emptySet() else', 'if (false) emptySet() else'),
            "is-all":      ('sel[group].orEmpty().containsAll(group.chips)', 'sel[group].orEmpty().isNotEmpty()'),
            "default-all": ('associateWith { it.chips.toSet() }', 'associateWith { setOf(it.chips.first()) }'),
            # #1400 Galaxy tabs (Tabs.kt, TabsTest) and the floor796 catalogue entry (store.json, StoreTest)
            "tabs-default":          ('DEFAULT_WORLD = "floor796"', 'DEFAULT_WORLD = "lusion-v3"', T),
            "tabs-open-focus":       ('if (id in s.open) s.copy(selected = id) else', 'if (false) s.copy(selected = id) else', T),
            "tabs-open-select":      ('State(s.open + id, id)', 'State(s.open + id, s.selected)', T),
            "tabs-close-neighbour":  ('rest.getOrNull(i) ?: rest.lastOrNull()', 'rest.firstOrNull()', T),
            "tabs-close-keep":       ('if (s.selected != id) s.selected else', 'if (false) s.selected else', T),
            "tabs-persist-selected": ('sel.takeIf { it in open } ?: open.firstOrNull()', 'open.firstOrNull()', T),
            "tabs-persist-all":      ('s.open.joinToString(",")', 's.open.take(1).joinToString(",")', T),
            "catalogue-floor796":    ('"id": "floor796"', '"id": "floor-796"', C),
            # #1711 the declared default tabs (Orion, floor796, Messenger) and their one-time seeding (Tabs.kt, TabsTest)
            "tabs-declared-first":   ('State(tabs, tabs.firstOrNull())', 'State(tabs, tabs.lastOrNull())', T),
            "tabs-seed-once":        ('it in known && it !in given && it !in s.open', 'it in known && it !in s.open', T),
            "tabs-seed-order":       ('front + s.open.filter { it !in front }', 's.open.filter { it !in front } + front', T),
            "tabs-restore-legacy":   ('else setOf(DEFAULT_WORLD)', 'else emptySet()', T),
            # #1711 pin offline never stands between a live page and the network (web-core PinPolicy.kt, PinPolicyTest)
            "pin-miss-live":         ('else -> Action.PASS_AND_RECORD', 'else -> Action.PASS', P),
            "pin-document-live":     ('document && liveDocuments -> Action.PASS_AND_RECORD', 'document && liveDocuments -> Action.SERVE', P),
            "pin-refresh-live":      ('refresh -> Action.PASS_AND_RECORD', 'refresh -> Action.SERVE', P),
            "pin-copy-newest":       ('Action.SERVE_NEWEST else Action.PASS', 'Action.PASS else Action.PASS', P),
            "pin-record-volatile":   ('hasQuery && newestStoredAt != null -> now - newestStoredAt >= RECORD_AGAIN_MS', 'hasQuery && newestStoredAt != null -> true', P),
            # #1711 a live page that starts no scene is shown from the pinned copy (ui/Pinned.kt sceneOverdue, PinPolicyTest)
            "pin-scene-parts":       ('page.canvases + page.videos + page.sceneContexts == 0', 'page.canvases + page.videos + page.sceneContexts + page.contexts2d == 0', G),
            "pin-scene-wait":        ('sinceDocumentMs >= SCENE_WAIT_MS', 'sinceDocumentMs >= 0L', G),
            # #1711 the copy: bounded queries per path, whole blobs only, the newest query answers, one writer at a time (web-core SiteCache.kt, SiteCacheTest)
            "cache-variants-bound":  ('if (same.size <= MAX_VARIANTS) return', 'if (true) return', S),
            "cache-blob-whole":      ('if (o.has("size") && f.length() != o.optLong("size")) return null', 'if (false) return null', S),
            "cache-newest":          ('.toList().asReversed().maxByOrNull { it.stored }', '.toList().asReversed().minByOrNull { it.stored }', S),
            "cache-one-writer":      ('Boolean = synchronized(LOCK) {', 'Boolean = run {', S),
          }[os.environ["M"]]
          if M is None: sys.exit(0)
          if len(M) == 3: p = M[2]
          with open("expect.txt", "w") as f: f.write({T: "TabsTest", C: "StoreTest", P: "PinPolicyTest", S: "SiteCacheTest", G: "PinPolicyTest"}.get(p, "StoreTest"))
          s = open(p).read()
          if s.count(M[0]) != 1: sys.exit("mutation target not found exactly once: %r" % M[0])
          open(p, "w").write(s.replace(M[0], M[1]))
          PY
          git diff --stat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM suite (baseline GREEN, every mutant RED)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          M: ${{ matrix.mutant }}
        run: |
          set +e
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" > unit.log 2>&1
          rc=$?
          tail -60 unit.log
          grep -E "(StoreTest|TabsTest|PinPolicyTest|SiteCacheTest) > .* FAILED|tests completed" unit.log || true
          if [ "$M" = baseline ]; then
            [ $rc -eq 0 ] || { echo "::error::the real tree is RED"; exit 1; }
            echo "baseline GREEN"
          else
            [ $rc -ne 0 ] || { echo "::error::mutant $M stayed GREEN: no test holds this rule"; exit 1; }
            E=$(cat expect.txt 2>/dev/null || echo StoreTest)
            grep -qE "$E > .* FAILED" unit.log || { echo "::error::mutant $M is red but not from $E"; exit 1; }
            echo "mutant $M is RED (killed)"
          fi

  screens:
    if: ${{ inputs.only != 'mutants' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get the x86_64 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.ship_run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN" ]; then gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64-*' -D apk
          else gh release download latest -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64.apk' -D apk; fi
          pick=$(find apk -name '*.apk' | head -1); [ -n "$pick" ] || { echo "::error::no APK"; exit 1; }
          cp "$pick" app.apk; ls -la app.apk
          # #1694 the same emulator's Cloud-Browser (best effort): floor796 is loaded in it for the side-by-side
          gh release download latest -R "$GITHUB_REPOSITORY" -p 'Cloud-Browser-x86_64.apk' -D browser 2>/dev/null \
            || gh release download latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'Cloud-Browser-x86_64.apk' -D browser 2>/dev/null || true
          [ -f browser/Cloud-Browser-x86_64.apk ] && cp browser/Cloud-Browser-x86_64.apk browser.apk || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the walk
        run: |
          cat > walk.py <<'PY'
          import re, subprocess, sys, time
          OUT = "screens"
          pkg = sys.argv[1]
          def sh(*a, check=False): return subprocess.run(["adb", *a], capture_output=True, text=True, timeout=90)
          def dump():
              for _ in range(6):
                  sh("shell", "uiautomator", "dump", "/sdcard/u.xml")
                  x = sh("shell", "cat", "/sdcard/u.xml").stdout
                  if "<hierarchy" in x: return x
                  time.sleep(2)
              return ""
          def nodes(x):
              for m in re.finditer(r'<node [^>]*>', x):
                  n = m.group(0)
                  t = re.search(r' text="([^"]*)"', n); d = re.search(r' content-desc="([^"]*)"', n)
                  b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
                  if b: yield (t.group(1) if t else ""), (d.group(1) if d else ""), tuple(map(int, b.groups()))
          LAST = []
          def launch(*extras, wait=8):
              # a cold start straight into a page or world (Launch.kt reads the extras); remembered for a relaunch
              LAST[:] = list(extras)
              sh("shell", "am", "start", "-S", "-W", "-n", pkg + "/.MainActivity", *extras); time.sleep(wait)
          def front():
              # the emulator's memory pressure can kill the app (run 41201038236: GMS and the app died together); relaunch it
              # where the walk was, never via the launcher (that would open the default page)
              top = sh("shell", "dumpsys", "activity", "activities").stdout
              if not any(pkg in l for l in top.splitlines() if "ResumedActivity" in l):
                  print("::warning::the app was not in front; relaunching")
                  launch(*LAST, wait=15)
          def tap(label, nth=0, scroll=0):
              front()
              for attempt in range(scroll + 1):
                  hits = [b for t, d, b in nodes(dump()) if label in (t, d)]
                  if len(hits) > nth:
                      x1, y1, x2, y2 = hits[nth]; sh("shell", "input", "tap", str((x1 + x2) // 2), str((y1 + y2) // 2)); time.sleep(1.5); return True
                  sh("shell", "input", "swipe", "540", "1700", "540", "900", "400"); time.sleep(1)
              print("::warning::no '%s' on screen" % label); return False
          def shot(name, wait=0):
              time.sleep(wait)
              if not name.startswith(("06", "07", "08")): front()
              try:
                  png = subprocess.run(["adb", "exec-out", "screencap", "-p"], capture_output=True, timeout=60).stdout
              except subprocess.TimeoutExpired:
                  print("::warning::screencap of %s timed out" % name); return
              with open("%s/%s.png" % (OUT, name), "wb") as f: f.write(png)
              print("shot", name)
          launch("-e", "section", "store"); shot("04-store-all", 2)
          tap("All", 0); tap("Games"); tap("Flat Screen"); shot("05-store-filtered", 2)
          # A Way to Go times out: the load watchdog (Offline.LOAD_TIMEOUT_MS, 15 s) shows the offline card well inside 25 s
          def seek(label, swipes=45):
              for _ in range(swipes):
                  if any(label in (t, d) for t, d, b in nodes(dump())): return True
                  sh("shell", "input", "swipe", "540", "1700", "540", "1000", "300"); time.sleep(0.8)
              print("::warning::'%s' never came on screen" % label); return False
          # #1400 Galaxy tabs: the fresh install opens the declared default tabs (#1711: Cyber City Orion, floor796, Messenger; Orion shown);
          # a Store world adds another tab
          launch("-e", "section", "galaxy", wait=0); shot("09b-galaxy-default-tabs", 40)
          launch("-e", "world", "floor796", wait=0); shot("09-galaxy-tab-floor796", 25)
          # #1701 floor796 loads the plain address (Galaxy = Cloud-Browser, #1694): the Page diagnostics sheet shows Failed requests
          shot("13-galaxy-floor796-after-3min", 180)   # a software-GL emulator draws the scene's tiles slowly: give it time
          tap("Page diagnostics"); shot("14-galaxy-floor796-diagnostics", 4)
          sh("shell", "input", "swipe", "540", "1700", "540", "700", "400"); shot("15-galaxy-floor796-diagnostics-failed", 1)
          sh("shell", "input", "keyevent", "KEYCODE_BACK")
          launch("-e", "world", "lusion-v3", wait=0); shot("10-galaxy-two-tabs", 20)
          # #1711 the other two default tabs, each on its own
          launch("-e", "world", "cyber-city-orion", wait=0); shot("19-galaxy-world-cyber-city-orion", 60)
          launch("-e", "world", "messenger", wait=0); shot("20-galaxy-world-messenger", 60)
          # #1701 the Store's 3D models: the cards (photo, facts), then each model open in Galaxy (runtime download, SHA-256 check, viewer)
          launch("-e", "section", "store"); seek("House Boat"); shot("16-store-models", 3)
          launch("-e", "world", "house-boat", wait=0); shot("17-galaxy-model-house-boat", 40)
          launch("-e", "world", "dji-s900", wait=0); shot("18-galaxy-model-dji-s900", 60)
          launch("-e", "section", "store"); seek("floor796"); shot("11-store-floor796", 1)
          launch("-e", "world", "a-way-to-go", wait=0); shot("06-galaxy-world-a-way-to-go", 25)
          launch("-e", "world", "webgl-fluid-simulation", wait=0); shot("07-galaxy-world-fluid", 20)
          sh("shell", "input", "swipe", "300", "1200", "800", "900", "300"); shot("08-galaxy-world-fluid-touched", 2)
          # Avatar last (#1373 owns it): a slow or hung Avatar page cannot cost the Store and Galaxy shots
          sh("shell", "dumpsys", "webviewupdate"); open("screens/webview.txt", "w").write(sh("shell", "dumpsys", "webviewupdate").stdout)
          if len(sys.argv) > 2:   # Cloud-Browser on the same emulator, the same address, the same wait (#1694)
              sh("shell", "am", "start", "-a", "android.intent.action.VIEW", "-d", "https://floor796.com", "-p", sys.argv[2]); time.sleep(5)
              shot("08-cloud-browser-floor796", 110)
          launch("-e", "section", "avatar", wait=0); shot("01-avatar-default", 20)
          sh("shell", "input", "swipe", "700", "900", "350", "900", "600"); shot("02-avatar-rotated", 3)
          PY
          cat > walk.sh <<'EOF'
          #!/bin/bash
          set -u
          mkdir -p screens
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb install -r -g app.apk || exit 2
          BR=""; if [ -f browser.apk ]; then adb install -r -g browser.apk && BR=com.diegonmarcos.cloudbrowser; fi
          PKG=com.diegonmarcos.cgomniverse
          adb logcat -v threadtime "*:W" chromium:I > screens/logcat.txt 2>&1 &
          python3 walk.py "$PKG" $BR; rc=$?
          adb shell dumpsys package "$PKG" | grep -E "versionName|codePath" > screens/package.txt || true
          ls -la app.apk >> screens/package.txt
          exit $rc
          EOF
          chmod +x walk.sh
      - name: Boot emulator + walk
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh
      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-omniverse-screens
          path: screens
          retention-days: 30
