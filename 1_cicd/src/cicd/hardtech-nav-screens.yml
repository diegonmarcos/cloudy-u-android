name: "Proof → Hardtech nav screens (Hardtech-CAD Models | Home | Sim2Real, Hardtech-BioMed seven tabs, emulator)"

# On demand (#1777): installs the x86_64 APK of a Ship run on an emulator and takes the screens a Ship run cannot give.
#   cad     opens Hardtech-CAD and shows Models (MCAD, BIM, SolidWorks sub-pages), Home and Sim2Real (SAP2000, MATLAB, Ansys), uploads `hardtech-cad-nav-screens`.
#   biomed  opens Hardtech-BioMed and walks its seven tabs (Physiology, BioChem, BioMech, Anatomy, Genetic, Neuro, Immuno): each tab fetches its model at
#           run time, waits for the viewer's own "Rendered:" line, takes the screen and the WebGL canvas snapshot, and lights one topic; uploads
#           `hardtech-biomed-screens`.

on:
  workflow_dispatch:
    inputs:
      cad_run_id:
        description: "Ship -> Hardtech-CAD run whose x86_64 APK to walk (empty = the rolling release)"
        required: false
        default: ""
      biomed_run_id:
        description: "Ship -> Hardtech-BioMed run whose x86_64 APK to walk (empty = the rolling release)"
        required: false
        default: ""
      only:
        description: "cad | biomed | both"
        required: false
        default: "both"
      gpu:
        description: "emulator -gpu mode (swangle_indirect | swiftshader_indirect | guest)"
        required: false
        default: "swangle_indirect"

permissions:
  contents: read
  actions: read

jobs:
  cad:
    if: ${{ inputs.only != 'biomed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: Get the x86_64 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.cad_run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN" ]; then gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'Hardtech-CAD-x86_64-*' -D apk
          else gh release download latest -R "$GITHUB_REPOSITORY" -p 'Hardtech-CAD-x86_64.apk' -D apk; fi
          pick=$(find apk -name '*.apk' | head -1); [ -n "$pick" ] || { echo "::error::no APK"; exit 1; }
          cp "$pick" app.apk; ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the walk
        run: |
          cp 1_cicd/dist/scripts/hardtech-nav-walk.py walk.py
          cat > walk.sh <<'EOF'
          #!/bin/bash
          set -u
          mkdir -p screens
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb install -r -g app.apk || exit 2
          adb logcat -v threadtime "*:W" chromium:I CadHost:I > screens/logcat.txt 2>&1 &
          python3 walk.py cad com.diegonmarcos.hardtechcad; rc=$?
          adb shell dumpsys package com.diegonmarcos.hardtechcad | grep -E "versionName" >> screens/package.txt || true
          exit $rc
          EOF
          chmod +x walk.sh
      - name: Boot emulator + walk
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'swangle_indirect' }} -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh
      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardtech-cad-nav-screens
          path: screens
          retention-days: 30

  biomed:
    if: ${{ inputs.only != 'cad' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: Get the x86_64 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.biomed_run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN" ]; then gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'Hardtech-BioMed-x86_64-*' -D apk
          else gh release download latest -R "$GITHUB_REPOSITORY" -p 'Hardtech-BioMed-x86_64.apk' -D apk; fi
          pick=$(find apk -name '*.apk' | head -1); [ -n "$pick" ] || { echo "::error::no APK"; exit 1; }
          cp "$pick" app.apk; ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the walk
        run: |
          cp 1_cicd/dist/scripts/hardtech-nav-walk.py walk.py
          cat > walk.sh <<'EOF'
          #!/bin/bash
          set -u
          mkdir -p screens
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb install -r -g app.apk || exit 2
          PKG=com.diegonmarcos.hardtechbiomed
          adb logcat -v threadtime "*:W" chromium:I BioHost:I lmkd:I ActivityManager:I libc:F DEBUG:F AndroidRuntime:E > screens/logcat.txt 2>&1 &
          python3 walk.py biomed "$PKG"; rc=$?
          adb logcat -d -s chromium:I BioHost:I | grep -iE "console|error|bio" | tail -80 > screens/console.txt || true
          adb shell ls -l /data/data/$PKG/cache/biomed-models >> screens/package.txt 2>&1 || true
          adb shell dumpsys package "$PKG" | grep -E "versionName" >> screens/package.txt || true
          exit $rc
          EOF
          chmod +x walk.sh
      - name: Boot emulator + walk
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'swangle_indirect' }} -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh
      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardtech-biomed-screens
          path: screens
          retention-days: 30
