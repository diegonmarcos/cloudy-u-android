name: "Ship → Cloud SuperApp APK (build + push to GHCR via ORAS + attach to GH Release)"

# Builds the Cloud SuperApp APK from aa_cloud-superapp/ and publishes via two
# channels — both data-driven by aa_cloud-superapp/build.json::release:
#
#   1. ORAS push as OCI artifact      → ghcr.io/<ns>/<image>:<tags>
#      Always runs on main pushes (release.ghcr.tags expanded from build.json).
#      ORAS lets us publish the raw APK as an OCI blob (not a container image)
#      so any OCI-aware tooling can pull it: oras pull, crane export, podman
#      image pull --tls-verify, etc.
#
#   2. GH Release attachment           → APK on a tagged release
#      Only fires on tag push matching release.gh_release.tag_pattern
#      (default: aa_cloud-superapp-v*). Lets phone-side install pick up
#      "latest version" via the gh-release JSON API or a fixed deep link.
#
# All registry, tag, asset-name strings live in aa_cloud-superapp/build.json —
# this workflow never hardcodes any of that. The only "knob" here is which
# build.sh subcommand to invoke; engine reads build.json for the rest.
#
# Triggers:
#   - push main on paths under aa_cloud-superapp/  → build + oras push :latest + :sha
#   - push tag `aa_cloud-superapp-v*`              → build + oras push :latest + :sha + :version + gh release
#   - workflow_dispatch                            → manual, same as main push

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      # DEFAULT TRUE, because "manual, same as main push" (above) has to mean
      # it. A main push publishes the rolling `latest` release — which is the
      # only thing the in-app updater ever downloads — and this defaulted to
      # false, so a manual dispatch built an APK, uploaded it as a workflow
      # artifact nobody installs, and exited GREEN having shipped nothing.
      # Worse, `concurrency: cancel-in-progress` is keyed on the ref, so a
      # dispatch fired seconds after a push CANCELS the push run that would
      # have published, and replaces it with one that does not. That is exactly
      # how commit ffe5b157c went green at 08:41 on 2026-09-05 while the served
      # asset stayed at the previous day's build (run 33955960648 cancelled run
      # 33955954081; "Publish to GitHub Releases" = skipped).
      #
      # No tag context is needed: the engine's rolling mode creates/updates the
      # `latest` release on any ref. Set this to false only to deliberately
      # build without publishing — the verify step below then says so loudly.
      create_release:
        description: "Publish to the rolling `latest` GitHub Release (what devices download)"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "aa_cloud-superapp-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # aa_cloud-superapp/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-superapp.yml"
      # ── end MANAGED-PATHS-HEADER ──
      # ab_cloud-libs-shared/build.json is watched because it carries
      # firestack.artifact — the tag and per-ABI checksums of the prebuilt
      # netstack aar this APK links against. Advancing that pin IS a change to
      # what ships, and without this entry the adopting commit would touch no
      # watched path, start no build, and leave the new aar unused with
      # everything reporting green. It is also then part of the publish gate's
      # source identity (cloud-android-source-identity.sh hashes exactly this
      # list; a file entry hashes as its git blob), so a pin advance correctly
      # republishes and an unrelated edit elsewhere in that file does not.
      - "aa_cloud-superapp/**"
      - "ab_cloud-libs-shared/build.json"
      - "ab_cloud-libs-shared/libs/account/**"
      - "ab_cloud-libs-shared/libs/ai-usage/**"
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs-shared/libs/appstore/**"
      - "ab_cloud-libs-shared/libs/auth/**"
      - "ab_cloud-libs-shared/libs/battery/**"
      - "ab_cloud-libs-shared/libs/bluetooth/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/chat/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/databackend/**"
      - "ab_cloud-libs-shared/libs/datamanager/**"
      - "ab_cloud-libs-shared/libs/decisions-link/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/firewall/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints-android/**"
      - "ab_cloud-libs-shared/libs/fleet-endpoints/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/health/**"
      - "ab_cloud-libs-shared/libs/kde-connect/**"
      - "ab_cloud-libs-shared/libs/launcher-apptabs/**"
      - "ab_cloud-libs-shared/libs/launcher-onehand/**"
      - "ab_cloud-libs-shared/libs/launcher-zoomies/**"
      - "ab_cloud-libs-shared/libs/light/**"
      - "ab_cloud-libs-shared/libs/mail/**"
      - "ab_cloud-libs-shared/libs/net/**"
      - "ab_cloud-libs-shared/libs/ops/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/search/**"
      - "ab_cloud-libs-shared/libs/shared-store/**"
      - "ab_cloud-libs-shared/libs/shizuku-adb-debug-tools/**"
      - "ab_cloud-libs-shared/libs/sysdns/**"
      - "ab_cloud-libs-shared/libs/text-tools/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      - "ab_cloud-libs-shared/libs/updater/**"
      - "ab_cloud-libs-shared/libs/usb-drive/**"
      - "ab_cloud-libs-shared/libs/web-core/**"
      - "ab_cloud-libs-shared/libs/webserver/**"
      - "ab_cloud-libs-shared/libs/wifi/**"
permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-superapp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: aa_cloud-superapp

jobs:
  build_and_publish:
    name: "Build APK + Push (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      # fail-fast: false so an x86_64 hiccup never blocks the arm64 release.
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      # The 34 testers under aa_cloud-superapp/test/ — until this step existed
      # no workflow ran a single one of them, so a tester nobody's pipeline
      # called was indistinguishable from no tester at all. They need no JDK,
      # no SDK and no gradle, so they go first and fail in seconds.
      #
      # DELIBERATELY NOT gated on steps.gate.outputs.skip: the gate answers
      # "would these bytes differ?", which is the right question for publishing
      # and the wrong one for testing — editing a tester does not move the APK,
      # and gating here would let a new assertion land without ever running.
      # ripgrep is NOT on the ubuntu-latest image — run 34441463781 proved it,
      # by refusing to run rather than by passing. Four of this app's testers
      # call rg with stderr discarded, so without it installed they do not fail:
      # test-no-conflict-markers.sh assigns HITS="$(rg …)" and reports "no
      # conflict markers" when the command was never found, and
      # test-comms-tile-retarget.sh's absent() helper reports every "no dead
      # reference survives" check as PASSING. Both were therefore green on this
      # runner for reasons unrelated to the code. Installing it is what makes
      # those assertions mean anything; build.json::tests.shell.requires is the
      # check that stops them going quietly vacuous again.
      - name: Install ripgrep (a tester's missing tool must never be a pass)
        run: sudo apt-get install -y -qq ripgrep

      - name: Shell testers (static assertions — fatal on failure)
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"

      - name: Guard against assertions that cannot fail
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint "$WORK_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pre-install the two native toolchains the build needs, so AGP
          # never races to install them lazily during parallel per-ABI native
          # tasks (corrupt-zip flake). Versions MUST match each module's
          # build.gradle + aa_cloud-superapp/{build.json::toolchain,flake.nix}:
          #   • cmake;3.22.1 + ndk;26.1.10909125 — libs:net (libwg-go.so).
          #   • ndk;28.0.13004108              — libs:keyboard (HeliBoard
          #     libjni_latinime.so, ndk-build).
          # platforms;android-36 + build-tools;36.0.0 added for the HeliBoard
          # bump (AGP 8.13.2 / Kotlin 2.3.20 / compileSdk 36). 35/34/26 kept for
          # the rest of the modules + NDK-side builds that still target them.
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          # Pin to build.json::toolchain.gradle. Bumped 8.10.2 -> 8.14 for the
          # HeliBoard toolchain (AGP 8.13.2 needs Gradle 8.13+; Kotlin 2.3.20
          # Compose-compiler plugin). Mirrors HeliBoard main's wrapper.
          gradle-version: "8.14"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      # ── firestack Go module cache ───────────────────────────────────────
      # RECOVERED FROM THE GENERATED COPY. This step existed only in
      # .github/workflows/ship-cloud-superapp.yml and never in this source, so
      # it was live on every run while being invisible here — and the next
      # `./build.sh workflow` would have deleted it without a word. That is the
      # same source-vs-generated split that let the ABI gate and the GHCR
      # auto-delete gate live in a file nobody executed, running the other way.
      #
      # MITIGATION, not the fix. The fix is in build-firestack.sh: the build
      # seeds from the committed go.mod/go.sum and then runs with GOPROXY=off,
      # so it resolves nothing. What this cache buys is the one hole that fix
      # cannot close: `gomobile bind` shells out to `go mod tidy` in a throwaway
      # module that has no go.sum, so tidy re-verifies the whole graph against
      # sum.golang.org — 257 tile fetches on a cold runner, any one of which can
      # return a stream error and cost the publish. Those tiles live in
      # GOMODCACHE, so once this cache is warm the tidy needs no network at all.
      # A cold cache still reaches out; only persisting it removes the lottery.
      # Keyed on go.sum: a pin change correctly invalidates it.
      - name: Cache firestack Go modules + checksum-db tiles
        uses: actions/cache@v4
        with:
          path: ab_cloud-libs-shared/.cache/gomodcache
          key: firestack-gomodcache-${{ runner.os }}-${{ hashFiles('ab_cloud-libs-shared/libs/firewall/firestack/go.sum') }}
          restore-keys: firestack-gomodcache-${{ runner.os }}-

      # ── ONE shared Cloud-constellation signing key (vault) ──────────────
      # ALL constellation apps (Cloud-Comms hub+forks, Cloud-Nav, Cloud-IDE,
      # Cloud-SuperApp) sign with the SAME key so cross-app signature-IPC + the
      # in-app fleet updater never hit a signature mismatch. The raw keystore +
      # its sops-encrypted passwords live ONLY in the private vault repo:
      #   Shared/Providers/D_TOOLS-DEVICES/d2-android/release.jks (OU=Cloud Constellation)
      #   Shared/Providers/D_TOOLS-DEVICES/d2-android/signing.secrets.yaml
      # build.sh::_resolve_signing reads $VAULT_DIR + sops-decrypts (SOPS_AGE_KEY)
      # and exports ANDROID_KEYSTORE_* which the gradle signingConfig reads.
      # NO fallback: if the key is unavailable build.sh exits 1 (desired).
      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install gh CLI + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # gh CLI is preinstalled on ubuntu-latest; verify.
          command -v gh

      # sops — build.sh::_resolve_signing needs it to decrypt the shared key.
      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Determine variant
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      # BYPASS_NIX=1 because GHA already provides JDK + SDK + Gradle —
      # devShell would just re-download them. The engine still reads
      # build.json + build.gradle for everything else (toolchain pins,
      # module graph, registry config, tags).
      # Runs build.json::tests.unit.task through the app's own build.sh. #512:
      # the first suite here is the Robolectric test that INFLATES
      # activity_main and measures the bottom-nav's selected pill — four
      # CI-green "fixes" of that widget shipped while it rendered nothing,
      # because every check read XML text and none read the resolved view.
      # Same env as the build step: gradle cannot even CONFIGURE this project
      # without the shared signing key, and BYPASS_NIX because GHA already
      # provides the JDK + SDK + Gradle.
      # UNGATED on the publish gate (toolchain steps above included): the gate hashes build inputs and deliberately
      # leaves test sources out, so a push that only edits tests skips the gate; gating the suite on it meant a test-only
      # change never ran the tests it changed. The suite now runs on every Ship run; only build/publish stay gated.
      - name: JVM unit tests (fatal on failure)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"

      # Board screenshots drawn by the unit suite (MyHealthShotTest): evidence of the rendered My-Health board.
      - name: Upload board screenshots
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: board-shots-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/app/build/board-shots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # SUPERAPP_VARIANT selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          # app/build.gradle shells out to `gh run list` at gradle config
          # phase to bake recent CI run durations into BuildConfig
          # (Configs → About → Stack: "Build avg time" + "Build last").
          # Without this token gh runs unauthenticated → returns empty,
          # the fields fall back to -1, the UI shows "—".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          set -o pipefail
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          else
            ./build.sh build 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          fi
          ls -la dist/

      - name: Why the build failed (readable without a token)
        if: failure() && steps.gate.outputs.skip != 'true'
        run: sh 1_cicd/dist/scripts/cloud-android-annotate-build-failure.sh "$RUNNER_TEMP/gradle-build.log" "build [superapp]"

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "aa_cloud-superapp" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-SuperApp-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-superapp

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      # Always runs — the engine publishes a rolling release tagged
      # `latest` (so /releases/latest/download/Cloud-SuperApp.apk is a
      # stable URL the linktree footer points at). The engine ALSO
      # creates the immutable per-tag release when it detects a tag
      # push (GITHUB_REF starts with refs/tags/). Don't try to clear
      # GITHUB_REF_NAME with an empty string here — GitHub Actions
      # re-injects the runner's default for that variable even when a
      # step's env: block sets it to '', which would falsely trigger
      # the per-tag branch on every main push and create a stray
      # "main"-tagged release.
      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "aa_cloud-superapp" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"

      # ── firestack health: REPORTS, NEVER VETOES ────────────────────────
      #
      # The APK no longer builds firestack from source, which is the whole point
      # — a red firestack cannot stop a publish any more. The cost is that a red
      # firestack became QUIET, where before it was impossible to miss because
      # it took the phone down with it. This step is what is paid instead.
      #
      # It runs LAST, AFTER the publish and after the publish guard, and it is
      # `continue-on-error` — so there is no ordering and no outcome by which it
      # can affect whether the APK ships. That placement is deliberate and is
      # the fleet's own lesson, learned twice this week: something that should
      # REPORT must not be wired as something that can VETO. A live third-party
      # pricing check had been wired onto this very publish step, and an inline
      # Go build was wired onto it before that. This one only ever prints.
      #
      # Do not "strengthen" this into a gate. If the pinned aar is stale that is
      # information for the owner, not grounds to withhold an APK carrying forty
      # other commits.
      - name: firestack pin health (report only — never blocks the APK)
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-firestack-pin-health.sh "${{ github.repository }}"
