name: "Configs tabs guard — every app's Configs is {own tabs} | General, Agents, Perms, Logcat, X-Ray App, About; General keeps every field"

# WHY THIS EXISTS (#1439, #1852).
# Configs grew a different shape per app: one page in one app, About last in the next, a private Perms list in a
# third. The fleet pattern is one order everywhere (#1852): the app's own tabs first, then a `|` divider, then the shared
# tabs General, Agents, Perms, Logcat, X-Ray App, About. The rule is 1_cicd/src/data/configs-pages.json::tabs (declared once,
# drawn by libs:ui-nav-bars FleetConfigsExtensions); the apps that do not conform yet are listed there with a reason, and the
# guard fails any other app that breaks the order. The second step is the rule-16 field parity of the compact Configs > General
# (1_cicd/src/data/configs-general-parity.json): no entry or action of the former General may be dropped.

on:
  push:
    # ── MANAGED-GUARD-TRIGGERS: injected by cloud-android-guard-triggers.py from 1_cicd/src/data/guard-triggers.json ──
    paths:
      - "1_cicd/src/cicd/configs-tabs-guard.yml"
      - "1_cicd/src/data/configs-general-parity.json"
      - "1_cicd/src/data/configs-pages.json"
      - "1_cicd/src/scripts/cloud-android-configs-general-parity-guard.py"
      - "1_cicd/src/scripts/cloud-android-configs-tabs-guard.py"
      - "1_cicd/src/scripts/test/configs-general-parity.test.sh"
      - "1_cicd/src/scripts/test/configs-tabs-guard.test.sh"
      - "a[acd]_*/**/*.java"
      - "a[acd]_*/**/*.kt"
      - "a[acd]_*/**/*.patch"
      - "a[acd]_*/**/build-extras.gradle"
      - "a[acd]_*/**/build.gradle"
      - "a[acd]_*/**/build.gradle.kts"
      - "a[acd]_*/**/settings-extras.gradle"
      - "a[acd]_*/**/settings.gradle"
      - "a[acd]_*/**/settings.gradle.kts"
      - "a[acd]_*/build.json"
      - "ab_cloud-libs-shared/libs/*/src/main/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/src/main/kotlin/com/diegonmarcos/superapp/fleetconfigs/FleetConfigsExtensions.kt"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/src/main/kotlin/com/diegonmarcos/superapp/fleetconfigs/FleetConfigsPages.kt"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/src/main/kotlin/com/diegonmarcos/superapp/fleetconfigs/FleetConfigsUi.kt"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/src/main/kotlin/com/diegonmarcos/superapp/fleetconfigs/FleetGeneralState.kt"
      - "ac_cloud-c3-webserver/server/ui/shell.html"
      - "ac_cloud-code/src/cloud/profile.js"
      - "ac_cloud-media-center/web/assets/configs.js"
    # ── end MANAGED-GUARD-TRIGGERS ──
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configs-tabs-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  configs-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private fleet data
        uses: ./.github/actions/fleet-private
        with:
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
      - name: Every app's Configs is {own tabs} | General, Agents, Perms, Logcat, X-Ray App, About (lists every app)
        run: python3 1_cicd/src/scripts/cloud-android-configs-tabs-guard.py
      - name: The configs-tabs guard still fails on each way an app can break the order
        run: bash 1_cicd/src/scripts/test/configs-tabs-guard.test.sh
      - name: Configs > General keeps every entry and action of the former General (field parity, rule 16), each with a live state
        run: python3 1_cicd/src/scripts/cloud-android-configs-general-parity-guard.py
      - name: The General parity guard still fails on each dropped field, lost live state and returned tile
        run: bash 1_cicd/src/scripts/test/configs-general-parity.test.sh
