name: "share-sheet guard — Notes/Drive/SuperApp offer their labelled share entries, the terminals offer none"

# WHY (#1888). Sharing a file from another app listed the two terminals (the upstream Termux share receiver) but neither Cloud Notes nor
# Cloud Drive (VIEW only). Notes: "Open with"; Drive: "Save to..." and "Open with"; SuperApp: "Send to peer"; terminals: no enabled
# SEND receiver (their DocumentsProvider stays). Every push: a manifest edit can bring any of it back.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ── MANAGED-GUARD-CONCURRENCY: injected by cloud-android-guard-triggers.py ──
concurrency:
  group: share-sheet-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# ── end MANAGED-GUARD-CONCURRENCY ──

jobs:
  share-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The guard is red for each lost entry (mutation proof)
        run: bash 1_cicd/src/scripts/test/share-sheet-guard.test.sh

      - name: The manifests declare the share entries
        run: python3 1_cicd/src/scripts/cloud-android-share-sheet-guard.py .

      - name: Notes keeps its open-any parity with Drive
        run: bash ac_cloud-notes/test/test-notes-open-any.sh
