name: "Ship → Cloud Keyboard APK (build + push to GHCR via ORAS + attach to GH Release)"

# Standalone Cloud Keyboard IME with translate/voice/sticker panel.
# Libs shared from ab_cloud-libs-shared/libs/ via relative project references.
#
# Triggers:
#   - push main touching ac_cloud-keyboard/ or ab_cloud-libs-shared/libs/{keyboard,media,translate,voice}/
#   - tag ac_cloud-keyboard-v* → release build
#   - workflow_dispatch → manual

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options: [debug, release]
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-keyboard-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-keyboard/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-keyboard.yml"
      # ── end MANAGED-PATHS-HEADER ──
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs-shared/libs/autofill/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/decisions-link/**"
      - "ab_cloud-libs-shared/libs/decisions/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleet-data-client/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-agents/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-logcat/**"
      - "ab_cloud-libs-shared/libs/fleetconfigs-xray/**"
      - "ab_cloud-libs-shared/libs/keyboard/**"
      - "ab_cloud-libs-shared/libs/media/**"
      - "ab_cloud-libs-shared/libs/ml-l-image-ocr/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/text-tools/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/translate/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ab_cloud-libs-shared/libs/voice/**"
      - "ab_cloud-libs-shared/libs/writer-core/**"
      - "ab_cloud-libs-shared/libs/writer-ui/**"
      - "ac_cloud-keyboard/**"
permissions:
  contents: write
  packages: write

concurrency:
  group: ship-cloud-keyboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-keyboard

jobs:
  build_and_publish:
    name: "Build Cloud Keyboard APK"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TESTS RUN BEFORE THE PUBLISH GATE, AND WITHOUT ITS CONDITION.
      #
      # This app had no test/ directory and no build.json::tests block, so this
      # workflow never invoked the test engine at all — it went straight from the
      # gate to assembleRelease. The green it printed for weeks meant the Kotlin
      # compiled and nothing else, while the assertions that do cover this keyboard
      # sat in aa_cloud-superapp/test/ gating a different app's release.
      #
      # They sit above the gate on purpose. The gate skips the whole job when this
      # app's source is unchanged, and an assertion can also start failing because
      # something it reads OUTSIDE the app changed — libs:translate, libs:keyboard,
      # the guard's own entry-point manifest. Gating the tests on the same condition
      # would mean the run that most needs them is the one that skips them.
      #
      # Static assertions only: no JDK, no Android SDK, no gradle. They cost seconds
      # and they run before anything is built, let alone published.
      - name: "Test → shell testers (build.json::tests.shell)"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"

      - name: "Test → assertions that cannot fail"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint "$WORK_DIR"

      # Prints the coverage gap rather than a tick. There are no JVM unit tests in
      # this app and the container that maintains it has no JVM to write them with,
      # so the honest output is a line saying so on every run.
      - name: "Test → JVM unit tests (coverage gap is logged, not hidden)"
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" ""

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          # Same toolchain as superapp (libs are shared).
          # NDK 28 for HeliBoard's libjni_latinime.so (ndk-build).
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        if: steps.gate.outputs.skip != 'true'
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # #843: libs:keyboard's JVM tests (the view-state invariant: every panel renders a
      # visible exit). After the SDK/JDK setup, which the static test step above lacks.
      - name: "Test → libs:keyboard JVM unit tests"
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh unit

      - name: Build APK
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-keyboard" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Keyboard-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-keyboard

      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-keyboard" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" ""

  # #1103 CI screenshots of the keyboard on a real emulator: the toolbar (every page), the Grammar mode icon in its three
  # states, the Autocomplete pages and the emoji search state, each also read back from the running keyboard and compared
  # with what the ticket asks for (ac_cloud-keyboard/ci/keyboard-screenshots.sh). The pictures are the artifact
  # `keyboard-screenshots`; the job is red when a state is not the asked one. A run whose publish gate skipped the build
  # uploaded no APK and this job reports that and stops.
  keyboard_screenshots:
    name: "Keyboard screenshots (emulator)"
    needs: build_and_publish
    if: ${{ !cancelled() && needs.build_and_publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the APK this run built
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: Cloud-Keyboard-*
          path: apk

      - name: Pick the APK
        id: pick
        run: |
          apk="$(find apk -name '*.apk' 2>/dev/null | head -1)"
          if [ -z "$apk" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; echo "no APK in this run (publish gate skipped the build): nothing to screenshot"; exit 0; fi
          echo "found=true" >> "$GITHUB_OUTPUT"; echo "apk=$apk" >> "$GITHUB_OUTPUT"; ls -la "$apk"

      - name: Enable KVM
        if: steps.pick.outputs.found == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator and take the screenshots
        if: steps.pick.outputs.found == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-keyboard/ci/keyboard-screenshots.sh ${{ steps.pick.outputs.apk }} keyboard-shots

      - name: Upload the screenshots
        if: ${{ always() && steps.pick.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-screenshots
          path: keyboard-shots
          if-no-files-found: warn
          retention-days: 30
