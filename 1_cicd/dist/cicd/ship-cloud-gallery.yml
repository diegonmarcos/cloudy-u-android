name: "Ship → Cloud Gallery APK (build + push to GHCR via ORAS + attach to GH Release)"

# Engine: 1_cicd/src/scripts/cloud-gallery-fork-engine.sh
# (symlinked as ac_cloud-gallery/build.sh) — this app's own copy, not
# shared, matching the ac_cloud-{mail,chat,dialer,matrix} per-app convention
# (the old shared cloud-comms-fork-engine.sh was retired 2026-07-30).
#
# Builds the Cloud Gallery APK from ac_cloud-gallery/ (a fork of
# IacobIonut01/ReFra) and publishes via two channels, both data-driven by
# ac_cloud-gallery/build.json::release (mirror of the
# ship-cloud-superapp.yml engine contract — the only "knob" here is which
# build.sh subcommand to invoke; engine reads build.json for the rest):
#
#   1. ORAS push as OCI artifact → ghcr.io/diegonmarcos/cloud-gallery:<tags>
#   2. GH Release attachment     → APK on the rolling `latest` release
#
# One matrix job per ABI variant (build.json::release.variants[].id): arm64
# (canonical phone build) + x86_64 (Waydroid / desktop emulators), published
# to the SAME rolling `latest` release under distinct filenames + to GHCR
# under tag suffix -x86_64.
#
# Cloud Gallery DOES have native modules: upstream ReFra uses
# externalNativeBuild + CMake with JNI over libheif/libde265, so the Android
# SDK setup below installs the matching NDK/CMake packages.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-gallery-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-gallery/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-gallery.yml"
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/scripts/cloud-gallery-fork-engine.sh"
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/cropper/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/gesture/**"
      - "ab_cloud-libs-shared/libs/ml-l-image/**"
      - "ab_cloud-libs-shared/libs/panoramaviewer/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/scrollbar/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ac_cloud-gallery/**"
permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-gallery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-gallery

jobs:
  build_and_publish:
    outputs:
      # read by launch_smoke: false when the publish gate skipped the build
      built: ${{ steps.gate.outputs.skip != 'true' }}
    name: "Build APK + Push (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      fail-fast: false
      matrix:
        # These are the REAL Android ABI names, matching upstream ReFra's
        # productFlavor keys (abiVersionCodes in app/build.gradle.kts) and
        # build.json::forks.<key>.build.gradle_task_by_abi. Kept identical on
        # purpose so no name-mapping table is needed anywhere in this workflow.
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      # Every application's testers, and — for the 24 that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Until this
      # step existed, an application with zero testers and one with fifty
      # passing testers produced indistinguishable green ticks, and the ship
      # workflow's only question was "did Gradle exit 0". Needs no JDK, no SDK
      # and no gradle, so it costs seconds and fails before anything is built.
      #
      # DELIBERATELY NOT gated on the publish gate: the gate answers "would
      # these bytes differ?", which is the right question for publishing and the
      # wrong one for testing — editing a tester does not move the APK, and
      # gating here would let a new assertion land without ever running once.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pins mirror ac_cloud-gallery/flake.nix + build.json::toolchain.
          # ndk;29.0.14033849 + cmake;3.31.6 required — ReFra upstream builds
          # native libheif/libde265 via CMake (see comment above).
          packages: "platforms;android-37.1 platforms;android-37.0 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;37.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools ndk;29.0.14033849 cmake;3.31.6"

      - name: Set up Gradle 8.10.2 (cached)
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      # UNGATED on the publish gate (toolchain steps above included): the gate hashes build inputs and deliberately
      # leaves test sources out, so a push that only edits tests skips the gate; gating the suite on it meant a test-only
      # change never ran the tests it changed. The suite now runs on every Ship run; only build/publish stay gated.
      # build.json::tests.unit.task names the task; the app's own gradlew runs it (the test engine prefers it).
      - name: JVM unit tests (fatal on failure)
        working-directory: ${{ github.workspace }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"

      # ── ONE shared Cloud-constellation signing key (vault) ──────────────
      # ALL constellation apps sign with the SAME key so cross-app
      # signature-IPC + the in-app fleet updater never hit a signature
      # mismatch. The raw keystore + its sops-encrypted passwords live ONLY in
      # the private vault repo (Shared/Providers/D_TOOLS-DEVICES/d2-android/release.jks +
      # signing.secrets.yaml). build.sh::_resolve_signing reads $VAULT_DIR +
      # sops-decrypts (SOPS_AGE_KEY) and exports ANDROID_KEYSTORE_* for gradle.
      # NO fallback: if the key is unavailable build.sh exits 1 (desired).
      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install gh CLI + jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          command -v gh

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Prebuilt native codecs ──────────────────────────────────────
      # app/src/main/cpp/CMakeLists.txt links libheif/libde265,
      # libjpeg-turbo/libpng, x265/aom and LibRaw/libtiff as PREBUILT STATIC
      # libs out of app/src/main/cpp/{heif,imgcodec,heifenc,rawcodec}/<abi>/,
      # and compiles a STUB (`#else` branch, every method returns false/0)
      # when they are absent. Those directories are .gitignored and exist
      # only once scripts/native/*.sh has run.
      #
      # Until now nothing in THIS pipeline ran them: the composite action that
      # does lives at ac_cloud-gallery/.github/actions/build-native-libs
      # and is referenced only by the vendored upstream workflows
      # (ac_cloud-gallery/.github/workflows/{stable,nightly}.yml), a
      # nested .github/ that GitHub never executes — only the repo-root one
      # runs. So every APK we ever shipped carried four ~4.8 KB stubs
      # (libheiftiles, libheifenc, libimgstream, librawcodec — DT_NEEDED
      # libc/libm/libdl/liblog and nothing else) on BOTH ABIs: HEIF tiling,
      # HEIC/AVIF encode, streaming JPEG/PNG encode and RAW decode have never
      # once been present in a published build.
      #
      # The action is not reused directly because its steps are written
      # relative to ITS repo root (`scripts/native/...`, `app/src/main/cpp`),
      # which is ac_cloud-gallery, not this workspace root. The scripts
      # themselves resolve their own output paths, so invoking them by path is
      # safe from anywhere; they also accept our exact matrix ABI names.
      #
      # Each stack caches independently keyed on its build script. A failure
      # degrades to the stub instead of blocking the APK — the same contract
      # NativeLibraries.load already implements on the Kotlin side.
      - name: Cache prebuilt libheif (decode)
        if: steps.gate.outputs.skip != 'true'
        id: heif-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/app/src/main/cpp/heif
          key: heif-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('ac_cloud-gallery/scripts/native/build-heif.sh') }}

      - name: Cache prebuilt imgcodec (JPEG/PNG encode)
        if: steps.gate.outputs.skip != 'true'
        id: imgcodec-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/app/src/main/cpp/imgcodec
          key: imgcodec-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('ac_cloud-gallery/scripts/native/build-imgcodec.sh') }}

      - name: Cache prebuilt heifenc (HEIC/AVIF encode)
        if: steps.gate.outputs.skip != 'true'
        id: heifenc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/app/src/main/cpp/heifenc
          key: heifenc-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('ac_cloud-gallery/scripts/native/build-heif-encode.sh') }}

      - name: Cache prebuilt rawcodec (RAW decode + TIFF export)
        if: steps.gate.outputs.skip != 'true'
        id: rawcodec-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/app/src/main/cpp/rawcodec
          key: rawcodec-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('ac_cloud-gallery/scripts/native/build-libraw.sh') }}

      - name: Build native codecs (${{ matrix.abi }})
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -u
          build() {
            echo "::group::$1 (${{ matrix.abi }})"
            if bash "scripts/native/$1" "${{ matrix.abi }}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::warning::$1 failed for ${{ matrix.abi }} — that codec falls back to its stub"
            fi
          }
          [ "${{ steps.heif-cache.outputs.cache-hit }}"     = "true" ] || build build-heif.sh
          [ "${{ steps.imgcodec-cache.outputs.cache-hit }}" = "true" ] || build build-imgcodec.sh
          [ "${{ steps.heifenc-cache.outputs.cache-hit }}"  = "true" ] || build build-heif-encode.sh
          [ "${{ steps.rawcodec-cache.outputs.cache-hit }}" = "true" ] || build build-libraw.sh
          echo "prebuilt static libs now present:"
          find app/src/main/cpp -name '*.a' -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true

      # ── Build via build.sh (engine) ─────────────────────────────────
      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # COMMS_BUNDLE_ABI selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          COMMS_BUNDLE_ABI: ${{ matrix.abi }}
          # app/build.gradle shells out to `gh run list` at config phase to
          # bake recent CI durations into BuildConfig (About → Stack).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          # Fork lifecycle, same shape as ship-cloud-mail.yml. This is a
          # pinned-upstream + patch-series fork: the tracker clone must be
          # materialized before any gradle task can run, otherwise the engine
          # exits 1 with "fork '<key>' not materialized" (GHA 30530415219).
          # The key is read from build.json (single "forks" entry) rather than
          # hardcoded here — data-driven, no app name in the workflow.
          FORK="$(jq -r '.forks | keys[0]' build.json)"
          echo "fork key: $FORK"
          ./build.sh materialize-fork "$FORK"
          set -o pipefail
          ./build.sh build-fork "$FORK" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          ls -la dist/

      - name: Why the build failed (readable without a token)
        if: failure() && steps.gate.outputs.skip != 'true'
        run: sh 1_cicd/dist/scripts/cloud-android-annotate-build-failure.sh "$RUNNER_TEMP/gradle-build.log" "build [gallery]"

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-gallery" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Gallery-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS_NIX: "1"
          COMMS_BUNDLE_ABI: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$(jq -r '.forks | keys[0]' build.json)"

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          COMMS_BUNDLE_ABI: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release-fork "$(jq -r '.forks | keys[0]' build.json)"

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-gallery" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"

  # Install the APK this run just built on an emulator and launch it: a crash at startup fails
  # Ship (1_cicd/src/cicd/test-launch-smoke.yml). A job of this run, not a workflow_run listener,
  # so it cannot fail to trigger.
  launch_smoke:
    needs: build_and_publish
    if: needs.build_and_publish.outputs.built == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-launch-smoke.yml
    with:
      app: cloud-gallery
      artifact_prefix: Cloud-Gallery-
      api_levels: "[34]"
