# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test -> Cloud Browser proof (emulator, real WebView) (#1420-#1422)     ║
# ║ Google OAuth hand-off to a Custom Tab, real sites (agent, console,    ║
# ║ night mode), Favourites chips / grid / collapse. Evidence artifact:   ║
# ║ `browser-proof-evidence`. Script: ac_cloud-browser/test/emulator-     ║
# ║ browser-proof.sh.                                                     ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test -> Cloud Browser proof (emulator)"

on:
  workflow_dispatch:
    inputs:
      browser_run_id:
        description: "Ship Cloud Browser run id whose APK artifact to test (empty = release asset)"
        required: false
        default: ""
      release_tag:
        description: "Release to download from when the run id is empty"
        required: false
        default: "latest"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the Cloud Browser APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          B_RUN: ${{ inputs.browser_run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$B_RUN" ]; then
            gh api "repos/$REPO/actions/runs/$B_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-Browser-")) | .name' |
            while read -r name; do gh run download "$B_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          else
            gh release download "${TAG:-latest}" -R "$REPO" -p Cloud-Browser.apk -D apk
          fi
          pick=""
          for want in x86_64 universal arm64 ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud Browser APK"; exit 1; }
          cp "$pick" browser.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # google_apis_playstore: the image ships Chrome, the browser the Custom Tab opens in
      - name: Boot emulator + run the proof (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-browser/test/emulator-browser-proof.sh browser.apk out

      - name: Boot emulator + run the proof (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-browser/test/emulator-browser-proof.sh browser.apk out

      - name: Upload evidence (screenshots, ui dumps, console)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-proof-evidence
          path: out/
          if-no-files-found: warn
