name: "Ship → Cloud Terminal (build + attach to GH Release)"

# Independent per-app workflow for Cloud Terminal — our fork of termux-app.
# Engine: 1_cicd/src/scripts/cloud-termux-fork-engine.sh (copied as ac_cloud-termux/build.sh).
# Per-app build.json at ac_cloud-termux/build.json.
#
# NO GHCR STEP, unlike the comms forks. A GHCR package is owned by the account
# rather than the repository and is created private whatever it was pushed
# from, so publishing here would put a private APK in a public repo. The GH
# Release asset IS the repo, so it is public by construction.

on:
  # ── MANAGED-REFRESH-TRIGGER (#836): fleet-refresh.yml dispatches this app ──
  repository_dispatch:
    types: [fleet-refresh-ac_cloud-termux]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-termux/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-termux.yml"
      #   input: "ab_cloud-terminal-store/**"
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/scripts/cloud-termux-fork-engine.sh"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleet-webserver/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/shizuku-adb-debug-tools/**"
      - "ab_cloud-libs-shared/libs/sysdns/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ac_cloud-termux/**"
permissions:
  contents: write   # gh release upload
  packages: write   # ghcr push (oras) — cloud-terminal mirror, arm64

concurrency:
  group: ship-cloud-termux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-termux
  FORK: termux

jobs:
  # ── ONE build stamp per run, read by every ABI leg (#636) ───────────────
  # Both legs publish the rootfs companion under ONE applicationId, and its
  # versionCode is derived from this stamp (rootfs-lib/build.gradle). Stamped
  # inside each leg, the arm64 and x86_64 companions of one build came out
  # minutes apart; stamped here once, they cannot. Taken when the run starts,
  # after the concurrency group has let it in, so it still moves forward from
  # run to run.
  build_stamp:
    name: "Build stamp (one per run)"
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: echo "stamp=$(date -u '+%Y%m%d.%H%M%S')" >> "$GITHUB_OUTPUT"

  # ── the baked agent-coding rootfs (#470) ─────────────────────────────────
  # One leg per release.variants[] entry, each on a runner of THAT CPU
  # (rootfs.json::abis[].runner): the rootfs is built natively and then
  # entered through the exact proot + enter.sh the APK ships, so the tester
  # runs what the phone runs. No qemu anywhere.
  rootfs_plan:
    name: "Rootfs plan"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          m="$(jq -c --slurpfile r "$WORK_DIR/rootfs/rootfs.json" \
                '{include: [.release.variants[] | {abi: .id, android_abi: .abis[0], runner: $r[0].abis[.abis[0]].runner}]}' \
                "$WORK_DIR/build.json")"
          echo "$m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  rootfs:
    name: "Rootfs build + verify (${{ matrix.abi }})"
    needs: rootfs_plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rootfs_plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools the builder and tester call
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends zstd binutils file
      - name: Build the rootfs from rootfs.json + the fleet tool belt
        run: sh "$WORK_DIR/rootfs/build-rootfs.sh" "${{ matrix.android_abi }}" "$RUNNER_TEMP/cloud-rootfs"
      # The tester: every declared binary present, its PT_INTERP inside the
      # root, its libraries resolvable, executed under the shipped proot;
      # fish is the login shell enter.sh starts; claude/goose/hermes/agy print.
      - name: "Test → the rootfs runs under the proot the APK ships"
        run: sh "$WORK_DIR/rootfs/verify-rootfs.sh" "$RUNNER_TEMP/cloud-rootfs"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-rootfs-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ runner.temp }}/cloud-rootfs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build_and_publish:
    name: "Build + publish (${{ matrix.abi }})"
    needs: [build_stamp, rootfs]
    strategy:
      fail-fast: false
      matrix:
        # One job per release.variants[] entry, like every other per-ABI app
        # here. Without this the fork's own build emits ONE universal APK
        # carrying all four ABIs.
        abi: [arm64, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Selects the release.variants[] entry: the engine exports its .abis as
      # CLOUDNAV_ABIS for gradle and names the artifact from its .gh_asset.
      CLOUDNAV_VARIANT: ${{ matrix.abi }}
      COMMS_BUNDLE_ABI: ${{ matrix.abi == 'arm64' && 'arm64-v8a' || 'x86_64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every application's testers, and — for the 24 that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Until this
      # step existed, an application with zero testers and one with fifty
      # passing testers produced indistinguishable green ticks, and the ship
      # workflow's only question was "did Gradle exit 0". Needs no JDK, no SDK
      # and no gradle, so it costs seconds and fails before anything is built.
      #
      # DELIBERATELY NOT gated on the publish gate: the gate answers "would
      # these bytes differ?", which is the right question for publishing and the
      # wrong one for testing — editing a tester does not move the APK, and
      # gating here would let a new assertion land without ever running once.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      # Upstream pins its own Gradle and AGP; the wrapper in the vendored tree
      # is used, never a toolchain from here.
      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: sops

      # Vendored in-repo: the tree is committed and has no .git, so the engine
      # reads it straight from here and never clones.
      - name: Materialize fork (vendored in-repo tree)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      # The verified rootfs from this run's own rootfs job, into the assets
      # dir gradle's verifyCloudRootfs insists on.
      - name: Rootfs asset dir (from rootfs.json)
        if: steps.gate.outputs.skip != 'true'
        id: rootfs
        run: echo "dir=$(jq -r .asset_dir "$WORK_DIR/rootfs/rootfs.json")" >> "$GITHUB_OUTPUT"

      - name: Fetch the verified rootfs
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: cloud-rootfs-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/app/src/main/assets/${{ steps.rootfs.outputs.dir }}

      # #786: the digest of the tree verify-rootfs.sh ran, kept for the published-lib
      # guard below. stageRootfsPayload deletes it from assets/ during the build.
      - name: Keep the verified rootfs digest
        if: steps.gate.outputs.skip != 'true'
        run: cp "$WORK_DIR/app/src/main/assets/${{ steps.rootfs.outputs.dir }}/rootfs.sha256" "$RUNNER_TEMP/verified-rootfs.sha256"

      - name: Build stamp (the run's, shared by every ABI leg)
        if: steps.gate.outputs.skip != 'true'
        run: echo "COMMS_BUILD_TIMESTAMP=${{ needs.build_stamp.outputs.stamp }}" >> "$GITHUB_ENV"

      # Signed with the ONE shared constellation key. That is not cosmetic:
      # CLOUD_EXEC is a signature-level permission, so an APK signed with
      # anything else is refused the bind by every app in the fleet.
      - name: Build fork APK (upstream wrapper + constellation signing)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          COMMS_BUILD_TIMESTAMP: ${{ env.COMMS_BUILD_TIMESTAMP }}
          # #618 — the build PUBLISHES the big runtime artefact (the rootfs
          # tarball / the baked bootstrap zip) to this app's own rolling release
          # and keeps only its digest + url in the APK, so `gh release upload`
          # runs here. GITHUB_TOKEN, never a PAT: the asset belongs to this repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./build.sh build-fork "$FORK" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          ls -la dist/

      - name: Why the build failed (readable without a token)
        if: failure() && steps.gate.outputs.skip != 'true'
        run: sh 1_cicd/dist/scripts/cloud-android-annotate-build-failure.sh "$RUNNER_TEMP/gradle-build.log" "build [termux]"

      # ── MANAGED-PAGE-SIZE-GUARD: injected by cloud-android-page-size-inject.py ──
      # 16 KB page size (Android 15+): every lib/{arm64-v8a,x86_64}/*.so in the APK about
      # to be uploaded must have LOAD segments aligned >= 16 KB and sit stored at a 16 KB
      # zip offset (zipalign -c -P 16). Policy and per-app exemptions:
      # 1_cicd/src/data/page-size-guard.json. The mutation test runs first.
      # Edit 1_cicd/src/scripts/cloud-android-page-size-inject.py, never this block.
      - name: "16 KB page size: native libs LOAD-aligned, stored, zipaligned"
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash 1_cicd/src/scripts/test/page-size-guard.test.sh
          python3 1_cicd/dist/scripts/cloud-android-page-size-guard.py "ac_cloud-termux" ${{ env.WORK_DIR }}/dist/*.apk
      # ── end MANAGED-PAGE-SIZE-GUARD ──

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-terminal-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── GHCR mirror (PUBLIC on first build), arm64 only ──────────────
      # The old cloud-terminal package was linked to cloud-infra-desktop, so
      # every cloud-u-android push 403'd; it was deleted so THIS repo's first
      # push creates it fresh. Login is GITHUB_TOKEN, never the PAT: a package
      # created by a PAT is account-owned and born PRIVATE with no API to flip
      # it, which is the whole reason first builds came out private. arm64 only
      # so the two ABI jobs cannot race on the `latest` tag; x86_64 ships via
      # the release asset. The engine (step_oras_push) creates an absent
      # package with GHCR_CREATE_TOKEN=GITHUB_TOKEN so it inherits this public
      # repo, then anon-pulls and auto-deletes it if it is somehow not public.
      - name: Install ORAS (pinned, sha256-checked, fails at the download)
        if: ${{ steps.gate.outputs.skip != 'true' && matrix.abi == 'arm64' }}
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras

      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && matrix.abi == 'arm64' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS (public, arm64)
        if: ${{ steps.gate.outputs.skip != 'true' && matrix.abi == 'arm64' }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: arm64
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' && matrix.abi == 'arm64' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-terminal

      # Rolling 'latest': /releases/latest/download/cloud-terminal.apk is the
      # stable install URL the constellation points at.
      - name: Publish APK to rolling 'latest' release (stable install URL)
        id: publish
        # `success()` removed, not lost: GitHub applies it implicitly to any `if:`
        # that names no status function, so this condition means exactly what it
        # did. It has to go because the published-nothing guard is HANDED this
        # expression as an argument, and a status function is only legal inside an
        # `if:` — leaving it made six ship workflows fail to parse at all, which
        # GitHub reports by showing the run under the FILENAME instead of the name.
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release-fork "$FORK"

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-termux" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"

      # #786: every link of #771's chain was green alone (verify 16/16, lib
      # published, fleet row moved) and nothing compared the ends. Runs on EVERY
      # run, gate-skipped included: the live release asset's rootfs-lib.json
      # version must be the fleet row's version_name, and when this run built the
      # lib, the release must serve exactly those bytes, carrying the payload the
      # rootfs job verified. Red otherwise.
      - name: "Test → the published rootfs lib is the fleet row's and the verified one"
        run: python3 1_cicd/dist/scripts/cloud-android-rootfs-published-guard.py "$WORK_DIR" "${{ matrix.abi }}" --verified-sha256 "$RUNNER_TEMP/verified-rootfs.sha256"

  # ── the APKs both legs produced agree (#636) ───────────────────────────
  # Read from the APKs themselves, not from the stamp that should have made
  # them agree: every package more than one leg built must carry exactly one
  # versionCode. A leg whose gate skipped contributes nothing to compare.
  abi_parity:
    name: "One versionCode per package across the ABI legs"
    needs: build_and_publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cloud-terminal-*-${{ github.sha }}
          path: ${{ runner.temp }}/abi
      - name: Every package both legs built carries one versionCode
        run: |
          mkdir -p "$RUNNER_TEMP/abi"
          sh 1_cicd/dist/scripts/cloud-android-abi-parity.sh "$RUNNER_TEMP/abi"

  # A clean emulator, network off: install (the rootfs lib first, as the Store does), launch, and
  # require a session to run ls, uname and fish (1_cicd/src/cicd/test-terminal-fresh-install.yml).
  fresh_install:
    needs: build_and_publish
    if: ${{ !cancelled() && needs.build_and_publish.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-terminal-fresh-install.yml
    with:
      app: cloud-terminal-termux
      artifact_prefix: cloud-terminal-x86_64-
      lib_package: "com.diegonmarcos.cloudlib.rootfstermux"
      lib_release_asset: "Cloud-Lib-Rootfs-Termux-x86_64.apk"

  # #1121 install, never open, replace in place: the update must unpack the bundled files by itself
  # (UnpackReceiver -> UnpackService). Evidence: unpack-result.json, bin/login, a screenshot.
  upgrade_unpack:
    needs: build_and_publish
    if: ${{ !cancelled() && needs.build_and_publish.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-terminal-upgrade-unpack.yml
    with:
      app: cloud-terminal-termux
      artifact_prefix: cloud-terminal-x86_64-
      lib_package: "com.diegonmarcos.cloudlib.rootfstermux"
      lib_release_asset: "Cloud-Lib-Rootfs-Termux-x86_64.apk"
