name: "mesh membership guard — no constellation app drops out of the fleet mesh"

# #753. #743/#744 brought every `kind: app` fleet row into the mesh (libs:core
# for CONSTELLATION_DATA, libs:devtools for the fleet provider, the MESH_MEMBER
# receiver and the <queries> that let a member see its peers). Before that,
# seventeen apps had never been members and nothing said so: a non-member looks
# exactly like a member that has no peers yet. The published-APK audit
# (cloud-android-mesh-membership-audit.py) can only see a dropout after it
# ships; this holds the same property against the commit.
#
# EVERY PUSH, NO PATH FILTER: the edit that drops an app can be in the app, in
# any shared lib on its route to core, in core or devtools' manifests, in a ship
# workflow or in the fleet roster. A filter would be a second list of those.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: write ONLY for the IPC registry refresh below (one derived file, pushed to main).
permissions:
  contents: write

# ── MANAGED-GUARD-CONCURRENCY: injected by cloud-android-guard-triggers.py ──
concurrency:
  group: mesh-membership-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# ── end MANAGED-GUARD-CONCURRENCY ──

jobs:
  mesh-membership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tester runs FIRST: it cuts each app's only route to core, a ship
      # workflow's watch, and each manifest property on a copy, and requires the
      # guard to fail naming it. A gate whose red path is unproven enforces nothing.
      - name: The guard still fails when an app drops out
        run: bash 1_cicd/src/scripts/test/mesh-source-guard.test.sh

      # #763: G1/G2 and the generator's ship triggers all take the answer to
      # "which shared libs are inputs of this app" from cloud_android_lib_closure;
      # this proves that answer still tells inputs from mentions.
      - name: The lib-closure answer separates an app's inputs from mentions
        run: bash 1_cicd/src/scripts/test/lib-closure.test.sh

      - name: Every fleet app reaches libs:core and libs:devtools, and its ship watches exactly its libs
        run: python3 1_cicd/src/scripts/cloud-android-mesh-source-guard.py .

      # #763: every shared lib is classified (gui / contract / engine / mesh /
      # pinned / logic), the class matches the source, the mesh and contracts
      # stay under budget, and the non-GUI logic compiled into apps (the
      # migration backlog) can only shrink. Same closure, same every-push run:
      # an app's module map is the edit that can grow the backlog.
      - name: The lib classification guard still fails on each rule
        run: bash 1_cicd/src/scripts/test/lib-classes.test.sh

      - name: Every shared lib is classified and the compiled-in non-GUI backlog does not grow
        run: python3 1_cicd/src/scripts/cloud-android-lib-classes.py .

      # The lib side (#743): every Cloud-Lib APK that compiles devtools also
      # links core, else it carries the provider without CONSTELLATION_DATA and
      # every peer view is one short. ship-cloud-libs runs it only when lib-apks
      # moves; a libs/*/build.gradle edge change can break it from outside.
      - name: Every mesh-member Cloud-Lib APK links core
        run: bash ab_cloud-libs-shared/lib-apks/test/test-mesh-membership.sh

      # #792: a member that cannot bind a port is a member that serves nothing.
      # Each fleet package owns one port in libs/devtools/debug-ports.json; the
      # roster edit that adds a package without one is caught here, on push,
      # not as a NO_DEBUG_API row on the phone. Tester first, as above.
      - name: The debug-ports guard still fails on each rule
        run: bash 1_cicd/src/scripts/test/debug-ports-guard.test.sh

      - name: Every fleet package owns a unique debug port, with headroom
        run: python3 1_cicd/src/scripts/cloud-android-debug-ports-guard.py .

      # #796: what one change REBUILDS (publish gates, not triggers) is held to
      # 1_cicd/src/data/rebuild-scenarios.json both ways. Here and not in a
      # path-filtered guard: the edit that widens a fan-out can be anywhere —
      # a lib newly compiled into an app, a build.json module map, a slice that
      # stopped being per-root — which is this guard's every-push reason too.
      - name: What one change rebuilds does not widen (#796 rebuild fan-out ratchet)
        run: bash 1_cicd/src/scripts/test/rebuild-fanout.test.sh

      # #870 (owner rule): a change rebuilds only what it owns. Engine lib -> its
      # one Cloud-Lib APK and no app; static lib -> its primary consumer only;
      # app dir -> that app; shared manifests -> no app. Every push, same reason
      # as the ratchet above. Tester first (it breaks isolation on copies and
      # requires red), then the real workflows and every rebuild scenario.
      - name: The rebuild-isolation guard still fails on each way isolation breaks (#870)
        run: bash 1_cicd/src/scripts/test/rebuild-isolation-guard.test.sh

      - name: Every app ships on what it owns and every scenario is isolated (#870)
        run: python3 1_cicd/src/scripts/cloud-android-rebuild-isolation-guard.py --scenarios 1_cicd/src/data/rebuild-scenarios.json

      # #ipc (a0_docs/eng-specs/fleet-ipc.md): two fleet apps on one phone talk over
      # Android IPC (libs:devtools FleetIpc on content://<pkg>.fleet, providers, bound
      # services, intents), never over a loopback socket; HTTP is for callers off the
      # phone. The commit that adds a sibling-to-sibling HTTP call can be any source file,
      # which is this guard's every-push reason. Tester first (it plants each break and
      # requires red), then: the IPC door is signature-guarded and re-checks the caller,
      # no loopback client outside 1_cicd/src/data/ipc-http-allow.json, and the
      # generated registry aa_cloud-superapp/data/ipc-mesh.json is current.
      - name: The IPC guard still fails on each way app-to-app traffic leaves IPC (#ipc)
        run: bash 1_cicd/src/scripts/test/ipc-mesh-guard.test.sh

      # aa_cloud-superapp/data/ipc-mesh.json is DERIVED from every fleet app's manifests and sources, so the commit that makes it
      # stale is a commit in some other app by an author with no reason to run `gen` (c3-webserver's DNS port, 2026-10-22: a red
      # main for a file nobody was editing). Same reasoning as the test-coverage inventory in generated-up-to-date: on a push to
      # main the registry is regenerated here and pushed (rebase-and-retry); anywhere else (a pull request) a stale registry stays red.
      - name: Refresh the IPC registry on main (a derived file)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 1_cicd/src/scripts/cloud-android-ipc-mesh.py gen .
          # #1718 two more files derived from declarations other apps own, refreshed here for the same reason: the device access
          # dataset (Cloud Store > Access and Cloud C3 Webserver > API read it; derived from the registry above, the webserver's
          # route map, the port table, the MCP catalogue, each app's api_endpoints) and Cloud C3's fleet endpoints block (derived
          # from Cloud Account's fleet_endpoints). A declaration that is invalid stays red in the check steps below.
          python3 1_cicd/src/scripts/cloud-android-device-access.py write . || true
          python3 ac_cloud-c3/data/gen_fleet_endpoints.py write . || true
          f="aa_cloud-superapp/data/ipc-mesh.json data/fleet/device-access.json ac_cloud-c3/data/api_providers.json"
          if git diff --quiet -- $f; then echo "IPC registry and the files derived with it are already current."; exit 0; fi
          git diff --stat -- $f
          git add -- $f
          git -c user.name="github-actions[bot]" -c user.email="noreply@anthropic.com" commit -q -m "ci(ipc-mesh): regenerate the IPC registry from ${GITHUB_SHA::8} via run ${GITHUB_RUN_ID} [skip ci]"
          bash 1_cicd/dist/scripts/cloud-android-push-main.sh

      - name: App to app on the phone is IPC, and the IPC registry is current (#ipc)
        run: python3 1_cicd/src/scripts/cloud-android-ipc-mesh.py check .

      - name: The device access dataset is current (#1718, one model for Cloud Store > Access and Cloud C3 Webserver > API)
        run: python3 1_cicd/src/scripts/cloud-android-device-access.py check .

      - name: Cloud C3's fleet endpoints are current (#1718, moved from Cloud C3 Webserver > API)
        run: python3 ac_cloud-c3/data/gen_fleet_endpoints.py check .
