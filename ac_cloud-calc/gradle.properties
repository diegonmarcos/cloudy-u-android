# Performance + AndroidX.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 1.9 incremental + jvm-target alignment.
kotlin.code.style=official
kotlin.incremental=true

# #1668 libs:clock-tools-core (the clock rules) is mutation-tested (PIT) in this app's `gradle test`, its first home; the
# other consumers (Cloud Tasks, the SuperApp) run the same suite without repeating the mutation pass.
clockToolsMutation=true
