// Root build.gradle — plugin versions only. Per-module config lives in each
// module's own build.gradle. Versions mirrored in build.json::toolchain.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library'     version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20' apply false
    // Kotlin 2.0+ moves the Compose compiler into a standalone Gradle plugin
    // (composeOptions.kotlinCompilerExtensionVersion is gone). Applied by
    // every Compose module: app, libs:wallet, libs:keyboard.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20' apply false
    // #1093 libs:fleet-endpoints (linked by libs:account) is plain JVM Kotlin.
    id 'org.jetbrains.kotlin.jvm' version '2.3.20' apply false
}

// build.json::tests.unit.task. The test engine takes ONE task name, so the suites this app owns hang off one (#1510):
//  - :app                       the Robolectric suite (SelfAllowlistTest proves every X-Ray / Background policy command is on the SuperApp's allowlist entry)
//  - :libs:shell-broker         allowlist matching, default deny, audit, timeout, NeedsArm, concurrency cap, idle stop
//  - :libs:shell-client         the wire codec, NeedsArm, the bounded stream
tasks.register('superappUnitTests') {
    group = 'verification'
    description = 'Unit suites the SuperApp ship runs (see build.json::tests.unit).'
    dependsOn ':libs:shell-client:testDebugUnitTest', ':libs:shell-broker:testDebugUnitTest', ':app:testDebugUnitTest'
}
