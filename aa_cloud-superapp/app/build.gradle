    def regen = providers.exec {
        workingDir file("../data")
        commandLine "bash", "regen.sh", "--constellation-only"
        ignoreExitValue = true
    }
    def regenRc = regen.result.get().exitValue
    if (regenRc != 0) {
        logger.warn("constellation-fleet.json regen exited ${regenRc} (${regen.standardError.asText.get().take(600).trim()}) — using last committed snapshot")
    }
} catch (Throwable t) {
    logger.warn("constellation-fleet.json regen failed (${t.message}) — using last committed snapshot")
}
