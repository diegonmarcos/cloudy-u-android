    buildFeatures {
        buildConfig = true
        // AIDL — needed for the Shizuku UserService (IUserService.aidl)
        // that runs `dumpsys batterystats` in shell context for exact
        // per-app energy attribution.
        aidl = true
        // compose = false was REVERSED by decree on 2026-09-24 (#565/#531): Compose is
        // mandatory in every app, and the bottom nav is the shared Compose island.
        compose = true
    }

    // The instrumented sources below were written against APIs that have since moved (Sections.forks,
    // hubPackage, ...) and have never compiled in CI - no workflow ran them. They are left out of the
    // androidTest compile until they are ported, so the edge-overlay gesture test (the emulator workflow
    // test-cloud-superapp.yml) can build. Delete a name from this list when its test is fixed.
    // #512. Robolectric inflates REAL layouts against the REAL merged
    // resources + theme, so a test can read what a widget actually resolved
    // instead of what an XML file says. Every event is logged with full
    // stack traces: the measured geometry the bottom-nav test prints is the
    // evidence, and a bare "1 test failed" in the CI log is not.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                    showStandardStreams = true
                }
            }
        }
    }

    // Stable signing — required for the in-app updater to install update APKs.
    // The ONE shared Cloud-constellation key (release.jks + sops passwords) lives
    // in vault; build.sh::_resolve_signing resolves it and exports
    // ANDROID_KEYSTORE_FILE / _PASSWORD / KEY_ALIAS / KEY_PASSWORD (CI does the
    // same via the vault checkout + SOPS_AGE_KEY). The SAME key signs SuperApp /
    // Cloud-Nav / Cloud-Comms / cloud-myterminal so local + CI + every app produce a
    // matching signature and the in-app updater never rejects an install on a
    // signature mismatch. THERE IS NO FALLBACK: if ANDROID_KEYSTORE_FILE is
    // absent the build FAILS LOUD — it never substitutes a debug/legacy/freshly
    // generated key. Run via build.sh (or export the env yourself from vault).
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // No applicationIdSuffix — this IS the daily app, not a "debug"
            // variant of a separate release app. Same on-device package
            // (com.diegonmarcos.superapp) so the in-app updater keeps the
            // upgrade chain stable.
            debuggable true
            // R8 in shrink-only mode. This variant is what actually ships, so
            // it is the only place minification can save anything - enabling it
            // on `release` below would have changed nothing about the APK on
            // the phone. proguard-rules.pro sets -dontobfuscate, so names and
            // line numbers survive and the reason this variant ships (real
            // stacktraces) is preserved; what goes is unreachable library code,
            // which was most of a ~20MB dex.
            // -PnoMinify (build.sh instrument): the instrumentation APK carries no Kotlin stdlib of its own, so a
            // shrunk app APK crashes the test runner (NoClassDefFoundError kotlin.LazyKt) before a test starts.
            minifyEnabled !project.hasProperty('noMinify')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            // Daily-driver app: keep debuggable=true even in release so adb
            // logcat / debugger always works regardless of which variant the
            // engine picks. No production-key custody — this is personal
            // infra, not Play Store distribution.
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Same shared key as debug → release APK is signed (no more
            // app-release-unsigned.apk fallback) and update-compatible.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

