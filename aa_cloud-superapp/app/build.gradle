// Bake build.json::ui.sections into BuildConfig as base64-JSON so Kotlin
// reads a single source of truth at runtime — no parallel hardcoded list.
// Base64 sidesteps Java-string-literal escaping for the embedded JSON.
// Strip the `_doc*` keys before baking. They are documentation for whoever
// opens build.json, and Sections.kt has never read one — but they were being
// base64'd into the APK all the same, and they are roughly HALF the payload.
//
// That stopped being merely wasteful and became a build failure:
//
//   BuildConfig.java:35: error: constant string too long
//
// A Java string constant cannot exceed 65535 bytes in the class file, and
// ui.sections had grown to ~63.2 KB of base64 — close enough that one ordinary
// day of editing section prose pushed it over. Stripping docs takes it to
// ~33.8 KB, so there is real headroom again rather than a cliff two paragraphs
// away. The blob the app decodes is otherwise identical.
def stripDocs
stripDocs = { obj ->
    if (obj instanceof Map) {
        return obj.findAll { k, v -> !k.toString().startsWith('_doc') }
                  .collectEntries { k, v -> [(k): stripDocs(v)] }
    }
    if (obj instanceof List) return obj.collect { stripDocs(it) }
    return obj
}
// Same problem, different source. Each data/*.json below was baked as base64 of
// its FILE TEXT — indentation included — and linktree.json reached 71,368 base64
// bytes that way, which is what actually broke javac's 65535-byte constant
// limit. Roughly half of that was whitespace no consumer reads: every one of
// these blobs is JSON.parse'd on the phone, so formatting is dead weight.
// Re-serialising compact takes linktree to 37,676 and gives every other blob
// headroom too, instead of leaving the next one to hit the same wall.
def leanJson = { java.io.File f, String fallback ->
    if (!f.exists()) return fallback
    return groovy.json.JsonOutput.toJson(stripDocs(new groovy.json.JsonSlurper().parse(f)))
}

// Third time at the same wall. Doc-stripping bought ui.sections 30 KB back and
// one season of ordinary editing has spent all of it: 48,101 bytes of compact
// JSON is 64,136 base64 bytes, 1,399 short of the 65,535-byte javac ceiling.
// Trimming content only moves the cliff a week, so deflate before encoding —
// JSON is thousands of repeated key names, which is precisely what deflate
// collapses: the same sections become 12,260 bytes. The reader sniffs the gzip
// magic instead of being told, so blobs still baked plain keep working and the
// next one to approach the wall changes one line here and nothing there.
def gzB64 = { String s ->
    def out = new java.io.ByteArrayOutputStream()
    new java.util.zip.GZIPOutputStream(out).withStream { it.write(s.getBytes("UTF-8")) }
    return out.toByteArray().encodeBase64().toString()
}

