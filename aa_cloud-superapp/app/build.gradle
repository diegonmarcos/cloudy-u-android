    // #531 the bottom-nav tests measure the real island through the compose test rule.
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // libs:mail's account auth (interceptor + cookie jar) is exercised against a real local server.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Four instrumented sources have never compiled in CI (APIs moved: Sections.forks,
// PhoneFolders, ...). Left out of the androidTest Kotlin compile until ported, so the edge-overlay gesture test
// (workflow test-cloud-superapp.yml) can build. Delete a name from this list when its test is fixed.
tasks.matching { it.name == 'compileDebugAndroidTestKotlin' }.configureEach {
    exclude '**/ExternalAppsTest.kt', '**/FloatingNavConfigTest.kt', '**/HomeAppsFoldersTest.kt', '**/KdeConfigsPageTest.kt'
}
