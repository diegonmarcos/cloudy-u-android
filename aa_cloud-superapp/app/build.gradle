// ── Stack scan ────────────────────────────────────────────────────────
// Data-driven snapshot of "what's inside this APK" for Configs → About →
// Stack. Computed from the actual repository contents at config time —
// no hardcoded list to drift. Two derived JSON blobs are baked into
// BuildConfig:
//   • UI_STACK_LANGUAGES_JSON_B64 — {language: {files, loc}} by extension
//   • UI_STACK_FRAMEWORKS_JSON_B64 — sorted unique deps from every
//     *.gradle in the repo (deduped, project(':...') skipped)
def repoRoot = rootDir.parentFile  // aa_cloud-superapp/

// Friendly-name table: filename extension → language label. Anything not
// listed here is ignored (build outputs, generated sources, .lock, etc.).
def stackExtMap = [
    "kt"     : "Kotlin",
    "java"   : "Java",
    "go"     : "Go (libwg-go)",
    "c"      : "C (ndk-compat)",
    "h"      : "C headers",
    "xml"    : "XML (resources/manifest)",
    "json"   : "JSON (config)",
    "gradle" : "Gradle (Groovy)",
    "kts"    : "Gradle (Kotlin DSL)",
    "groovy" : "Groovy",
    "sh"     : "Shell",
    "md"     : "Markdown",
    "nix"    : "Nix",
    "yml"    : "YAML",
    "yaml"   : "YAML",
    "pro"    : "ProGuard",
]
// Roots we count: app source, every libs/* source, root build/config.
def stackRoots = [
    new File(rootDir, "app/src/main"),
    new File(repoRoot, "libs"),
    new File(repoRoot, "build.json"),
    rootDir,                         // app/build.gradle, app/proguard
]
// Directories we skip (no point counting generated / external code).
def stackSkipDirs = [
    "build", ".gradle", ".idea", "dist", ".result",
    "libs/net/src/main/cpp/libwg-go/generated-src",
]
def stackStats = [:]  // ext -> [files: N, loc: M]
stackRoots.each { root ->
    if (!root.exists()) return
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label == null) return
        def loc = 0
        try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def bucket = stackStats[label] ?: [files: 0, loc: 0]
        bucket.files += 1
        bucket.loc   += loc
        stackStats[label] = bucket
    }
}
def stackLanguagesJson = groovy.json.JsonOutput.toJson(stackStats)
def stackLanguagesB64  = stackLanguagesJson.bytes.encodeBase64().toString()

// Framework scan: walk every *.gradle in this app/ + libs/, harvest
// `implementation`/`api`/`compileOnly` lines whose argument is a Maven
// coordinate (group:artifact:version). Skip `project(':libs:...')`
// entries — those are internal modules already covered by the module list.
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly|annotationProcessor|kapt)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
def gradleSearchRoots = [rootDir, new File(repoRoot, "libs"), new File(repoRoot, "aa_cloud-superapp")]
gradleSearchRoots.findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        if (!(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""
        try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksJson = groovy.json.JsonOutput.toJson(stackDeps.toList())
def stackFrameworksB64  = stackFrameworksJson.bytes.encodeBase64().toString()

// ── Folder tree (L3, a[abc]_* siblings) — DYNAMIC, scanned every build ────
// Re-scanned fresh from the filesystem on EVERY build (no committed
// snapshot): every `a[abc]_*` directory sibling under the unix repo root is
// listed (L2), each with its immediate sub-directories (L3), rooted at
// `unix/` (L1). The tree therefore reflects exactly the a[abc]_* clones
// present at build time. NOTE: the gitignored upstream clones
// (ac_cal-davx5, ac_mail-fairmail, …) appear only on machines where
// they're checked out (local builds); the GHA runner — which has just
// the tracked ac_cloud-* siblings — prints those. The `a[abc]_*` filter
// requires an alphanumeric after the prefix so layout separator dirs
// (ac_____…) are skipped; nothing here is a hardcoded sibling list.
def stackTreeSkip = ["build", "dist", "node_modules", ".gradle", ".result"] as Set
def stackTreeSubdirs = { File dir, String selfName ->
    (dir.listFiles() ?: []).findAll {
        it.isDirectory() && !it.name.startsWith(".") &&
            !stackTreeSkip.contains(it.name) && it.name != selfName
    }.sort { it.name }
}
// Recursive directory walker, capped at `maxDepth` (the level NUMBER being
// printed). Rendered as a separate closure so the Folders view can emit
// three depth-bounded trees (L2 / L3 / L4) as 3 columns from ONE scan.
def stackTreeWalk
stackTreeWalk = { StringBuilder sb, File dir, String prefix, String selfName, int level, int maxDepth ->
    if (level > maxDepth) return
    def kids = stackTreeSubdirs(dir, selfName)
    kids.eachWithIndex { k, i ->
        boolean last = (i == kids.size() - 1)
        sb.append(prefix).append(last ? "└── " : "├── ").append(k.name).append("/\n")
        if (level < maxDepth)
            stackTreeWalk(sb, k, prefix + (last ? "    " : "│   "), null, level + 1, maxDepth)
    }
}
// unix/ (L1) → a[abc]_* siblings (L2) → sub-dirs (L3) → grand-children (L4).
def folderTree = { int maxDepth ->
    def root = repoRoot
    if (root == null || !root.isDirectory()) return "—"
    // L2 = a[abc]_* siblings. Alphanumeric-after-prefix filter drops layout
    // separator dirs (ac_____…) without a hardcoded sibling list.
    def eaDirs = (root.listFiles() ?: []).findAll {
        it.isDirectory() && (it.name ==~ /a[abc]_[a-z0-9].*/)
    }.sort { it.name }
    if (eaDirs.isEmpty()) return "—"
    def sb = new StringBuilder(root.name + "/\n")   // L1
    eaDirs.eachWithIndex { ea, i ->
        boolean lastEa = (i == eaDirs.size() - 1)
        sb.append(lastEa ? "└── " : "├── ").append(ea.name).append("/\n")   // L2
        // L3 = the sibling's immediate sub-dirs (selfName guard skips the
        // doubly-nested self leftover); L4 = grand-children, recursed.
        if (maxDepth >= 3)
            stackTreeWalk(sb, ea, lastEa ? "    " : "│   ", ea.name, 3, maxDepth)
    }
    sb.toString()
}
def stackTreeL3B64 = folderTree(3).bytes.encodeBase64().toString()
def stackTreeL4B64 = folderTree(4).bytes.encodeBase64().toString()
def stackTreeB64   = folderTree(5).bytes.encodeBase64().toString()   // full (L5)

// ── ASM tree (app navigation sitemap) — static, hand-authored ─────────
// data/asm-tree.txt is the full page/section map shown behind the
// "ASM Tree Pages" button in Configs/About#Stack. Edit the txt to update.
def asmTreeFile = new File(rootDir, "data/asm-tree.txt")
def asmTreeB64  = (asmTreeFile.exists() ? asmTreeFile.text : "—").bytes.encodeBase64().toString()

// ── AST tree (app code structure) — generated from the Kotlin source ──
// Scans app/ + every libs/* module and groups top-level TYPE declarations
// by package → file, so the "AST" button in Configs/About#Stack shows the
// real code map (module → package → file → class/object/interface).
def astTreeText = { ->
    def declRe = ~/(?m)^[a-z ]*\b(data class|sealed class|enum class|annotation class|class|object|interface)\s+([A-Za-z0-9_]+)/
    def pkgRe  = ~/(?m)^\s*package\s+([\w.]+)/
    def roots = []
    def appSrc = new File(rootDir, "app/src/main/java"); if (appSrc.exists()) roots << [m: "app", d: appSrc]
    (new File(repoRoot, "libs").listFiles() ?: []).findAll { it.directory }.sort { it.name }.each {
        def s = new File(it, "src/main/java"); if (s.exists()) roots << [m: "libs:${it.name}".toString(), d: s]
    }
    def sb = new StringBuilder()
    roots.each { root ->
        def byPkg = new TreeMap()
        root.d.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith(".kt")) return
            def txt = ""; try { txt = f.text } catch (Throwable t) { return }
            def pm = pkgRe.matcher(txt); def pkg = pm.find() ? pm.group(1) : "(default)"
            def decls = []
            declRe.matcher(txt).each { mm -> decls << "${mm[1]} ${mm[2]}".toString() }
            if (!decls.isEmpty()) byPkg.computeIfAbsent(pkg, { [] }) << [file: f.name, decls: decls]
        }
        if (byPkg.isEmpty()) return
        sb.append(root.m).append("\n")
        byPkg.each { pkg, files ->
            sb.append("  ").append(pkg).append("\n")
            files.sort { it.file }.each { fi ->
                sb.append("    ").append(fi.file).append("\n")
                fi.decls.each { d -> sb.append("      ").append(d).append("\n") }
            }
        }
    }
    sb.length() == 0 ? "—" : sb.toString()
}()
def astTreeB64 = astTreeText.bytes.encodeBase64().toString()

// ── javac's 65,535-byte string-constant cap ───────────────────────────
// A baked String is a CONSTANT_Utf8 entry in the class file and JVMS 4.4.7 caps
// ONE at 65,535 bytes. So `buildConfigField "String", X, "\"${blob}\""` stops
// compiling the moment `blob` outgrows that, and what you get is javac saying
// "constant string too long" about a generated BuildConfig.java — in a step
// named "JVM unit tests", before any test runs, naming nothing that would help.
//
// #567 HIT THIS ON THE FLEET MANIFEST (c866529e8) AND #646 HIT IT AGAIN ON THE
// FOLDER TREE. This app is the only one that really scans the repository — the
// other seven bake a "—" placeholder — and the L5 tree had 147 bytes of headroom
// left: adding ab_cloud-libs-shared/libs/gh and libs/gix grew it 236 bytes, from
// 65,388 to 65,624 base64, and every job compiling this module died at once.
// Both numbers measured from git at 10000dcb7 (green) and a9e7383f4 (red).
//
// SAME FIX AS #567: every blob derived from a SCAN of the repository — and the
// fleet manifest — is baked through bakeB64(), parts joined at class-init, so the
// next directory anyone adds cannot bring the limit back. The helper is the ONE
// copy the fleet shares (#654), in :libs:updater, which this app links anyway.
apply from: '../../ab_cloud-libs-shared/libs/updater/bake-b64.gradle'

// ── Build duration history (from gh CLI) ──────────────────────────────
// Run `gh run list` to pull the wall-clock duration of the last N
// successful GHA runs of this app's ship workflow. Used by the Stack
// section to surface "average build time" + "last build time" instead
// of just the UTC timestamp of THIS build (which the user reads here:
// reading is satisfying but doesn't tell you whether builds are
// getting slower or faster). Degrades cleanly if gh is missing or
// unauthenticated (e.g. offline / first-time clone) — fields fall back
// to -1, the UI renders "—".
def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list',
            '--workflow=ship-cloud-superapp.yml',
            '--limit', '10',
            '--status', 'success',
            '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) { /* skip malformed */ }
        }
    }
} catch (Throwable t) {
    // gh CLI unavailable, not authenticated, or no network — leave empty
    // and the UI will render "—".
}
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.superapp'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy said "Cloud Browser" while
        // the fleet, the store and every roster said cloud-browser.
        resValue "string", "app_name", buildJson.display_name
        // FLEET RULE (#299): English is the fleet's base language. Unlisted locales are
        // dropped from resources.arsc, so a Spanish phone resolves the English
        // in values/ instead of any values-es this module or a library ships.
        resConfigs "en"
        applicationId 'com.diegonmarcos.superapp'
        minSdk 26
        targetSdk 34
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        // Native-library ABI filter — declared in build.json::android.abi_filters
        // so the choice stays data-driven. Default = arm64-v8a only,
        // which trims MapLibre's native .so payload from ~60 MB across
        // 4 ABIs to ~15 MB for one ABI. Trades older-32-bit-device + x86-
        // emulator support for ~45 MB APK savings.
        ndk {
            // ABI is data-driven with an env override: the engine exports
            // SUPERAPP_ABIS (CSV) per release.variants[] when SUPERAPP_VARIANT
            // is set (CI builds one job per ABI). Unset → build.json default
            // (arm64-v8a), i.e. the phone build is byte-identical to before.
            def abiOverride = System.getenv('SUPERAPP_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
