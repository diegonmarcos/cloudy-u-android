android {
    packagingOptions {
        pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
    buildTypes {
        release {
            //might cause ClassNotFoundException errors
            //to fix those errors you need to either put @Keep on the class/feild or add a entry in progrud rules file
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations {
  all {
      exclude module: 'commons-logging'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
  }
}
// ── cloud-code (#562): install identity comes from the fleet declaration ──
// build.json::android is the ONE declaration of this app's applicationId and
// version. Cordova derives both from config.xml's widget id/version, and that id
// must STAY com.foxdebug.acode: it is also the Java namespace, and upstream
// plugin sources import com.foxdebug.acode.R. So the namespace is left alone and
// only the install identity is overridden, in onVariants — which runs after the
// android {} block Cordova applies this file BEFORE (a DSL applicationId here
// would be silently overwritten by that block). ${applicationId} manifest
// placeholders resolve to the overridden value.
// #830 the build commit, baked into versionName "(sha-xxxxxxxx)" + BuildConfig.GIT_SHORT_SHA so
// Store Details (libs/appstore BuiltFrom) and About can name the installed build. Same
// derivation as the rest of the fleet (#826): GITHUB_SHA first, `git rev-parse` locally, 8 hex.
// versionCode is untouched.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def cloudBuildJson = new groovy.json.JsonSlurper().parse(new File(rootProject.projectDir, '../../build.json'))
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.applicationId.set(cloudBuildJson.android.application_id as String)
        variant.outputs.each { output ->
            output.versionCode.set(cloudBuildJson.android.version_code as Integer)
            output.versionName.set("${cloudBuildJson.android.version_name} (sha-${shortSha})")
        }
    }
}

// ── cloud-code (#741): the Alpine shell resolves through Android, not a server of its own ──
// libs/sysdns's SystemDnsBridge is compiled in BY REFERENCE (plain Java, its own source
// dir) so every fleet terminal runs the one bridge; its port is libs/sysdns's to declare.
def cloudDnsBridgeJson = new File(rootProject.projectDir, '../../../ab_cloud-libs-shared/libs/sysdns/data/sysdns.json')
def cloudDnsBridge = new groovy.json.JsonSlurper().parse(cloudDnsBridgeJson)
android {
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "GIT_SHORT_SHA", "\"${shortSha}\""
        buildConfigField 'int', 'CLOUD_DNS_BRIDGE_PORT', "${cloudDnsBridge.bridge_port as int}"
    }
    sourceSets {
        main {
            java.srcDirs += new File(cloudDnsBridgeJson.parentFile.parentFile, 'src/bridge/java')
        }
    }
}

// ── cloud-code (#743): fleet mesh member ──
// libs:core (+ devtools via `api`) merges the fleet provider, receiver, <queries>
// and the signature permission into this APK; nothing here calls it.
// settings-extras.gradle includes it from build.json::modules.
dependencies {
    implementation project(':libs:core')
    // #1352 Configs ▸ General / ▸ About (libs:ui-nav-bars), reached through the launcher shortcuts the lib publishes;
    // hooks/post-process.js puts the Compose compiler plugin on the generated root buildscript for it.
    implementation project(':libs:ui-nav-bars')
    // #1630 fleet-default Configs tail: Agents, Logcat, X-Ray App register themselves on the shared strip.
    implementation project(':libs:fleetconfigs-agents')
    implementation project(':libs:fleetconfigs-logcat')
    implementation project(':libs:fleetconfigs-xray')
}

// ── cloud-code Chat: the fleet's model catalogue, BY REFERENCE (one implementation with Cloud Search) ──
// libs:model-catalogue is a Compose lib (its page is Cloud Search's), and this app is a Cordova
// WebView with no Compose: so the lib is not included as a project. Its LOGIC package dir (the
// selection parser, the OpenRouter pricing repository, the section filter, CatalogueJson; no UI
// import in it) and its assets (models/catalogue.json) are compiled in by reference, as libs/sysdns'
// bridge is above, and the CloudChat plugin hands CatalogueJson to the web page. Never a copy.
def cloudCatalogueLib = new File(rootProject.projectDir, '../../../ab_cloud-libs-shared/libs/model-catalogue')
android {
    sourceSets {
        main {
            java.srcDirs += new File(cloudCatalogueLib, 'src/main/kotlin/com/diegonmarcos/superapp/modelcatalogue')
            assets.srcDirs += new File(cloudCatalogueLib, 'src/main/assets')
        }
    }
}

// ── cloud-code Chat: the shared AI contract (libs:ai assets/ai/ai.json + protocol-cases.json), BY REFERENCE ──
// The page reads the gateway and OpenRouter from it (tools/resolve-targets.py copies them into
// targets.gen.json at build time; nav.json restates neither). The assets dir is compiled in by reference
// so the contract also ships in the APK and a change to it is a source input of this app's build.
// libs:ai itself is a Compose lib and is not included as a project (as with libs:model-catalogue above).
def cloudAiLib = new File(rootProject.projectDir, '../../../ab_cloud-libs-shared/libs/ai')
android {
    sourceSets {
        main {
            assets.srcDirs += new File(cloudAiLib, 'src/main/assets')
        }
    }
}

// ── cloud-code Chat: the fleet Account (Cloud Account / keyboard) over the ITextTools binder (a contract
// lib): Profile & Config asks it, key-free, whether it holds an OpenRouter key. The key itself is never
// read here. settings-extras.gradle includes it from build.json::modules.
dependencies {
    implementation project(':libs:text-tools')
}
