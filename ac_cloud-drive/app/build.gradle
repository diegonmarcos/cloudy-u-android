// #575 THE ONE shared repo store. build.json::storage.shared_root, relative to
// shared storage (never /storage/emulated/0 — that is one device's fact); the
// runtime half is SharedStore.kt. A missing or absolute value fails the build
// here: an APK whose clones land nowhere shared is the bug this replaces.
def storageDecl = buildJson.storage ?: [:]
// cloud-shared-store: the store's root folder name and its git folder are declared ONCE, in
// ac_cloud-termux/build.json::storage (the store's owner). Read from there; a copy in this
// app's build.json is refused by test/test-drive-shared-store.sh.
def storeOwnerJson = file("${rootDir}/../ac_cloud-termux/build.json")
if (!storeOwnerJson.isFile()) throw new GradleException("missing ${storeOwnerJson} -- the store (storage.shared_root, storage.git_subdir) is declared there")
def storeOwnerStorage = new groovy.json.JsonSlurper().parseText(storeOwnerJson.getText("UTF-8")).storage ?: [:]
def sharedRoot  = (storeOwnerStorage.shared_root ?: '').toString().trim()
if (!sharedRoot || sharedRoot.startsWith('/') || sharedRoot.contains('..')) {
    throw new GradleException("ac_cloud-termux/build.json::storage.shared_root must be a relative folder name under shared storage (got '${sharedRoot}')")
}
// #606/#608 the ONE folder of the store that holds clones: build.json::storage.git_subdir.
// ONE path segment, relative, never absolute — SharedStore.gitRoot() is the runtime half and
// both clone paths (the first-run seed and the Git page's Clone) resolve through it. Same
// guard shape as shared_root above: an APK whose clones land outside the store is the bug.
def gitSubdir = (storeOwnerStorage.git_subdir ?: '').toString().trim()
if (!gitSubdir || gitSubdir.startsWith('/') || gitSubdir.contains('/') || gitSubdir.contains('..')) {
    throw new GradleException("ac_cloud-termux/build.json::storage.git_subdir must be a single relative folder name inside the store (got '${gitSubdir}')")
}
def gitSyncDecl      = storageDecl.git_sync ?: [:]
def gitSyncMinutes   = (gitSyncDecl.interval_minutes ?: 60) as long
def gitSyncUnmetered = gitSyncDecl.require_unmetered_network == null ? true : gitSyncDecl.require_unmetered_network
// #603 build.json::storage.seed — whether the shared store is populated on first run
// and how deep each clone is. Data, not a Kotlin constant: StoreSeed reads only this.
def seedDecl      = storageDecl.seed ?: [:]
def seedEnabled   = seedDecl.enabled == null ? false : seedDecl.enabled
def seedDepth     = (seedDecl.depth ?: 1) as int
def seedUnmetered = seedDecl.require_unmetered_network == null ? true : seedDecl.require_unmetered_network
def gitReposFile = file('../data/drive-git-repos.json')
def gitReposB64  = b64(gitReposFile.exists()
    ? new groovy.json.JsonSlurper().parse(gitReposFile) : [:])
// #1073 build.json::storage.repos_source: the repo registry (_git-repos-master/repos.json) is the
// ONE list of repositories. Its byte copy is BAKED here (REPOS_SOT_B64 = identity, visibility,
// pending, renames only) and the build fails when the copy is not the pinned one, or when the
// Sync > Git family names a repository the registry does not list / has not created yet.
// data/drive-git-repos.json is generated from the family overlay + that copy by
// tools/gen-drive-git-repos.js (test/test-drive-repos-sot.sh holds it to --check).
def reposSrcDecl = storageDecl.repos_source ?: [:]
def reposSotFile = file("../${reposSrcDecl.path ?: 'data/repos.sot.json'}")
if (!reposSotFile.isFile()) throw new GradleException("build.json::storage.repos_source.path ${reposSotFile} is missing -- the repo list is read from _git-repos-master/repos.json, vendored there")
def reposSotSha = java.security.MessageDigest.getInstance('SHA-256').digest(reposSotFile.bytes).encodeHex().toString()
if (reposSotSha != (reposSrcDecl.sha256 ?: '').toString()) {
    throw new GradleException("repos.sot.json sha256 ${reposSotSha} != build.json::storage.repos_source.sha256 -- run ac_cloud-drive/tools/sync-repos-sot.sh (the copy drifted from its pin)")
}
def reposSot = new groovy.json.JsonSlurper().parse(reposSotFile)
if (reposSot._schema != 'cloud-repos/v1') throw new GradleException("repos.sot.json _schema is '${reposSot._schema}', expected cloud-repos/v1")
def reposSotSlim = reposSot.repos.collect { r ->
    [name: r.name, github: r.url.toString().replaceFirst(/^.*[\/:]/, '').replaceFirst(/\.git$/, ''),
     private: (r.private == true), pending: (r.status == 'pending_creation'), renamed_from: (r.renamed_from ?: []), lfs: (r.lfs == true), is_hub: (r.parent_hub != null)]
}
def reposSotB64 = b64(reposSotSlim)
((gitReposFile.exists() ? new groovy.json.JsonSlurper().parse(gitReposFile) : [repos: []]).repos ?: []).each { fr ->
    def hit = reposSotSlim.find { it.github == fr.name }
    if (hit == null) throw new GradleException("data/drive-git-repos.json lists '${fr.name}', which the repo registry (repos.sot.json) does not -- edit the registry, then drive-git-family.json")
    if (hit.pending) throw new GradleException("data/drive-git-repos.json lists '${fr.name}', which the registry marks pending_creation (repo not created yet)")
}
// The Apps tab grid. data/drive-apps.json declares WHICH apps the grid links to
// and how each tile looks; the constellation fleet manifest — the SAME canonical
// file :libs:updater bakes into CONSTELLATION_FLEET_B64 — supplies each entry's
// package identity. One declaration for the app list, one for identity, and no
// second list of packages to keep in step (the #170/#380/#381 defect shape).
// A declared fleet id that the manifest does not contain is a hard error here:
// resolving it would bake a tile that can never open anything.
def driveAppsFile  = file('../data/drive-apps.json')
def fleetAppsFile  = new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json')
def fleetById      = [:]
if (fleetAppsFile.exists()) {
    new groovy.json.JsonSlurper().parse(fleetAppsFile).apps.each { fleetById[it.id] = it }
}
def resolvedDriveApps = []
if (driveAppsFile.exists()) {
    new groovy.json.JsonSlurper().parse(driveAppsFile).apps.each { entry ->
        def out = [label: entry.label, icon: entry.icon]
        // #603 an in-app tile: `route` names a declared section and sub-page (ui.bottom_nav /
        // ui.sections[].pages), so GitSync and RSync are shortcuts into the screens #567
        // and #330 already built, not a second copy of either.
        if (entry.route) { out.route = [tab: (entry.route.tab ?: ''), page: (entry.route.page ?: '')] }
        if (entry.fleet) {
            def fleetEntry = fleetById[entry.fleet]
            if (fleetEntry == null) {
                throw new GradleException(
                    "data/drive-apps.json names fleet app '${entry.fleet}' which the " +
                    "constellation fleet manifest does not contain ($fleetAppsFile). " +
                    "Rename or remove the entry.")
            }
            out.package = fleetEntry.package
        } else {
            out.package = entry.package
            out.fallback_url = entry.fallback_url ?: ''
        }
        resolvedDriveApps << out
    }
}
def driveAppsB64  = b64(resolvedDriveApps)
// #604/#630 Volumes ▸ Fleet Volumes: the fleet apps whose folder the class lists.
// #630 DERIVED, NEVER HAND-PICKED. data/drive-constellation.json used to BE the list and
// carried four entries, so the section showed four of the fleet's apps and looked like the
// whole fleet. The list is now every `kind: app` entry of the constellation fleet manifest
// — the SAME canonical file :libs:updater and the Store's Phone tab read — and
// drive-constellation.json is reduced to LABEL/ICON OVERRIDES for the few whose manifest
// label reads as a slug. An override naming a fleet id the manifest does not carry is still
// a hard error; a manifest app with no override simply takes its manifest label.
def constellationFile = file('../data/drive-constellation.json')
def constellationOverrides = [:]
if (constellationFile.exists()) {
    new groovy.json.JsonSlurper().parse(constellationFile).apps.each { entry ->
        def fleetEntry = fleetById[entry.fleet]
        if (fleetEntry == null) {
            throw new GradleException(
                "data/drive-constellation.json names fleet app '${entry.fleet}' which the " +
                "constellation fleet manifest does not contain ($fleetAppsFile). " +
                "Rename or remove the entry.")
        }
        constellationOverrides[entry.fleet] = entry
    }
}
def resolvedConstellation = []
fleetById.each { fleetId, fleetEntry ->
    if (fleetEntry.kind != 'app') return
    if (!fleetEntry.package) return
    def over = constellationOverrides[fleetId]
    resolvedConstellation << [
        label  : (over?.label ?: fleetEntry.label ?: fleetId),
        icon   : (over?.icon ?: 'apps'),
        package: fleetEntry.package,
    ]
}
resolvedConstellation.sort { it.label.toLowerCase() }
if (resolvedConstellation.isEmpty()) {
    throw new GradleException(
        "the constellation fleet manifest ($fleetAppsFile) yielded no `kind: app` entry: " +
        "Volumes ▸ Fleet Volumes would render an empty section.")
}
def constellationB64 = b64(resolvedConstellation)
// #604 the folder↔folder sync rules the Rsync sub-page renders, on the same carrier.
// Only the `rules` array crosses into the APK: the file's _doc_* keys are for whoever
// edits it. An empty declaration is NOT an error — a phone with no rule yet is a valid
// phone — but the default rule is pinned by test/test-drive-shell.sh.
def syncRulesFile = file('../data/drive-sync-rules.json')
