// #642 Sync ▸ Git hands every git OPERATION to cloud-terminal-nix, so the terminal's package
// is resolved here from the SAME constellation manifest personal_auth above resolves against —
// one package list for the whole fleet, never a second (#170/#380/#381). Every {package}
// placeholder in the block (the action, the permission, bin/login's path and the four extras)
// is substituted from that one answer, so the id is written down once, in build.json, as a
// fleet id rather than as a package literal anywhere. A fleet id the manifest lacks is a hard
// error: resolving it would bake an intent aimed at a package that cannot exist, and an
// unresolvable intent is exactly the silent no-op this feature must never have.
def terminalPackage = ''
if (uiDecl.sync?.git?.terminal != null) {
    def term = uiDecl.sync.git.terminal
    def termFleet = fleetById[term.fleet]
    if (termFleet == null) {
        throw new GradleException(
            "build.json::ui.sync.git.terminal.fleet '${term.fleet}' is not in the constellation " +
            "fleet manifest ($fleetAppsFile) — Sync ▸ Git would bake an intent at no package.")
    }
    terminalPackage = termFleet.package.toString()
    term.each { k, v ->
        if (v instanceof String) term[k] = v.replace('{package}', terminalPackage)
    }
    term.package = terminalPackage
    term.remove('fleet')
}
// #684 THE BROWSER AUTH MISSION's package and permission, for the MANIFEST. The contract itself
// is ab_cloud-libs-shared/build.json::auth.browser_mission and is baked by libs:auth for the
// code path; the manifest cannot read JSON, so the <uses-permission> and <queries> lines take
// the SAME answer the shared bake takes — the fleet id resolved against the SAME constellation
// manifest — as placeholders. A retyped package here would be the second copy this resolution
// exists to avoid. A declared fleet id the manifest lacks is a hard error, as for the terminal.
def authMissionPackage = ''
def authMissionPermission = ''
def sharedAuthFile = new File(rootDir, '../ab_cloud-libs-shared/build.json')
def sharedMission = sharedAuthFile.exists() ? new groovy.json.JsonSlurper().parse(sharedAuthFile).auth?.browser_mission : null
if (sharedMission != null) {
    def missionFleet = fleetById[sharedMission.fleet]
    if (missionFleet == null) {
        throw new GradleException(
            "ab_cloud-libs-shared/build.json::auth.browser_mission.fleet '${sharedMission.fleet}' is not in the " +
            "constellation fleet manifest ($fleetAppsFile) — the manifest would ask for a permission no package declares.")
    }
    authMissionPackage = missionFleet.package.toString()
    authMissionPermission = sharedMission.permission.toString().replace('{package}', authMissionPackage)
}
