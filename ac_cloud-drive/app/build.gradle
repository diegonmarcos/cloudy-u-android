    ? (new groovy.json.JsonSlurper().parse(syncRulesFile).rules ?: []) : [])
// #1084 the Unison folder pairs: the `unison` object of the SAME file (one source of truth for sync
// declarations), baked whole. libs:rclone's UnisonConfig validates it at runtime and the JVM suite
// (UnisonDeclarationTest) pins the shipped file; an absent block is a phone with no Unison pair.
def unisonDecl    = syncRulesFile.exists() ? (new groovy.json.JsonSlurper().parse(syncRulesFile).unison ?: [:]) : [:]
