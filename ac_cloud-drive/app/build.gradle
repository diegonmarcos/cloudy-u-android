        buildConfigField "String", "AUTH_APPLIES_B64", "\"${authAppliesB64}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermissionsRuntimeB64}\""
        buildConfigField "String", "UI_PERMISSIONS_ROLES_B64",   "\"${uiPermissionsRolesB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",      "\"${profileName}\""
        buildConfigField "String", "UI_PROFILE_EMAIL",     "\"${profileEmail}\""
        buildConfigField "String", "UI_PROFILE_INITIALS",  "\"${profileInitials}\""
        buildConfigField "String", "UI_PROFILE_COMPANY",   "\"${profileCompany}\""
        buildConfigField "String", "UI_PROFILE_LOCATION",  "\"${profileLocation}\""
        buildConfigField "String", "UI_PROFILE_WEBSITE",   "\"${profileWebsite}\""
        buildConfigField "String", "UI_PROFILE_TITLES",    "\"${profileTitles}\""
        buildConfigField "String", "UI_PROFILE_REPOS_B64", "\"${profileReposB64}\""
        buildConfigField "String", "UI_CONSOLIDATED_CONFIG", "\"${consolidatedCfg}\""
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "String", "UI_STACK_FOLDER_TREE_B64",     "\"${stackTreeB64}\""
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",  "${System.currentTimeMillis() - gradleScriptStartMs}L"
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",    "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",   "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",      "${buildSampleSize}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        // #579 the whole chrome is Compose; EngineActivity hosts the engines' screens.
        compose = true
    }

    testOptions {
        unitTests {
            // #579 DriveShellTest is a Robolectric Compose layout-tree test: it renders
            // the shell and the Files pane against the app's real resources (the
            // libs:bottomnav precedent, BottomNavIslandTest).
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    // ONE shared Cloud-constellation key — same key as SuperApp/Nav/Comms/Wallet/IDE.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            // See build.json::android._doc_packaging_excludes — the engine
            // libraries' jars (JGit, jsch, …) collide on their notice files.
            excludes += (buildJson.android?.packaging_excludes ?: []) as List
        }
        // #871 move 10: no jniLibs block. The static rclone binary left with libs:rclone-engine
        // (Cloud-Lib-Rclone-Engine.apk, whose flavor extracts its own .so); this app execs nothing.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// ONE BouncyCastle in the APK: libs:mounts (sshj) brings the jdk18on artifacts and
// libs:shizuku-adb-debug-tools (libadb-android) the jdk15to18 ones, the same classes under two
// coordinates (checkDuplicateClasses). The jdk18on line is the newer one; libadb only uses API both carry.
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        ['bcprov', 'bcpkix', 'bcutil'].each { a ->
            substitute(module("org.bouncycastle:${a}-jdk15to18")).using(module("org.bouncycastle:${a}-jdk18on:1.84"))
        }
    }
}

dependencies {
    implementation project(':libs:analytics')
    implementation project(':libs:core')
    implementation project(':libs:databackend')   // #825 DataBackendClient: this app binds an engine
    implementation project(':libs:updater')
    // The shared scan engine: ZXing barcode decode + ML Kit OCR for the image
    // viewer. Same module cloud-media-center compiles in (task #459/#460).
    implementation project(':libs:ml-l-image')
    // The four engine libraries (#567): the main APK is chrome, each tooling is
    // its own module on the shared shelf. Linked from push 1 so every push after it
    // compiles the engine inside THIS app's toolchain, not only inside lib-apks'.
    implementation project(':libs:git-sync')
    // cloud-shared-store: where the store is and how this app reaches it (direct / CLOUD_EXEC).
    implementation project(':libs:shared-store')
    implementation project(':libs:file-editor')
    implementation project(':libs:rclone')
    implementation project(':libs:mounts')
    // #579 the fleet's bottom-nav island: the five tabs are the same Compose pill
    // superapp, mail, wallet and me draw.
    implementation project(':libs:bottomnav')
    implementation project(':libs:ui-nav-bars')
    implementation project(':libs:theme-background')
    // #587 THE sign-in of the fleet: Configs ▸ Sign in hosts libs:auth's Compose surface
    // (the same one superapp's Profile ▸ Connect hosts) and applies the drive sections.
    implementation project(':libs:auth')
    // #813 the Disk Management engine (Home ▸ Apps ▸ Disk Management, /api/disk/*); pinned to
    // this app's own grants, so it is compiled in (1_cicd/src/data/lib-classes.json).
    implementation project(':libs:disk')
    // Manage ▸ Apps: running state + PSS of other apps through the fleet's privileged shell channel.
    implementation project(':libs:shizuku-adb-debug-tools')
    // The AI tab: the fleet's AI chat over the fleet agent gateway (no token on the phone). It brings libs:model-catalogue along.
    implementation project(':libs:ai')
    // #646 THE DECLARED GIT AUTH+OPS CHAIN, one ordered declaration (libs-shared
    // build.json::auth.git_chain: fleet, then github) walked by libs:git-sync's
    // GitAuthChain. #705 neither of its binaries is linked here: gh runs in
    // Cloud-Lib-Gh.apk and this app binds it (sync/GhEngine.kt, build.json::engines.gh);
    // libs:gix was linked and called by nothing, so it ships only as Cloud-Lib-Gix.apk.
    // #567 push 5 / #579: the Compose toolchain of the WHOLE chrome. Same BOM the
    // libraries pin, so app and libraries compose against one toolchain.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    // Row menu > Unzip...: tar, tar.gz, tar.xz and 7z (commons-compress + xz) and rar (junrar). All pure JVM and
    // bundled in the APK: nothing is downloaded at runtime. zip/jar/apk use java.util.zip.
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:7.5.5'
    // #1375 USB-C drives Android did not mount: libaums (Apache-2.0, ~190 kB) speaks USB mass storage (SCSI over bulk
    // endpoints) and reads FAT32 (RawUsbDrive). exFAT/NTFS drives open through the system mount only. Its own deps
    // (androidx core/annotation, kotlin stdlib) are already in the app.
    implementation 'me.jahnen.libaums:core:0.10.0'
    // #575 the scheduled git sync (GitSyncWorker) — the same WorkManager libs:updater
    // already schedules its own periodic check with, same version.
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    // Every activity, the PDF reader included, is a ComponentActivity with Compose chrome now; appcompat
    // and material stay only because Theme.CloudDrive's parent (Theme.Material3.Dark.NoActionBar, the
    // AppCompat-descended dark theme the whole app declares) is a Material Components style.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Nothing in Drive is a secret today: FilesBridge only touches shared storage the
    // user already granted. Kept so a later remote back end has somewhere to put a token
    // that is not SharedPreferences in the clear.
    implementation 'androidx.security:security-crypto:1.1.0'
    // #577 the PDF reader's engine: pdfium through io.legere:pdfiumandroid, the ONLY in-process
    // PDF renderer in the fleet (#463). The coordinate is build.json::pdf.engine, read above —
    // and PdfEngine.kt is the only source file allowed to import it.
    pdfEngineCoordinates.each { implementation it }

    // The JVM unit phase (build.json::tests.unit) runs these on every ship: PdfConvertTest and
    // PdfLayoutTest execute the converter and the page layout, which no shell tester can.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r'   // the light-check end-to-end test builds a real repository on disk
    testImplementation 'org.json:json:20240303'   // real org.json on the JVM (the android.jar stubs throw): TermuxGitWireTest builds wire requests

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    // #579 the app's own JVM suite (state reducers, plans, guards, history, schedule)
    // and the Robolectric Compose layout-tree test — the libs:bottomnav test stack.
    // (junit itself is declared once above, with #577's PDF tests.)
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
