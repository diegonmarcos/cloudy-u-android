// #1952: the mail model is immutable by use (vals, lists never edited in place; a change is a new copy with equal fields). Compose treats a
// List-holding data class as unstable and compares it by identity, so every re-query of the list (each write a sync makes) handed every row on
// screen an EQUAL but new Email and recomposed all of them. Declared stable, equal rows are skipped. RowRecomposition1952Test proves it.
app.sterna.core.jmap.model.Email
app.sterna.core.jmap.model.EmailAddress
app.sterna.core.jmap.model.EmailBodyPart
app.sterna.core.data.mail.InboxRow
