buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        // 26, not upstream's 24: libs:core and libs:devtools (fleet mesh
        // membership) declare minSdk 26, and the manifest merger fails the app
        // build on a lower app minSdk. 26 is every constellation app's floor.
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        supportLibVersion = "35.0.0"
        // #1630 2.3.20 (was upstream's 2.0.21): the fleet Configs lib (libs:ui-nav-bars, Compose) is built with the fleet toolchain and its
        // compose artifacts carry Kotlin metadata a 2.0.x compiler cannot read; the compose compiler plugin below is pinned to the same version.
        kotlinVersion = "2.3.20"
        kotlin_version = kotlinVersion
        RNNKotlinVersion = kotlinVersion
        firebaseVersion = "24.1.0"
        ndkVersion = "27.1.12297006"
    }
    repositories {
        mavenCentral()
        mavenLocal()
        google()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath('com.google.gms:google-services:4.4.2')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // #1630 libs:ui-nav-bars and its libs apply the bare id org.jetbrains.kotlin.plugin.compose, resolved from this classpath
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion")

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        maven {
            url "$rootDir/../detox/node_modules/detox/Detox-android"
        }
        maven { url 'https://jitpack.io' }
    }
}

// #1630 Kotlin 2.3 turned the reified-intersection-type warning of upstream's own Kotlin (the helpers/database_extension files) into an error.
// Upstream's code and the npm modules' stay on language/API 2.2 (it compiles there as upstream wrote it); the fleet libs (:libs:*) are built
// at the toolchain's own level.
allprojects { p ->
    if (!p.path.startsWith(':libs:')) {
        p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { t ->
            t.compilerOptions.languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2)
            t.compilerOptions.apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2)
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

dependencyLocking {
    lockAllConfigurations()
}
