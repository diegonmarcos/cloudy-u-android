plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. The shell and every page of this app are
    // composables (libs:ui-kit's CloudKitTheme); Health and Fin are library Fragments hosted in it.
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))
// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base.
//
// This used to be build.json's version_code plus GITHUB_RUN_NUMBER, which is
// per-WORKFLOW. Every app here ships from its own ship-*.yml with its own
// independent counter, so the moment an app was built by a different workflow
// than the one that produced the installed APK -- or a workflow was re-created,
// or a dispatch cancelled a push-triggered run via the concurrency group -- the
// number handed out was SMALLER than the last published one and Android refused
// the update with "Update version code 190 is older than current 192". A build
// counter can only be monotonic for the one counter that issued it.
//
// Wall clock only ever moves forward and is identical for every workflow, every
// runner and every trigger, so this cannot go backwards again. Same encoding as
// ac_cloud-mail and ab_cloud-libs-shared/lib-apks, so the whole fleet is
// comparable: ~3.35M in Sep 2026, far above any version code in the field and
// inside the 2^31 limit for centuries. COMMS_BUILD_TIMESTAMP is honoured when
// CI provides one so the code matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()
def shortSha  = (System.getenv('GITHUB_SHA')
                 ?: providers.exec {
                        commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                        ignoreExitValue = true
                    }.standardOutput.asText.get().trim())
                .take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC')); format(new java.util.Date())
}

// Every navigation surface in the app is baked from build.json::ui here and
// decoded once at process start by Sections.kt. There is no hardcoded menu,
// tab strip or tile list anywhere in the Kotlin — adding a page is a JSON edit.
def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// build.json::ui.sections carries the navigation SHAPE only — ids, labels,
// icons, placement. Page CONTENT is NOT baked in: the stacks ship as assets
// (see sourceSets below) and Sections.kt reads one when its page opens.
//
// They used to be folded in here, and that hit javac's 64KB limit on a String
// constant the moment Profile gained a real profile's worth of text. A
// BuildConfig field is the wrong home for content that grows with the data:
// the shape is bounded, the content is not.
//
// A declared page with no file is still a build failure rather than a blank
// tab on the phone — the check moves here, the loader does not become
// fail-soft.
//
// A container tab holds no content of its own, and its children sit one folder
// deeper — at whatever depth build.json declares, since Projects > Health >
// Workout > Gym is three deep and nothing in the shell caps that any more.
def uiPagesDir = file('../data/ui')
def checkPages
checkPages = { sectionId, pages, dir ->
    pages.each { p ->
        if (p.pages) {
            checkPages(sectionId, p.pages, "${dir}/${p.id}")
        } else if (!new File(uiPagesDir, "${dir}/${p.id}.json").exists()) {
            throw new GradleException("ui.sections[${sectionId}] page '${p.id}' has no data/ui/${dir}/${p.id}.json")
        }
    }
}
(buildJson.ui.sections ?: []).each { s -> checkPages(s.id, s.pages ?: [], s.id) }
// #868 the bar is ONE declaration: ui.bottom_nav (ids, in order) + ui.default_section, read at
// runtime through libs:bottomnav's NavDecl together with UI_SECTIONS_B64.
def uiBottomNav       = (buildJson.ui.bottom_nav ?: []).join(',')
def uiDefaultSection  = (buildJson.ui.default_section ?: '').toString()
// ui.settings: the section ids drawn as the visible Settings entries at the top right (Profile, Configs).
def uiSettings        = (buildJson.ui.settings ?: []).join(',')
(buildJson.ui.settings ?: []).each { id ->
    if (!(buildJson.ui.sections ?: []).any { it.id == id }) {
        throw new GradleException("ui.settings names '${id}', which is not a ui.sections id")
    }
}
def uiExternalAppsB64 = b64(buildJson.ui.external_apps ?: [])
// Configs > Perms: the whole ui.permissions declaration (catalogue ids, install-time list, Health Connect set), read by MePerms.
def uiPermissionsB64  = b64(buildJson.ui.permissions ?: [:])
def profile           = buildJson.ui.profile_default ?: [:]
// THE cal ENGINE this app binds instead of compiling libs:cal (build.json::engines.cal,
// engine-apk-split move 3). Its package comes from the constellation fleet manifest, for the
// client's BuildConfig AND the manifest's <queries> (on API 30+ an unqueried package is
// invisible, and invisible reads exactly like "not installed"). A fleet id the manifest lacks
// fails the build: Agenda would otherwise bind a package no Store row installs.
def fleetAppsFile = new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json')
def calEngineDecl = buildJson.engines?.cal
if (calEngineDecl == null) {
    throw new GradleException("build.json::engines.cal is not declared — Agenda would bind nothing")
}
// #1298 Lnktree > Proj: build.json::ui.repo_tree (which group, which area page is which registry area code) and the fleet
// apps a repo leaf can open (constellation repo_url -> package; a repo with no app opens its GitHub url). The tree itself
// is the asset data/repos/repos.outline.json (libs:repos), read when the page opens. A declared area page the outline
// does not hold, or a group that is not declared, fails the build instead of drawing an empty tree on the phone.
def repoTreeDecl = buildJson.ui.repo_tree ?: [:]
def repoOutline  = new groovy.json.JsonSlurper().parse(file('../data/repos/repos.outline.json'))
if (repoTreeDecl) {
    def outlineCodes = repoOutline.areas.collect { it.code.toString() }
    (repoTreeDecl.areas ?: []).each { a ->
        if (!(a.code.toString() in outlineCodes)) throw new GradleException("ui.repo_tree area ${a.page} names code ${a.code}, which repos.outline.json does not hold")
    }
    def owner = (buildJson.ui.sections ?: []).find { s -> (s.groups ?: []).any { it.id == repoTreeDecl.group } }
    if (owner == null) throw new GradleException("ui.repo_tree.group '${repoTreeDecl.group}' is not a declared ui.sections[].groups id")
}
// Each Proj chip's label is its registry area's name, read from the outline here: build.json declares NO label for it.
def areaLabels = repoOutline.areas.collectEntries { [(it.code.toString()): (it.label ?: it.name).toString()] }
def areaPageCodes = (repoTreeDecl.areas ?: []).collectEntries { [(it.page.toString()): it.code.toString()] }
def labelAreaPages
labelAreaPages = { pages -> pages.collect { p ->
    def q = new LinkedHashMap(p)
    if (areaPageCodes.containsKey(p.id.toString())) q.label = areaLabels[areaPageCodes[p.id.toString()]]
    if (p.pages) q.pages = labelAreaPages(p.pages)
    q
} }
def uiSectionsB64 = b64((buildJson.ui.sections ?: []).collect { s -> new LinkedHashMap(s) + [pages: labelAreaPages(s.pages ?: [])] })
def fleetRepoApps = new groovy.json.JsonSlurper().parse(new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json')).apps
    .findAll { it.repo_url && it.package }.collect { [url: it.repo_url.toString(), package: it.package.toString()] }
def uiRepoTreeB64 = b64(repoTreeDecl + [fleet_apps: fleetRepoApps])
// #1323 Lnktree page cache (TTL, prefetch, concurrency, size cap, hard-refresh scope, opt-outs): build.json::ui.lnktree_cache, parsed by
// LnktreeCacheConfig. A declared cache that cannot work fails the build instead of silently caching nothing.
def lnktreeCacheDecl = buildJson.ui.lnktree_cache ?: [:]
if (lnktreeCacheDecl.enabled) {
    if (!((lnktreeCacheDecl.ttl_days ?: 0) > 0)) throw new GradleException("ui.lnktree_cache.ttl_days must be > 0")
    if (!(lnktreeCacheDecl.hard_refresh_scope in ['page', 'all'])) throw new GradleException("ui.lnktree_cache.hard_refresh_scope must be page or all")
    if (!(lnktreeCacheDecl.prefetch?.network in ['unmetered', 'connected'])) throw new GradleException("ui.lnktree_cache.prefetch.network must be unmetered or connected")
    if (!(buildJson.ui.sections ?: []).any { it.id == lnktreeCacheDecl.section }) throw new GradleException("ui.lnktree_cache.section '${lnktreeCacheDecl.section}' is not a ui.sections id")
}
def uiLnktreeCacheB64 = b64(lnktreeCacheDecl)
def calEngineFleet = new groovy.json.JsonSlurper().parse(fleetAppsFile).apps.find { it.id == calEngineDecl.fleet }
if (calEngineFleet == null) {
    throw new GradleException(
        "build.json::engines.cal.fleet '${calEngineDecl.fleet}' is not in the constellation fleet manifest " +
        "($fleetAppsFile) — Agenda would bind a package no Store row installs.")
}
def calEnginePackage = calEngineFleet.package.toString()
def calEngineAction  = calEngineDecl.action.toString().replace('{package}', calEnginePackage)
def calEngineMinContract = calEngineDecl.min_contract as int
if (calEngineMinContract < 1) {
    throw new GradleException("build.json::engines.cal.min_contract must be >= 1")
}

android {
    namespace 'com.diegonmarcos.cloudme'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy said "Cloud Browser" while
        // the fleet, the store and every roster said cloud-browser.
        resValue "string", "app_name", buildJson.display_name
        applicationId 'com.diegonmarcos.cloudme'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299): package-time filter, so no merged
        // library locale (libs:bottomnav and the rest, #531) can make the app come up in Spanish.
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDME_ABIS')
            def abis = (abiOverride?.trim())
                ? abiOverride.split(',').collect { it.trim() }.findAll { it }
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "UI_SECTIONS_B64",      "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",        "\"${uiBottomNav}\""
        buildConfigField "String", "UI_DEFAULT_SECTION",   "\"${uiDefaultSection}\""
        buildConfigField "String", "UI_SETTINGS",          "\"${uiSettings}\""
        buildConfigField "String", "UI_EXTERNAL_APPS_B64", "\"${uiExternalAppsB64}\""
        buildConfigField "String", "UI_PERMISSIONS_B64", "\"${uiPermissionsB64}\""
        buildConfigField "String", "UI_REPO_TREE_B64",     "\"${uiRepoTreeB64}\""
        buildConfigField "String", "UI_LNKTREE_CACHE_B64", "\"${uiLnktreeCacheB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",  "\"${profile.name ?: ''}\""
        buildConfigField "String", "UI_PROFILE_EMAIL", "\"${profile.email ?: ''}\""
        buildConfigField "String", "CAL_ENGINE_PACKAGE",      "\"${calEnginePackage}\""
        buildConfigField "String", "CAL_ENGINE_ACTION",       "\"${calEngineAction}\""
        buildConfigField "int",    "CAL_ENGINE_MIN_CONTRACT", "${calEngineMinContract}"
        manifestPlaceholders = [calEnginePackage: calEnginePackage]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig = true; compose = true }

    // #531 Robolectric resolves the real layout, theme and libs:bottomnav's dimens, and the CI
    // log prints each measured number when an assertion fails.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events 'passed', 'failed'
                    exceptionFormat 'full'
                    showStandardStreams = true
                }
            }
        }
    }

    // Both data trees ship verbatim as assets. data/files so Buro > Wallet can
    // browse the real wallet records as folders — AssetManager.list()
    // enumerates a directory, so the tree needs no manifest. data/ui so a page
    // is read when it opens instead of being carried in a String constant.
    //
    // They merge into one asset root, so a section id must not collide with a
    // top-level folder under data/files. test-ui-pages.sh fails if one ever
    // does; today the only candidate is `wallet`, and the Wallet bar section
    // has no pages and therefore no data/ui/wallet/ folder.
    sourceSets {
        main {
            assets.srcDirs += file('../data/files')
            assets.srcDirs += file('../data/ui')
            // Health's declared content (plan, formulas, home clusters, workout): data/health/health_*.json.
            assets.srcDirs += file('../data/health')
            // The real mySocials pages, so Profile renders the actual LinkedIn
            // and Instagram layouts instead of an approximation of them.
            assets.srcDirs += file('../data/web')
            // Health and DD record SCHEMAS (labels only, no values; test-profiles-privacy.sh enforces it): data/profiles/profiles/<id>.schema.json.
            assets.srcDirs += file('../data/profiles')
            // #1298 libs:repos' registry outline (byte-equal copy, guarded), read by Lnktree > Proj: repos.outline.json at the asset root.
            assets.srcDirs += file('../data/repos')
        }
    }

    // ONE shared Cloud-constellation key — same key as SuperApp/Wallet/Vault.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true; signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Shared BY REFERENCE from ab_cloud-libs-shared/libs — Cloud Me owns no
    // library source, it is an assembly of the constellation's modules.
    implementation project(':libs:web-core')   // #1371 the fleet's one web view (CloudWeb, WebProfile)
    implementation project(':libs:core')
    implementation project(':libs:databackend')   // #825 DataBackendClient: this app binds an engine
    implementation project(':libs:updater')
    implementation project(':libs:analytics')
    implementation project(':libs:health')   // Health section (Health Connect)
    implementation project(':libs:perms')    // Configs > Perms: the shared catalogue, status reader and settings intents
    implementation project(':libs:fin')      // Buro → Accounting
    implementation project(':libs:ui-kit')   // CloudKitTheme: libs:fin's dashboard is Compose under it
    // libs:cal is NOT linked: Agenda binds Cloud-Lib-Cal.apk (CalEngineClient, build.json::engines.cal).
    implementation project(':libs:bottomnav') // #531 the fleet's one bottom nav (Compose island)
    implementation project(':libs:ui-nav-bars')
    implementation project(':libs:theme-background')

    // Photo grid on Profile > Personal. Same version libs:media already pins.
    implementation 'io.coil-kt:coil:2.7.0'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'   // #1323 Lnktree prefetch (the version libs:updater pins; >= 2.10 handles the dataSync onTimeout)
    // Health trackers read Health Connect live (libs:health keeps the SDK private).
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha10'

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'   // Configs > Perms: expand / dismiss glyphs

    // #531 MeBottomNavTest composes the real shell body (MeBody) under Robolectric and drives the island.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
