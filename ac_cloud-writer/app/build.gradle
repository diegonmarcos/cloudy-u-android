apply plugin: 'com.android.application'
apply from: '../../ab_cloud-libs-shared/libs/fleet-urls.gradle'   // #1093 fleetUrl(): fleet hosts come from the one declaration
apply plugin: 'org.jetbrains.kotlin.android'
// THE COMPOSE COMPILER. Pinned to the Kotlin version in the root build.gradle,
// because since Kotlin 2.0 it ships with Kotlin rather than as a separately
// versioned artifact with a compatibility table to keep in step.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def a = buildJson.android

// build.json::writer_ai, ::writer_routes, ::update and ::ui are baked by libs:writer-ui (BuildConfig of
// the lib), which reads THIS app's build.json; the app bakes none of them (#1652). Only the voice
// engine's package is needed here, for the manifest's <queries>.
def writerRoutes = buildJson.writer_routes
if (writerRoutes == null || writerRoutes.voice_engine?.package == null || writerRoutes.voice_engine?.action == null) {
    throw new GradleException("build.json::writer_routes (with voice_engine.package and .action) is missing — " +
        "Listen and Translation have no routes to run on. Restore it from git.")
}

// versionCode MUST move on every build, or nothing lands.
//
// Same encoding as ac_c3-morpheus, ac_c3-watchdog, ac_cloud-mail and lib-apks,
// and for the same reason: minutes since 2026-01-01 UTC over a 3,000,000 base.
// A build counter (GITHUB_RUN_NUMBER) is per-WORKFLOW, so the moment an app is
// built by a different workflow than the one that produced the installed APK
// the number handed out can be SMALLER and Android refuses the update outright.
// Wall clock only moves forward and is identical for every workflow, runner and
// trigger. COMMS_BUILD_TIMESTAMP is honoured when CI provides one so the code
// matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

// #826 the build commit, baked into versionName "(sha-xxxxxxxx)" + BuildConfig.GIT_SHORT_SHA so
// Store Details (libs/appstore BuiltFrom) and About can name the installed build. Same
// derivation as the rest of the fleet: GITHUB_SHA first, `git rev-parse` locally. versionCode
// is untouched — identity on the fleet's update path stays what it was.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

android {
    namespace 'com.diegonmarcos.cloudwriter'
    compileSdk a.compile_sdk

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy said "Cloud Browser" while
        // the fleet, the store and every roster said cloud-browser.
        resValue "string", "app_name", buildJson.display_name
        // FLEET RULE (#299): English is the fleet's base language. Unlisted locales are
        // dropped from resources.arsc, so a Spanish phone resolves the English
        // in values/ instead of any values-es this module or a library ships.
        resConfigs "en"
        applicationId a.application_id
        minSdk        a.min_sdk
        targetSdk     a.target_sdk
        versionCode   codeFinal
        versionName   "${a.version_name} (sha-${shortSha})"
        buildConfigField "String", "GIT_SHORT_SHA", "\"${shortSha}\""
        ndk { abiFilters a.abi_filters as String[] }

        // The on-device voice engine's package and action, for the manifest's <queries> and the
        // bind (VoiceEngineBinder reads the same values out of WRITER_ROUTES_B64).
        manifestPlaceholders.put('voiceEnginePackage', writerRoutes.voice_engine.package.toString())
    }

    buildFeatures { buildConfig = true; compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // THE ONLY CONSTELLATION LINK, and it is a boundary rather than an engine:
    // the ITextTools AIDL, TextToolsClient and the addresses. The engines, the
    // routing preferences and the provider API key stay in the serving app's
    // process; only text crosses the binder. Shared BY REFERENCE from
    // ab_cloud-libs-shared (build.json::modules."libs:text-tools".dir), so this
    // app links the same copy cloud-mail and cloud-keyboard link.
    implementation project(':libs:text-tools')
    implementation project(':libs:ml-l-image-ocr')           // #1418 OCR: ML Kit on-device + the OpenRouter vision transport
    // #1418 the WYSIWYG box: compose-rich-editor (Apache-2.0, MohamedRejeb), a small Compose rich-text
    // editor whose state reads and writes HTML. Listed in licenses/inventory.json.
    implementation 'com.mohamedrejeb.richeditor:richeditor-compose:1.0.0-rc13'
    implementation project(':libs:decisions-link')   // #882 writer_route: asks the decisions engine, holds no key
    // #743 fleet mesh membership: core defines + requests CONSTELLATION_DATA and
    // carries libs:devtools (fleet provider, MESH_MEMBER receiver and query).
    implementation project(':libs:core')
    // #800 the pure logic (routing, OpenRouter wire, segmenter, documents, Markdown tools), a
    // plain-JVM module tested and PIT-mutated on its own; it carries libs:decisions by `api`.
    // #1652 the whole UI: WriterSurface and the tool pages (libs:writer-ui), over the pure logic (libs:writer-core).
    implementation project(':libs:writer-ui')
    implementation project(':libs:writer-core')
    // #800 the fleet UI kit (empty state, section headers), drawn inside this app's theme by ui.KitBridge.
    implementation project(':libs:ui-kit')
    // #868 NavDecl, and #1164 the shared nav: first row (Profile -> Cloud Account), second row, bottom nav, page background.
    implementation project(':libs:bottomnav')
    implementation project(':libs:ui-nav-bars')
    // #1630 fleet-default Configs tail: Agents, Logcat, X-Ray App register themselves on the shared strip.
    implementation project(':libs:fleetconfigs-agents')
    implementation project(':libs:fleetconfigs-logcat')
    implementation project(':libs:fleetconfigs-xray')
    implementation project(':libs:theme-background')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // JETPACK COMPOSE + MATERIAL 3, the same stack and the same BOM
    // ac_cloud-mail resolves. cloud-writer drew every screen by hand out of
    // LinearLayout and addView with a hardcoded four-colour palette and no
    // theme, which is what an app inherits when its screens are copied from an
    // IME: cloud-keyboard cannot use a layout file or an app theme, and
    // cloud-writer is not an IME and never had that constraint.
    //
    // A BOM rather than per-artifact versions, so ui, material3 and tooling
    // cannot be bumped independently into a combination nobody has built. The
    // version is build.json::toolchain.compose_bom and the toolchain tester
    // fails the build if the two disagree.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.animation:animation'   // #1532 AnimatedContent: the fade-through between screens
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // The per-feature icons on the home screen's four cards. The core set does
    // not carry Translate or Spellcheck, and a feature card without its icon is
    // the row of bare buttons this change exists to replace.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
