// Root build.gradle — plugin versions only.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library'     version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android'            version '2.3.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20' apply false
    // Compose (#565): the shell is Compose; the store pages it hosts are
    // libs:appstore's Fragments, embedded through fragment-compose.
    id 'org.jetbrains.kotlin.plugin.compose'       version '2.3.20' apply false
}

// build.json::tests.unit.task. The test engine takes ONE task name, so the suites this app owns hang off one:
//  - :libs:bottomnav            the top bar, the page strip and the Configs menu over the declared pages (Robolectric)
//  - :libs:shell-client         the broker client: the stdin door's size limits and the rish relay (#1512)
//  - :libs:core                 the Store notification matrix behind Configs > Notifications
// A sibling lib's suite stays out so it cannot turn this release red.
tasks.register('storeUnitTests') {
    group = 'verification'
    description = 'Unit suites the Cloud Store ship runs (see build.json::tests.unit).'
    dependsOn ':libs:bottomnav:testDebugUnitTest', ':libs:shell-client:testDebugUnitTest', ':libs:core:testDebugUnitTest', ':libs:appstore:testDebugUnitTest', ':app:testDebugUnitTest'
}
